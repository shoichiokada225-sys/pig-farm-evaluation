n nhân.","Hiểu các điểm chính của luật về cơ sở xử lý xác động vật (化製場法) và luật xử lý chất thải (廃棄物処理法), và có thể hướng dẫn người mới cách xử lý và ghi chép đúng."],"name_id":"Kepatuhan peraturan dan pencatatan kematian","kanten_id":"Apakah menghindari pemrosesan ilegal seperti mencampur ke kompos, tidak memutuskan sendiri jika dicurigai penyakit menular, dan bisa mencatat keadaan kematian.","levels_id":["Melakukan pemrosesan ilegal seperti mencampur anak babi yang mati ke kompos, dan tidak meninggalkan catatan.","Jika disuruh bisa mencatat, tetapi pemahaman peraturannya dangkal dan catatannya banyak yang terlewat.","Jika ada instruksi, bisa menyerahkan ke pemrosesan khusus dan mencatat keadaan kematian secara garis besar.","Tanpa instruksi pun, memproses sesuai peraturan, tidak memutuskan sendiri jika dicurigai penyakit menular, dan mencatat tanggal kematian, jumlah ekor, dan penyebabnya.","Memahami poin-poin undang-undang pengolahan bangkai dan pengelolaan limbah (peraturan Jepang), dan bisa mengajari karyawan baru pemrosesan dan pencatatan yang benar."]}],"gyomu":"37","name_en":"Dead pig collection","purposeShort_en":"Prevent pathogen spread, odor, and pest damage, and comply with the law","name_vi":"Thu gom lợn chết","purposeShort_vi":"Ngăn mầm bệnh lan rộng, mùi hôi và thú hại, tuân thủ pháp luật","name_id":"Pengumpulan babi mati","purposeShort_id":"Mencegah penyebaran bibit penyakit, bau busuk, dan kerusakan oleh hewan liar, serta mematuhi peraturan"},{"id":"ai-insem","category":"breeding","no":"No.14","name":"AI（人工授精）注入作業","purposeShort":"受胎数・産子数を高く保ち、精液を無駄なく計画的に使う","aspects":[{"id":"acceptance","name":"許容確認と挿入の判断","kanten":"許容を確認してから無理なく挿入し、排卵タイミングに合った適期に注入できるか。","levels":["許容を確かめず無理に挿入し、排卵タイミングを無視して受胎率を落とす。","指示があれば実施するが、許容確認が不十分で適期を外すことが多い。","指示があれば許容を確認し、指示された適期にひと通り注入できる。","指示がなくても許容を確かめてから適期に注入し、無理な挿入を避ける。","許容開始からの排卵時間を理解し、適期の判断と丁寧な注入を新人に指導できる。"],"name_en":"Confirming standing heat and judging insertion","kanten_en":"Can they confirm standing heat before inserting gently, and inseminate at the right time matched to ovulation?","levels_en":["Inserts forcibly without confirming standing heat and ignores ovulation timing, lowering the conception rate.","With guidance, performs the procedure, but standing heat checks are insufficient and the optimal window is often missed.","With guidance, confirms standing heat and can adequately inseminate at the instructed timing.","Independently confirms standing heat before inseminating at the right time, avoiding forced insertion.","Understands the time from onset of standing heat to ovulation, and can teach new staff timing judgment and careful insemination."],"name_vi":"Kiểm tra phản xạ đứng yên và phán đoán đưa ống vào","kanten_vi":"Có kiểm tra phản xạ đứng yên rồi mới đưa ống vào nhẹ nhàng, bơm tinh đúng thời kỳ phù hợp với thời điểm rụng trứng không.","levels_vi":["Không kiểm tra phản xạ đứng yên mà đưa ống vào cưỡng ép, bỏ qua thời điểm rụng trứng làm giảm tỷ lệ thụ thai.","Nếu có chỉ dẫn thì làm được, nhưng kiểm tra phản xạ đứng yên chưa đủ, thường lỡ thời kỳ thích hợp.","Nếu có chỉ dẫn thì kiểm tra phản xạ đứng yên, bơm tinh được cơ bản vào thời kỳ được chỉ định.","Không cần chỉ dẫn cũng kiểm tra phản xạ đứng yên rồi bơm tinh đúng thời kỳ, tránh đưa ống vào cưỡng ép.","Hiểu thời gian rụng trứng tính từ khi bắt đầu chịu đực, và có thể hướng dẫn người mới cách phán đoán thời kỳ và bơm tinh nhẹ nhàng."],"name_id":"Pemeriksaan refleks diam dan keputusan memasukkan kateter","kanten_id":"Apakah memeriksa refleks diam dulu baru memasukkan kateter tanpa paksaan, dan bisa memasukkan semen pada waktu yang tepat sesuai saat ovulasi.","levels_id":["Memasukkan kateter dengan paksa tanpa memeriksa refleks diam, mengabaikan saat ovulasi sehingga menurunkan angka kebuntingan.","Jika ada instruksi bisa melaksanakan, tetapi pemeriksaan refleks diam kurang sehingga sering meleset dari waktu yang tepat.","Jika ada instruksi, bisa memeriksa refleks diam dan memasukkan semen secara garis besar pada waktu yang diinstruksikan.","Tanpa instruksi pun, memeriksa refleks diam dulu baru memasukkan semen pada waktu yang tepat, dan menghindari pemasukan kateter secara paksa.","Memahami waktu ovulasi dihitung dari mulainya refleks diam, dan bisa mengajari karyawan baru cara menilai waktu yang tepat dan memasukkan semen dengan hati-hati."]},{"id":"hygiene-temp","name":"器具・外陰部の清潔と精液の温度管理","kanten":"器具・外陰部を清潔に保ち、精液をゆっくり入れ、急激な加温を避けて温度管理できるか。","levels":["器具・外陰部を清潔にせず、精液を急激に加温してカテーテル汚染や高温障害を招く。","指示があれば清潔にするが、温度管理や注入速度に漏れがある。","指示があれば器具・外陰部を清潔に保ち、精液をひと通りゆっくり入れられる。","指示がなくても清潔を徹底し、精液を急激に加温せずゆっくり注入する。","子宮炎・高温障害の仕組みを理解し、清潔操作と温度管理を新人に指導できる。"],"name_en":"Cleanliness of equipment and vulva, and semen temperature control","kanten_en":"Can they keep the equipment and vulva clean, introduce semen slowly, and control temperature while avoiding rapid warming?","levels_en":["Does not clean the equipment or vulva and warms semen rapidly, causing catheter contamination and heat damage.","With guidance, keeps things clean, but is inconsistent about temperature control and insemination speed.","With guidance, keeps the equipment and vulva clean and can adequately introduce the semen slowly.","Independently maintains strict cleanliness and inseminates slowly without rapidly warming the semen.","Understands the mechanisms of metritis and heat damage, and can teach new staff clean technique and temperature control."],"name_vi":"Giữ sạch dụng cụ, bộ phận sinh dục ngoài và quản lý nhiệt độ tinh dịch","kanten_vi":"Có giữ sạch dụng cụ và bộ phận sinh dục ngoài, bơm tinh chậm rãi, tránh làm ấm đột ngột và quản lý được nhiệt độ không.","levels_vi":["Không làm sạch dụng cụ và bộ phận sinh dục ngoài, làm ấm tinh dịch đột ngột, gây bẩn ống thông và hỏng do nhiệt độ cao.","Nếu có chỉ dẫn thì làm sạch, nhưng có bỏ sót việc quản lý nhiệt độ và tốc độ bơm.","Nếu có chỉ dẫn thì giữ sạch dụng cụ và bộ phận sinh dục ngoài, bơm tinh được cơ bản một cách chậm rãi.","Không cần chỉ dẫn cũng giữ sạch kỹ, không làm ấm tinh dịch đột ngột mà bơm chậm rãi.","Hiểu cơ chế viêm tử cung và hỏng do nhiệt độ cao, và có thể hướng dẫn người mới thao tác sạch và quản lý nhiệt độ."],"name_id":"Kebersihan alat dan vulva serta pengelolaan suhu semen","kanten_id":"Apakah menjaga alat dan vulva tetap bersih, memasukkan semen perlahan, dan mengelola suhu dengan menghindari pemanasan mendadak.","levels_id":["Tidak membersihkan alat dan vulva, memanaskan semen secara mendadak sehingga menyebabkan kontaminasi kateter dan kerusakan karena suhu tinggi.","Jika ada instruksi bisa menjaga kebersihan, tetapi sering lalai mengelola suhu dan kecepatan memasukkan semen.","Jika ada instruksi, bisa menjaga alat dan vulva tetap bersih, dan memasukkan semen secara garis besar dengan perlahan.","Tanpa instruksi pun, menjaga kebersihan dengan ketat, dan memasukkan semen perlahan tanpa memanaskannya mendadak.","Memahami mekanisme radang rahim dan kerusakan karena suhu tinggi, dan bisa mengajari karyawan baru kerja bersih dan pengelolaan suhu."]}],"gyomu":"14","name_en":"AI (artificial insemination)","purposeShort_en":"Keep conception and litter size high, and use semen efficiently and according to plan","name_vi":"Công việc bơm tinh AI (thụ tinh nhân tạo)","purposeShort_vi":"Giữ số con thụ thai và số con đẻ ra ở mức cao, dùng tinh dịch có kế hoạch, không lãng phí","name_id":"Pekerjaan inseminasi AI (inseminasi buatan)","purposeShort_id":"Menjaga angka kebuntingan dan jumlah anak tetap tinggi, dan memakai semen secara terencana tanpa pemborosan"},{"id":"standing-check","category":"breeding","no":"No.33","name":"許容確認","purposeShort":"交配に入れる最適なタイミングを見極め、受胎率と産子数を上げる","aspects":[{"id":"boar-backpressure","name":"雄豚接触＋背圧での確認","kanten":"雄豚を接触させ、背圧をかけて強く押しても動かず立つかを確かめられるか。","levels":["雄豚を近づけず外陰部の腫れだけで判断し、偽陰性・適期外授精を招く。","指示があれば背圧を確かめるが、雄豚接触が不十分で判断が甘い。","指示があれば雄豚接触＋背圧で許容をひと通り確認できる。","指示がなくても雄豚を接触させて背圧をかけ、静止するかを確実に確かめる。","許容反応の仕組みを理解し、確実な確認方法と適期の見極めを新人に指導できる。"],"name_en":"Checking with boar contact plus back pressure","kanten_en":"Can they bring a boar into contact and apply back pressure to verify that the sow stands firm even when pushed hard?","levels_en":["Judges only by vulvar swelling without bringing a boar close, causing false negatives and mistimed insemination.","With guidance, checks back pressure, but boar contact is insufficient and judgment is unreliable.","With guidance, can adequately confirm standing heat with boar contact plus back pressure.","Independently brings the boar into contact, applies back pressure, and reliably verifies that the sow stands still.","Understands the mechanism of the standing reflex, and can teach new staff reliable checking methods and how to judge the optimal timing."],"name_vi":"Kiểm tra bằng tiếp xúc lợn đực và ấn lưng","kanten_vi":"Có cho tiếp xúc lợn đực, ấn lưng mạnh để kiểm tra lợn có đứng yên không nhúc nhích không.","levels_vi":["Không cho lợn đực lại gần, chỉ phán đoán bằng độ sưng của bộ phận sinh dục ngoài, gây âm tính giả và phối sai thời kỳ.","Nếu có chỉ dẫn thì kiểm tra bằng ấn lưng, nhưng việc tiếp xúc lợn đực chưa đủ nên phán đoán còn non.","Nếu có chỉ dẫn thì kiểm tra được cơ bản phản xạ đứng yên bằng tiếp xúc lợn đực và ấn lưng.","Không cần chỉ dẫn cũng cho tiếp xúc lợn đực và ấn lưng, kiểm tra chắc chắn lợn có đứng yên không.","Hiểu cơ chế của phản xạ đứng yên, và có thể hướng dẫn người mới cách kiểm tra chắc chắn và nhìn ra thời kỳ thích hợp."],"name_id":"Pemeriksaan dengan kontak babi jantan + tekanan punggung","kanten_id":"Apakah bisa mendekatkan babi jantan, memberi tekanan pada punggung, dan memastikan babi tetap berdiri diam walau ditekan kuat.","levels_id":["Tidak mendekatkan babi jantan dan hanya menilai dari bengkaknya vulva, sehingga terjadi negatif palsu dan inseminasi di luar waktu yang tepat.","Jika ada instruksi bisa memeriksa tekanan punggung, tetapi kontak dengan babi jantan kurang sehingga penilaiannya lemah.","Jika ada instruksi, bisa memeriksa refleks diam secara garis besar dengan kontak babi jantan + tekanan punggung.","Tanpa instruksi pun, mendekatkan babi jantan, memberi tekanan punggung, dan memastikan dengan pasti apakah babi berdiri diam.","Memahami mekanisme refleks diam saat birahi, dan bisa mengajari karyawan baru cara pemeriksaan yang pasti dan penentuan waktu yang tepat."]},{"id":"quiet-timing","name":"静かな母豚・夜間発情の見落とし防止","kanten":"静かな母豚は外見・行動も合わせて見て、夜間・早朝発情を見落とさず確認できるか。","levels":["1日1回の確認だけで、夜間・早朝発情や静かな母豚の発情を見落とす。","指示があれば確認するが、静かな母豚や時間帯による見落としが多い。","指示があれば静かな母豚も外見・行動を合わせてひと通り確認できる。","指示がなくても確認回数を工夫し、静かな母豚も排尿等の行動から発情を捉える。","夜間発情や微弱発情の見落としリスクを理解し、確認のタイミングを新人に指導できる。"],"name_en":"Avoiding missed quiet sows and night-time heats","kanten_en":"Can they assess quiet sows by appearance and behavior as well, and check without missing night-time or early-morning heats?","levels_en":["Checks only once a day and misses night or early-morning heats and the heats of quiet sows.","With guidance, checks, but often misses quiet sows and heats at certain times of day.","With guidance, can adequately check quiet sows using appearance and behavior together.","Independently varies the number and timing of checks, and detects heat in quiet sows from behaviors such as urination.","Understands the risk of missing night-time and weak heats, and can teach new staff the timing of checks."],"name_vi":"Phòng bỏ sót lợn nái động dục thầm lặng và động dục ban đêm","kanten_vi":"Với lợn nái động dục thầm lặng có nhìn thêm cả bề ngoài và hành vi, không bỏ sót động dục ban đêm và sáng sớm không.","levels_vi":["Chỉ kiểm tra 1 lần mỗi ngày, bỏ sót động dục ban đêm, sáng sớm và động dục của lợn nái thầm lặng.","Nếu có chỉ dẫn thì kiểm tra, nhưng hay bỏ sót lợn nái thầm lặng và tùy theo giờ giấc.","Nếu có chỉ dẫn thì kiểm tra được cơ bản cả lợn nái thầm lặng bằng cách nhìn thêm bề ngoài và hành vi.","Không cần chỉ dẫn cũng thay đổi số lần kiểm tra, nhận ra động dục của lợn nái thầm lặng qua hành vi như đi tiểu.","Hiểu nguy cơ bỏ sót động dục ban đêm và động dục yếu, và có thể hướng dẫn người mới thời điểm kiểm tra."],"name_id":"Mencegah terlewatnya induk pendiam dan birahi malam hari","kanten_id":"Apakah induk babi yang pendiam diperiksa juga dari penampilan dan perilakunya, dan birahi malam serta pagi buta tidak terlewat.","levels_id":["Hanya memeriksa sekali sehari, sehingga melewatkan birahi malam dan pagi buta serta birahi induk babi yang pendiam.","Jika ada instruksi bisa memeriksa, tetapi sering melewatkan induk yang pendiam atau karena jam pemeriksaan.","Jika ada instruksi, bisa memeriksa induk yang pendiam juga secara garis besar dengan melihat penampilan dan perilakunya.","Tanpa instruksi pun, mengatur frekuensi pemeriksaan, dan menangkap birahi induk yang pendiam dari perilaku seperti buang air kecil.","Memahami risiko terlewatnya birahi malam hari dan birahi yang lemah, dan bisa mengajari karyawan baru waktu-waktu pemeriksaan."]}],"gyomu":"33","name_en":"Standing heat check","purposeShort_en":"Identify the optimal timing for breeding and raise conception rate and litter size","name_vi":"Kiểm tra phản xạ đứng yên khi động dục","purposeShort_vi":"Nhìn ra thời điểm tốt nhất để phối giống, nâng tỷ lệ thụ thai và số con đẻ ra","name_id":"Pemeriksaan refleks diam saat birahi","purposeShort_id":"Menentukan waktu terbaik untuk perkawinan, menaikkan angka kebuntingan dan jumlah anak"},{"id":"semen-check","category":"breeding","no":"No.03","name":"精液検査・反転","purposeShort":"問題のある精液を使用前に除外し、繁殖成績の低下を防ぐ","aspects":[{"id":"temp-control","name":"17℃保管と温度変化の抑制","kanten":"精液を17℃前後で保管し、検査前の温度を均一にして温度変化を最小限にできるか。","levels":["保管温度を気にせず、検査前の温度も不均一なまま評価して誤判定する。","指示があれば温度を確認するが、変化の抑制や均一化に漏れがある。","指示があれば17℃前後で保管し、ひと通り温度に配慮できる。","指示がなくても温度変化を最小限に抑え、検査前に温度を均一にする。","温度が精子品質に与える影響を理解し、保管・検査時の温度管理を新人に指導できる。"],"name_en":"Storage at 17°C and minimizing temperature changes","kanten_en":"Can they store semen at around 17°C and equalize its temperature before testing, keeping temperature changes to a minimum?","levels_en":["Pays no attention to storage temperature and evaluates semen at uneven temperatures, causing misjudgment.","With guidance, checks the temperature, but is inconsistent about limiting changes and equalizing it.","With guidance, stores semen at around 17°C and can pay adequate attention to temperature.","Independently keeps temperature changes to a minimum and equalizes the temperature before testing.","Understands how temperature affects sperm quality, and can teach new staff temperature control during storage and testing."],"name_vi":"Bảo quản 17℃ và hạn chế thay đổi nhiệt độ","kanten_vi":"Có bảo quản tinh dịch quanh 17℃, làm đều nhiệt độ trước khi kiểm tra và giữ thay đổi nhiệt độ ở mức nhỏ nhất không.","levels_vi":["Không quan tâm nhiệt độ bảo quản, đánh giá khi nhiệt độ trước kiểm tra chưa đều nên phán đoán sai.","Nếu có chỉ dẫn thì kiểm tra nhiệt độ, nhưng có bỏ sót việc hạn chế thay đổi và làm đều nhiệt độ.","Nếu có chỉ dẫn thì bảo quản quanh 17℃, chú ý được cơ bản đến nhiệt độ.","Không cần chỉ dẫn cũng giữ thay đổi nhiệt độ ở mức nhỏ nhất, làm đều nhiệt độ trước khi kiểm tra.","Hiểu nhiệt độ ảnh hưởng đến chất lượng tinh trùng, và có thể hướng dẫn người mới cách quản lý nhiệt độ khi bảo quản và kiểm tra."],"name_id":"Penyimpanan 17°C dan menekan perubahan suhu","kanten_id":"Apakah menyimpan semen sekitar 17°C, menyeragamkan suhu sebelum pemeriksaan, dan menekan perubahan suhu seminimal mungkin.","levels_id":["Tidak peduli suhu penyimpanan, mengevaluasi dengan suhu sebelum pemeriksaan yang tidak seragam sehingga salah menilai.","Jika ada instruksi bisa memeriksa suhu, tetapi sering lalai menekan perubahan dan menyeragamkan suhu.","Jika ada instruksi, bisa menyimpan sekitar 17°C dan cukup memperhatikan suhu.","Tanpa instruksi pun, menekan perubahan suhu seminimal mungkin, dan menyeragamkan suhu sebelum pemeriksaan.","Memahami pengaruh suhu terhadap kualitas sperma, dan bisa mengajari karyawan baru pengelolaan suhu saat penyimpanan dan pemeriksaan."]},{"id":"activity-mix","name":"精子活力確認と穏やかな反転","kanten":"顕微鏡で精子活力を確認し、反転を穏やかに行って精子へのダメージを防げるか。","levels":["活力確認を省き、新鮮精液を激しく振盪して精子を傷める。","指示があれば確認するが、反転の強さやタイミングに漏れがある。","指示があれば顕微鏡で活力を確認し、ひと通り穏やかに反転できる。","指示がなくても活力を確認し、反転を穏やかに行ってダメージを防ぐ。","精子活力と反転操作の関係を理解し、検査と反転の手技を新人に指導できる。"],"name_en":"Checking sperm motility and gentle inversion","kanten_en":"Can they check sperm motility under a microscope and invert the container gently to prevent sperm damage?","levels_en":["Skips the motility check and shakes fresh semen violently, damaging the sperm.","With guidance, checks motility, but is inconsistent about the force and timing of inversion.","With guidance, checks motility under the microscope and can adequately invert the container gently.","Independently checks motility and inverts gently to prevent damage.","Understands the relationship between sperm motility and the inversion procedure, and can teach new staff the testing and inversion techniques."],"name_vi":"Kiểm tra hoạt lực tinh trùng và đảo chai nhẹ nhàng","kanten_vi":"Có kiểm tra hoạt lực tinh trùng bằng kính hiển vi, đảo chai nhẹ nhàng để tránh làm tổn thương tinh trùng không.","levels_vi":["Bỏ qua kiểm tra hoạt lực, lắc mạnh tinh dịch tươi làm tổn thương tinh trùng.","Nếu có chỉ dẫn thì kiểm tra, nhưng có bỏ sót về độ mạnh và thời điểm đảo chai.","Nếu có chỉ dẫn thì kiểm tra hoạt lực bằng kính hiển vi, đảo chai được cơ bản một cách nhẹ nhàng.","Không cần chỉ dẫn cũng kiểm tra hoạt lực, đảo chai nhẹ nhàng để tránh tổn thương.","Hiểu quan hệ giữa hoạt lực tinh trùng và thao tác đảo chai, và có thể hướng dẫn người mới kỹ thuật kiểm tra và đảo chai."],"name_id":"Pemeriksaan motilitas sperma dan membalik botol dengan lembut","kanten_id":"Apakah memeriksa motilitas (gerak) sperma dengan mikroskop, dan membalik botol dengan lembut untuk mencegah kerusakan sperma.","levels_id":["Melewatkan pemeriksaan motilitas, dan mengguncang semen segar dengan keras sehingga merusak sperma.","Jika ada instruksi bisa memeriksa, tetapi sering lalai soal kekuatan dan waktu membalik botol.","Jika ada instruksi, bisa memeriksa motilitas dengan mikroskop dan membalik botol secara garis besar dengan lembut.","Tanpa instruksi pun, memeriksa motilitas dan membalik botol dengan lembut sehingga mencegah kerusakan.","Memahami hubungan motilitas sperma dengan cara membalik botol, dan bisa mengajari karyawan baru teknik pemeriksaan dan pembalikan."]}],"gyomu":"03","name_en":"Semen check and inversion","purposeShort_en":"Exclude problem semen before use and prevent declines in reproductive performance","name_vi":"Kiểm tra tinh dịch và đảo chai tinh","purposeShort_vi":"Loại bỏ tinh dịch có vấn đề trước khi dùng, ngăn thành tích sinh sản giảm sút","name_id":"Pemeriksaan semen dan membalik botol semen","purposeShort_id":"Menyingkirkan semen yang bermasalah sebelum dipakai, mencegah turunnya hasil reproduksi"},{"id":"semen-mix","category":"breeding","no":"No.17","name":"精液攪拌","purposeShort":"精子濃度を均一化する","aspects":[{"id":"gentle-mix","name":"穏やかな攪拌と温度・浸透圧の配慮","kanten":"強く振らず穏やかに攪拌し、希釈液との温度差や気泡混入を避けられるか。","levels":["強く振って気泡を混入させ、希釈液との温度差で浸透圧ショックを招く。","指示があれば攪拌するが、強さや温度差への配慮に漏れがある。","指示があれば穏やかにひと通り攪拌できる。","指示がなくても温度差を抑えて穏やかに攪拌し、気泡混入を避ける。","浸透圧ショックや酸化ストレスの仕組みを理解し、攪拌のコツを新人に指導できる。"],"name_en":"Gentle mixing with attention to temperature and osmotic pressure","kanten_en":"Can they mix gently without shaking hard, avoiding temperature differences with the extender and air bubble entrainment?","levels_en":["Shakes hard, entraining air bubbles, and causes osmotic shock through temperature differences with the extender.","With guidance, mixes, but is inconsistent about force and attention to temperature differences.","With guidance, can adequately mix gently.","Independently limits temperature differences, mixes gently, and avoids entraining air bubbles.","Understands the mechanisms of osmotic shock and oxidative stress, and can teach new staff the knack of mixing."],"name_vi":"Lắc nhẹ nhàng và chú ý nhiệt độ, áp suất thẩm thấu","kanten_vi":"Có lắc nhẹ nhàng, không lắc mạnh, tránh chênh lệch nhiệt độ với dung dịch pha loãng và tránh lẫn bọt khí không.","levels_vi":["Lắc mạnh làm lẫn bọt khí, chênh lệch nhiệt độ với dung dịch pha loãng gây sốc thẩm thấu.","Nếu có chỉ dẫn thì lắc, nhưng có bỏ sót về độ mạnh và chú ý đến chênh lệch nhiệt độ.","Nếu có chỉ dẫn thì lắc được cơ bản một cách nhẹ nhàng.","Không cần chỉ dẫn cũng giữ chênh lệch nhiệt độ nhỏ, lắc nhẹ nhàng và tránh lẫn bọt khí.","Hiểu cơ chế sốc thẩm thấu và stress oxy hóa, và có thể hướng dẫn người mới mẹo lắc đều."],"name_id":"Pengadukan lembut dan perhatian pada suhu serta tekanan osmotik","kanten_id":"Apakah mengaduk dengan lembut tanpa mengocok keras, dan menghindari perbedaan suhu dengan cairan pengencer serta masuknya gelembung udara.","levels_id":["Mengocok keras sehingga gelembung udara masuk, dan perbedaan suhu dengan cairan pengencer menyebabkan syok tekanan osmotik.","Jika ada instruksi bisa mengaduk, tetapi sering lalai memperhatikan kekuatan dan perbedaan suhu.","Jika ada instruksi, bisa mengaduk secara garis besar dengan lembut.","Tanpa instruksi pun, menekan perbedaan suhu, mengaduk dengan lembut, dan menghindari masuknya gelembung udara.","Memahami mekanisme syok tekanan osmotik dan stres oksidatif, dan bisa mengajari karyawan baru trik pengadukan."]},{"id":"light-shield","name":"遮光の徹底","kanten":"遮光を守り、紫外線・光線による精子ダメージを防げるか。","levels":["遮光を怠り、光にさらして精子を傷める。","指示があれば遮光するが、徹底に漏れがある。","指示があればひと通り遮光して扱える。","指示がなくても遮光を徹底し、光線ダメージを防ぐ。","光が精子に与える影響を理解し、遮光管理を新人に指導できる。"],"name_en":"Thorough light shielding","kanten_en":"Can they maintain light shielding and prevent sperm damage from ultraviolet and visible light?","levels_en":["Neglects light shielding and exposes semen to light, damaging the sperm.","With guidance, shields from light, but not thoroughly.","With guidance, can adequately handle semen under light shielding.","Independently maintains thorough light shielding and prevents light damage.","Understands how light affects sperm, and can teach new staff light-shielding management."],"name_vi":"Che sáng kỹ càng","kanten_vi":"Có giữ việc che sáng, phòng tổn thương tinh trùng do tia cực tím và ánh sáng không.","levels_vi":["Không che sáng, để tinh dịch phơi ra ánh sáng làm tổn thương tinh trùng.","Nếu có chỉ dẫn thì che sáng, nhưng chưa làm triệt để.","Nếu có chỉ dẫn thì che sáng và xử lý được cơ bản.","Không cần chỉ dẫn cũng che sáng kỹ càng, phòng tổn thương do ánh sáng.","Hiểu ánh sáng ảnh hưởng đến tinh trùng, và có thể hướng dẫn người mới cách quản lý che sáng."],"name_id":"Menjalankan pelindungan dari cahaya","kanten_id":"Apakah mematuhi pelindungan dari cahaya, dan mencegah kerusakan sperma karena sinar ultraviolet dan cahaya.","levels_id":["Lalai melindungi dari cahaya, membiarkan semen terkena cahaya sehingga sperma rusak.","Jika ada instruksi bisa melindungi dari cahaya, tetapi pelaksanaannya sering lalai.","Jika ada instruksi, bisa menangani semen secara garis besar dengan terlindung dari cahaya.","Tanpa instruksi pun, menjalankan pelindungan dari cahaya dengan ketat, dan mencegah kerusakan karena cahaya.","Memahami pengaruh cahaya terhadap sperma, dan bisa mengajari karyawan baru pengelolaan pelindungan dari cahaya."]}],"gyomu":"17","name_en":"Semen mixing","purposeShort_en":"Even out the sperm concentration","name_vi":"Lắc đều tinh dịch (lắc nhẹ)","purposeShort_vi":"Làm đều nồng độ tinh trùng","name_id":"Mengaduk semen (kocok pelan)","purposeShort_id":"Menyeragamkan konsentrasi sperma"},{"id":"preg-check","category":"breeding","no":"No.09","name":"妊娠鑑定","purposeShort":"分娩・離乳頭数を計画通り確保し、空胎母豚を早く見つけて対応する","aspects":[{"id":"timing-recheck","name":"鑑定時期の厳守と再確認","kanten":"交配後24〜28日に鑑定し、1回で判断せず35〜40日で必ず再確認できるか。","levels":["1回の確認だけで妊娠を確定し、21日目などの偽陽性を見落とす。","指示があれば鑑定するが、時期の厳守や再確認に漏れが多い。","指示があれば決められた時期に鑑定し、ひと通り実施できる。","指示がなくても24〜28日に鑑定し、35〜40日で必ず再確認する。","偽陽性・偽陰性の時期特性を理解し、鑑定時期と再確認の重要性を新人に指導できる。"],"name_en":"Strict Timing and Recheck","kanten_en":"Can they check at 24-28 days after mating, and always recheck at 35-40 days instead of deciding from a single check?","levels_en":["Confirms pregnancy from a single check and misses false positives such as those around day 21.","With guidance can perform checks, but often misses the required timing or the recheck.","With guidance can check at the designated timing and complete the basic procedure.","Independently checks at 24-28 days and always rechecks at 35-40 days.","Understands the timing characteristics of false positives and negatives, and can teach new staff the importance of check timing and rechecking."],"name_vi":"Tuân thủ thời điểm chẩn đoán và kiểm tra lại","kanten_vi":"Có chẩn đoán vào ngày 24-28 sau giao phối, không kết luận chỉ sau 1 lần mà luôn kiểm tra lại vào ngày 35-40 không.","levels_vi":["Chỉ kiểm tra 1 lần đã kết luận là mang thai, bỏ sót dương tính giả như ở ngày 21.","Nếu được chỉ thị thì chẩn đoán, nhưng hay thiếu sót về tuân thủ thời điểm và kiểm tra lại.","Nếu được chỉ thị thì chẩn đoán đúng thời điểm quy định và thực hiện được cơ bản.","Dù không có chỉ thị vẫn chẩn đoán vào ngày 24-28 và luôn kiểm tra lại vào ngày 35-40.","Hiểu đặc điểm thời điểm của dương tính giả, âm tính giả, và có thể hướng dẫn người mới về tầm quan trọng của thời điểm chẩn đoán và kiểm tra lại."],"name_id":"Menepati waktu pemeriksaan dan pemeriksaan ulang","kanten_id":"Apakah dapat memeriksa pada hari ke-24-28 setelah perkawinan, tidak memutuskan hanya dengan satu kali pemeriksaan, dan selalu memeriksa ulang pada hari ke-35-40?","levels_id":["Memastikan kebuntingan hanya dengan satu kali pemeriksaan, sehingga melewatkan hasil positif palsu seperti pada hari ke-21.","Memeriksa jika diperintah, tetapi sering lalai menepati waktu dan melakukan pemeriksaan ulang.","Jika diperintah, dapat memeriksa pada waktu yang ditentukan dan melakukannya secara lengkap.","Tanpa diperintah pun, memeriksa pada hari ke-24-28 dan selalu memeriksa ulang pada hari ke-35-40.","Memahami kapan hasil positif palsu dan negatif palsu bisa terjadi, dan dapat mengajarkan pentingnya waktu pemeriksaan dan pemeriksaan ulang kepada karyawan baru."]},{"id":"echo-reading","name":"エコー画像の正しい読み取り","kanten":"膀胱・腸内容物と胎胞を混同せず、エコー画像を正しく読み取れるか。","levels":["膀胱や腸内容物を妊娠と誤読し、判定を誤る。","指示があれば当てるが、画像の読み取りに誤りが多い。","指示があればひと通りエコーを当てて胎胞を確認できる。","指示がなくても膀胱・腸内容物と胎胞を見分けて正しく判定する。","エコー画像の見分け方を理解し、誤読を避ける読み取りを新人に指導できる。"],"name_en":"Correct Reading of Ultrasound Images","kanten_en":"Can they read ultrasound images correctly without confusing the bladder or intestinal contents with gestational sacs?","levels_en":["Misreads the bladder or intestinal contents as pregnancy and makes wrong judgments.","With guidance can apply the probe, but makes frequent errors in reading the images.","With guidance can apply the ultrasound probe and confirm gestational sacs through the basic procedure.","Independently distinguishes the bladder and intestinal contents from gestational sacs and judges correctly.","Understands how to distinguish ultrasound images and can teach new staff how to read them without misinterpretation."],"name_vi":"Đọc đúng hình ảnh siêu âm","kanten_vi":"Có đọc đúng hình ảnh siêu âm, không nhầm bàng quang hoặc chất chứa trong ruột với túi thai không.","levels_vi":["Đọc nhầm bàng quang hoặc chất chứa trong ruột thành mang thai, dẫn đến kết luận sai.","Nếu được chỉ thị thì áp đầu dò siêu âm, nhưng hay đọc sai hình ảnh.","Nếu được chỉ thị thì có thể siêu âm và xác nhận túi thai một cách cơ bản.","Dù không có chỉ thị vẫn phân biệt được bàng quang, chất chứa trong ruột với túi thai và kết luận đúng.","Hiểu cách phân biệt hình ảnh siêu âm, và có thể hướng dẫn người mới cách đọc để tránh đọc sai."],"name_id":"Membaca gambar USG dengan benar","kanten_id":"Apakah dapat membaca gambar USG dengan benar, tanpa mengira kandung kemih atau isi usus sebagai kantung janin?","levels_id":["Salah membaca kandung kemih atau isi usus sebagai kebuntingan, sehingga hasil penilaian keliru.","Menempelkan alat USG jika diperintah, tetapi sering salah membaca gambar.","Jika diperintah, dapat menempelkan alat USG dan memeriksa kantung janin secara lengkap.","Tanpa diperintah pun, dapat membedakan kandung kemih dan isi usus dari kantung janin, lalu menilai dengan benar.","Memahami cara membedakan gambar USG dan dapat mengajarkan cara membaca yang menghindari salah baca kepada karyawan baru."]},{"id":"recheck-return","name":"鑑定後の再発情チェック","kanten":"鑑定後も再発情チェックを続け、空胎の長期化を防げるか。","levels":["鑑定後の再発情チェックを中断し、空胎を長期化させる。","指示があれば確認するが、継続に漏れが多い。","指示があれば鑑定後の再発情をひと通り確認できる。","指示がなくても再発情チェックを続け、空胎の母豚を早く見つける。","再発情チェックの意義を理解し、空胎長期化を防ぐ管理を新人に指導できる。"],"name_en":"Return-to-Estrus Checks After Diagnosis","kanten_en":"Can they continue return-to-estrus checks after diagnosis and prevent prolonged open days?","levels_en":["Stops return-to-estrus checks after diagnosis and lets open days drag on.","With guidance can check, but often fails to keep it up.","With guidance can carry out the basic return-to-estrus checks after diagnosis.","Independently continues return-to-estrus checks and finds open sows early.","Understands the purpose of return-to-estrus checks and can teach new staff how to prevent prolonged open days."],"name_vi":"Kiểm tra động dục trở lại sau chẩn đoán","kanten_vi":"Sau khi chẩn đoán có tiếp tục kiểm tra động dục trở lại, tránh để tình trạng không mang thai kéo dài không.","levels_vi":["Ngừng kiểm tra động dục trở lại sau chẩn đoán, để tình trạng không mang thai kéo dài.","Nếu được chỉ thị thì kiểm tra, nhưng hay không duy trì liên tục.","Nếu được chỉ thị thì có thể kiểm tra động dục trở lại sau chẩn đoán một cách cơ bản.","Dù không có chỉ thị vẫn tiếp tục kiểm tra động dục trở lại, phát hiện sớm lợn nái không mang thai.","Hiểu ý nghĩa của việc kiểm tra động dục trở lại, và có thể hướng dẫn người mới cách quản lý để tránh tình trạng không mang thai kéo dài."],"name_id":"Memeriksa birahi kembali setelah diagnosa","kanten_id":"Apakah tetap memeriksa birahi kembali setelah diagnosa, sehingga masa tidak bunting tidak berkepanjangan?","levels_id":["Berhenti memeriksa birahi kembali setelah diagnosa, sehingga masa tidak bunting menjadi berkepanjangan.","Memeriksa jika diperintah, tetapi sering tidak melanjutkannya.","Jika diperintah, dapat memeriksa birahi kembali setelah diagnosa secara lengkap.","Tanpa diperintah pun, terus memeriksa birahi kembali dan cepat menemukan induk babi yang tidak bunting.","Memahami pentingnya pemeriksaan birahi kembali dan dapat mengajarkan cara mencegah masa tidak bunting berkepanjangan kepada karyawan baru."]}],"gyomu":"09","name_en":"Pregnancy Check","purposeShort_en":"Secure planned farrowing and weaning numbers, and find open sows early to take action","name_vi":"Chẩn đoán mang thai","purposeShort_vi":"Đảm bảo số con đẻ ra và số con cai sữa theo kế hoạch, phát hiện sớm lợn nái không mang thai để xử lý","name_id":"Diagnosa kebuntingan","purposeShort_id":"Memastikan jumlah kelahiran dan penyapihan sesuai rencana, serta cepat menemukan induk babi yang tidak bunting untuk ditangani"},{"id":"pms","category":"breeding","no":"No.08","name":"PMS投与","purposeShort":"発情が弱い・来ない母豚に発情を誘起し、タイミングをそろえる","aspects":[{"id":"timing-judge","name":"投与時期と黄体確認","kanten":"基本は離乳当日〜翌日に投与し、黄体遺残をエコー確認して重複投与を避けられるか。","levels":["黄体遺残を確認せず重複投与し、投与時期も守らない。","指示があれば投与するが、時期や黄体確認に漏れがある。","指示があれば決められた時期に用量を守ってひと通り投与できる。","指示がなくても離乳当日〜翌日に投与し、黄体遺残を確認して重複を避ける。","黄体とホルモン誘起の関係を理解し、投与時期と適応の判断を新人に指導できる。"],"name_en":"Administration Timing and Corpus Luteum Check","kanten_en":"Can they administer on the day of weaning or the next day as a rule, and check for retained corpora lutea by ultrasound to avoid duplicate dosing?","levels_en":["Doses repeatedly without checking for retained corpora lutea, and ignores the administration timing.","With guidance can administer, but misses the timing or the corpus luteum check.","With guidance can administer the correct dose at the designated timing through the basic procedure.","Independently administers on the day of weaning or the next day, checking for retained corpora lutea to avoid duplication.","Understands the relationship between corpora lutea and hormonal induction, and can teach new staff how to judge timing and indications."],"name_vi":"Thời điểm tiêm và kiểm tra thể vàng","kanten_vi":"Về cơ bản có tiêm vào ngày cai sữa hoặc ngày hôm sau, siêu âm kiểm tra thể vàng tồn lưu để tránh tiêm trùng lặp không.","levels_vi":["Không kiểm tra thể vàng tồn lưu mà tiêm trùng lặp, cũng không giữ đúng thời điểm tiêm.","Nếu được chỉ thị thì tiêm, nhưng còn thiếu sót về thời điểm và kiểm tra thể vàng.","Nếu được chỉ thị thì tiêm đúng thời điểm, đúng liều lượng quy định một cách cơ bản.","Dù không có chỉ thị vẫn tiêm vào ngày cai sữa hoặc ngày hôm sau, kiểm tra thể vàng tồn lưu để tránh trùng lặp.","Hiểu quan hệ giữa thể vàng và kích thích bằng hormone, và có thể hướng dẫn người mới cách phán đoán thời điểm tiêm và đối tượng phù hợp."],"name_id":"Waktu penyuntikan dan pemeriksaan korpus luteum","kanten_id":"Apakah pada dasarnya menyuntik pada hari sapih sampai hari berikutnya, dan memeriksa sisa korpus luteum (badan kuning) dengan USG untuk menghindari penyuntikan ganda?","levels_id":["Menyuntik ganda tanpa memeriksa sisa korpus luteum, dan tidak menepati waktu penyuntikan.","Menyuntik jika diperintah, tetapi sering lalai soal waktu dan pemeriksaan korpus luteum.","Jika diperintah, dapat menyuntik pada waktu yang ditentukan dengan dosis yang benar secara lengkap.","Tanpa diperintah pun, menyuntik pada hari sapih sampai hari berikutnya, dan memeriksa sisa korpus luteum untuk menghindari penyuntikan ganda.","Memahami hubungan korpus luteum dengan induksi hormon, dan dapat mengajarkan penilaian waktu dan sasaran penyuntikan kepada karyawan baru."]},{"id":"no-self-judge","name":"自己判断の回避と投与後の確認","kanten":"使いすぎず上長・獣医師と相談し、未経産・経産を区別し、投与後の雄豚刺激で許容を確認できるか。","levels":["自己判断で使い、未経産・経産を区別せず、投与後の許容反応も確認しない。","指示があれば投与するが、相談や投与後確認に漏れがある。","指示があれば上長・獣医師と相談してひと通り投与できる。","指示がなくても使いすぎを避けて相談し、投与後は雄豚刺激で許容反応を確認する。","誘起剤の適正使用と個体差を理解し、相談と投与後確認の要点を新人に指導できる。"],"name_en":"Avoiding Self-Judgment and Post-Administration Checks","kanten_en":"Can they avoid overuse by consulting supervisors and the veterinarian, distinguish gilts from parous sows, and confirm standing response with boar stimulation after administration?","levels_en":["Uses the drug on their own judgment, does not distinguish gilts from parous sows, and never confirms the standing response after administration.","With guidance can administer, but misses consultations or post-administration checks.","With guidance can consult supervisors and the veterinarian and administer through the basic procedure.","Independently avoids overuse by consulting others, and confirms the standing response with boar stimulation after administration.","Understands proper use of induction drugs and individual variation, and can teach new staff the key points of consultation and post-administration checks."],"name_vi":"Tránh tự ý quyết định và kiểm tra sau khi tiêm","kanten_vi":"Có tránh lạm dụng, trao đổi với cấp trên và bác sĩ thú y, phân biệt nái chưa đẻ và nái đã đẻ, sau khi tiêm dùng lợn đực kích thích để kiểm tra phản xạ đứng yên không.","levels_vi":["Tự ý sử dụng, không phân biệt nái chưa đẻ và nái đã đẻ, cũng không kiểm tra phản xạ đứng yên sau khi tiêm.","Nếu được chỉ thị thì tiêm, nhưng còn thiếu sót về trao đổi và kiểm tra sau khi tiêm.","Nếu được chỉ thị thì trao đổi với cấp trên, bác sĩ thú y và tiêm được cơ bản.","Dù không có chỉ thị vẫn tránh lạm dụng, có trao đổi, sau khi tiêm dùng lợn đực kích thích để kiểm tra phản xạ đứng yên.","Hiểu cách dùng đúng thuốc kích thích và sự khác biệt giữa từng cá thể, và có thể hướng dẫn người mới các điểm chính về trao đổi và kiểm tra sau khi tiêm."],"name_id":"Tidak memutuskan sendiri dan memeriksa setelah penyuntikan","kanten_id":"Apakah tidak memakai obat berlebihan, berkonsultasi dengan atasan dan dokter hewan, membedakan babi dara dan induk babi beranak, serta memeriksa refleks diam dengan rangsangan babi jantan setelah penyuntikan?","levels_id":["Memakai obat atas keputusan sendiri, tidak membedakan babi dara dan induk babi beranak, dan tidak memeriksa refleks diam setelah penyuntikan.","Menyuntik jika diperintah, tetapi sering lalai berkonsultasi dan memeriksa setelah penyuntikan.","Jika diperintah, dapat menyuntik secara lengkap setelah berkonsultasi dengan atasan dan dokter hewan.","Tanpa diperintah pun, menghindari pemakaian berlebihan, berkonsultasi lebih dulu, dan setelah penyuntikan memeriksa refleks diam dengan rangsangan babi jantan.","Memahami pemakaian obat pemicu birahi yang tepat dan perbedaan tiap individu, dan dapat mengajarkan pokok konsultasi dan pemeriksaan setelah penyuntikan kepada karyawan baru."]}],"gyomu":"08","name_en":"PMS Administration","purposeShort_en":"Induce estrus in sows with weak or absent heat and synchronize timing","name_vi":"Tiêm PMS (hormone kích thích động dục)","purposeShort_vi":"Gây động dục cho lợn nái động dục yếu hoặc không động dục, làm đồng đều thời điểm","name_id":"Penyuntikan PMS (hormon induksi birahi)","purposeShort_id":"Memicu birahi pada induk babi yang birahinya lemah atau tidak muncul, dan menyeragamkan waktunya"},{"id":"echo-check","category":"breeding","no":"No.24","name":"入室準備（エコー検査）","purposeShort":"妊娠している母豚だけを分娩舎に入れ、空胎を早く見つける","aspects":[{"id":"timing-hold","name":"実施時期の遵守と保留判定","kanten":"決められた時期に実施し、判定があいまいな個体は保留・再確認できるか。","levels":["時期を守らず、あいまいな判定でも確定してしまう。","指示があれば実施するが、保留・再確認の判断に漏れがある。","指示があれば決められた時期にひと通り検査できる。","指示がなくても時期を守り、あいまいな個体は保留して再確認する。","誤判定のリスクを理解し、保留・再確認の判断を新人に指導できる。"],"name_en":"Keeping the Schedule and Holding Uncertain Cases","kanten_en":"Can they perform the exam at the designated time and hold and recheck animals with ambiguous results?","levels_en":["Ignores the schedule and finalizes judgments even when the result is ambiguous.","With guidance can perform the exam, but misses the judgment to hold and recheck.","With guidance can perform the basic exam at the designated time.","Independently keeps the schedule and holds ambiguous animals for rechecking.","Understands the risk of misjudgment and can teach new staff how to decide on holding and rechecking."],"name_vi":"Tuân thủ thời điểm thực hiện và tạm giữ kết luận","kanten_vi":"Có thực hiện đúng thời điểm quy định, với con có kết quả chưa rõ thì tạm giữ và kiểm tra lại không.","levels_vi":["Không giữ đúng thời điểm, kết quả chưa rõ vẫn kết luận.","Nếu được chỉ thị thì thực hiện, nhưng còn thiếu sót trong phán đoán tạm giữ, kiểm tra lại.","Nếu được chỉ thị thì kiểm tra đúng thời điểm quy định một cách cơ bản.","Dù không có chỉ thị vẫn giữ đúng thời điểm, con chưa rõ thì tạm giữ và kiểm tra lại.","Hiểu rủi ro kết luận sai, và có thể hướng dẫn người mới cách phán đoán tạm giữ, kiểm tra lại."],"name_id":"Menepati waktu pelaksanaan dan menunda penilaian yang meragukan","kanten_id":"Apakah melaksanakan pada waktu yang ditentukan, dan menunda serta memeriksa ulang individu yang hasilnya meragukan?","levels_id":["Tidak menepati waktu, dan tetap memastikan hasil walaupun penilaiannya meragukan.","Melaksanakan jika diperintah, tetapi sering lalai menunda dan memeriksa ulang.","Jika diperintah, dapat memeriksa pada waktu yang ditentukan secara lengkap.","Tanpa diperintah pun, menepati waktu, dan menunda individu yang meragukan lalu memeriksanya ulang.","Memahami risiko salah penilaian dan dapat mengajarkan penilaian tunda dan periksa ulang kepada karyawan baru."]},{"id":"reflect-result","name":"結果の即時反映と入室前の環境確認","kanten":"結果をその場でプレート・リストに反映し、分娩舎の衛生・飲水を確認できるか。","levels":["結果を反映せず、分娩舎の衛生・飲水確認も省く。","指示があれば反映するが、記録や環境確認に漏れがある。","指示があれば結果をひと通りプレート・リストに反映できる。","指示がなくても結果を即時反映し、入室前に分娩舎の衛生・飲水を確認する。","結果反映と環境準備の意義を理解し、入室前チェックを新人に指導できる。"],"name_en":"Immediate Recording of Results and Pre-Entry Environment Check","kanten_en":"Can they record results on plates and lists on the spot, and check hygiene and drinking water in the farrowing house?","levels_en":["Does not record results, and skips the hygiene and drinking-water checks in the farrowing house.","With guidance can record results, but misses records or environment checks.","With guidance can record the results on plates and lists through the basic procedure.","Independently records results immediately and checks hygiene and drinking water in the farrowing house before entry.","Understands the value of recording results and preparing the environment, and can teach new staff the pre-entry checks."],"name_vi":"Cập nhật kết quả ngay và kiểm tra môi trường trước khi vào chuồng","kanten_vi":"Có ghi ngay kết quả vào thẻ thông tin (plate) và danh sách, kiểm tra vệ sinh và nước uống của chuồng đẻ không.","levels_vi":["Không cập nhật kết quả, cũng bỏ qua việc kiểm tra vệ sinh, nước uống của chuồng đẻ.","Nếu được chỉ thị thì cập nhật, nhưng còn thiếu sót về ghi chép và kiểm tra môi trường.","Nếu được chỉ thị thì có thể ghi kết quả vào thẻ thông tin và danh sách một cách cơ bản.","Dù không có chỉ thị vẫn cập nhật kết quả ngay, kiểm tra vệ sinh và nước uống của chuồng đẻ trước khi cho lợn vào.","Hiểu ý nghĩa của việc cập nhật kết quả và chuẩn bị môi trường, và có thể hướng dẫn người mới cách kiểm tra trước khi cho lợn vào chuồng."],"name_id":"Segera mencatat hasil dan memeriksa lingkungan sebelum masuk","kanten_id":"Apakah dapat langsung mencatat hasil ke kartu data (plate) dan daftar, serta memeriksa kebersihan dan air minum kandang beranak?","levels_id":["Tidak mencatat hasil, dan melewatkan pemeriksaan kebersihan dan air minum kandang beranak.","Mencatat jika diperintah, tetapi sering lalai dalam pencatatan dan pemeriksaan lingkungan.","Jika diperintah, dapat mencatat hasil ke kartu data (plate) dan daftar secara lengkap.","Tanpa diperintah pun, langsung mencatat hasil, dan sebelum babi masuk memeriksa kebersihan dan air minum kandang beranak.","Memahami arti pencatatan hasil dan persiapan lingkungan, dan dapat mengajarkan pemeriksaan sebelum masuk kepada karyawan baru."]}],"gyomu":"24","name_en":"Entry Preparation (Ultrasound Exam)","purposeShort_en":"Move only pregnant sows into the farrowing house and find open sows early","name_vi":"Chuẩn bị vào chuồng đẻ (kiểm tra siêu âm)","purposeShort_vi":"Chỉ đưa lợn nái đang mang thai vào chuồng đẻ, phát hiện sớm lợn không mang thai","name_id":"Persiapan masuk kandang beranak (pemeriksaan USG)","purposeShort_id":"Memasukkan hanya induk babi yang bunting ke kandang beranak, dan cepat menemukan yang tidak bunting"},{"id":"pg","category":"breeding","no":"No.36","name":"PG（プロスタグランジン）接種","purposeShort":"分娩のタイミングをそろえ、分娩管理・立会いをしやすくする","aspects":[{"id":"gestation-day","name":"妊娠日数の確認と適期投与","kanten":"妊娠日数を正しく数え、113日以前の禁忌を避けて決められた日齢・対象に接種できるか。","levels":["妊娠日数を誤算して113日以前に投与し、早産・死産を招く。","指示があれば接種するが、日数確認や対象確認に漏れがある。","指示があれば決められた日齢・対象にひと通り接種できる。","指示がなくても妊娠日数を確認し、対象母豚を確かめて適期に接種する。","早期投与の禁忌と黄体の関係を理解し、適期投与の判断を新人に指導できる。"],"name_en":"Confirming Gestation Days and Timely Administration","kanten_en":"Can they count gestation days correctly, avoid the contraindicated period before day 113, and inject the designated animals at the designated day?","levels_en":["Miscounts gestation days, injects before day 113, and causes premature farrowing and stillbirths.","With guidance can inject, but misses the day count or the target-animal check.","With guidance can inject the designated animals at the designated day through the basic procedure.","Independently confirms gestation days, verifies the target sows, and injects at the right time.","Understands the contraindication of early administration and its relationship with the corpus luteum, and can teach new staff how to judge timely administration."],"name_vi":"Kiểm tra số ngày mang thai và tiêm đúng thời điểm","kanten_vi":"Có đếm đúng số ngày mang thai, tránh chống chỉ định tiêm trước ngày 113, tiêm đúng ngày tuổi thai và đúng đối tượng quy định không.","levels_vi":["Tính sai số ngày mang thai, tiêm trước ngày 113, gây đẻ non, thai chết lưu.","Nếu được chỉ thị thì tiêm, nhưng còn thiếu sót về kiểm tra số ngày và đối tượng.","Nếu được chỉ thị thì tiêm đúng ngày tuổi thai, đúng đối tượng quy định một cách cơ bản.","Dù không có chỉ thị vẫn kiểm tra số ngày mang thai, xác nhận lợn nái đối tượng và tiêm đúng thời điểm.","Hiểu chống chỉ định tiêm sớm và quan hệ với thể vàng, và có thể hướng dẫn người mới cách phán đoán thời điểm tiêm phù hợp."],"name_id":"Memeriksa umur kebuntingan dan menyuntik pada waktu yang tepat","kanten_id":"Apakah dapat menghitung umur kebuntingan dengan benar, menghindari larangan penyuntikan sebelum hari ke-113, dan menyuntik pada umur dan sasaran yang ditentukan?","levels_id":["Salah menghitung umur kebuntingan sehingga menyuntik sebelum hari ke-113, dan menyebabkan lahir prematur atau lahir mati.","Menyuntik jika diperintah, tetapi sering lalai memeriksa jumlah hari dan sasaran.","Jika diperintah, dapat menyuntik pada umur dan sasaran yang ditentukan secara lengkap.","Tanpa diperintah pun, memeriksa umur kebuntingan, memastikan induk babi sasaran, dan menyuntik pada waktu yang tepat.","Memahami larangan penyuntikan terlalu awal dan hubungannya dengan korpus luteum, dan dapat mengajarkan penilaian waktu penyuntikan kepada karyawan baru."]},{"id":"injection-obs","name":"確実な注射と誘起後の分娩観察","kanten":"脂肪層への誤注射を避けて確実に注射し、誘起後の分娩観察を強化できるか。","levels":["脂肪層に誤注射して効果を弱め、誘起後の分娩観察も強化しない。","指示があれば接種するが、注射部位や観察強化に漏れがある。","指示があればひと通り正しく注射し、誘起後の観察ができる。","指示がなくても確実に筋注し、誘起後は分娩観察を強化する。","誤注射による吸収遅延を理解し、確実な注射と観察強化を新人に指導できる。"],"name_en":"Reliable Injection and Farrowing Observation After Induction","kanten_en":"Can they inject reliably while avoiding accidental injection into the fat layer, and intensify farrowing observation after induction?","levels_en":["Injects into the fat layer, weakening the effect, and does not intensify farrowing observation after induction.","With guidance can inject, but misses the injection site or the intensified observation.","With guidance can inject correctly and observe after induction through the basic procedure.","Independently gives a reliable intramuscular injection and intensifies farrowing observation after induction.","Understands delayed absorption from misplaced injections, and can teach new staff reliable injection and intensified observation."],"name_vi":"Tiêm chắc chắn và theo dõi đẻ sau khi kích thích","kanten_vi":"Có tiêm chắc chắn, tránh tiêm nhầm vào lớp mỡ, và tăng cường theo dõi đẻ sau khi kích thích không.","levels_vi":["Tiêm nhầm vào lớp mỡ làm giảm hiệu quả, cũng không tăng cường theo dõi đẻ sau khi kích thích.","Nếu được chỉ thị thì tiêm, nhưng còn thiếu sót về vị trí tiêm và tăng cường theo dõi.","Nếu được chỉ thị thì tiêm đúng và theo dõi sau khi kích thích một cách cơ bản.","Dù không có chỉ thị vẫn tiêm bắp chắc chắn, sau khi kích thích thì tăng cường theo dõi đẻ.","Hiểu việc tiêm sai chỗ làm thuốc hấp thu chậm, và có thể hướng dẫn người mới cách tiêm chắc chắn và tăng cường theo dõi."],"name_id":"Menyuntik dengan pasti dan mengawasi kelahiran setelah induksi","kanten_id":"Apakah dapat menyuntik dengan pasti tanpa salah masuk ke lapisan lemak, dan memperketat pengawasan kelahiran setelah induksi?","levels_id":["Salah menyuntik ke lapisan lemak sehingga efeknya lemah, dan tidak memperketat pengawasan kelahiran setelah induksi.","Menyuntik jika diperintah, tetapi sering lalai soal lokasi suntikan dan penguatan pengawasan.","Jika diperintah, dapat menyuntik dengan benar dan mengawasi setelah induksi secara lengkap.","Tanpa diperintah pun, menyuntik ke dalam otot dengan pasti, dan memperketat pengawasan kelahiran setelah induksi.","Memahami bahwa salah suntik memperlambat penyerapan obat, dan dapat mengajarkan cara menyuntik yang pasti dan penguatan pengawasan kepada karyawan baru."]}],"gyomu":"36","name_en":"PG (Prostaglandin) Injection","purposeShort_en":"Synchronize farrowing timing to make farrowing management and attendance easier","name_vi":"Tiêm PG (prostaglandin)","purposeShort_vi":"Làm đồng đều thời điểm đẻ, giúp quản lý đẻ và trực đẻ dễ dàng hơn","name_id":"Penyuntikan PG (prostaglandin) — induksi kelahiran","purposeShort_id":"Menyeragamkan waktu melahirkan agar pengelolaan dan pendampingan kelahiran lebih mudah"},{"id":"uterine-wash","category":"breeding","no":"No.42","name":"子宮内洗浄","purposeShort":"子宮内の汚染物を減らし、子宮炎・発熱を防ぎ産後回復を促す","aspects":[{"id":"target-select","name":"対象選定と獣医師指示の遵守","kanten":"全頭には行わず対象を選定し、薬剤の濃度・量を守って獣医師の指示に従えるか。","levels":["全頭にルーチンで行い、薬剤の濃度・量も守らず自然回復を妨げる。","指示があれば実施するが、対象選定や濃度管理に漏れがある。","指示があれば対象を選び、決められた濃度・量でひと通り実施できる。","指示がなくても手入れした母豚等に絞り、濃度・量を守って獣医師の指示に従う。","予防的ルーチン洗浄の弊害を理解し、対象選定と適正実施を新人に指導できる。"],"name_en":"Case Selection and Following Veterinary Instructions","kanten_en":"Can they select cases instead of treating every sow, keep the correct drug concentration and volume, and follow the veterinarian's instructions?","levels_en":["Performs it routinely on every sow, ignores drug concentration and volume, and hinders natural recovery.","With guidance can perform it, but misses case selection or concentration control.","With guidance can select cases and perform the basic procedure at the designated concentration and volume.","Independently limits treatment to sows that required manual intervention and the like, keeps concentration and volume, and follows the veterinarian's instructions.","Understands the harm of routine preventive flushing, and can teach new staff case selection and proper practice."],"name_vi":"Chọn đối tượng và tuân theo chỉ thị của bác sĩ thú y","kanten_vi":"Có chọn đối tượng thay vì làm cho tất cả, giữ đúng nồng độ và lượng thuốc, tuân theo chỉ thị của bác sĩ thú y không.","levels_vi":["Làm thường quy cho tất cả, không giữ đúng nồng độ và lượng thuốc, cản trở hồi phục tự nhiên.","Nếu được chỉ thị thì thực hiện, nhưng còn thiếu sót về chọn đối tượng và quản lý nồng độ.","Nếu được chỉ thị thì chọn đối tượng, thực hiện đúng nồng độ và lượng quy định một cách cơ bản.","Dù không có chỉ thị vẫn chỉ làm cho lợn nái đã can thiệp bằng tay v.v., giữ đúng nồng độ, lượng thuốc và tuân theo chỉ thị của bác sĩ thú y.","Hiểu tác hại của việc rửa thường quy để phòng bệnh, và có thể hướng dẫn người mới cách chọn đối tượng và thực hiện đúng."],"name_id":"Memilih sasaran dan mengikuti perintah dokter hewan","kanten_id":"Apakah tidak melakukan pada semua babi tetapi memilih sasaran, menjaga kepekatan dan jumlah obat, serta mengikuti perintah dokter hewan?","levels_id":["Melakukan secara rutin pada semua babi, tidak menjaga kepekatan dan jumlah obat, sehingga menghambat pemulihan alami.","Melakukan jika diperintah, tetapi sering lalai memilih sasaran dan mengatur kepekatan.","Jika diperintah, dapat memilih sasaran dan melakukannya secara lengkap dengan kepekatan dan jumlah yang ditentukan.","Tanpa diperintah pun, membatasi hanya pada induk babi yang dibantu saat melahirkan dan sejenisnya, menjaga kepekatan dan jumlah obat, serta mengikuti perintah dokter hewan.","Memahami kerugian pencucian rutin sebagai pencegahan, dan dapat mengajarkan pemilihan sasaran dan pelaksanaan yang tepat kepada karyawan baru."]},{"id":"aseptic-gentle","name":"滅菌器具・穏やかな操作と術後観察","kanten":"滅菌した器具・洗浄液を使い、強くこすらず、実施後の体調・悪露を観察できるか。","levels":["非滅菌の器具・洗浄液を使い、強くこすって子宮内膜を傷め、術後観察も省く。","指示があれば実施するが、滅菌や術後観察に漏れがある。","指示があれば滅菌器具でひと通り実施し、術後の体調を確認できる。","指示がなくても滅菌器具で穏やかに操作し、実施後の体調・悪露を観察する。","二次汚染・内膜損傷のリスクを理解し、無菌操作と術後観察を新人に指導できる。"],"name_en":"Sterile Equipment, Gentle Handling, and Follow-up Observation","kanten_en":"Can they use sterilized equipment and flushing solution, avoid harsh scrubbing, and monitor condition and lochia afterward?","levels_en":["Uses unsterilized equipment and solution, scrubs hard and damages the endometrium, and skips follow-up observation.","With guidance can perform it, but misses sterilization or follow-up observation.","With guidance can perform the basic procedure with sterile equipment and check the sow's condition afterward.","Independently handles the procedure gently with sterile equipment and monitors condition and lochia afterward.","Understands the risks of secondary contamination and endometrial damage, and can teach new staff aseptic technique and follow-up observation."],"name_vi":"Dụng cụ tiệt trùng, thao tác nhẹ nhàng và theo dõi sau khi làm","kanten_vi":"Có dùng dụng cụ và dung dịch rửa đã tiệt trùng, không chà xát mạnh, theo dõi thể trạng và sản dịch sau khi thực hiện không.","levels_vi":["Dùng dụng cụ, dung dịch không tiệt trùng, chà xát mạnh làm tổn thương niêm mạc tử cung, cũng bỏ qua theo dõi sau khi làm.","Nếu được chỉ thị thì thực hiện, nhưng còn thiếu sót về tiệt trùng và theo dõi sau khi làm.","Nếu được chỉ thị thì thực hiện bằng dụng cụ tiệt trùng và kiểm tra thể trạng sau khi làm một cách cơ bản.","Dù không có chỉ thị vẫn thao tác nhẹ nhàng với dụng cụ tiệt trùng, theo dõi thể trạng và sản dịch sau khi thực hiện.","Hiểu rủi ro nhiễm bẩn thứ cấp và tổn thương niêm mạc, và có thể hướng dẫn người mới thao tác vô trùng và theo dõi sau khi làm."],"name_id":"Alat steril, penanganan lembut, dan pengawasan setelah tindakan","kanten_id":"Apakah memakai alat dan cairan pencuci yang steril, tidak menggosok keras, serta mengawasi kondisi tubuh dan cairan nifas (lokia) setelah tindakan?","levels_id":["Memakai alat dan cairan pencuci yang tidak steril, menggosok keras hingga melukai dinding rahim, dan melewatkan pengawasan setelah tindakan.","Melakukan jika diperintah, tetapi sering lalai soal sterilisasi dan pengawasan setelah tindakan.","Jika diperintah, dapat melakukannya secara lengkap dengan alat steril dan memeriksa kondisi tubuh setelah tindakan.","Tanpa diperintah pun, menangani dengan lembut memakai alat steril, dan setelah tindakan mengawasi kondisi tubuh dan cairan nifas (lokia).","Memahami risiko pencemaran ulang dan luka pada dinding rahim, dan dapat mengajarkan penanganan steril dan pengawasan setelah tindakan kepada karyawan baru."]}],"gyomu":"42","name_en":"Uterine Flushing","purposeShort_en":"Reduce uterine contamination, prevent metritis and fever, and promote postpartum recovery","name_vi":"Rửa tử cung (sau khi đẻ)","purposeShort_vi":"Giảm chất bẩn trong tử cung, phòng viêm tử cung, sốt và giúp hồi phục sau đẻ","name_id":"Pencucian rahim (setelah melahirkan)","purposeShort_id":"Mengurangi kotoran di dalam rahim, mencegah radang rahim dan demam, serta mempercepat pemulihan setelah melahirkan"},{"id":"farrow-entry","category":"farrowing","no":"No.26","name":"入室（分娩舎）","purposeShort":"分娩が近い母豚だけを入れ、落ち着いた状態で分娩を迎えさせる","aspects":[{"id":"prep-before","name":"入室前の舎内準備","kanten":"入室前に床・温度・水・エサと分娩クレートの洗浄・乾燥を整えられるか。","levels":["分娩舎の温度・保温灯を確認せず、クレート洗浄・乾燥も未完了のまま入室させ、子豚低体温死を招く。","指示があれば準備するが、温度設定やクレート乾燥の確認に漏れがある。","指示があれば床・温度・水・エサをひと通り整えられる。","指示がなくても入室前に温度・保温灯・水・エサとクレートの洗浄・乾燥を確認する。","入室前準備が子豚の生存に直結すると理解し、準備の要点を新人に指導できる。"],"name_en":"House Preparation Before Entry","kanten_en":"Can they prepare the floor, temperature, water, and feed, and wash and dry the farrowing crates before entry?","levels_en":["Moves sows in without checking the house temperature or heat lamps and with crates not yet washed and dried, causing piglet deaths from hypothermia.","With guidance can prepare, but misses the temperature settings or the crate-drying check.","With guidance can set up the floor, temperature, water, and feed through the basic procedure.","Independently checks temperature, heat lamps, water, feed, and crate washing and drying before entry.","Understands that pre-entry preparation directly affects piglet survival, and can teach new staff the key points of preparation."],"name_vi":"Chuẩn bị trong chuồng trước khi đưa lợn vào","kanten_vi":"Trước khi đưa lợn vào, có chuẩn bị sàn, nhiệt độ, nước, thức ăn và rửa, làm khô cũi đẻ không.","levels_vi":["Không kiểm tra nhiệt độ và đèn sưởi ấm của chuồng đẻ, đưa lợn vào khi cũi chưa rửa, chưa khô, khiến lợn con chết vì hạ thân nhiệt.","Nếu được chỉ thị thì chuẩn bị, nhưng còn thiếu sót về kiểm tra cài đặt nhiệt độ và độ khô của cũi.","Nếu được chỉ thị thì chuẩn bị sàn, nhiệt độ, nước, thức ăn được cơ bản.","Dù không có chỉ thị vẫn kiểm tra nhiệt độ, đèn sưởi ấm, nước, thức ăn và việc rửa, làm khô cũi trước khi đưa lợn vào.","Hiểu việc chuẩn bị trước khi vào chuồng liên quan trực tiếp đến sự sống của lợn con, và có thể hướng dẫn người mới các điểm chính của việc chuẩn bị."],"name_id":"Menyiapkan kandang sebelum babi masuk","kanten_id":"Apakah sebelum babi masuk dapat menyiapkan lantai, suhu, air, pakan, serta mencuci dan mengeringkan farrowing crate?","levels_id":["Tidak memeriksa suhu dan lampu pemanas kandang beranak, memasukkan babi sebelum farrowing crate selesai dicuci dan dikeringkan, sehingga anak babi mati kedinginan.","Menyiapkan jika diperintah, tetapi sering lalai memeriksa pengaturan suhu dan kekeringan crate.","Jika diperintah, dapat menyiapkan lantai, suhu, air, dan pakan secara lengkap.","Tanpa diperintah pun, sebelum babi masuk memeriksa suhu, lampu pemanas, air, pakan, serta pencucian dan pengeringan crate.","Memahami bahwa persiapan sebelum masuk langsung menentukan hidup mati anak babi, dan dapat mengajarkan pokok persiapan kepada karyawan baru."]},{"id":"batch-entry","name":"適期の一斉入室と入室後観察","kanten":"分娩が近い母豚をロットごとに一斉入室させ、途中追加を避け、入室後の体調・行動を観察できるか。","levels":["入室タイミングが遅れて妊娠舎で分娩させ、入室後の観察も怠る。","指示があれば入室させるが、タイミングや一斉入室の管理に漏れがある。","指示があればロットごとに一斉入室させ、ひと通り観察できる。","指示がなくても適期にロット単位で入室させ、途中追加を避けて入室後を観察する。","オールイン・オールアウトの意義を理解し、適期入室と観察を新人に指導できる。"],"name_en":"Timely Batch Entry and Observation After Entry","kanten_en":"Can they move sows close to farrowing in by lot all at once, avoid mid-batch additions, and observe condition and behavior after entry?","levels_en":["Moves sows in too late so they farrow in the gestation house, and neglects observation after entry.","With guidance can move sows in, but misses the timing or batch-entry management.","With guidance can move sows in by lot all at once and observe them through the basic routine.","Independently moves sows in by lot at the right time, avoids mid-batch additions, and observes them after entry.","Understands the value of all-in/all-out, and can teach new staff timely entry and observation."],"name_vi":"Đưa vào đồng loạt đúng thời điểm và theo dõi sau khi vào","kanten_vi":"Có đưa lợn nái sắp đẻ vào đồng loạt theo từng lô, tránh bổ sung giữa chừng, theo dõi thể trạng và hành vi sau khi vào không.","levels_vi":["Đưa vào muộn khiến nái đẻ ở chuồng mang thai, cũng lơ là theo dõi sau khi vào.","Nếu được chỉ thị thì đưa lợn vào, nhưng còn thiếu sót về thời điểm và quản lý đưa vào đồng loạt.","Nếu được chỉ thị thì đưa vào đồng loạt theo lô và theo dõi được cơ bản.","Dù không có chỉ thị vẫn đưa vào theo lô đúng thời điểm, tránh bổ sung giữa chừng và theo dõi sau khi vào.","Hiểu ý nghĩa của cùng vào - cùng ra (all-in all-out), và có thể hướng dẫn người mới việc đưa vào đúng thời điểm và theo dõi."],"name_id":"Memasukkan serentak pada waktu yang tepat dan mengawasi setelahnya","kanten_id":"Apakah dapat memasukkan induk babi yang hampir melahirkan serentak per kelompok (lot), menghindari penambahan di tengah jalan, dan mengawasi kondisi tubuh dan tingkah lakunya setelah masuk?","levels_id":["Terlambat memasukkan sehingga babi melahirkan di kandang bunting, dan lalai mengawasi setelah masuk.","Memasukkan jika diperintah, tetapi sering lalai soal waktu dan pengaturan masuk serentak.","Jika diperintah, dapat memasukkan serentak per kelompok (lot) dan mengawasinya secara lengkap.","Tanpa diperintah pun, memasukkan per kelompok (lot) pada waktu yang tepat, menghindari penambahan di tengah jalan, dan mengawasi setelah masuk.","Memahami arti sistem all-in all-out, dan dapat mengajarkan waktu masuk yang tepat dan pengawasan kepada karyawan baru."]}],"gyomu":"26","name_en":"Entry (Farrowing House)","purposeShort_en":"Move in only sows close to farrowing so they can farrow in a calm state","name_vi":"Đưa nái vào chuồng đẻ","purposeShort_vi":"Chỉ đưa lợn nái sắp đẻ vào, để nái đón cuộc đẻ trong trạng thái yên tĩnh","name_id":"Memasukkan induk ke kandang beranak","purposeShort_id":"Memasukkan hanya induk babi yang hampir melahirkan, agar melahirkan dalam keadaan tenang"},{"id":"farrow-assist","category":"farrowing","no":"No.35","name":"分娩介助","purposeShort":"母豚と子豚の命を守り、死産・直後の死亡を減らし初乳を飲ませる","aspects":[{"id":"timing","name":"介助タイミングの見極め","kanten":"分娩間隔を計り、子豚が長く出てこない時だけ適切に介助できるか。","levels":["分娩間隔を見ずに放置し、45分を超えても介助せず低酸素・死産を増やす。","指示があれば介助するが、分娩間隔の見極めが甘く判断は他者まかせ。","指示があれば分娩間隔を計り、長く出ない時にひと通り介助できる。","指示がなくても分娩間隔を計り、必要な時だけ適切に介助する。","分娩間隔と低酸素・死産の関係を理解し、介助の見極めを新人に指導できる。"],"name_en":"Judging When to Assist","kanten_en":"Can they time the birth intervals and assist properly only when a piglet is long overdue?","levels_en":["Leaves the sow unattended without watching birth intervals, fails to assist even past 45 minutes, and increases hypoxia and stillbirths.","With guidance can assist, but judges birth intervals poorly and leaves decisions to others.","With guidance can time birth intervals and perform basic assistance when a piglet is long overdue.","Independently times birth intervals and assists properly only when needed.","Understands the relationship between birth intervals, hypoxia, and stillbirth, and can teach new staff how to judge when to assist."],"name_vi":"Phán đoán thời điểm can thiệp","kanten_vi":"Có đo khoảng cách giữa các lần đẻ, chỉ can thiệp đúng cách khi lợn con lâu không ra không.","levels_vi":["Không theo dõi khoảng cách giữa các lần đẻ mà bỏ mặc, quá 45 phút vẫn không can thiệp, làm tăng thiếu oxy và chết lưu.","Nếu được chỉ thị thì can thiệp, nhưng phán đoán khoảng cách đẻ còn kém và phó mặc người khác quyết định.","Nếu được chỉ thị thì đo khoảng cách giữa các lần đẻ và can thiệp được cơ bản khi lợn con lâu không ra.","Dù không có chỉ thị vẫn đo khoảng cách giữa các lần đẻ, chỉ can thiệp đúng cách khi cần.","Hiểu quan hệ giữa khoảng cách đẻ với thiếu oxy, chết lưu, và có thể hướng dẫn người mới cách phán đoán khi nào cần can thiệp."],"name_id":"Menilai waktu yang tepat untuk membantu","kanten_id":"Apakah dapat mengukur jarak waktu antar kelahiran, dan membantu dengan tepat hanya saat anak babi lama tidak keluar?","levels_id":["Membiarkan tanpa melihat jarak waktu antar kelahiran, tidak membantu walau lebih dari 45 menit, sehingga kekurangan oksigen dan lahir mati bertambah.","Membantu jika diperintah, tetapi penilaian jarak waktu antar kelahiran lemah dan keputusan diserahkan ke orang lain.","Jika diperintah, dapat mengukur jarak waktu antar kelahiran dan membantu secara lengkap saat anak babi lama tidak keluar.","Tanpa diperintah pun, mengukur jarak waktu antar kelahiran dan membantu dengan tepat hanya saat diperlukan.","Memahami hubungan jarak waktu antar kelahiran dengan kekurangan oksigen dan lahir mati, dan dapat mengajarkan penilaian kapan harus membantu kepada karyawan baru."]},{"id":"asepsis-lubric","name":"清潔・潤滑と薬剤の適正使用","kanten":"介助時に清潔と潤滑を守り、オキシトシンを過剰投与せず適正に使えるか。","levels":["清潔・潤滑を守らず、オキシトシンを過剰投与して過強陣痛・死産を招く。","指示があれば清潔にするが、潤滑や薬剤量の管理に漏れがある。","指示があれば清潔と潤滑を守り、ひと通り介助できる。","指示がなくても清潔・潤滑を徹底し、薬剤を適正量で使う。","過剰投与の危険を理解し、清潔操作と薬剤の適正使用を新人に指導できる。"],"name_en":"Cleanliness, Lubrication, and Proper Drug Use","kanten_en":"Can they keep clean and lubricated during assistance and use oxytocin properly without overdosing?","levels_en":["Ignores cleanliness and lubrication, and overdoses oxytocin, causing hypertonic labor and stillbirths.","With guidance keeps things clean, but misses lubrication or dose control.","With guidance can keep clean and lubricated and perform basic assistance.","Independently maintains thorough cleanliness and lubrication and uses drugs at the proper dose.","Understands the dangers of overdosing, and can teach new staff clean technique and proper drug use."],"name_vi":"Sạch sẽ, bôi trơn và dùng thuốc đúng cách","kanten_vi":"Khi can thiệp có giữ sạch sẽ và bôi trơn, dùng oxytocin (thuốc giục đẻ) đúng cách, không quá liều không.","levels_vi":["Không giữ sạch sẽ, không bôi trơn, tiêm oxytocin quá liều gây cơn co quá mạnh, chết lưu.","Nếu được chỉ thị thì giữ sạch, nhưng còn thiếu sót về bôi trơn và quản lý liều thuốc.","Nếu được chỉ thị thì giữ sạch sẽ, bôi trơn và can thiệp được cơ bản.","Dù không có chỉ thị vẫn giữ sạch sẽ, bôi trơn triệt để, dùng thuốc đúng liều.","Hiểu nguy hiểm của việc quá liều, và có thể hướng dẫn người mới thao tác sạch sẽ và dùng thuốc đúng cách."],"name_id":"Kebersihan, pelumas, dan pemakaian obat yang tepat","kanten_id":"Apakah saat membantu menjaga kebersihan dan memakai pelumas, serta memakai oksitosin dengan tepat tanpa dosis berlebihan?","levels_id":["Tidak menjaga kebersihan dan pelumas, memberi oksitosin berlebihan sehingga kontraksi terlalu kuat dan terjadi lahir mati.","Menjaga kebersihan jika diperintah, tetapi sering lalai soal pelumas dan takaran obat.","Jika diperintah, dapat menjaga kebersihan dan pelumas serta membantu secara lengkap.","Tanpa diperintah pun, menjaga kebersihan dan pelumas dengan ketat, dan memakai obat dengan takaran yang tepat.","Memahami bahaya dosis berlebihan, dan dapat mengajarkan penanganan bersih dan pemakaian obat yang tepat kepada karyawan baru."]},{"id":"newborn-care","name":"新生子豚の乾燥・保温・蘇生","kanten":"生まれた子豚をすぐ乾かし温め、呼吸を確認し、仮死子豚を蘇生できるか。","levels":["子豚を乾かさず温めず、仮死子豚を死産と誤判断して蘇生処置を省く。","指示があれば処置するが、呼吸確認や蘇生の判断に漏れがある。","指示があれば子豚を乾かし温め、呼吸をひと通り確認できる。","指示がなくてもすぐ乾かして温め、仮死子豚を見分けて蘇生処置を行う。","仮死と死産の見分けや蘇生の意義を理解し、新生子豚の初期処置を新人に指導できる。"],"name_en":"Drying, Warming, and Resuscitating Newborn Piglets","kanten_en":"Can they dry and warm newborn piglets immediately, check breathing, and resuscitate piglets born in apparent lifelessness?","levels_en":["Does not dry or warm piglets, mistakes asphyxiated piglets for stillbirths, and skips resuscitation.","With guidance can treat piglets, but misses breathing checks or the decision to resuscitate.","With guidance can dry and warm piglets and check breathing through the basic routine.","Independently dries and warms piglets immediately, recognizes asphyxiated piglets, and performs resuscitation.","Understands how to distinguish asphyxia from stillbirth and the value of resuscitation, and can teach new staff the initial care of newborn piglets."],"name_vi":"Lau khô, giữ ấm, hồi sức lợn con sơ sinh","kanten_vi":"Có lau khô, sưởi ấm lợn con ngay sau khi sinh, kiểm tra hô hấp và hồi sức cho lợn con bị ngạt không.","levels_vi":["Không lau khô, không sưởi ấm lợn con, nhầm lợn con bị ngạt là chết lưu và bỏ qua hồi sức.","Nếu được chỉ thị thì xử lý, nhưng còn thiếu sót trong kiểm tra hô hấp và phán đoán hồi sức.","Nếu được chỉ thị thì lau khô, sưởi ấm lợn con và kiểm tra hô hấp được cơ bản.","Dù không có chỉ thị vẫn lau khô, sưởi ấm ngay, phân biệt được lợn con bị ngạt và tiến hành hồi sức.","Hiểu cách phân biệt ngạt với chết lưu và ý nghĩa của hồi sức, và có thể hướng dẫn người mới cách xử lý ban đầu cho lợn con sơ sinh."],"name_id":"Mengeringkan, menghangatkan, dan menghidupkan kembali anak babi baru lahir","kanten_id":"Apakah dapat segera mengeringkan dan menghangatkan anak babi yang lahir, memeriksa napasnya, dan menolong anak babi yang lemas seperti mati (asfiksia)?","levels_id":["Tidak mengeringkan dan menghangatkan anak babi, salah mengira anak babi lemas sebagai lahir mati, dan melewatkan pertolongan napas.","Menangani jika diperintah, tetapi sering lalai memeriksa napas dan menilai perlunya pertolongan.","Jika diperintah, dapat mengeringkan dan menghangatkan anak babi serta memeriksa napasnya secara lengkap.","Tanpa diperintah pun, segera mengeringkan dan menghangatkan, membedakan anak babi lemas dan melakukan pertolongan napas.","Memahami cara membedakan lemas dan lahir mati serta arti pertolongan napas, dan dapat mengajarkan penanganan awal anak babi baru lahir kepada karyawan baru."]}],"gyomu":"35","name_en":"Farrowing Assistance","purposeShort_en":"Protect the lives of sows and piglets, reduce stillbirths and early deaths, and ensure colostrum intake","name_vi":"Hỗ trợ đỡ đẻ","purposeShort_vi":"Bảo vệ tính mạng lợn nái và lợn con, giảm chết lưu, chết ngay sau đẻ và cho bú sữa đầu","name_id":"Membantu proses kelahiran","purposeShort_id":"Melindungi nyawa induk dan anak babi, mengurangi lahir mati dan kematian setelah lahir, serta memberi kolostrum (susu pertama)"},{"id":"cross-foster","category":"farrowing","no":"No.39","name":"送り里子","purposeShort":"乳頭数と子豚数のバランスを整え、離乳頭数を増やし弱子を助ける","aspects":[{"id":"colostrum-first","name":"初乳摂取後の里子と対象選び","kanten":"初乳を飲ませてから、日齢・体重が近い健康な子豚を組み合わせ、乳頭数を超えないよう里子に出せるか。","levels":["初乳摂取が不十分なまま移動させ、体重差の大きい子豚を混ぜ、病気の子豚も里子にする。","指示があれば里子に出すが、初乳確認や対象選びに漏れが多い。","指示があれば初乳を飲ませてから日齢・体重の近い子豚をひと通り組める。","指示がなくても生後12〜24時間で初乳を飲ませ、体重差を抑えて乳頭数内に収める。","初乳と免疫獲得の関係を理解し、里子の対象選びと頭数管理を新人に指導できる。"],"name_en":"Fostering After Colostrum Intake and Selecting Candidates","kanten_en":"Can they foster only after colostrum intake, match healthy piglets of similar age and weight, and stay within the teat count?","levels_en":["Moves piglets with insufficient colostrum intake, mixes piglets with large weight differences, and fosters sick piglets too.","With guidance can foster, but often misses the colostrum check or candidate selection.","With guidance can ensure colostrum intake first and match piglets of similar age and weight through the basic procedure.","Independently ensures colostrum intake within 12-24 hours of birth, limits weight differences, and stays within the teat count.","Understands the relationship between colostrum and immunity, and can teach new staff candidate selection and litter-size management."],"name_vi":"Ghép bầy sau khi bú sữa đầu và chọn đối tượng","kanten_vi":"Có cho bú sữa đầu trước, ghép các lợn con khỏe mạnh có ngày tuổi, cân nặng gần nhau, không vượt quá số vú không.","levels_vi":["Chuyển đi khi chưa bú đủ sữa đầu, ghép lợn con chênh lệch cân nặng lớn, cho cả lợn con bệnh đi ghép bầy.","Nếu được chỉ thị thì ghép bầy, nhưng hay thiếu sót về kiểm tra sữa đầu và chọn đối tượng.","Nếu được chỉ thị thì cho bú sữa đầu rồi ghép các con có ngày tuổi, cân nặng gần nhau một cách cơ bản.","Dù không có chỉ thị vẫn cho bú sữa đầu trong 12-24 giờ sau sinh, hạn chế chênh lệch cân nặng và giữ trong số vú.","Hiểu quan hệ giữa sữa đầu và miễn dịch, và có thể hướng dẫn người mới cách chọn con ghép bầy và quản lý số con."],"name_id":"Menitipkan setelah minum kolostrum dan memilih sasaran","kanten_id":"Apakah menitipkan setelah anak minum kolostrum (susu pertama), memasangkan anak babi sehat yang umur dan beratnya berdekatan, dan tidak melebihi jumlah puting?","levels_id":["Memindahkan sebelum cukup minum kolostrum, mencampur anak babi yang beda beratnya besar, dan menitipkan juga anak babi yang sakit.","Menitipkan jika diperintah, tetapi sering lalai memastikan kolostrum dan memilih sasaran.","Jika diperintah, dapat memasangkan anak babi yang umur dan beratnya berdekatan secara lengkap setelah minum kolostrum.","Tanpa diperintah pun, memberi kolostrum dalam 12-24 jam setelah lahir, menekan beda berat, dan menjaga jumlah dalam batas jumlah puting.","Memahami hubungan kolostrum dengan kekebalan, dan dapat mengajarkan pemilihan anak titipan dan pengaturan jumlah kepada karyawan baru."]},{"id":"acceptance-care","name":"母豚の拒絶対策","kanten":"里子移動時に臭い付けなどで母豚の拒絶を防ぎ、定着を確認できるか。","levels":["臭い付けなどの拒絶対策をせず、母豚に拒まれても放置する。","指示があれば対策するが、定着の確認に漏れがある。","指示があれば拒絶対策をひと通り行える。","指示がなくても臭い付け等で拒絶を防ぎ、定着を確認する。","母豚の拒絶の仕組みを理解し、拒絶対策と定着確認を新人に指導できる。"],"name_en":"Preventing Rejection by the Sow","kanten_en":"Can they prevent rejection by the sow with scent-masking and the like during fostering, and confirm the piglets settle in?","levels_en":["Takes no anti-rejection measures such as scent-masking, and leaves piglets alone even when the sow rejects them.","With guidance can take measures, but misses confirming that the piglets settle in.","With guidance can carry out the basic anti-rejection measures.","Independently prevents rejection with scent-masking and the like and confirms the piglets settle in.","Understands how sow rejection occurs, and can teach new staff anti-rejection measures and settlement checks."],"name_vi":"Đối sách khi nái từ chối con","kanten_vi":"Khi chuyển con ghép bầy có phòng nái từ chối bằng cách tạo mùi v.v., kiểm tra con đã quen bầy chưa không.","levels_vi":["Không có biện pháp như tạo mùi, nái từ chối cũng bỏ mặc.","Nếu được chỉ thị thì làm, nhưng còn thiếu sót trong kiểm tra con đã quen bầy chưa.","Nếu được chỉ thị thì thực hiện đối sách chống từ chối được cơ bản.","Dù không có chỉ thị vẫn phòng từ chối bằng tạo mùi v.v. và kiểm tra con đã quen bầy.","Hiểu cơ chế nái từ chối con, và có thể hướng dẫn người mới cách chống từ chối và kiểm tra con quen bầy."],"name_id":"Mencegah penolakan oleh induk babi","kanten_id":"Apakah saat memindahkan anak titipan dapat mencegah penolakan induk babi, misalnya dengan menyamakan bau, dan memastikan anak diterima?","levels_id":["Tidak melakukan pencegahan penolakan seperti menyamakan bau, dan membiarkan walaupun induk babi menolak.","Melakukan pencegahan jika diperintah, tetapi sering lalai memastikan anak diterima.","Jika diperintah, dapat melakukan pencegahan penolakan secara lengkap.","Tanpa diperintah pun, mencegah penolakan dengan menyamakan bau dan sebagainya, lalu memastikan anak diterima.","Memahami mengapa induk babi menolak, dan dapat mengajarkan pencegahan penolakan dan pemastian penerimaan kepada karyawan baru."]}],"gyomu":"39","name_en":"Cross-Fostering","purposeShort_en":"Balance teat numbers and litter sizes, increase weaned piglets, and help weak piglets","name_vi":"Ghép bầy (cho nái khác nuôi)","purposeShort_vi":"Cân bằng số vú và số lợn con, tăng số con cai sữa và cứu con yếu","name_id":"Titip anak ke induk lain","purposeShort_id":"Menyeimbangkan jumlah puting dan jumlah anak babi, menambah jumlah anak sapih, dan menolong anak yang lemah"},{"id":"sow-lineup","category":"facility","no":"No.13","name":"母豚の並びの整理","purposeShort":"母豚をまとめて管理しやすくし、ケンカ・ストレスを減らす","aspects":[{"id":"schedule-order","name":"分娩予定日順の整列と台帳反映","kanten":"交配日・分娩予定日のズレを抑えて整列させ、並び情報を台帳に反映できるか。","levels":["分娩予定日順に整列させず、並び情報も台帳に反映せず認識齟齬を招く。","指示があれば整列させるが、予定日順の徹底や台帳反映に漏れがある。","指示があれば分娩予定日順にひと通り整列できる。","指示がなくても予定日のズレを抑えて整列させ、並び情報を台帳に反映する。","整列と移動指示の連動を理解し、並び管理と台帳反映を新人に指導できる。"],"name_en":"Lining Up by Due Date and Updating the Ledger","kanten_en":"Can they line up sows with minimal gaps in mating and due dates, and record the lineup in the ledger?","levels_en":["Does not line sows up by due date and does not record the lineup in the ledger, causing misunderstandings.","With guidance can line sows up, but misses strict due-date ordering or ledger updates.","With guidance can line sows up by due date through the basic procedure.","Independently lines sows up with minimal due-date gaps and records the lineup in the ledger.","Understands how the lineup links to movement orders, and can teach new staff lineup management and ledger updates."],"name_vi":"Xếp theo thứ tự ngày dự sinh và cập nhật sổ quản lý","kanten_vi":"Có xếp hàng sao cho ngày giao phối, ngày dự sinh ít chênh lệch, và ghi thông tin vị trí vào sổ quản lý không.","levels_vi":["Không xếp theo thứ tự ngày dự sinh, cũng không ghi thông tin vị trí vào sổ, gây hiểu nhầm lẫn nhau.","Nếu được chỉ thị thì xếp, nhưng còn thiếu sót về xếp đúng thứ tự ngày dự sinh và cập nhật sổ.","Nếu được chỉ thị thì xếp theo thứ tự ngày dự sinh được cơ bản.","Dù không có chỉ thị vẫn xếp cho ngày dự sinh ít chênh lệch và ghi thông tin vị trí vào sổ quản lý.","Hiểu sự liên kết giữa xếp hàng và chỉ thị di chuyển, và có thể hướng dẫn người mới cách quản lý vị trí và cập nhật sổ."],"name_id":"Menata urut tanggal perkiraan melahirkan dan mencatat ke buku","kanten_id":"Apakah dapat menata dengan menekan selisih tanggal kawin dan perkiraan melahirkan, serta mencatat susunan posisinya ke buku catatan?","levels_id":["Tidak menata urut tanggal perkiraan melahirkan, tidak mencatat susunan ke buku catatan, sehingga terjadi salah paham.","Menata jika diperintah, tetapi sering lalai menepati urutan tanggal dan mencatat ke buku.","Jika diperintah, dapat menata urut tanggal perkiraan melahirkan secara lengkap.","Tanpa diperintah pun, menata dengan menekan selisih tanggal perkiraan, dan mencatat susunan posisi ke buku catatan.","Memahami kaitan penataan dengan instruksi pemindahan, dan dapat mengajarkan pengaturan susunan dan pencatatan kepada karyawan baru."]},{"id":"compatibility","name":"体格差・攻撃性への配慮","kanten":"極端に弱い・大きい母豚や攻撃的な個体を同じ並びに入れず、負傷を防げるか。","levels":["体格差・攻撃性を考えず収容し、負傷が出ても気にしない。","指示があれば配慮するが、体格差や攻撃性の見極めに漏れがある。","指示があれば極端に弱い・大きい母豚を分けてひと通り配置できる。","指示がなくても体格差・攻撃性を見て収容し、妊娠初期の大きな並び替えを避ける。","収容と負傷・ストレスの関係を理解し、相性を考えた配置を新人に指導できる。"],"name_en":"Accounting for Size Differences and Aggression","kanten_en":"Can they keep extremely weak, oversized, or aggressive sows out of the same lineup and prevent injuries?","levels_en":["Houses sows without regard to size differences or aggression, and does not care even when injuries occur.","With guidance can take care, but misses judging size differences or aggression.","With guidance can separate extremely weak or oversized sows and complete the basic placement.","Independently houses sows with attention to size and aggression, and avoids major regrouping in early gestation.","Understands how housing relates to injury and stress, and can teach new staff compatibility-based placement."],"name_vi":"Chú ý chênh lệch thể trạng và tính hung dữ","kanten_vi":"Có tránh xếp lợn nái quá yếu, quá to hoặc con hung dữ vào cùng hàng, phòng bị thương không.","levels_vi":["Xếp lợn không xét chênh lệch thể trạng, tính hung dữ, có con bị thương cũng không quan tâm.","Nếu được chỉ thị thì chú ý, nhưng còn thiếu sót trong nhận biết chênh lệch thể trạng và tính hung dữ.","Nếu được chỉ thị thì tách riêng lợn nái quá yếu, quá to và sắp xếp được cơ bản.","Dù không có chỉ thị vẫn xem thể trạng, tính hung dữ khi xếp, tránh xáo trộn lớn vào đầu thai kỳ.","Hiểu quan hệ giữa cách xếp với bị thương, stress, và có thể hướng dẫn người mới cách bố trí có xét đến sự hợp nhau."],"name_id":"Memperhatikan beda ukuran badan dan sifat agresif","kanten_id":"Apakah tidak menempatkan induk babi yang sangat lemah, sangat besar, atau agresif dalam satu barisan, sehingga mencegah luka?","levels_id":["Menempatkan tanpa memikirkan beda ukuran badan dan sifat agresif, dan tidak peduli walaupun ada yang terluka.","Memperhatikan jika diperintah, tetapi sering lalai menilai beda ukuran badan dan sifat agresif.","Jika diperintah, dapat memisahkan induk babi yang sangat lemah atau sangat besar dan menempatkannya secara lengkap.","Tanpa diperintah pun, menempatkan dengan melihat beda ukuran badan dan sifat agresif, serta menghindari penataan ulang besar pada awal kebuntingan.","Memahami hubungan penempatan dengan luka dan stres, dan dapat mengajarkan penempatan yang memperhatikan kecocokan kepada karyawan baru."]}],"gyomu":"13","name_en":"Organizing the Sow Lineup","purposeShort_en":"Group sows for easier management and reduce fighting and stress","name_vi":"Sắp xếp lại vị trí lợn nái","purposeShort_vi":"Gom lợn nái lại cho dễ quản lý, giảm đánh nhau và stress","name_id":"Menata ulang posisi induk babi","purposeShort_id":"Mengelompokkan induk babi agar mudah dikelola, serta mengurangi perkelahian dan stres"},{"id":"move-order","category":"facility","no":"No.10","name":"移動指示","purposeShort":"ピッグフローを滞らせず、豚にストレスをかけず安全に移動させる","aspects":[{"id":"count-handover","name":"頭数・グループ確認と引き継ぎ","kanten":"移動する頭数・グループを事前確認し、口頭のみに頼らず引き継いで誤移動を防げるか。","levels":["口頭のみで指示し、頭数照合もせず担当交代時に誤移動・在庫ズレを招く。","指示があれば確認するが、頭数照合や引き継ぎに漏れが多い。","指示があれば移動頭数・グループをひと通り事前確認できる。","指示がなくても頭数・グループを確認し、記録で引き継いで実頭数と照合する。","誤移動・在庫ズレのリスクを理解し、頭数管理と引き継ぎを新人に指導できる。"],"name_en":"Confirming Head Counts and Groups, and Handover","kanten_en":"Can they confirm the head count and group to be moved in advance, and hand over with records rather than word of mouth to prevent wrong moves?","levels_en":["Gives orders only verbally without count verification, causing wrong moves and inventory mismatches at shift changes.","With guidance can confirm, but often misses count verification or handover.","With guidance can confirm the head count and group to be moved in advance through the basic procedure.","Independently confirms head counts and group
