s, hands over with records, and verifies against actual counts.","Understands the risks of wrong moves and inventory mismatches, and can teach new staff count management and handover."],"name_vi":"Kiểm tra số con, nhóm và bàn giao","kanten_vi":"Có kiểm tra trước số con, nhóm cần di chuyển, không chỉ dựa vào lời nói mà bàn giao bằng ghi chép để tránh di chuyển nhầm không.","levels_vi":["Chỉ thị chỉ bằng lời nói, không đối chiếu số con, gây di chuyển nhầm, lệch tồn kho khi đổi ca.","Nếu được chỉ thị thì kiểm tra, nhưng hay thiếu sót về đối chiếu số con và bàn giao.","Nếu được chỉ thị thì kiểm tra trước số con, nhóm di chuyển được cơ bản.","Dù không có chỉ thị vẫn kiểm tra số con, nhóm, bàn giao bằng ghi chép và đối chiếu với số con thực tế.","Hiểu rủi ro di chuyển nhầm, lệch tồn kho, và có thể hướng dẫn người mới cách quản lý số con và bàn giao."],"name_id":"Memeriksa jumlah ekor dan kelompok serta serah terima","kanten_id":"Apakah dapat memeriksa lebih dulu jumlah ekor dan kelompok yang dipindah, serta melakukan serah terima tidak hanya secara lisan sehingga mencegah salah pindah?","levels_id":["Memberi perintah hanya secara lisan tanpa mencocokkan jumlah ekor, sehingga saat ganti petugas terjadi salah pindah dan selisih stok.","Memeriksa jika diperintah, tetapi sering lalai mencocokkan jumlah ekor dan serah terima.","Jika diperintah, dapat memeriksa lebih dulu jumlah ekor dan kelompok yang dipindah secara lengkap.","Tanpa diperintah pun, memeriksa jumlah ekor dan kelompok, melakukan serah terima dengan catatan, dan mencocokkan dengan jumlah ekor sebenarnya.","Memahami risiko salah pindah dan selisih stok, dan dapat mengajarkan pengelolaan jumlah ekor dan serah terima kepada karyawan baru."]},{"id":"route-biosec","name":"通路確認と移動先の清浄性","kanten":"通路の段差・滑り・障害物を先に確認し、移動先の清掃・消毒完了を確かめて汚染搬入を防げるか。","levels":["通路を確認せず、清掃・消毒完了前の汚染豚舎に搬入する。","指示があれば通路を見るが、移動先の清浄性確認に漏れがある。","指示があれば通路の危険をひと通り確認できる。","指示がなくても通路を先に点検し、移動先の清掃・消毒完了を確かめてから移動する。","移動と防疫の関係を理解し、通路点検と清浄性確認を新人に指導できる。"],"name_en":"Checking Routes and Destination Cleanliness","kanten_en":"Can they check the route in advance for steps, slippery spots, and obstacles, and confirm the destination's cleaning and disinfection are complete to prevent bringing in contamination?","levels_en":["Does not check the route and moves pigs into a contaminated barn before cleaning and disinfection are complete.","With guidance checks the route, but misses confirming the destination's cleanliness.","With guidance can check the route hazards through the basic procedure.","Independently inspects the route first and confirms the destination's cleaning and disinfection are complete before moving.","Understands the link between movement and biosecurity, and can teach new staff route inspection and cleanliness checks."],"name_vi":"Kiểm tra lối đi và độ sạch của nơi chuyển đến","kanten_vi":"Có kiểm tra trước bậc, chỗ trơn, vật cản trên lối đi, xác nhận nơi chuyển đến đã vệ sinh, khử trùng xong để tránh mang ô nhiễm vào không.","levels_vi":["Không kiểm tra lối đi, đưa lợn vào chuồng ô nhiễm chưa vệ sinh, khử trùng xong.","Nếu được chỉ thị thì xem lối đi, nhưng còn thiếu sót trong kiểm tra độ sạch của nơi chuyển đến.","Nếu được chỉ thị thì kiểm tra chỗ nguy hiểm trên lối đi được cơ bản.","Dù không có chỉ thị vẫn kiểm tra lối đi trước, xác nhận nơi chuyển đến đã vệ sinh, khử trùng xong rồi mới di chuyển.","Hiểu quan hệ giữa di chuyển và phòng dịch, và có thể hướng dẫn người mới cách kiểm tra lối đi và độ sạch."],"name_id":"Memeriksa jalur dan kebersihan tempat tujuan","kanten_id":"Apakah dapat memeriksa lebih dulu jalur dari tangga, licin, dan penghalang, serta memastikan tempat tujuan sudah selesai dibersihkan dan didisinfeksi agar tidak membawa masuk pencemaran?","levels_id":["Tidak memeriksa jalur, dan memasukkan babi ke kandang kotor yang belum selesai dibersihkan dan didisinfeksi.","Melihat jalur jika diperintah, tetapi sering lalai memastikan kebersihan tempat tujuan.","Jika diperintah, dapat memeriksa bahaya di jalur secara lengkap.","Tanpa diperintah pun, memeriksa jalur lebih dulu, dan memastikan tempat tujuan selesai dibersihkan dan didisinfeksi sebelum memindahkan.","Memahami hubungan pemindahan dengan biosekuriti, dan dapat mengajarkan pemeriksaan jalur dan kebersihan tujuan kepada karyawan baru."]}],"gyomu":"10","name_en":"Movement Orders","purposeShort_en":"Keep the pig flow moving and move pigs safely without stress","name_vi":"Chỉ thị di chuyển","purposeShort_vi":"Không làm tắc luồng luân chuyển lợn (pig flow), di chuyển an toàn không gây stress cho lợn","name_id":"Instruksi pemindahan (memindahkan babi)","purposeShort_id":"Menjaga alur pemindahan babi (pig flow) tetap lancar, dan memindahkan babi dengan aman tanpa membuat stres"},{"id":"move-preg","category":"facility","no":"No.25","name":"妊娠舎→交配舎・育成舎 移動","purposeShort":"ピッグフローを守って次の舎へつなぐ","aspects":[{"id":"quiet-move","name":"静かな追い方と適期移動","kanten":"静かに追い無理に走らせず、分娩予定を踏まえた適期に移動できるか。","levels":["分娩予定より早く移動させ、妊娠後期の母豚を急かしてストレス・分娩事故を招く。","指示があれば移動させるが、追い方や時期の見極めに漏れがある。","指示があれば静かにひと通り移動できる。","指示がなくても静かに追い、分娩予定を踏まえた適期に無理なく移動する。","移動時期とストレスの関係を理解し、静かな移動と適期の判断を新人に指導できる。"],"name_en":"Quiet Driving and Timely Movement","kanten_en":"Can they drive sows quietly without forcing them to run, and move them at the right time based on the farrowing schedule?","levels_en":["Moves sows earlier than the farrowing schedule and rushes late-gestation sows, causing stress and farrowing accidents.","With guidance can move sows, but misses driving technique or timing judgment.","With guidance can complete a basic quiet move.","Independently drives sows quietly and moves them without strain at the right time based on the farrowing schedule.","Understands the relationship between movement timing and stress, and can teach new staff quiet movement and timing judgment."],"name_vi":"Lùa nhẹ nhàng và di chuyển đúng thời điểm","kanten_vi":"Có lùa nhẹ nhàng, không bắt lợn chạy, di chuyển đúng thời điểm dựa trên ngày dự sinh không.","levels_vi":["Di chuyển sớm hơn ngày dự sinh, hối thúc lợn nái cuối thai kỳ gây stress, tai nạn khi đẻ.","Nếu được chỉ thị thì di chuyển, nhưng còn thiếu sót về cách lùa và phán đoán thời điểm.","Nếu được chỉ thị thì di chuyển nhẹ nhàng được cơ bản.","Dù không có chỉ thị vẫn lùa nhẹ nhàng, di chuyển đúng thời điểm dựa trên ngày dự sinh, không ép lợn.","Hiểu quan hệ giữa thời điểm di chuyển và stress, và có thể hướng dẫn người mới cách di chuyển nhẹ nhàng và phán đoán thời điểm."],"name_id":"Menggiring dengan tenang dan memindah pada waktu yang tepat","kanten_id":"Apakah dapat menggiring dengan tenang tanpa memaksa babi berlari, dan memindah pada waktu yang tepat dengan mempertimbangkan perkiraan melahirkan?","levels_id":["Memindah lebih awal dari perkiraan melahirkan, memburu-buru induk babi bunting tua, sehingga menyebabkan stres dan kecelakaan melahirkan.","Memindah jika diperintah, tetapi sering lalai soal cara menggiring dan penilaian waktu.","Jika diperintah, dapat memindah dengan tenang secara lengkap.","Tanpa diperintah pun, menggiring dengan tenang dan memindah tanpa paksaan pada waktu yang tepat sesuai perkiraan melahirkan.","Memahami hubungan waktu pemindahan dengan stres, dan dapat mengajarkan cara memindah yang tenang dan penilaian waktu yang tepat kepada karyawan baru."]},{"id":"dest-check","name":"移動先の水・エサ・収容確認","kanten":"移動先の水・エサと収容スペースを事前に確認し、過密搬入を防げるか。","levels":["移動先の水・エサや収容スペースを確認せず、過密に搬入する。","指示があれば確認するが、収容スペースの確認に漏れがある。","指示があれば移動先の水・エサをひと通り確認できる。","指示がなくても移動先の水・エサと収容スペースを確かめ、過密を避ける。","過密搬入のリスクを理解し、移動先確認の要点を新人に指導できる。"],"name_en":"Checking Water, Feed, and Capacity at the Destination","kanten_en":"Can they check water, feed, and housing capacity at the destination in advance and prevent overcrowded moves?","levels_en":["Moves pigs in overcrowded without checking water, feed, or housing capacity at the destination.","With guidance can check, but misses the housing-capacity check.","With guidance can check water and feed at the destination through the basic procedure.","Independently checks water, feed, and housing capacity at the destination and avoids overcrowding.","Understands the risks of overcrowded moves, and can teach new staff the key points of destination checks."],"name_vi":"Kiểm tra nước, thức ăn, sức chứa của nơi chuyển đến","kanten_vi":"Có kiểm tra trước nước, thức ăn và diện tích chứa của nơi chuyển đến, tránh nhập lợn quá đông không.","levels_vi":["Không kiểm tra nước, thức ăn, diện tích chứa của nơi chuyển đến, nhập lợn quá đông.","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót trong kiểm tra diện tích chứa.","Nếu được chỉ thị thì kiểm tra nước, thức ăn của nơi chuyển đến được cơ bản.","Dù không có chỉ thị vẫn kiểm tra nước, thức ăn, diện tích chứa của nơi chuyển đến, tránh quá đông.","Hiểu rủi ro nhập lợn quá đông, và có thể hướng dẫn người mới các điểm chính khi kiểm tra nơi chuyển đến."],"name_id":"Memeriksa air, pakan, dan daya tampung tempat tujuan","kanten_id":"Apakah dapat memeriksa lebih dulu air, pakan, dan ruang tampung di tempat tujuan, sehingga mencegah pemasukan yang terlalu padat?","levels_id":["Tidak memeriksa air, pakan, dan ruang tampung di tempat tujuan, dan memasukkan babi terlalu padat.","Memeriksa jika diperintah, tetapi sering lalai memeriksa ruang tampung.","Jika diperintah, dapat memeriksa air dan pakan di tempat tujuan secara lengkap.","Tanpa diperintah pun, memastikan air, pakan, dan ruang tampung tempat tujuan, dan menghindari kepadatan berlebih.","Memahami risiko pemasukan terlalu padat, dan dapat mengajarkan pokok pemeriksaan tempat tujuan kepada karyawan baru."]}],"gyomu":"25","name_en":"Gestation House to Breeding/Grower House Movement","purposeShort_en":"Keep the pig flow and connect sows to the next house","name_vi":"Di chuyển từ chuồng lợn nái mang thai → chuồng phối giống / chuồng hậu bị","purposeShort_vi":"Giữ đúng luồng luân chuyển lợn (pig flow), nối tiếp sang chuồng kế","name_id":"Pemindahan dari kandang bunting → kandang kawin / kandang babi pengganti","purposeShort_id":"Menyambungkan ke kandang berikutnya dengan menjaga alur pemindahan babi (pig flow)"},{"id":"scraper","category":"facility","no":"No.19","name":"スクレーパー動作確認","purposeShort":"除糞機能を正常に保ち、機械トラブルを早期発見して大故障を防ぐ","aspects":[{"id":"safety-power","name":"電源遮断など安全手順","kanten":"確認・清掃の前に必ず電源を切り、回転部・可動部に安全に触れられるか。","levels":["電源を切らずに点検・清掃し、回転部に触れて事故の危険を招く。","指示があれば電源を切るが、徹底が甘く危険な操作が残る。","指示があれば確認・清掃前に電源をひと通り切れる。","指示がなくても必ず電源を切ってから安全に点検・清掃する。","回転部の危険を理解し、電源遮断など安全手順を新人に指導できる。"],"name_en":"Safety Procedures Including Power Shutoff","kanten_en":"Can they always cut the power before inspection and cleaning and touch rotating and moving parts safely?","levels_en":["Inspects and cleans without cutting the power, touching rotating parts and risking accidents.","With guidance cuts the power, but the habit is weak and unsafe actions remain.","With guidance can cut the power before inspection and cleaning as a basic routine.","Independently always cuts the power before inspecting and cleaning safely.","Understands the dangers of rotating parts, and can teach new staff safety procedures including power shutoff."],"name_vi":"Quy trình an toàn như ngắt điện","kanten_vi":"Trước khi kiểm tra, vệ sinh có luôn ngắt điện, chạm vào bộ phận quay, bộ phận chuyển động một cách an toàn không.","levels_vi":["Không ngắt điện mà kiểm tra, vệ sinh, chạm vào bộ phận quay gây nguy cơ tai nạn.","Nếu được chỉ thị thì ngắt điện, nhưng chưa triệt để, vẫn còn thao tác nguy hiểm.","Nếu được chỉ thị thì ngắt điện trước khi kiểm tra, vệ sinh được cơ bản.","Dù không có chỉ thị vẫn luôn ngắt điện rồi mới kiểm tra, vệ sinh an toàn.","Hiểu nguy hiểm của bộ phận quay, và có thể hướng dẫn người mới quy trình an toàn như ngắt điện."],"name_id":"Prosedur keselamatan seperti mematikan listrik","kanten_id":"Apakah selalu mematikan listrik sebelum pemeriksaan dan pembersihan, sehingga aman saat menyentuh bagian yang berputar atau bergerak?","levels_id":["Memeriksa dan membersihkan tanpa mematikan listrik, menyentuh bagian berputar, dan menimbulkan bahaya kecelakaan.","Mematikan listrik jika diperintah, tetapi tidak konsisten sehingga masih ada tindakan berbahaya.","Jika diperintah, dapat mematikan listrik sebelum pemeriksaan dan pembersihan secara lengkap.","Tanpa diperintah pun, selalu mematikan listrik lebih dulu, lalu memeriksa dan membersihkan dengan aman.","Memahami bahaya bagian yang berputar, dan dapat mengajarkan prosedur keselamatan seperti mematikan listrik kepada karyawan baru."]},{"id":"wear-report","name":"異音・摩耗の点検と異常時の停止・報告","kanten":"異音・振動・チェーンやワイヤの摩耗を点検し、異常があれば無理に動かさず報告できるか。","levels":["定期確認をせず異音・動作不良や摩耗を見落とし、汚液滞留・断線を招く。","指示があれば点検するが、摩耗の見極めや異常時の対応に漏れがある。","指示があれば異音・振動やチェーンの摩耗をひと通り点検できる。","指示がなくても定期点検し、異常があれば無理に動かさず停止して報告する。","摩耗・断線のリスクを理解し、点検の着眼点と異常時対応を新人に指導できる。"],"name_en":"Inspecting for Noise and Wear, and Stopping and Reporting on Abnormality","kanten_en":"Can they inspect for abnormal noise, vibration, and wear of chains and wires, and stop and report instead of forcing operation when something is wrong?","levels_en":["Skips regular inspection, missing abnormal noise, malfunction, and wear, leading to slurry buildup and cable breaks.","With guidance can inspect, but misses judging wear or responding to abnormalities.","With guidance can inspect for abnormal noise, vibration, and chain wear through the basic routine.","Independently inspects regularly and, on any abnormality, stops the machine and reports instead of forcing it.","Understands the risks of wear and cable breaks, and can teach new staff inspection points and abnormality response."],"name_vi":"Kiểm tra tiếng lạ, mài mòn; dừng và báo cáo khi bất thường","kanten_vi":"Có kiểm tra tiếng lạ, rung, độ mài mòn của xích, dây cáp, khi có bất thường thì không cố chạy mà báo cáo không.","levels_vi":["Không kiểm tra định kỳ, bỏ sót tiếng lạ, hoạt động kém, mài mòn, gây ứ đọng nước bẩn, đứt dây.","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót trong nhận biết mài mòn và xử lý khi bất thường.","Nếu được chỉ thị thì kiểm tra tiếng lạ, rung và độ mài mòn của xích được cơ bản.","Dù không có chỉ thị vẫn kiểm tra định kỳ, khi có bất thường thì không cố chạy mà dừng lại và báo cáo.","Hiểu rủi ro mài mòn, đứt dây, và có thể hướng dẫn người mới các điểm cần xem khi kiểm tra và cách xử lý bất thường."],"name_id":"Memeriksa bunyi aneh dan keausan, berhenti dan melapor saat tidak normal","kanten_id":"Apakah dapat memeriksa bunyi aneh, getaran, dan keausan rantai atau kawat, dan jika ada yang tidak normal tidak memaksakan jalan melainkan melapor?","levels_id":["Tidak memeriksa secara berkala, melewatkan bunyi aneh, gangguan kerja, dan keausan, sehingga cairan kotor menumpuk dan kawat putus.","Memeriksa jika diperintah, tetapi sering lalai menilai keausan dan menangani saat tidak normal.","Jika diperintah, dapat memeriksa bunyi aneh, getaran, dan keausan rantai secara lengkap.","Tanpa diperintah pun, memeriksa berkala, dan jika ada yang tidak normal menghentikan mesin tanpa memaksakan lalu melapor.","Memahami risiko keausan dan kawat putus, dan dapat mengajarkan titik pemeriksaan dan penanganan saat tidak normal kepada karyawan baru."]}],"gyomu":"19","name_en":"Manure Scraper Operation Check","purposeShort_en":"Keep manure removal working, detect mechanical trouble early, and prevent major breakdowns","name_vi":"Kiểm tra hoạt động máy cào phân","purposeShort_vi":"Giữ chức năng dọn phân hoạt động bình thường, phát hiện sớm trục trặc máy để tránh hỏng lớn","name_id":"Pemeriksaan kerja alat pengeruk kotoran","purposeShort_id":"Menjaga fungsi pembersihan kotoran tetap normal, menemukan gangguan mesin sejak dini, dan mencegah kerusakan besar"},{"id":"fan-clean","category":"facility","no":"No.29","name":"ファン清掃","purposeShort":"換気能力を保ち、呼吸器トラブル・暑熱ストレスを防ぎ設備を長持ちさせる","aspects":[{"id":"power-off","name":"電源遮断と安全な清掃","kanten":"作業前に必ず電源を切り、モーター・配線に水をかけずに清掃できるか。","levels":["電源を切らずに清掃して回転部に接触し、モーターや配線に水をかける危険な作業をする。","指示があれば電源を切るが、水かけ回避などの徹底が甘い。","指示があれば電源を切り、羽根・シャッター・ネットの汚れをひと通り落とせる。","指示がなくても電源を切り、モーターや配線を避けて安全に清掃する。","感電・巻き込みの危険を理解し、安全な清掃手順を新人に指導できる。"],"name_en":"Power Shutoff and Safe Cleaning","kanten_en":"Can they always cut the power before work and clean without splashing water on motors and wiring?","levels_en":["Cleans without cutting the power, contacting rotating parts, and works dangerously by splashing water on motors and wiring.","With guidance cuts the power, but is lax about avoiding water splashes and the like.","With guidance can cut the power and remove the dirt from blades, shutters, and nets through the basic routine.","Independently cuts the power and cleans safely while avoiding motors and wiring.","Understands the dangers of electric shock and entanglement, and can teach new staff safe cleaning procedures."],"name_vi":"Ngắt điện và vệ sinh an toàn","kanten_vi":"Trước khi làm có luôn ngắt điện, vệ sinh mà không xịt nước vào mô-tơ, dây điện không.","levels_vi":["Không ngắt điện mà vệ sinh, chạm vào bộ phận quay, làm việc nguy hiểm như xịt nước vào mô-tơ, dây điện.","Nếu được chỉ thị thì ngắt điện, nhưng chưa triệt để trong việc tránh xịt nước v.v.","Nếu được chỉ thị thì ngắt điện, làm sạch cánh quạt, cửa chớp, lưới được cơ bản.","Dù không có chỉ thị vẫn ngắt điện, tránh mô-tơ và dây điện, vệ sinh an toàn.","Hiểu nguy hiểm điện giật, bị cuốn kẹt, và có thể hướng dẫn người mới quy trình vệ sinh an toàn."],"name_id":"Mematikan listrik dan membersihkan dengan aman","kanten_id":"Apakah selalu mematikan listrik sebelum bekerja, dan membersihkan tanpa menyiram air ke motor dan kabel?","levels_id":["Membersihkan tanpa mematikan listrik hingga menyentuh bagian berputar, dan bekerja berbahaya dengan menyiram air ke motor dan kabel.","Mematikan listrik jika diperintah, tetapi tidak konsisten menghindari siraman air.","Jika diperintah, dapat mematikan listrik dan membersihkan kotoran pada baling-baling, penutup (shutter), dan jaring secara lengkap.","Tanpa diperintah pun, mematikan listrik dan membersihkan dengan aman sambil menghindari motor dan kabel.","Memahami bahaya tersengat listrik dan terlilit, dan dapat mengajarkan urutan pembersihan yang aman kepada karyawan baru."]},{"id":"belt-check","name":"ファンベルト・効率の点検","kanten":"埃の堆積やベルトの劣化を点検し、換気効率の低下や突然停止を防げるか。","levels":["埃の堆積やベルト劣化を確認せず、換気効率低下や突然停止を招く。","指示があれば清掃するが、ベルト劣化や効率低下の点検に漏れがある。","指示があれば埃を落とし、目に見える不具合をひと通り確認できる。","指示がなくてもベルトの劣化を点検し、換気効率の低下に早く気づく。","換気効率と暑熱死のリスクを理解し、ベルト・効率の点検を新人に指導できる。"],"name_en":"Inspecting Fan Belts and Efficiency","kanten_en":"Can they inspect for dust buildup and belt deterioration and prevent reduced ventilation efficiency and sudden stoppage?","levels_en":["Does not check dust buildup or belt deterioration, causing reduced ventilation efficiency and sudden stoppage.","With guidance can clean, but misses inspecting belt deterioration or efficiency loss.","With guidance can remove dust and check visible defects through the basic routine.","Independently inspects belt deterioration and notices reduced ventilation efficiency early.","Understands the risks of ventilation loss and heat-related deaths, and can teach new staff belt and efficiency inspection."],"name_vi":"Kiểm tra dây curoa quạt và hiệu suất","kanten_vi":"Có kiểm tra bụi bám và dây curoa xuống cấp, phòng giảm hiệu suất thông gió và dừng đột ngột không.","levels_vi":["Không kiểm tra bụi bám, dây curoa xuống cấp, gây giảm hiệu suất thông gió, dừng đột ngột.","Nếu được chỉ thị thì vệ sinh, nhưng còn thiếu sót trong kiểm tra dây curoa xuống cấp và hiệu suất giảm.","Nếu được chỉ thị thì làm sạch bụi và kiểm tra các hỏng hóc nhìn thấy được một cách cơ bản.","Dù không có chỉ thị vẫn kiểm tra dây curoa xuống cấp, sớm nhận ra hiệu suất thông gió giảm.","Hiểu rủi ro giữa hiệu suất thông gió và chết do nóng, và có thể hướng dẫn người mới cách kiểm tra dây curoa, hiệu suất."],"name_id":"Memeriksa sabuk (belt) kipas dan efisiensi","kanten_id":"Apakah dapat memeriksa tumpukan debu dan kerusakan sabuk (belt), sehingga mencegah turunnya efisiensi ventilasi dan berhenti mendadak?","levels_id":["Tidak memeriksa tumpukan debu dan kerusakan sabuk, sehingga efisiensi ventilasi turun dan kipas berhenti mendadak.","Membersihkan jika diperintah, tetapi sering lalai memeriksa kerusakan sabuk dan penurunan efisiensi.","Jika diperintah, dapat membersihkan debu dan memeriksa kerusakan yang terlihat secara lengkap.","Tanpa diperintah pun, memeriksa kerusakan sabuk dan cepat menyadari turunnya efisiensi ventilasi.","Memahami risiko efisiensi ventilasi terhadap kematian karena panas, dan dapat mengajarkan pemeriksaan sabuk dan efisiensi kepada karyawan baru."]}],"gyomu":"29","name_en":"Fan Cleaning","purposeShort_en":"Maintain ventilation capacity, prevent respiratory trouble and heat stress, and extend equipment life","name_vi":"Vệ sinh quạt","purposeShort_vi":"Duy trì năng lực thông gió, phòng bệnh hô hấp, stress do nóng và giúp thiết bị bền lâu","name_id":"Membersihkan kipas","purposeShort_id":"Menjaga kemampuan ventilasi, mencegah gangguan pernapasan dan stres panas, serta membuat peralatan awet"},{"id":"pad-tank","category":"facility","no":"No.30","name":"パドタンク清掃（夏季）","purposeShort":"クーリング性能を保ち、藻・細菌・悪臭を防ぎ設備を長持ちさせる","aspects":[{"id":"regular-clean","name":"定期清掃と藻・バイオフィルム防止","kanten":"月1回以上の清掃を守り、藻・バイオフィルムの発生を防げるか。作業前に電源を切り水を抜けるか。","levels":["清掃を怠って藻・バイオフィルムを発生させ、電源も切らずに作業する。","指示があれば清掃するが、頻度や電源遮断・排水の手順に漏れがある。","指示があれば電源を切り水を抜いて、やさしくひと通り清掃できる。","指示がなくても月1回以上清掃し、フィルターやポンプも一緒に確認する。","クーリング性能と衛生の関係を理解し、定期清掃の手順を新人に指導できる。"],"name_en":"Regular Cleaning and Preventing Algae and Biofilm","kanten_en":"Can they clean at least once a month to prevent algae and biofilm, and cut the power and drain the water before work?","levels_en":["Neglects cleaning, letting algae and biofilm develop, and works without cutting the power.","With guidance can clean, but misses the frequency or the power-shutoff and draining steps.","With guidance can cut the power, drain the water, and clean gently through the basic routine.","Independently cleans at least once a month and checks the filters and pump at the same time.","Understands the link between cooling performance and hygiene, and can teach new staff the regular cleaning procedure."],"name_vi":"Vệ sinh định kỳ và phòng rêu tảo, màng sinh học","kanten_vi":"Có giữ vệ sinh ít nhất 1 lần/tháng, phòng rêu tảo, màng sinh học (biofilm) phát sinh không. Trước khi làm có ngắt điện, xả nước không.","levels_vi":["Lười vệ sinh làm phát sinh rêu tảo, màng sinh học, làm việc mà không ngắt điện.","Nếu được chỉ thị thì vệ sinh, nhưng còn thiếu sót về tần suất và quy trình ngắt điện, xả nước.","Nếu được chỉ thị thì ngắt điện, xả nước và vệ sinh nhẹ nhàng được cơ bản.","Dù không có chỉ thị vẫn vệ sinh ít nhất 1 lần/tháng, kiểm tra luôn cả bộ lọc và máy bơm.","Hiểu quan hệ giữa hiệu quả làm mát và vệ sinh, và có thể hướng dẫn người mới quy trình vệ sinh định kỳ."],"name_id":"Pembersihan berkala dan pencegahan lumut serta biofilm","kanten_id":"Apakah menepati pembersihan minimal sebulan sekali sehingga mencegah lumut dan biofilm (lapisan lendir kuman)? Apakah sebelum bekerja mematikan listrik dan membuang airnya?","levels_id":["Lalai membersihkan sehingga lumut dan biofilm tumbuh, dan bekerja tanpa mematikan listrik.","Membersihkan jika diperintah, tetapi sering lalai soal frekuensi serta urutan mematikan listrik dan membuang air.","Jika diperintah, dapat mematikan listrik, membuang air, dan membersihkan dengan lembut secara lengkap.","Tanpa diperintah pun, membersihkan minimal sebulan sekali, dan memeriksa filter serta pompa sekaligus.","Memahami hubungan kemampuan pendinginan dengan kebersihan, dan dapat mengajarkan urutan pembersihan berkala kepada karyawan baru."]},{"id":"chlorine-temp","name":"残留塩素・水温・濃度の管理","kanten":"残留塩素・水温を確認して細菌増殖を防ぎ、塩素系消毒剤を高濃度にせず飲水量低下を招かないか。","levels":["残留塩素・水温を確認せず補充のみで細菌を増やし、消毒剤を高濃度にして飲水量を落とす。","指示があれば確認するが、濃度や水温の管理に漏れがある。","指示があれば残留塩素・水温をひと通り確認できる。","指示がなくても残留塩素・水温を確認し、消毒剤の濃度を適正に保つ。","細菌増殖と飲水量の関係を理解し、塩素・水温・濃度の管理を新人に指導できる。"],"name_en":"Managing Residual Chlorine, Water Temperature, and Concentration","kanten_en":"Can they check residual chlorine and water temperature to prevent bacterial growth, and avoid over-concentrating chlorine disinfectant so water intake does not drop?","levels_en":["Only refills without checking residual chlorine or water temperature, letting bacteria grow, and over-concentrates disinfectant, reducing water intake.","With guidance can check, but misses concentration or water-temperature management.","With guidance can check residual chlorine and water temperature through the basic routine.","Independently checks residual chlorine and water temperature and keeps disinfectant concentration appropriate.","Understands the relationship between bacterial growth and water intake, and can teach new staff chlorine, temperature, and concentration management."],"name_vi":"Quản lý clo dư, nhiệt độ nước và nồng độ","kanten_vi":"Có kiểm tra clo dư, nhiệt độ nước để phòng vi khuẩn sinh sôi, không pha thuốc khử trùng gốc clo quá đậm gây giảm lượng nước uống không.","levels_vi":["Không kiểm tra clo dư, nhiệt độ nước, chỉ châm thêm nước làm vi khuẩn sinh sôi, pha thuốc khử trùng quá đậm làm giảm lượng nước uống.","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót trong quản lý nồng độ và nhiệt độ nước.","Nếu được chỉ thị thì kiểm tra clo dư, nhiệt độ nước được cơ bản.","Dù không có chỉ thị vẫn kiểm tra clo dư, nhiệt độ nước, giữ nồng độ thuốc khử trùng phù hợp.","Hiểu quan hệ giữa vi khuẩn sinh sôi và lượng nước uống, và có thể hướng dẫn người mới cách quản lý clo, nhiệt độ nước, nồng độ."],"name_id":"Mengelola sisa klorin, suhu air, dan kepekatan","kanten_id":"Apakah memeriksa sisa klorin dan suhu air untuk mencegah bakteri berkembang, dan tidak membuat disinfektan klorin terlalu pekat sehingga babi jadi kurang minum?","levels_id":["Hanya menambah air tanpa memeriksa sisa klorin dan suhu air sehingga bakteri berkembang, dan membuat disinfektan terlalu pekat sehingga babi kurang minum.","Memeriksa jika diperintah, tetapi sering lalai mengelola kepekatan dan suhu air.","Jika diperintah, dapat memeriksa sisa klorin dan suhu air secara lengkap.","Tanpa diperintah pun, memeriksa sisa klorin dan suhu air, dan menjaga kepekatan disinfektan tetap tepat.","Memahami hubungan perkembangan bakteri dengan jumlah air minum, dan dapat mengajarkan pengelolaan klorin, suhu air, dan kepekatan kepada karyawan baru."]}],"gyomu":"30","name_en":"Pad Tank Cleaning (Summer)","purposeShort_en":"Maintain cooling performance, prevent algae, bacteria, and odor, and extend equipment life","name_vi":"Vệ sinh bể nước của tấm làm mát (pad tank) — mùa hè","purposeShort_vi":"Duy trì hiệu quả làm mát, phòng rêu tảo, vi khuẩn, mùi hôi và giúp thiết bị bền lâu","name_id":"Membersihkan tangki air panel pendingin (pad tank) — musim panas","purposeShort_id":"Menjaga kemampuan pendinginan, mencegah lumut, bakteri, dan bau busuk, serta membuat peralatan awet"},{"id":"feed-switch","category":"facility","no":"No.20","name":"エサスイッチ","purposeShort":"給餌を安定させ、ムダな飼料を減らし機械トラブルを防ぐ","aspects":[{"id":"switch-position","name":"スイッチ位置と異常時の停止","kanten":"自動・手動・切の位置を確認し、ホッパー空・詰まり・異音時はすぐオフにできるか。","levels":["スイッチ位置を確認せず、ホッパー空や詰まり・異音があってもオフにしない。","指示があれば位置を確認するが、異常時の停止対応に漏れがある。","指示があれば自動・手動・切の位置をひと通り確認できる。","指示がなくても位置を確認し、ホッパー空・詰まり・異音時はすぐオフにする。","給餌設備のトラブルを理解し、スイッチ操作と異常時対応を新人に指導できる。"],"name_en":"Switch Position and Stopping on Abnormality","kanten_en":"Can they confirm the auto/manual/off position and switch off immediately when the hopper is empty, clogged, or making abnormal noise?","levels_en":["Does not confirm the switch position and does not switch off even when the hopper is empty, clogged, or making abnormal noise.","With guidance can confirm the position, but misses stopping the machine on abnormality.","With guidance can confirm the auto/manual/off position through the basic routine.","Independently confirms the position and switches off immediately on an empty hopper, clogging, or abnormal noise.","Understands feeding-equipment troubles, and can teach new staff switch operation and abnormality response."],"name_vi":"Vị trí công tắc và dừng khi bất thường","kanten_vi":"Có kiểm tra vị trí tự động / bằng tay / tắt, khi phễu chứa cám rỗng, bị tắc hoặc có tiếng lạ thì tắt ngay không.","levels_vi":["Không kiểm tra vị trí công tắc, phễu rỗng, bị tắc hay có tiếng lạ cũng không tắt.","Nếu được chỉ thị thì kiểm tra vị trí, nhưng còn thiếu sót trong xử lý dừng khi bất thường.","Nếu được chỉ thị thì kiểm tra vị trí tự động / bằng tay / tắt được cơ bản.","Dù không có chỉ thị vẫn kiểm tra vị trí, khi phễu rỗng, bị tắc, có tiếng lạ thì tắt ngay.","Hiểu các trục trặc của thiết bị cho ăn, và có thể hướng dẫn người mới cách thao tác công tắc và xử lý khi bất thường."],"name_id":"Posisi sakelar dan mematikan saat tidak normal","kanten_id":"Apakah memeriksa posisi otomatis / manual / mati, dan segera mematikan saat corong pakan (hopper) kosong, tersumbat, atau berbunyi aneh?","levels_id":["Tidak memeriksa posisi sakelar, dan tidak mematikan walaupun corong pakan kosong, tersumbat, atau berbunyi aneh.","Memeriksa posisi jika diperintah, tetapi sering lalai mematikan saat tidak normal.","Jika diperintah, dapat memeriksa posisi otomatis / manual / mati secara lengkap.","Tanpa diperintah pun, memeriksa posisi, dan segera mematikan saat corong pakan kosong, tersumbat, atau berbunyi aneh.","Memahami gangguan pada peralatan pemberian pakan, dan dapat mengajarkan pengoperasian sakelar dan penanganan saat tidak normal kepada karyawan baru."]},{"id":"timer-record","name":"タイマー変更後の動作確認と記録","kanten":"設定変更は決められた人が行い、タイマー変更後は動作確認し、切り替え日を記録できるか。","levels":["権限のない者が設定を変え、変更後の動作確認もせず切り替え日も記録しない。","指示があれば確認するが、動作確認や記録に漏れがある。","指示があればタイマー変更後の動作をひと通り確認できる。","指示がなくても変更後に動作を確認し、切り替え日を記録して二重切り替えを防ぐ。","設定変更と給餌事故の関係を理解し、動作確認と記録の徹底を新人に指導できる。"],"name_en":"Operation Check and Recording After Timer Changes","kanten_en":"Can they leave setting changes to designated staff, verify operation after timer changes, and record the changeover date?","levels_en":["Unauthorized staff change the settings, with no operation check afterward and no record of the changeover date.","With guidance can check, but misses the operation check or the record.","With guidance can verify operation after a timer change through the basic routine.","Independently verifies operation after changes and records the changeover date to prevent double changeovers.","Understands how setting changes relate to feeding accidents, and can teach new staff thorough operation checks and recording."],"name_vi":"Kiểm tra hoạt động sau khi đổi hẹn giờ và ghi chép","kanten_vi":"Việc đổi cài đặt có do người được quy định làm, sau khi đổi hẹn giờ có kiểm tra hoạt động và ghi lại ngày chuyển đổi không.","levels_vi":["Người không có quyền đổi cài đặt, sau khi đổi không kiểm tra hoạt động, cũng không ghi ngày chuyển đổi.","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót về kiểm tra hoạt động và ghi chép.","Nếu được chỉ thị thì kiểm tra hoạt động sau khi đổi hẹn giờ được cơ bản.","Dù không có chỉ thị vẫn kiểm tra hoạt động sau khi đổi, ghi ngày chuyển đổi để tránh chuyển đổi hai lần.","Hiểu quan hệ giữa đổi cài đặt và sự cố cho ăn, và có thể hướng dẫn người mới việc kiểm tra hoạt động và ghi chép triệt để."],"name_id":"Memeriksa kerja setelah mengubah timer dan mencatatnya","kanten_id":"Apakah perubahan pengaturan hanya dilakukan orang yang ditunjuk, kerja mesin diperiksa setelah timer diubah, dan tanggal penggantian dicatat?","levels_id":["Orang tanpa wewenang mengubah pengaturan, tidak memeriksa kerja mesin setelah diubah, dan tidak mencatat tanggal penggantian.","Memeriksa jika diperintah, tetapi sering lalai memeriksa kerja mesin dan mencatat.","Jika diperintah, dapat memeriksa kerja mesin setelah timer diubah secara lengkap.","Tanpa diperintah pun, memeriksa kerja mesin setelah perubahan, dan mencatat tanggal penggantian untuk mencegah penggantian ganda.","Memahami hubungan perubahan pengaturan dengan kecelakaan pemberian pakan, dan dapat mengajarkan pemeriksaan kerja mesin dan pencatatan kepada karyawan baru."]}],"gyomu":"20","name_en":"Feed Switch","purposeShort_en":"Keep feeding stable, reduce feed waste, and prevent mechanical trouble","name_vi":"Công tắc cấp cám","purposeShort_vi":"Giữ việc cho ăn ổn định, giảm lãng phí thức ăn và phòng trục trặc máy","name_id":"Sakelar pakan (pengoperasian pemberian pakan otomatis)","purposeShort_id":"Menstabilkan pemberian pakan, mengurangi pakan terbuang, dan mencegah gangguan mesin"},{"id":"daily-report","category":"record","no":"No.05","name":"日報記入","purposeShort":"豚の状態を記録して病気を早期発見し、成績を数字で残し改善に役立てる","aspects":[{"id":"accurate-timely","name":"その場での正確な記録","kanten":"記憶頼りのまとめ書きを避け、その場で事実と数字を正確に記録できるか。","levels":["記憶頼りで後からまとめ書きし、数値の単位ズレなど不正確な記録をする。","指示があれば記録するが、まとめ書きや単位ズレが多い。","指示があればその場で事実と数字をひと通り正確に記録できる。","指示がなくてもその場で正確に記録し、単位や数値を確かめる。","記録の正確さが早期発見・改善に不可欠と理解し、正確な記入を新人に指導できる。"],"name_en":"Accurate On-the-Spot Recording","kanten_en":"Can they avoid batch-writing from memory and record facts and figures accurately on the spot?","levels_en":["Batch-writes later from memory and makes inaccurate records such as unit mismatches in figures.","With guidance can record, but often batch-writes and mismatches units.","With guidance can record facts and figures accurately on the spot through the basic routine.","Independently records accurately on the spot and double-checks units and figures.","Understands that accurate records are essential to early detection and improvement, and can teach new staff accurate entry."],"name_vi":"Ghi chính xác ngay tại chỗ","kanten_vi":"Có tránh ghi gộp sau bằng trí nhớ, ghi sự việc và con số chính xác ngay tại chỗ không.","levels_vi":["Dựa vào trí nhớ, ghi gộp sau, ghi không chính xác như lệch đơn vị của số liệu.","Nếu được chỉ thị thì ghi, nhưng hay ghi gộp và lệch đơn vị.","Nếu được chỉ thị thì ghi sự việc, con số chính xác ngay tại chỗ được cơ bản.","Dù không có chỉ thị vẫn ghi chính xác ngay tại chỗ, kiểm tra lại đơn vị và con số.","Hiểu tính chính xác của ghi chép là không thể thiếu cho phát hiện sớm và cải thiện, và có thể hướng dẫn người mới cách ghi chính xác."],"name_id":"Mencatat dengan tepat di tempat","kanten_id":"Apakah menghindari menulis rangkuman dari ingatan, dan dapat mencatat fakta dan angka dengan tepat di tempat kerja?","levels_id":["Menulis rangkuman belakangan dari ingatan, dan membuat catatan tidak tepat seperti satuan angka yang keliru.","Mencatat jika diperintah, tetapi sering menulis rangkuman belakangan dan salah satuan.","Jika diperintah, dapat mencatat fakta dan angka dengan tepat di tempat secara lengkap.","Tanpa diperintah pun, mencatat dengan tepat di tempat, dan memastikan satuan dan angkanya.","Memahami bahwa ketepatan catatan penting untuk penemuan dini dan perbaikan, dan dapat mengajarkan pengisian yang tepat kepada karyawan baru."]},{"id":"shared-rule-use","name":"共通ルールでの記入と活用","kanten":"全員が同じルールで書き、書くだけで終わらせず見返して活用できるか。治療豚情報を漏らさないか。","levels":["自己流で書き、治療豚の薬剤名・投与量・開始日を記入せず休薬管理を抜けさせる。","指示があれば共通ルールで書くが、活用や治療豚情報の記入に漏れがある。","指示があれば共通ルールに沿ってひと通り記入できる。","指示がなくても共通ルールで書き、治療豚情報を漏らさず、記録を見返して活用する。","記録の共有と活用の意義を理解し、共通ルールと活用方法を新人に指導できる。"],"name_en":"Writing by Shared Rules and Putting Records to Use","kanten_en":"Can everyone write by the same rules, review and use the records rather than just writing them, and never omit treated-pig information?","levels_en":["Writes in a personal style and omits drug names, doses, and start dates for treated pigs, breaking withdrawal management.","With guidance writes by shared rules, but misses using the records or entering treated-pig information.","With guidance can complete entries following the shared rules.","Independently writes by shared rules, never omits treated-pig information, and reviews and uses the records.","Understands the value of sharing and using records, and can teach new staff the shared rules and how to use records."],"name_vi":"Ghi theo quy tắc chung và sử dụng ghi chép","kanten_vi":"Mọi người có ghi theo cùng một quy tắc, không chỉ ghi mà còn xem lại để sử dụng không. Có bỏ sót thông tin lợn đang điều trị không.","levels_vi":["Ghi theo kiểu riêng, không ghi tên thuốc, liều lượng, ngày bắt đầu của lợn điều trị, làm hổng quản lý thời gian ngừng thuốc.","Nếu được chỉ thị thì ghi theo quy tắc chung, nhưng còn thiếu sót về sử dụng và ghi thông tin lợn điều trị.","Nếu được chỉ thị thì ghi theo quy tắc chung được cơ bản.","Dù không có chỉ thị vẫn ghi theo quy tắc chung, không bỏ sót thông tin lợn điều trị, xem lại và sử dụng ghi chép.","Hiểu ý nghĩa của việc chia sẻ và sử dụng ghi chép, và có thể hướng dẫn người mới quy tắc chung và cách sử dụng."],"name_id":"Mengisi dengan aturan bersama dan memanfaatkannya","kanten_id":"Apakah semua orang menulis dengan aturan yang sama, tidak berhenti pada sekadar menulis tetapi membacanya kembali dan memanfaatkannya? Apakah data babi yang diobati tidak terlewat?","levels_id":["Menulis dengan gaya sendiri, tidak mengisi nama obat, dosis, dan tanggal mulai untuk babi yang diobati, sehingga pengelolaan masa henti obat bolong.","Menulis dengan aturan bersama jika diperintah, tetapi sering lalai memanfaatkan dan mengisi data babi yang diobati.","Jika diperintah, dapat mengisi sesuai aturan bersama secara lengkap.","Tanpa diperintah pun, menulis dengan aturan bersama, tidak melewatkan data babi yang diobati, dan membaca kembali catatan untuk dimanfaatkan.","Memahami arti berbagi dan memanfaatkan catatan, dan dapat mengajarkan aturan bersama dan cara memanfaatkannya kepada karyawan baru."]}],"gyomu":"05","name_en":"Daily Report Entry","purposeShort_en":"Record pig conditions for early disease detection and keep performance in numbers for improvement","name_vi":"Ghi nhật ký công việc","purposeShort_vi":"Ghi lại tình trạng lợn để phát hiện bệnh sớm, lưu thành tích bằng con số để phục vụ cải thiện","name_id":"Mengisi laporan harian","purposeShort_id":"Mencatat keadaan babi untuk menemukan penyakit sejak dini, dan menyimpan hasil kerja dalam angka untuk perbaikan"},{"id":"plate","category":"record","no":"No.07","name":"プレート作成","purposeShort":"個体・群をすぐ見分けられるようにし、ワクチン・治療・休薬中を示す","aspects":[{"id":"update","name":"最新状態への更新と旧プレート処理","kanten":"情報を最新に保ち、分娩後の作成忘れや、差し替え時の古いプレートの残存を防げるか。","levels":["分娩後に作成し忘れ、差し替え時も古いプレートを廃棄せず誤情報を残す。","指示があれば更新するが、作成忘れや旧プレート処理に漏れがある。","指示があれば情報をひと通り最新に更新できる。","指示がなくても分娩後すぐ作成し、差し替え時は古いプレートを確実に廃棄する。","情報の鮮度が個体管理に直結すると理解し、更新と旧プレート処理を新人に指導できる。"],"name_en":"Keeping Plates Current and Disposing of Old Ones","kanten_en":"Can they keep information current, avoiding missed plate creation after farrowing and old plates left behind after replacement?","levels_en":["Forgets to create plates after farrowing and leaves old plates undiscarded at replacement, keeping wrong information posted.","With guidance can update, but misses plate creation or old-plate disposal.","With guidance can update information to the current state through the basic routine.","Independently creates plates right after farrowing and reliably discards old plates at replacement.","Understands that information freshness directly affects individual management, and can teach new staff updating and old-plate disposal."],"name_vi":"Cập nhật trạng thái mới nhất và xử lý thẻ cũ","kanten_vi":"Có giữ thông tin luôn mới nhất, tránh quên làm thẻ sau khi đẻ, tránh để sót thẻ cũ khi thay thẻ không.","levels_vi":["Quên làm thẻ sau khi đẻ, khi thay cũng không bỏ thẻ cũ, để lại thông tin sai.","Nếu được chỉ thị thì cập nhật, nhưng còn thiếu sót về quên làm thẻ và xử lý thẻ cũ.","Nếu được chỉ thị thì cập nhật thông tin lên mới nhất được cơ bản.","Dù không có chỉ thị vẫn làm thẻ ngay sau khi đẻ, khi thay thì bỏ chắc chắn thẻ cũ.","Hiểu độ mới của thông tin liên quan trực tiếp đến quản lý cá thể, và có thể hướng dẫn người mới việc cập nhật và xử lý thẻ cũ."],"name_id":"Memperbarui ke keadaan terkini dan membuang kartu lama","kanten_id":"Apakah dapat menjaga informasi tetap terkini, tidak lupa membuat kartu setelah melahirkan, dan tidak membiarkan kartu lama tertinggal saat penggantian?","levels_id":["Lupa membuat kartu setelah melahirkan, dan saat penggantian tidak membuang kartu lama sehingga informasi salah tertinggal.","Memperbarui jika diperintah, tetapi sering lupa membuat dan lalai menangani kartu lama.","Jika diperintah, dapat memperbarui informasi ke keadaan terkini secara lengkap.","Tanpa diperintah pun, segera membuat setelah melahirkan, dan saat penggantian pasti membuang kartu lama.","Memahami bahwa kesegaran informasi langsung memengaruhi pengelolaan individu, dan dapat mengajarkan pembaruan dan penanganan kartu lama kepada karyawan baru."]},{"id":"readable","name":"誰にでも分かる表記・帳票一致","kanten":"誰が見ても分かる表記・色分けにし、日報や帳票の内容と一致させられるか。","levels":["担当者ごとに書式が異なり、後任者が判読できず帳票とも食い違う。","指示があれば書くが、表記の統一や帳票一致に漏れがある。","指示があれば分かる表記・色分けでひと通り作成できる。","指示がなくても誰でも分かる統一表記にし、日報・帳票と一致させる。","表記統一の意義を理解し、分かりやすいプレート作成を新人に指導できる。"],"name_en":"Notation Anyone Can Read and Consistency with Records","kanten_en":"Can they use notation and color coding anyone can understand, kept consistent with daily reports and ledgers?","levels_en":["Uses formats that differ by person, so successors cannot read the plates and they contradict the ledgers.","With guidance can write plates, but misses unified notation or consistency with ledgers.","With guidance can create plates with understandable notation and color coding through the basic routine.","Independently uses unified notation anyone can read and keeps plates consistent with daily reports and ledgers.","Understands the value of unified notation, and can teach new staff how to make clear plates."],"name_vi":"Cách ghi ai cũng hiểu, khớp với sổ sách","kanten_vi":"Có ghi và phân màu sao cho ai nhìn cũng hiểu, khớp với nội dung nhật ký công việc và sổ sách không.","levels_vi":["Mỗi người ghi một kiểu, người kế nhiệm không đọc được, lệch cả với sổ sách.","Nếu được chỉ thị thì ghi, nhưng còn thiếu sót về thống nhất cách ghi và khớp sổ sách.","Nếu được chỉ thị thì làm thẻ với cách ghi, phân màu dễ hiểu được cơ bản.","Dù không có chỉ thị vẫn ghi thống nhất ai cũng hiểu, khớp với nhật ký công việc, sổ sách.","Hiểu ý nghĩa của việc thống nhất cách ghi, và có thể hướng dẫn người mới cách làm thẻ dễ hiểu."],"name_id":"Penulisan yang dimengerti siapa pun dan cocok dengan buku catatan","kanten_id":"Apakah dapat menulis dengan cara dan warna yang dimengerti siapa pun, dan mencocokkannya dengan isi laporan harian dan buku catatan?","levels_id":["Format tulisan berbeda tiap petugas, tidak terbaca oleh pengganti, dan tidak cocok dengan buku catatan.","Menulis jika diperintah, tetapi sering lalai menyeragamkan penulisan dan mencocokkan dengan buku catatan.","Jika diperintah, dapat membuat dengan penulisan dan pewarnaan yang dimengerti secara lengkap.","Tanpa diperintah pun, menulis dengan format seragam yang dimengerti siapa pun, dan mencocokkannya dengan laporan harian dan buku catatan.","Memahami arti keseragaman penulisan, dan dapat mengajarkan pembuatan kartu yang mudah dimengerti kepada karyawan baru."]}],"gyomu":"07","name_en":"Plate Preparation","purposeShort_en":"Make individuals and groups instantly identifiable and show vaccination, treatment, and withdrawal status","name_vi":"Làm thẻ thông tin (plate)","purposeShort_vi":"Giúp nhận biết ngay từng con, từng nhóm; hiển thị vắc-xin, điều trị, đang ngừng thuốc","name_id":"Membuat kartu data (plate)","purposeShort_id":"Membuat individu dan kelompok mudah dikenali dengan cepat, serta menandai babi yang divaksin, diobati, atau dalam masa henti obat"},{"id":"tagging","category":"record","no":"No.21","name":"タグ付け","purposeShort":"1頭ずつ確実に見分け、健康・繁殖・治療・出荷を一貫管理し追跡可能にする","aspects":[{"id":"position-asepsis","name":"正しい位置と装着前消毒","kanten":"決められた位置・向きに正しく付け、装着前に器具と耳を消毒できるか。","levels":["装着位置・向きが不統一で読み取りにくく、器具・耳の消毒もしない。","指示があれば付けるが、位置の統一や消毒に漏れがある。","指示があれば決められた位置に、消毒してひと通り装着できる。","指示がなくても位置・向きを統一し、装着前に器具と耳を消毒する。","読み取りやすさと感染防止を理解し、正しい装着と消毒を新人に指導できる。"],"name_en":"Correct Position and Pre-Attachment Disinfection","kanten_en":"Can they attach tags correctly in the designated position and orientation, and disinfect the applicator and the ear before attachment?","levels_en":["Attaches tags in inconsistent positions and orientations that are hard to read, and skips disinfecting the applicator and the ear.","With guidance can attach tags, but misses position consistency or disinfection.","With guidance can disinfect and attach tags in the designated position through the basic routine.","Independently keeps position and orientation consistent and disinfects the applicator and the ear before attachment.","Understands readability and infection prevention, and can teach new staff correct attachment and disinfection."],"name_vi":"Vị trí đúng và khử trùng trước khi gắn","kanten_vi":"Có gắn đúng vị trí, đúng chiều quy định, khử trùng dụng cụ và tai trước khi gắn không.","levels_vi":["Vị trí, chiều gắn không thống nhất, khó đọc, cũng không khử trùng dụng cụ và tai.","Nếu được chỉ thị thì gắn, nhưng còn thiếu sót về thống nhất vị trí và khử trùng.","Nếu được chỉ thị thì khử trùng và gắn vào đúng vị trí quy định được cơ bản.","Dù không có chỉ thị vẫn thống nhất vị trí, chiều gắn, khử trùng dụng cụ và tai trước khi gắn.","Hiểu tính dễ đọc và việc phòng nhiễm trùng, và có thể hướng dẫn người mới cách gắn đúng và khử trùng."],"name_id":"Posisi yang benar dan disinfeksi sebelum pemasangan","kanten_id":"Apakah dapat memasang dengan benar pada posisi dan arah yang ditentukan, serta mendisinfeksi alat dan telinga sebelum pemasangan?","levels_id":["Posisi dan arah pemasangan tidak seragam sehingga sulit dibaca, dan tidak mendisinfeksi alat dan telinga.","Memasang jika diperintah, tetapi sering lalai menyeragamkan posisi dan mendisinfeksi.","Jika diperintah, dapat memasang pada posisi yang ditentukan dengan disinfeksi secara lengkap.","Tanpa diperintah pun, menyeragamkan posisi dan arah, serta mendisinfeksi alat dan telinga sebelum pemasangan.","Memahami kemudahan pembacaan dan pencegahan infeksi, dan dapat mengajarkan pemasangan yang benar dan disinfeksi kepada karyawan baru."]},{"id":"reattach","name":"脱落・破損時の再装着","kanten":"脱落・破損を見つけ次第付け直し、個体不明のまま管理を続けないか。","levels":["タグ付け忘れや脱落後の再装着をせず、個体不明のまま出荷しトレーサビリティを断つ。","指示があれば付け直すが、脱落の発見や再装着に漏れがある。","指示があれば脱落・破損をひと通り付け直せる。","指示がなくても脱落・破損を見つけ次第付け直し、個体不明を作らない。","トレーサビリティの重要性を理解し、脱落時の再装着徹底を新人に指導できる。"],"name_en":"Reattachment After Loss or Damage","kanten_en":"Can they reattach tags as soon as loss or damage is found, and never continue managing unidentified pigs?","levels_en":["Skips tagging or reattachment after loss, ships unidentified pigs, and breaks traceability.","With guidance can reattach, but misses spotting losses or reattaching.","With guidance can reattach lost or damaged tags through the basic routine.","Independently reattaches tags as soon as loss or damage is found and never leaves pigs unidentified.","Understands the importance of traceability, and can teach new staff thorough reattachment after tag loss."],"name_vi":"Gắn lại khi thẻ rơi, hỏng","kanten_vi":"Phát hiện thẻ rơi, hỏng có gắn lại ngay, không tiếp tục quản lý khi không rõ cá thể không.","levels_vi":["Quên gắn thẻ, thẻ rơi cũng không gắn lại, xuất chuồng khi không rõ cá thể, làm đứt truy xuất nguồn gốc.","Nếu được chỉ thị thì gắn lại, nhưng còn thiếu sót trong phát hiện thẻ rơi và gắn lại.","Nếu được chỉ thị thì gắn lại thẻ rơi, hỏng được cơ bản.","Dù không có chỉ thị vẫn phát hiện thẻ rơi, hỏng là gắn lại ngay, không để xảy ra con không rõ cá thể.","Hiểu tầm quan trọng của truy xuất nguồn gốc, và có thể hướng dẫn người mới việc gắn lại triệt để khi thẻ rơi."],"name_id":"Memasang ulang saat lepas atau rusak","kanten_id":"Apakah memasang ulang begitu menemukan tanda telinga yang lepas atau rusak, dan tidak melanjutkan pengelolaan dengan individu yang tidak dikenal?","levels_id":["Lupa memasang tanda telinga dan tidak memasang ulang setelah lepas, mengirim babi tanpa identitas, sehingga memutus ketertelusuran (traceability).","Memasang ulang jika diperintah, tetapi sering lalai menemukan yang lepas dan memasang ulang.","Jika diperintah, dapat memasang ulang yang lepas atau rusak secara lengkap.","Tanpa diperintah pun, memasang ulang begitu menemukan yang lepas atau rusak, dan tidak membiarkan ada individu tanpa identitas.","Memahami pentingnya ketertelusuran (traceability), dan dapat mengajarkan kedisiplinan memasang ulang saat lepas kepada karyawan baru."]}],"gyomu":"21","name_en":"Tagging","purposeShort_en":"Identify each pig reliably for consistent health, breeding, treatment, and shipping management and traceability","name_vi":"Gắn thẻ tai","purposeShort_vi":"Nhận biết chắc chắn từng con, quản lý nhất quán sức khỏe, sinh sản, điều trị, xuất chuồng và truy xuất được nguồn gốc","name_id":"Pemasangan tanda telinga (tag nomor)","purposeShort_id":"Mengenali setiap ekor dengan pasti, mengelola kesehatan, reproduksi, pengobatan, dan pengiriman secara terpadu, serta membuatnya dapat ditelusuri"},{"id":"farrow-schedule","category":"record","no":"No.32","name":"分娩予定記入","purposeShort":"分娩時期を把握して舎・人手を計画的に準備し、不受胎を早期発見する","aspects":[{"id":"calc","name":"妊娠日齢の統一計算","kanten":"妊娠日齢の数え方を統一し、交配日から114〜115日後を正確に計算できるか。","levels":["交配日の記録が抜け、日齢の数え方も不統一で分娩予定を計算できない。","指示があれば計算するが、数え方の統一や幅の考慮に漏れがある。","指示があれば交配日から予定日をひと通り計算できる。","指示がなくても統一した数え方で114〜115日後を正確に計算する。","計算のズレが準備に与える影響を理解し、統一した数え方を新人に指導できる。"],"name_en":"Standardized Gestation-Day Calculation","kanten_en":"Can they use a standardized way of counting gestation days and accurately calculate 114-115 days from the mating date?","levels_en":["Mating dates go unrecorded and day counting is inconsistent, so due dates cannot be calculated.","With guidance can calculate, but misses the standardized counting or the allowance for the range.","With guidance can calculate the due date from the mating date through the basic procedure.","Independently calculates 114-115 days accurately using the standardized counting.","Understands how calculation errors affect preparation, and can teach new staff the standardized counting."],"name_vi":"Tính ngày tuổi thai theo cách thống nhất","kanten_vi":"Có thống nhất cách đếm ngày tuổi thai, tính đúng 114-115 ngày sau ngày giao phối không.","levels_vi":["Thiếu ghi chép ngày giao phối, cách đếm cũng không thống nhất nên không tính được ngày dự sinh.","Nếu được chỉ thị thì tính, nhưng còn thiếu sót về thống nhất cách đếm và xét khoảng dao động.","Nếu được chỉ thị thì tính được ngày dự sinh từ ngày giao phối một cách cơ bản.","Dù không có chỉ thị vẫn tính đúng 114-115 ngày sau bằng cách đếm thống nhất.","Hiểu ảnh hưởng của việc tính lệch đến khâu chuẩn bị, và có thể hướng dẫn người mới cách đếm thống nhất."],"name_id":"Menghitung umur kebuntingan dengan cara yang seragam","kanten_id":"Apakah cara menghitung umur kebuntingan diseragamkan, dan dapat menghitung dengan tepat 114-115 hari setelah tanggal kawin?","levels_id":["Catatan tanggal kawin bolong dan cara menghitung tidak seragam, sehingga perkiraan melahirkan tidak dapat dihitung.","Menghitung jika diperintah, tetapi sering lalai menyeragamkan cara hitung dan mempertimbangkan rentangnya.","Jika diperintah, dapat menghitung tanggal perkiraan dari tanggal kawin secara lengkap.","Tanpa diperintah pun, menghitung 114-115 hari setelah kawin dengan tepat memakai cara hitung yang seragam.","Memahami pengaruh selisih hitungan terhadap persiapan, dan dapat mengajarkan cara hitung yang seragam kepada karyawan baru."]},{"id":"rewrite","name":"再交配時の書き直しと母豚観察","kanten":"交配・再交配のたびに書き直し、予定日だけで判断せず母豚の様子も確認できるか。","levels":["再交配時に修正記入を忘れ、予定日だけで判断して母豚の様子を見ない。","指示があれば書き直すが、修正漏れや観察不足がある。","指示があれば交配・再交配のたびにひと通り書き直せる。","指示がなくても再交配時に必ず書き直し、母豚の様子も合わせて確認する。","書き直し漏れがスケジュール混乱を招くと理解し、記入と観察の徹底を新人に指導できる。"],"name_en":"Rewriting on Rebreeding and Observing the Sow","kanten_en":"Can they rewrite the entry at every mating and rebreeding, and check the sow's condition instead of judging by the due date alone?","levels_en":["Forgets to correct entries on rebreeding and judges by the due date alone without watching the sow.","With guidance can rewrite, but has missed corrections and insufficient observation.","With guidance can rewrite the entry at every mating and rebreeding through the basic routine.","Independently rewrites without fail on rebreeding and checks the sow's condition as well.","Understands that missed rewrites disrupt the schedule, and can teach new staff thorough entry and observation."],"name_vi":"Ghi lại khi phối lại và quan sát lợn nái","kanten_vi":"Mỗi lần phối, phối lại có ghi lại không, không chỉ dựa vào ngày dự sinh mà còn xem tình trạng lợn nái không.","levels_vi":["Quên sửa khi phối lại, chỉ dựa vào ngày dự sinh mà không xem tình trạng lợn nái.","Nếu được chỉ thị thì ghi lại, nhưng còn sót chỗ sửa và thiếu quan sát.","Nếu được chỉ thị thì ghi lại được mỗi lần phối, phối lại một cách cơ bản.","Dù không có chỉ thị vẫn luôn ghi lại khi phối lại, đồng thời xem tình trạng lợn nái.","Hiểu sót ghi lại sẽ gây rối loạn lịch, và có thể hướng dẫn người mới việc ghi chép và quan sát triệt để."],"name_id":"Menulis ulang saat kawin ulang dan mengamati induk babi","kanten_id":"Apakah menulis ulang setiap kali kawin atau kawin ulang, dan tidak menilai hanya dari tanggal perkiraan tetapi juga memeriksa keadaan induk babi?","levels_id":["Lupa memperbaiki catatan saat kawin ulang, menilai hanya dari tanggal perkiraan, dan tidak melihat keadaan induk babi.","Menulis ulang jika diperintah, tetapi masih ada lupa memperbaiki dan kurang mengamati.","Jika diperintah, dapat menulis ulang setiap kali kawin atau kawin ulang secara lengkap.","Tanpa diperintah pun, pasti menulis ulang saat kawin ulang, dan memeriksa keadaan induk babi sekaligus.","Memahami bahwa lupa menulis ulang mengacaukan jadwal, dan dapat mengajarkan kedisiplinan mencatat dan mengamati kepada karyawan baru."]}],"gyomu":"32","name_en":"Farrowing Due-Date Entry","purposeShort_en":"Grasp farrowing timing to prepare housing and staff systematically and detect failed conception early","name_vi":"Ghi ngày dự sinh","purposeShort_vi":"Nắm thời kỳ đẻ để chuẩn bị chuồng và nhân lực có kế hoạch, phát hiện sớm không thụ thai","name_id":"Mencatat perkiraan tanggal melahirkan","purposeShort_id":"Mengetahui waktu melahirkan untuk menyiapkan kandang dan tenaga kerja secara terencana, serta menemukan kegagalan bunting sejak dini"},{"id":"cull-ship","category":"shipping","no":"No.22","name":"廃豚出荷（母豚出し）","purposeShort":"繁殖群を計画的に更新し、母豚に無理をさせず安全に出荷する","aspects":[{"id":"welfare-law","name":"歩様確認と法令遵守","kanten":"歩けない・立てない豚は出荷せず、出荷前に体調・歩様を確認し、絶食時も水を止めないか。","levels":["歩けない豚を出荷し、体調・歩様の確認も絶食時の給水も怠る。","指示があれば確認するが、歩様の見極めや給水管理に漏れがある。","指示があれば体調・歩様をひと通り確認して出荷できる。","指示がなくても歩けない豚を除外し、絶食時も水を止めずに安全に出荷する。","と畜場法・輸送指針を理解し、welfareに配慮した出荷を新人に指導できる。"],"name_en":"Gait Checks and Legal Compliance","kanten_en":"Can they refuse to ship pigs that cannot walk or stand, check condition and gait before shipping, and keep water available during fasting?","levels_en":["Ships pigs that cannot walk, and neglects condition and gait checks and water supply during fasting.","With guidance can check, but misses judging gait or managing water supply.","With guidance can check condition and gait and ship through the basic procedure.","Independently excludes pigs that cannot walk and ships safely with water kept available during fasting.","Understands the Slaughterhouse Act and transport guidelines, and can teach new staff welfare-conscious shipping."],"name_vi":"Kiểm tra dáng đi và tuân thủ pháp luật","kanten_vi":"Có không xuất lợn không đi được, không đứng được; trước khi xuất kiểm tra thể trạng, dáng đi; khi nhịn ăn không cắt nước không.","levels_vi":["Xuất cả lợn không đi được, lơ là kiểm tra thể trạng, dáng đi và cấp nước khi nhịn ăn.","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót về nhận biết dáng đi và quản lý cấp nước.","Nếu được chỉ thị thì kiểm tra thể trạng, dáng đi và xuất chuồng được cơ bản.","Dù không có chỉ thị vẫn loại trừ lợn không đi được, không cắt nước khi nhịn ăn, xuất chuồng an toàn.","Hiểu luật về lò mổ và hướng dẫn vận chuyển của Nhật Bản, và có thể hướng dẫn người mới cách xuất chuồng có quan tâm đến phúc lợi động vật (welfare)."],"name_id":"Memeriksa cara berjalan dan menaati peraturan","kanten_id":"Apakah tidak mengirim babi yang tidak bisa berjalan atau berdiri, memeriksa kondisi tubuh dan cara berjalan sebelum pengiriman, dan tidak menghentikan air minum saat puasa?","levels_id":["Mengirim babi yang tidak bisa berjalan, dan lalai memeriksa kondisi tubuh dan cara berjalan serta memberi air minum saat puasa.","Memeriksa jika diperintah, tetapi sering lalai menilai cara berjalan dan mengelola air minum.","Jika diperintah, dapat memeriksa kondisi tubuh dan cara berjalan secara lengkap lalu mengirim.","Tanpa diperintah pun, menyisihkan babi yang tidak bisa berjalan, dan mengirim dengan aman tanpa menghentikan air minum saat puasa.","Memahami undang-undang rumah potong hewan dan pedoman pengangkutan, dan dapat mengajarkan pengiriman yang memperhatikan kesejahteraan hewan kepada karyawan baru."]},{"id":"cull-select","name":"廃豚候補の選定と誤出荷防止","kanten":"廃豚選定基準に沿って選び、休薬期間中の治療豚と混同せず、体重・体型を確認できるか。","levels":["休薬中の治療豚と廃豚候補を混同して誤出荷し、体重・体型確認も省く。","指示があれば選定するが、基準の統一や治療豚との区別に漏れがある。","指示があれば選定基準に沿ってひと通り選べる。","指示がなくても基準に沿って選び、治療豚と区別し、体重・体型を確認する。","選定基準と残留違反のリスクを理解し、廃豚選定と誤出荷防止を新人に指導できる。"],"name_en":"Selecting Cull Candidates and Preventing Wrong Shipments","kanten_en":"Can they select by the culling criteria, avoid confusing them with treated pigs in withdrawal, and check weight and body condition?","levels_en":["Confuses treated pigs in withdrawal with cull candidates and ships them by mistake, skipping weight and body-condition checks.","With guidance can select, but misses standardized criteria or the distinction from treated pigs.","With guidance can select by the culling criteria through the basic procedure.","Independently selects by the criteria, distinguishes treated pigs, and checks weight and body condition.","Understands the criteria and the risk of residue violations, and can teach new staff cull selection and wrong-shipment prevention."],"name_vi":"Chọn lợn loại thải và phòng xuất nhầm","kanten_vi":"Có chọn theo tiêu chuẩn chọn lợn loại thải, không nhầm với lợn đang điều trị trong thời gian ngừng thuốc, kiểm tra cân nặng, thể hình không.","levels_vi":["Nhầm lợn điều trị đang trong thời gian ngừng thuốc với lợn loại thải và xuất nhầm, cũng bỏ qua kiểm tra cân nặng, thể hình.","Nếu được chỉ thị thì chọn, nhưng còn thiếu sót về thống nhất tiêu chuẩn và phân biệt với lợn điều trị.","Nếu được chỉ thị thì chọn theo tiêu chuẩn được cơ bản.","Dù không có chỉ thị vẫn chọn theo tiêu chuẩn, phân biệt với lợn điều trị, kiểm tra cân nặng, thể hình.","Hiểu tiêu chuẩn chọn và rủi ro vi phạm tồn dư thuốc, và có thể hướng dẫn người mới cách chọn lợn loại thải và phòng xuất nhầm."],"name_id":"Memilih calon babi afkir dan mencegah salah kirim","kanten_id":"Apakah memilih sesuai kriteria pemilihan babi afkir, tidak mencampuradukkan dengan babi yang masih dalam masa henti obat, dan memeriksa berat serta bentuk badan?","levels_id":["Mencampuradukkan babi dalam masa henti obat dengan calon afkir sehingga salah kirim, dan melewatkan pemeriksaan berat dan bentuk badan.","Memilih jika diperintah, tetapi sering lalai menyeragamkan kriteria dan membedakan dari babi yang diobati.","Jika diperintah, dapat memilih sesuai kriteria pemilihan secara lengkap.","Tanpa diperintah pun, memilih sesuai kriteria, membedakan dari babi yang diobati, dan memeriksa berat serta bentuk badan.","Memahami kriteria pemilihan dan risiko pelanggaran residu obat, dan dapat mengajarkan pemilihan babi afkir dan pencegahan salah kirim kepada karyawan baru."]}],"gyomu":"22","name_en":"Cull Sow Shipping","purposeShort_en":"Renew the breeding herd systematically and ship sows safely without overstraining them","name_vi":"Xuất chuồng lợn loại thải (đưa lợn nái đi)","purposeShort_vi":"Đổi mới đàn sinh sản có kế hoạch, xuất chuồng an toàn không ép lợn nái quá sức","name_id":"Pengiriman babi afkir (mengeluarkan induk babi)","purposeShort_id":"Memperbarui kelompok induk secara terencana, dan mengirim dengan aman tanpa memaksa induk babi"},{"id":"cull-move","category":"shipping","no":"No.23","name":"育成舎へ廃豚移動","purposeShort":"出荷前管理を円滑にする","aspects":[{"id":"isolation-move","name":"他群との接触回避と静かな移動","kanten":"他群との接触による感染拡大を避け、静かに移動して転倒させないか。","levels":["他群との接触を避けず、急かして転倒させ、収容限界を超えて過密にする。","指示があれば移動させるが、接触回避や収容確認に漏れがある。","指示があれば静かにひと通り移動できる。","指示がなくても他群との接触を避け、静かに移動して過密を防ぐ。","移動時の感染・負傷リスクを理解し、安全な廃豚移動を新人に指導できる。"],"name_en":"Avoiding Contact with Other Groups and Quiet Movement","kanten_en":"Can they avoid spreading infection through contact with other groups and move pigs quietly without letting them fall?","levels_en":["Does not avoid contact with other groups, rushes pigs into falls, and overcrowds beyond housing capacity.","With guidance can move pigs, but misses contact avoidance or capacity checks.","With guidance can complete a basic quiet move.","Independently avoids contact with other groups, moves pigs quietly, and prevents overcrowding.","Understands infection and injury risks during movement, and can teach new staff safe cull-sow movement."],"name_vi":"Tránh tiếp xúc với nhóm khác và di chuyển nhẹ nhàng","kanten_vi":"Có tránh lây lan bệnh do tiếp xúc với nhóm khác, di chuyển nhẹ nhàng để lợn không bị ngã không.","levels_vi":["Không tránh tiếp xúc với nhóm khác, hối thúc làm lợn ngã, nhồi quá giới hạn sức chứa gây quá đông.","Nếu được chỉ thị thì di chuyển, nhưng còn thiếu sót về tránh tiếp xúc và kiểm tra sức chứa.","Nếu được chỉ thị thì di chuyển nhẹ nhàng được cơ bản.","Dù không có chỉ thị vẫn tránh tiếp xúc với nhóm khác, di chuyển nhẹ nhàng, tránh quá đông.","Hiểu rủi ro lây nhiễm, bị thương khi di chuyển, và có thể hướng dẫn người mới cách chuyển lợn loại thải an toàn."],"name_id":"Menghindari kontak dengan kelompok lain dan memindah dengan tenang","kanten_id":"Apakah menghindari penyebaran penyakit lewat kontak dengan kelompok lain, dan memindah dengan tenang tanpa membuat babi jatuh?","levels_id":["Tidak menghindari kontak dengan kelompok lain, memburu-buru hingga babi jatuh, dan memasukkan melebihi batas tampung sehingga terlalu padat.","Memindah jika diperintah, tetapi sering lalai menghindari kontak dan memeriksa daya tampung.","Jika diperintah, dapat memindah dengan tenang secara lengkap.","Tanpa diperintah pun, menghindari kontak dengan kelompok lain, memindah dengan tenang, dan mencegah kepadatan berlebih.","Memahami risiko infeksi dan luka saat memindah, dan dapat mengajarkan pemindahan babi afkir yang aman kepada karyawan baru."]},{"id":"move-record-feed","name":"移動の記録と出荷前給餌管理","kanten":"廃豚移動を記録して在庫を合わせ、出荷予定日までの給餌管理を明確にできるか。","levels":["移動を記録せず在庫が合わず、出荷までの給餌管理も曖昧で飼料コストを膨らませる。","指示があれば記録するが、在庫照合や給餌管理に漏れがある。","指示があれば移動をひと通り記録できる。","指示がなくても移動を記録して在庫を合わせ、出荷予定日までの給餌を管理する。","在庫管理と飼料コストの関係を理解し、記録と給餌管理を新人に指導できる。"],"name_en":"Recording Movements and Pre-Shipping Feed Management","kanten_en":"Can they record cull-sow movements to keep inventory matched, and clarify feeding management up to the planned shipping date?","levels_en":["Does not record movements so inventory does not match, and leaves feeding until shipping vague, inflating feed costs.","With guidance can record, but misses inventory verification or feed management.","With guidance can record the movements through the basic routine.","Independently records movements to match inventory and manages feeding up to the planned shipping date.","Understands the relationship between inventory management and feed costs, and can teach new staff recording and feed management."],"name_vi":"Ghi chép di chuyển và quản lý cho ăn trước xuất chuồng","kanten_vi":"Có ghi việc chuyển lợn loại thải để khớp tồn kho, làm rõ việc quản lý cho ăn đến ngày dự kiến xuất chuồng không.","levels_vi":["Không ghi di chuyển làm lệch tồn kho, quản lý cho ăn đến khi xuất cũng mơ hồ, làm tăng chi phí thức ăn.","Nếu được chỉ thị thì ghi, nhưng còn thiếu sót về đối chiếu tồn kho và quản lý cho ăn.","Nếu được chỉ thị thì ghi việc di chuyển được cơ bản.","Dù không có chỉ thị vẫn ghi việc di chuyển để khớp tồn kho, quản lý cho ăn đến ngày dự kiến xuất chuồng.","Hiểu quan hệ giữa quản lý tồn kho và chi phí thức ăn, và có thể hướng dẫn người mới việc ghi chép và quản lý cho ăn."],"name_id":"Mencatat pemindahan dan mengelola pakan sebelum pengiriman","kanten_id":"Apakah dapat mencatat pemindahan babi afkir agar stok cocok, dan menjelaskan dengan jelas pengelolaan pakan sampai tanggal rencana pengiriman?","levels_id":["Tidak mencatat pemindahan sehingga stok tidak cocok, dan pengelolaan pakan sampai pengiriman kabur sehingga biaya pakan membengkak.","Mencatat jika diperintah, tetapi sering lalai mencocokkan stok dan mengelola pakan.","Jika diperintah, dapat mencatat pemindahan secara lengkap.","Tanpa diperintah pun, mencatat pemindahan agar stok cocok, dan mengelola pemberian pakan sampai tanggal rencana pengiriman.","Memahami hubungan pengelolaan stok dengan biaya pakan, dan dapat mengajarkan pencatatan dan pengelolaan pakan kepada karyawan baru."]}],"gyomu":"23","name_en":"Moving Cull Sows to the Grower House","purposeShort_en":"Keep pre-shipping management running smoothly","name_vi":"Chuyển lợn loại thải sang chuồng lợn choai","purposeShort_vi":"Giúp việc quản lý trước xuất chuồng thuận lợi","name_id":"Memindahkan babi afkir ke kandang grower","purposeShort_id":"Melancarkan pengelolaan sebelum pengiriman"},{"id":"cull-prep","category":"shipping","no":"No.28","name":"廃豚準備","purposeShort":"出荷作業を安全に進める","aspects":[{"id":"final-check","name":"歩様の最終確認と無理のない誘導","kanten":"体調と歩様を最終確認し、歩行困難豚への無理な誘導を避け、急かして暴れさせないか。","levels":["歩行困難豚を無理に誘導し、出荷当日に急かして暴れさせ打撲・PSE肉を招く。","指示があれば確認するが、歩様の最終確認や誘導の丁寧さに漏れがある。","指示があれば体調・歩様をひと通り最終確認できる。","指示がなくても歩様を最終確認し、無理な誘導を避けて落ち着いて誘導する。","PSE肉・打撲の原因を理解し、安全な誘導と最終確認を新人に指導できる。"],"name_en":"Final Gait Check and Unforced Handling","kanten_en":"Can they make a final check of condition and gait, avoid forcing pigs with walking difficulty, and drive without rushing pigs into panic?","levels_en":["Forces pigs with walking difficulty and rushes pigs on shipping day into panic, causing bruises and PSE meat.","With guidance can check, but misses the final gait check or careful handling.","With guidance can make the final check of condition and gait through the basic routine.","Independently makes the final gait check and drives pigs calmly without forcing them.","Understands the causes of PSE meat and bruising, and can teach new staff safe handling and final checks."],"name_vi":"Kiểm tra dáng đi lần cuối và dẫn lợn không ép buộc","kanten_vi":"Có kiểm tra lần cuối thể trạng và dáng đi, tránh ép dẫn lợn đi lại khó khăn, không hối thúc làm lợn hoảng loạn không.","levels_vi":["Ép dẫn lợn đi lại khó khăn, hối thúc trong ngày xuất chuồng làm lợn hoảng loạn, gây bầm dập, thịt PSE (nhạt màu, mềm, rỉ nước).","Nếu được chỉ thị thì kiểm tra, nhưng còn thiếu sót về kiểm tra dáng đi lần cuối và sự nhẹ nhàng khi dẫn.","Nếu được chỉ thị thì kiểm tra lần cuối thể trạng, dáng đi được cơ bản.","Dù không có chỉ thị vẫn kiểm tra dáng đi lần cuối, tránh ép buộc, dẫn lợn một cách bình tĩnh.","Hiểu nguyên nhân của thịt PSE và bầm dập, và có thể hướng dẫn người mới cách dẫn an toàn và kiểm tra lần cuối."],"name_id":"Pemeriksaan akhir cara berjalan dan penggiringan tanpa paksaan","kanten_id":"Apakah memeriksa terakhir kondisi tubuh dan cara berjalan, tidak memaksa menggiring babi yang sulit berjalan, dan tidak memburu-buru hingga babi mengamuk?","levels_id":["Memaksa menggiring babi yang sulit berjalan, memburu-buru pada hari pengiriman hingga babi mengamuk, sehingga terjadi memar dan daging PSE (daging pucat lembek berair).","Memeriksa jika diperintah, tetapi sering lalai pada pemeriksaan akhir cara berjalan dan kehalusan penggiringan.","Jika diperintah, dapat memeriksa terakhir kondisi tubuh dan cara berjalan secara lengkap.","Tanpa diperintah pun, memeriksa terakhir cara berjalan, dan menggiring dengan tenang tanpa paksaan.","Memahami penyebab daging PSE dan memar, dan dapat mengajarkan penggiringan yang aman dan pemeriksaan akhir kepada karyawan baru."]},{"id":"fast-notify","name":"絶食タイミングと業者への事前連絡","kanten":"絶食開始タイミングを守り、出荷業者へ頭数・個体情報を事前連絡できるか。","levels":["絶食開始を誤って糞汚染や体重ロスを招き、業者への事前連絡も漏らして積込みを混乱させる。","指示があれば準備するが、絶食時期や事前連絡に漏れがある。","指示があれば絶食のタイミングをひと通り守れる。","指示がなくても絶食開始を適切に管理し、業者へ頭数・個体情報を事前連絡する。","絶食管理と積込みの段取りを理解し、事前連絡と準備を新人に指導できる。"],"name_en":"Fasting Timing and Advance Notice to the Hauler","kanten_en":"Can they keep the fasting start time and notify the shipping company of head counts and individual information in advance?","levels_en":["Gets the fasting start wrong, causing fecal contamination and weight loss, and skips advance notice to the hauler, throwing loading into confusion.","With guidance can prepare, but misses the fasting timing or the advance notice.","With guidance can keep the fasting timing through the basic routine.","Independently manages the fasting start properly and notifies the hauler of head counts and individual information in advance.","Understands fasting management and loading logistics, and can teach new staff advance notice and preparation."],"name_vi":"Thời điểm nhịn ăn và liên hệ trước với đơn vị vận chuyển","kanten_vi":"Có giữ đúng thời điểm bắt đầu nhịn ăn, liên hệ trước với đơn vị xuất chuồng về số con và thông tin cá thể không.","levels_vi":["Sai thời điểm bắt đầu nhịn ăn gây bẩn phân, hụt cân, cũng quên liên hệ trước với đơn vị vận chuyển làm rối việc chất lên xe.","Nếu được chỉ thị thì chuẩn bị, nhưng còn thiếu sót về thời điểm nhịn ăn và liên hệ trước.","Nếu được chỉ thị thì giữ đúng thời điểm nhịn ăn được cơ bản.","Dù không có chỉ thị vẫn quản lý phù hợp thời điểm bắt đầu nhịn ăn, liên hệ trước với đơn vị về số con, thông tin cá thể.","Hiểu việc quản lý nhịn ăn và trình tự chất lên xe, và có thể hướng dẫn người mới việc liên hệ trước và chuẩn bị."],"name_id":"Waktu mulai puasa dan pemberitahuan awal ke pengangkut","kanten_id":"Apakah menepati waktu mulai puasa, dan memberitahukan jumlah ekor dan data individu ke perusahaan pengangkut lebih dulu?","levels_id":["Salah waktu mulai puasa sehingga terjadi pencemaran kotoran dan kehilangan berat, dan lupa memberi tahu pengangkut sehingga pemuatan kacau.","Menyiapkan jika diperintah, tetapi sering lalai soal waktu puasa dan pemberitahuan awal.","Jika diperintah, dapat menepati waktu puasa secara lengkap.","Tanpa diperintah pun, mengelola mulai puasa dengan tepat, dan memberitahukan jumlah ekor dan data individu ke pengangkut lebih dulu.","Memahami pengelolaan puasa dan urutan pemuatan, dan dapat mengajarkan pemberitahuan awal dan persiapan kepada karyawan baru."]}],"gyomu":"28","name_en":"Cull Sow Preparation","purposeShort_en":"Carry out shipping work safely","name_vi":"Chuẩn bị lợn loại thải (trước khi xuất chuồng)","purposeShort_vi":"Tiến hành công việc xuất chuồng an toàn","name_id":"Persiapan babi afkir (sebelum pengiriman)","purposeShort_id":"Menjalankan pekerjaan pengiriman dengan aman"}],"levelLabels_en":["Needs Coaching","Needs Improvement","Standard","Above Standard","Exemplary"],"levelLabels_vi":["Cần hướng dẫn","Cần cải thiện","Đạt chuẩn","Vượt chuẩn","Gương mẫu"],"levelLabels_id":["Perlu bimbingan","Perlu perbaikan","Standar","Di atas standar","Teladan"]}</script>
