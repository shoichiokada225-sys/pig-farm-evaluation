ếu phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì cho ăn với lượng thay đổi theo giai đoạn mang thai (thay đổi lượng theo đầu kỳ - giữa kỳ - cuối kỳ), kiểm tra được nước có chảy ra từ vòi uống không.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra hàng ngày mức độ ăn (có thức ăn thừa không), kiểm tra nước chảy ra của vòi uống. Không để lợn nái mang thai bị hết nước, chuẩn bị đủ lượng nước uống nhiều hơn cần cho nái đang cho con bú; mùa nóng có thể làm các cách như dời giờ cho ăn sang sáng sớm và chiều tối mát mẻ.","level5_vi":"Hiểu nội dung dinh dưỡng của thức ăn và việc nước mát giúp duy trì sự thèm ăn vào mùa nóng; điều chỉnh tỉ mỉ lượng thức ăn dựa trên mức độ ăn, thể trạng, số con đẻ ra. Ghi chép thức ăn thừa và lượng nước uống, đề xuất cải thiện cách cho ăn, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Pengelolaan pakan dan air minum (jenis dan jumlah pakan, pemeriksaan alat minum)","kanten_id":"Apakah dapat mengelola jenis dan jumlah pakan sesuai tahap kebuntingan, memeriksa sisa pakan, memeriksa keluarnya air dan jumlahnya pada alat minum, dan menjamin air minum yang cukup.","level1_id":"Salah jenis dan jumlah pakan, tidak sadar air alat minum keluarnya buruk dan membiarkannya. Tidak sadar akan sisa pakan atau air habis, dan tidak bisa menambah-mengurangi jumlah pakan.","level2_id":"Jika diberi petunjuk, dapat memberi jumlah yang ditentukan, tetapi banyak yang terlewat dalam pemakaian pakan sesuai tahap kebuntingan dan pemeriksaan alat minum. Penilaian kelebihan-kekurangan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat memberi pakan dengan jumlah yang berbeda sesuai tahap kebuntingan (jumlah diubah pada awal, tengah, dan akhir), dan memeriksa apakah air keluar dari alat minum.","level4_id":"Tanpa diberi petunjuk pun memeriksa cara makan (ada tidaknya sisa pakan) setiap hari dan memeriksa keluarnya air pada alat minum. Tidak membiarkan induk bunting kehabisan air, menyediakan air minum yang banyak yang dibutuhkan induk menyusui, dan dapat berimprovisasi seperti menggeser waktu pemberian pakan ke pagi dan sore yang sejuk pada musim panas.","level5_id":"Paham isi gizi pakan dan bahwa air dingin membantu menjaga nafsu makan di musim panas, dan mengatur halus jumlah pakan berdasarkan cara makan, kondisi tubuh, dan jumlah anak per kelahiran. Mencatat sisa pakan dan jumlah minum, mengusulkan perbaikan cara pemberian, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-5","name":"母豚の健康観察（足・蹄・乳房・陰部の異常、足を引きずる歩き方の確認）","kanten":"足や歩き方（足を引きずらないか）、乳房（腫れ・泌乳）、陰部の異常な分泌物、飼料の食べ具合・水の出方を確認し、熱っぽければ体温を測り平熱より高くないか確かめられるか。","level1":"足を引きずる、乳房の腫れ、陰部の異常な分泌物を見ても気づかず放置する。観察すべき部位が分からず、常に指示を要する。","level2":"指示があれば足の引きずりや食べ残しには気づくが、乳房や陰部の分泌物の確認に漏れが多く、原因の究明は他者任せ。","level3":"指示があれば毎日見回り、食べ残し・下痢・元気のなさ・足を引きずる歩き方・乳房の張り・陰部の分泌物など、目に見える状態を確かめられる。","level4":"指示がなくても毎日見回り、熱っぽければ体温を測り平熱より高くないか確かめる（高ければ、分娩後なら乳房の腫れ・熱っぽさ・泌乳不良といった分娩後の体調不良、妊娠中なら疾病を疑う）。飼料の食べ具合・水の出方・泌乳の偏りの有無・足の踏ん張りまで確かめ、原因を探る処置ができる。","level5":"悪臭や膿のような陰部の分泌物、足を引きずる様子を正しく読み取り、処置・経過観察・隔離・上長への報告を自ら判断する。分娩後に排出されるはずのもの（胎盤）が残っていないか、子豚が乳を十分に吸えて育っているかまで関連づけて観察し、記録して改善し、同僚や新人に指導できる。","name_en":"Sow health observation (abnormalities of the legs, hooves, udder, and vulva; checking for lameness)","kanten_en":"Can check the legs and gait (for lameness), the udder (swelling, milk production), abnormal vulvar discharge, feed intake, and water flow, and when a sow seems feverish, measure the temperature and confirm whether it is above normal.","level1_en":"Sees lameness, udder swelling, or abnormal vulvar discharge but does not notice or leaves it unaddressed. Does not know which areas to observe and always requires instruction.","level2_en":"With guidance, notices lameness and leftover feed, but often misses checks of the udder and vulvar discharge, relying on others to investigate causes.","level3_en":"With guidance, makes daily rounds and can check visible conditions: leftover feed, diarrhea, listlessness, lameness, udder fullness, and vulvar discharge.","level4_en":"Without guidance, makes daily rounds; when a sow seems feverish, measures the temperature and checks whether it is above normal (if high, suspects postpartum illness — udder swelling, heat, poor milk flow — after farrowing, or disease during gestation). Also checks feed intake, water flow, uneven milk production, and leg stability, and can take steps to investigate the cause.","level5_en":"Correctly interprets foul-smelling or pus-like vulvar discharge and lameness, and independently decides on treatment, follow-up observation, isolation, or reporting to the supervisor. Observes in context — whether anything that should be expelled after farrowing (the placenta) remains, and whether piglets are suckling enough and growing — records and improves, and can instruct colleagues and new staff.","name_vi":"Quan sát sức khỏe lợn nái (bất thường ở chân, móng, bầu vú, âm hộ; kiểm tra dáng đi khập khiễng)","kanten_vi":"Có kiểm tra chân và dáng đi (có đi khập khiễng không), bầu vú (sưng, tiết sữa), dịch tiết bất thường ở âm hộ, mức độ ăn thức ăn và nước chảy ra; khi thấy có vẻ sốt thì đo thân nhiệt để xác nhận có cao hơn bình thường không.","level1_vi":"Thấy đi khập khiễng, vú sưng, dịch tiết bất thường ở âm hộ cũng không nhận ra và bỏ mặc. Không biết vị trí cần quan sát, lúc nào cũng cần chỉ dẫn.","level2_vi":"Nếu có chỉ dẫn thì nhận ra được việc đi khập khiễng và thức ăn thừa, nhưng nhiều bỏ sót trong việc kiểm tra bầu vú và dịch tiết âm hộ, việc tìm nguyên nhân phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì đi tuần tra hàng ngày, kiểm tra được các trạng thái nhìn thấy: thức ăn thừa, tiêu chảy, kém khỏe, dáng đi khập khiễng, độ căng bầu vú, dịch tiết âm hộ.","level4_vi":"Dù không có chỉ dẫn vẫn đi tuần tra hàng ngày; nếu có vẻ sốt thì đo thân nhiệt xem có cao hơn bình thường không (nếu cao: sau khi đẻ thì nghi bệnh sau đẻ như vú sưng - nóng - tiết sữa kém, đang mang thai thì nghi bệnh). Kiểm tra đến cả mức độ ăn, nước chảy ra, tiết sữa có lệch không, độ vững của chân — làm được việc xử lý để tìm nguyên nhân.","level5_vi":"Đọc đúng dịch tiết âm hộ có mùi hôi hay như mủ, dáng đi khập khiễng; tự phán đoán xử lý, theo dõi, cách ly, báo cáo cấp trên. Quan sát có liên hệ đến cả việc thứ cần được đẩy ra sau khi đẻ (nhau thai) có còn sót không, lợn con có bú đủ sữa và lớn lên không; ghi chép để cải thiện, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Pengamatan kesehatan induk babi (kelainan kaki, kuku, ambing, kemaluan; pemeriksaan jalan pincang)","kanten_id":"Apakah dapat memeriksa kaki dan cara jalan (apakah pincang), ambing (bengkak, produksi susu), cairan tidak normal dari kemaluan, cara makan pakan dan keluarnya air, dan jika tampak demam, mengukur suhu tubuh untuk memastikan tidak lebih tinggi dari suhu normal.","level1_id":"Melihat babi jalan pincang, ambing bengkak, atau cairan tidak normal dari kemaluan, tetapi tidak sadar dan membiarkannya. Tidak tahu bagian yang harus diamati, selalu butuh perintah.","level2_id":"Jika diberi petunjuk, sadar akan jalan pincang dan sisa pakan, tetapi banyak yang terlewat dalam pemeriksaan ambing dan cairan kemaluan, dan pencarian penyebab bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, berkeliling setiap hari dan dapat memeriksa keadaan yang terlihat: sisa pakan, diare, tidak bersemangat, jalan pincang, bengkak ambing, cairan dari kemaluan.","level4_id":"Tanpa diberi petunjuk pun berkeliling setiap hari; jika tampak demam, mengukur suhu tubuh dan memastikan tidak lebih tinggi dari normal (jika tinggi: setelah melahirkan curiga gangguan kesehatan pasca melahirkan seperti ambing bengkak, panas, dan susu tidak lancar; saat bunting curiga penyakit). Memeriksa sampai cara makan, keluarnya air, ketimpangan produksi susu, dan kuatnya pijakan kaki, dan dapat melakukan penanganan untuk mencari penyebab.","level5_id":"Dapat membaca dengan benar cairan kemaluan yang berbau busuk atau seperti nanah dan cara jalan yang pincang, lalu memutuskan sendiri penanganan, pemantauan, isolasi, atau lapor ke atasan. Mengamati sampai keterkaitannya: apakah yang seharusnya keluar setelah melahirkan (ari-ari) tidak tertinggal, apakah anak babi cukup menyusu dan tumbuh. Mencatat dan memperbaiki, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-6","name":"衛生管理・消毒（ストール清掃、器具消毒、防疫意識）","kanten":"ストールの清掃・糞の片づけ、種付け器具の消毒、「洗う→消毒する→乾かす」の基本の徹底、人や物の動線・病原を持ち込まない意識があるか。","level1":"清掃や消毒が不十分で、糞や食べ残しが残ったまま、器具も洗わず使い回すなど、病原を持ち込まない意識が低く、不衛生な状態を放置する。","level2":"指示があれば清掃はするが、洗う→消毒する→乾かすの手順や消毒薬の使い分けに漏れが多く、消毒の要否の判断は他者任せ。","level3":"指示があればストールの清掃・糞の片づけを行い、「洗う→消毒する→乾かす」の基本に沿って種付け器具を消毒できる。汚れの残りに気づける。","level4":"指示がなくても毎日清掃・消毒し、精液や種付けの管などの器具を清潔に扱う。汚れが残ると消毒が効きにくいことをふまえ高圧の水で十分に洗い、消毒薬の希釈やつけ置き時間を守る。","level5":"複数の消毒薬を、対象の病原や汚れの程度・温度に応じて使い分け、清潔な場所から汚れた場所への一方通行など、病原を持ち込まない動線の意味を理解する。消毒の記録（日時・薬剤・希釈・対象）を残し、手順を改善し、同僚や新人に指導できる。","name_en":"Hygiene and disinfection (stall cleaning, instrument disinfection, biosecurity awareness)","kanten_en":"Maintains stall cleaning and manure removal, disinfection of breeding instruments, strict adherence to the basic 'wash → disinfect → dry' sequence, and awareness of the flow of people and materials and of not introducing pathogens.","level1_en":"Cleaning and disinfection are inadequate — manure and leftover feed remain, and instruments are reused without washing — showing low biosecurity awareness and leaving unsanitary conditions unaddressed.","level2_en":"With guidance, cleans, but often misses steps in the 'wash → disinfect → dry' sequence and the proper use of different disinfectants, relying on others to judge when disinfection is needed.","level3_en":"With guidance, cleans stalls and removes manure, and can disinfect breeding instruments following the basic 'wash → disinfect → dry' sequence. Notices remaining dirt.","level4_en":"Without guidance, cleans and disinfects daily and handles semen, insemination catheters, and other instruments hygienically. Understanding that remaining dirt reduces disinfectant effectiveness, washes thoroughly with high-pressure water and observes the disinfectant dilution rates and soaking times.","level5_en":"Uses multiple disinfectants selectively according to the target pathogen, degree of soiling, and temperature, and understands the meaning of pathogen-excluding traffic flow such as one-way movement from clean to dirty areas. Keeps disinfection records (date/time, product, dilution, target), improves procedures, and can instruct colleagues and new staff.","name_vi":"Quản lý vệ sinh, khử trùng (dọn cũi cá thể, khử trùng dụng cụ, ý thức phòng dịch)","kanten_vi":"Có dọn cũi cá thể và dọn phân, khử trùng dụng cụ phối giống, thực hiện triệt để nguyên tắc cơ bản \"rửa → khử trùng → làm khô\", có ý thức về đường đi của người và đồ vật, không mang mầm bệnh vào không.","level1_vi":"Dọn dẹp và khử trùng không đầy đủ, để nguyên phân và thức ăn thừa, dụng cụ không rửa mà dùng đi dùng lại — ý thức không mang mầm bệnh vào thấp, bỏ mặc tình trạng mất vệ sinh.","level2_vi":"Nếu có chỉ dẫn thì dọn dẹp, nhưng nhiều bỏ sót trong trình tự rửa → khử trùng → làm khô và cách dùng các loại thuốc khử trùng; phán đoán có cần khử trùng hay không phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì dọn cũi cá thể và dọn phân, khử trùng được dụng cụ phối giống theo nguyên tắc cơ bản \"rửa → khử trùng → làm khô\". Nhận ra được vết bẩn còn sót.","level4_vi":"Dù không có chỉ dẫn vẫn dọn dẹp và khử trùng hàng ngày, xử lý sạch sẽ các dụng cụ như tinh dịch và ống phối giống. Hiểu rằng còn bẩn thì khử trùng khó có hiệu quả nên rửa kỹ bằng nước áp lực cao, tuân thủ độ pha loãng thuốc khử trùng và thời gian ngâm.","level5_vi":"Dùng được nhiều loại thuốc khử trùng khác nhau theo mầm bệnh, mức độ bẩn, nhiệt độ; hiểu ý nghĩa của đường đi không mang mầm bệnh vào như đi một chiều từ chỗ sạch sang chỗ bẩn. Lưu ghi chép khử trùng (ngày giờ, thuốc, độ pha loãng, đối tượng), cải thiện quy trình, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Pengelolaan kebersihan dan disinfeksi (pembersihan stall, disinfeksi alat, kesadaran biosekuriti)","kanten_id":"Apakah melakukan pembersihan kandang individu (stall) dan pembuangan kotoran, disinfeksi alat perkawinan, kepatuhan pada dasar 'cuci → disinfeksi → keringkan', serta punya kesadaran akan alur gerak orang dan barang dan tidak membawa masuk kuman penyakit.","level1_id":"Pembersihan dan disinfeksi kurang; kotoran dan sisa pakan dibiarkan, alat dipakai bergantian tanpa dicuci; kesadaran mencegah masuknya kuman rendah dan keadaan tidak bersih dibiarkan.","level2_id":"Jika diberi petunjuk akan membersihkan, tetapi banyak yang terlewat dalam urutan cuci → disinfeksi → keringkan dan pemilihan obat disinfektan; perlu tidaknya disinfeksi bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat membersihkan stall dan membuang kotoran, serta mendisinfeksi alat perkawinan sesuai dasar 'cuci → disinfeksi → keringkan'. Dapat menyadari kotoran yang masih tersisa.","level4_id":"Tanpa diberi petunjuk pun membersihkan dan mendisinfeksi setiap hari, dan menangani alat seperti semen dan selang perkawinan dengan bersih. Paham disinfeksi kurang mempan jika kotoran tersisa, mencuci bersih dengan air tekanan tinggi, dan mematuhi pengenceran disinfektan serta waktu perendaman.","level5_id":"Dapat memakai beberapa jenis disinfektan sesuai kuman sasaran, tingkat kotoran, dan suhu, serta paham arti alur gerak yang tidak membawa masuk kuman, seperti arus satu arah dari tempat bersih ke tempat kotor. Menyimpan catatan disinfeksi (tanggal, obat, pengenceran, sasaran), memperbaiki urutan kerja, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-7","name":"異常の早期発見と報告（疾病・事故・発情戻りの早期察知と報連相）","kanten":"発情の再発・流産・不受胎・疾病・事故を早期に察知し、まず処置を行い、いつ・どの母豚に・どのような状態かを明確に報告・連絡・相談できるか。","level1":"発情の再発・流産・疾病・事故などの異常を見ても気づかず、報告もしないため対応が遅れる。報告すべき内容が分からず、見落としが多い。","level2":"指示があれば異常に気づくが、報告が遅く内容も不十分で、その後の判断・対応は他者任せ。","level3":"指示があれば発情の再発・食欲不振・足の引きずり・流産・陰部の分泌物などの異常を確かめ、いつ・どの母豚かを添えて上長へ報告できる。","level4":"指示がなくても毎日の見回りで異常を早期に察知し、体温の測定や患部の確認といった処置を行ったうえで、いつ・どの母豚に・どのような状態が出たかを具体的に報告する。発情の再発する母豚の増加や事故の傾向にも自ら気づく。","level5":"流産や、生まれずに固まってしまった子、発情の再発が繰り返し多いことなどから、繁殖に関わる疾病の可能性を見立て、隔離・記録・上長への報告や連携を自ら判断する。報告・連絡・相談の仕組みや確認方法を改善し、新人に指導できる。","name_en":"Early detection and reporting of abnormalities (early recognition of disease, accidents, and returns to estrus, and reporting/communication)","kanten_en":"Can detect returns to estrus, abortions, open sows, disease, and accidents early, take initial action first, and clearly report, contact, and consult on when, which sow, and in what condition.","level1_en":"Sees abnormalities such as returns to estrus, abortion, disease, or accidents but does not notice or report them, so the response is delayed. Does not know what should be reported, and much is overlooked.","level2_en":"With guidance, notices abnormalities, but reporting is slow and the content insufficient, and the subsequent judgment and response are left to others.","level3_en":"With guidance, checks for abnormalities such as returns to estrus, loss of appetite, lameness, abortion, and vulvar discharge, and can report to the supervisor with when and which sow.","level4_en":"Without guidance, detects abnormalities early through daily rounds, takes action such as measuring the temperature and examining the affected area, and then reports concretely when, which sow, and what condition appeared. Also notices, on their own, trends such as an increase in sows returning to estrus or in accidents.","level5_en":"From abortions, mummified fetuses, and repeated frequent returns to estrus, forms an assessment of possible reproductive disease and independently decides on isolation, recording, and reporting to and coordinating with the supervisor. Improves the reporting and communication system and verification methods, and can instruct new staff.","name_vi":"Phát hiện sớm bất thường và báo cáo (phát hiện sớm bệnh, tai nạn, động dục trở lại; báo cáo - liên lạc - trao đổi)","kanten_vi":"Có phát hiện sớm động dục trở lại, sảy thai, không thụ thai, bệnh, tai nạn; xử lý trước rồi báo cáo - liên lạc - trao đổi rõ ràng: khi nào, lợn nái nào, trạng thái như thế nào không.","level1_vi":"Thấy các bất thường như động dục trở lại, sảy thai, bệnh, tai nạn cũng không nhận ra, không báo cáo nên việc đối ứng bị chậm. Không biết nội dung cần báo cáo, nhiều bỏ sót.","level2_vi":"Nếu có chỉ dẫn thì nhận ra bất thường, nhưng báo cáo chậm và nội dung chưa đầy đủ; việc phán đoán và đối ứng sau đó phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì kiểm tra các bất thường như động dục trở lại, chán ăn, đi khập khiễng, sảy thai, dịch tiết âm hộ; báo cáo được cấp trên kèm thông tin khi nào, lợn nái nào.","level4_vi":"Dù không có chỉ dẫn vẫn phát hiện sớm bất thường qua tuần tra hàng ngày, thực hiện xử lý như đo thân nhiệt, kiểm tra chỗ bất thường, rồi báo cáo cụ thể: khi nào, lợn nái nào, xuất hiện trạng thái gì. Tự nhận ra cả xu hướng tăng số nái động dục trở lại và xu hướng tai nạn.","level5_vi":"Từ việc sảy thai, thai gỗ, động dục trở lại lặp lại nhiều — nhận định khả năng có bệnh liên quan đến sinh sản; tự phán đoán cách ly, ghi chép, báo cáo và phối hợp với cấp trên. Cải thiện cơ chế và cách xác nhận của báo cáo - liên lạc - trao đổi, và hướng dẫn cho người mới.","name_id":"Penemuan dini kelainan dan pelaporan (deteksi dini penyakit, kecelakaan, birahi kembali, serta lapor-hubung-konsultasi)","kanten_id":"Apakah dapat mendeteksi sejak dini birahi kembali, keguguran, tidak bunting, penyakit, dan kecelakaan, melakukan penanganan lebih dulu, lalu melapor, menghubungi, dan berkonsultasi dengan jelas: kapan, induk yang mana, dalam keadaan bagaimana.","level1_id":"Melihat kelainan seperti birahi kembali, keguguran, penyakit, atau kecelakaan, tetapi tidak sadar dan tidak melapor, sehingga penanganan terlambat. Tidak tahu isi yang harus dilaporkan, banyak yang terlewat.","level2_id":"Jika diberi petunjuk, sadar akan kelainan, tetapi laporannya lambat dan isinya kurang; penilaian dan penanganan selanjutnya bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat memeriksa kelainan seperti birahi kembali, nafsu makan menurun, jalan pincang, keguguran, dan cairan dari kemaluan, lalu melapor ke atasan disertai kapan dan induk yang mana.","level4_id":"Tanpa diberi petunjuk pun mendeteksi kelainan sejak dini melalui keliling harian, melakukan penanganan seperti mengukur suhu tubuh dan memeriksa bagian yang sakit, lalu melapor secara konkret: kapan, pada induk yang mana, muncul keadaan bagaimana. Juga sadar sendiri akan bertambahnya induk yang birahi kembali dan kecenderungan kecelakaan.","level5_id":"Dapat memperkirakan kemungkinan penyakit yang berkaitan dengan reproduksi dari keguguran, anak yang mati mengeras dalam kandungan (fetus mumifikasi), atau birahi kembali yang sering berulang, dan memutuskan sendiri isolasi, pencatatan, laporan ke atasan, dan kerja sama. Memperbaiki sistem dan cara pemeriksaan lapor-hubung-konsultasi, dan dapat mengajari karyawan baru."}]},{"key":"finish","sheet":"肥育舎","scale":"業務","items":[{"no":"肥-1","name":"飼料・給餌管理（飼料切替の段取り、給餌器の調整、残飼・こぼれの管理）","kanten":"発育段階に応じた飼料の切り替えのやり方、給餌器から出る量の調整、食べ残しや床へのこぼれの確認を行えているか。","level1":"指示しても飼料の切り替えや給餌器の調整ができず、給餌器の食べ残しや床へのこぼれを放置する。発育段階の前後で飼料を取り違える、徐々に慣らさず急に切り替えて消化器の不調を招くなど、雑で危険な扱いが見られる。","level2":"言われれば給餌や食べ残しの片づけはある程度できるが、切り替えの時期や、数日かけて少しずつ混ぜながら変える手順を忘れがちで、給餌器の詰まり・出る量・床のこぼれの確認に漏れが多い。増減の判断は他者任せ。","level3":"指示があれば発育段階に応じた飼料の切り替え（育ちはじめは栄養を多めに、仕上げは控えめの飼料へ）を一通り行え、給餌器の詰まり・食べ残しの増加・床へのこぼれなど目に見える点を確認できる。","level4":"指示がなくても毎日給餌器を確認し、食べ残しが増えていれば食欲低下の原因（暑さ・体調不良・飼料の傷み）を探る。飼料の切り替えは数日かけて少しずつ混ぜながら行い、給餌器から出る量を調整してこぼれを減らす対応ができる。","level5":"飼料を与えすぎると過肥になり肉質が落ちるなど、給餌の意味を正しく理解し、食べ具合や発育に合わせて量を細かく調整する。食べ残した量や、増体に要した飼料の量を記録して改善につなげ、切り替えの手順や給餌器の調整を自ら判断して上長に報告し、同僚や新人に指導できる。","name_en":"Feed and feeding management (planning feed transitions, adjusting feeders, managing leftovers and spillage)","kanten_en":"Carries out feed changes according to growth stage, adjusts the amount dispensed by the feeders, and checks leftovers and feed spilled onto the floor.","level1_en":"Cannot change feeds or adjust the feeders even when instructed, and leaves leftovers in the feeders and spillage on the floor unaddressed. Shows careless, dangerous handling, such as mixing up feeds between growth stages or switching abruptly without a gradual transition, causing digestive upsets.","level2_en":"When told, can feed and clear leftovers to some extent, but tends to forget the transition timing and the procedure of mixing gradually over several days, and often misses checks of feeder blockages, dispensed amounts, and floor spillage. Relies on others to judge increases and decreases.","level3_en":"With guidance, can carry out the feed changes appropriate to growth stage (richer feed for the early growing period, leaner feed for finishing) and check visible points such as feeder blockages, increased leftovers, and spillage on the floor.","level4_en":"Without guidance, checks the feeders daily; if leftovers increase, investigates the causes of reduced appetite (heat, poor health, spoiled feed). Performs feed transitions gradually over several days by mixing, and adjusts the amount dispensed by the feeders to reduce spillage.","level5_en":"Correctly understands the purpose of feeding — for example, that overfeeding causes over-fatness and lowers meat quality — and fine-tunes amounts to intake and growth. Records the amount left uneaten and the feed required for weight gain to drive improvement, independently judges transition procedures and feeder adjustments and reports to the supervisor, and can instruct colleagues and new staff.","name_vi":"Quản lý thức ăn và cho ăn (sắp xếp chuyển đổi thức ăn, điều chỉnh máng ăn, quản lý thức ăn thừa và rơi vãi)","kanten_vi":"Có thực hiện được cách chuyển đổi thức ăn theo giai đoạn phát triển, điều chỉnh lượng thức ăn ra từ máng ăn, kiểm tra thức ăn thừa và thức ăn rơi vãi trên sàn không.","level1_vi":"Được chỉ dẫn cũng không chuyển đổi thức ăn hay điều chỉnh máng ăn được, bỏ mặc thức ăn thừa trong máng và thức ăn rơi vãi trên sàn. Có các thao tác cẩu thả và nguy hiểm như nhầm thức ăn giữa các giai đoạn phát triển, đổi đột ngột không cho quen dần gây rối loạn tiêu hóa.","level2_vi":"Nếu được nói thì cho ăn và dọn thức ăn thừa được phần nào, nhưng hay quên thời điểm chuyển đổi và trình tự trộn dần từng ít một trong vài ngày; nhiều bỏ sót trong việc kiểm tra máng ăn tắc, lượng ra, thức ăn rơi trên sàn. Phán đoán tăng giảm phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì làm được một loạt việc chuyển đổi thức ăn theo giai đoạn phát triển (giai đoạn bắt đầu lớn dùng thức ăn dinh dưỡng cao hơn, giai đoạn vỗ béo cuối chuyển sang thức ăn nhẹ hơn), kiểm tra được các điểm nhìn thấy như máng ăn tắc, thức ăn thừa tăng, rơi vãi trên sàn.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra máng ăn hàng ngày; nếu thức ăn thừa tăng thì tìm nguyên nhân giảm ăn (nóng, thể trạng kém, thức ăn bị hỏng). Chuyển đổi thức ăn bằng cách trộn dần từng ít một trong vài ngày, điều chỉnh được lượng ra từ máng ăn để giảm rơi vãi.","level5_vi":"Hiểu đúng ý nghĩa của việc cho ăn — cho ăn quá nhiều gây quá béo và làm giảm chất lượng thịt, v.v. — điều chỉnh tỉ mỉ lượng thức ăn theo mức độ ăn và sự phát triển. Ghi chép lượng thức ăn thừa và lượng thức ăn cần cho tăng trọng để cải thiện; tự phán đoán trình tự chuyển đổi và việc điều chỉnh máng ăn, báo cáo cấp trên, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Pengelolaan pakan dan pemberian pakan (urutan penggantian pakan, penyetelan tempat pakan, pengelolaan sisa pakan dan tumpahan)","kanten_id":"Apakah melakukan cara penggantian pakan sesuai tahap pertumbuhan, penyetelan jumlah pakan yang keluar dari tempat pakan, dan pemeriksaan sisa pakan serta pakan yang tumpah ke lantai.","level1_id":"Walau disuruh, tidak bisa mengganti pakan atau menyetel tempat pakan, dan membiarkan sisa pakan di tempat pakan serta tumpahan di lantai. Ada perlakuan asal dan berbahaya, seperti tertukar pakan antara tahap pertumbuhan, atau mengganti pakan mendadak tanpa membiasakan bertahap sehingga menimbulkan gangguan pencernaan.","level2_id":"Kalau disuruh, dapat memberi pakan dan membereskan sisa seadanya, tetapi sering lupa waktu penggantian dan cara mengganti bertahap dengan mencampur sedikit demi sedikit selama beberapa hari. Banyak yang terlewat dalam pemeriksaan sumbatan tempat pakan, jumlah yang keluar, dan tumpahan di lantai. Penilaian menambah-mengurangi bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat melakukan penggantian pakan sesuai tahap pertumbuhan (awal pertumbuhan gizi lebih banyak, tahap penggemukan akhir pakan lebih ringan) secara lengkap, dan memeriksa hal yang terlihat: sumbatan tempat pakan, sisa pakan yang bertambah, tumpahan ke lantai.","level4_id":"Tanpa diberi petunjuk pun memeriksa tempat pakan setiap hari; jika sisa pakan bertambah, mencari penyebab turunnya nafsu makan (panas, kondisi badan, pakan rusak). Dapat mengganti pakan bertahap dengan mencampur sedikit demi sedikit selama beberapa hari, dan menyetel jumlah yang keluar dari tempat pakan untuk mengurangi tumpahan.","level5_id":"Paham arti pemberian pakan dengan benar (memberi terlalu banyak membuat terlalu gemuk dan mutu daging turun, dll.) dan mengatur halus jumlahnya sesuai cara makan dan pertumbuhan. Mencatat jumlah sisa pakan dan jumlah pakan yang dibutuhkan untuk pertambahan berat badan sebagai bahan perbaikan, memutuskan sendiri urutan penggantian dan penyetelan tempat pakan lalu melapor ke atasan, dan dapat mengajari rekan dan karyawan baru."},{"no":"肥-2","name":"飲水・給水設備の管理（ニップルの点検、水量・水質の確認）","kanten":"給水器（ニップル）が正常に出るか・出る量の点検、飲水量・水温・水の清浄さを確認できているか。","level1":"給水器の点検を行わず、水の出が悪い・詰まっている状態を放置する。給水の止まった部屋や水漏れに気づかず、豚が飲水できず衰弱する・採食しなくなる事態を見落とす。","level2":"言われれば給水器を確かめるが、部屋ごと・各所の確認や出る量の点検に漏れが多く、水温や清浄さまで気が回らない。確認は指示を待ってから動く。","level3":"指示があれば個々の給水器を実際に作動させて出水を確かめ、詰まり・水漏れ・出の悪さなど目に見える不具合を確認できる。","level4":"指示がなくても毎日すべての給水器の出る量を確かめ、出が悪ければ清掃や高さの調整を行う。豚が十分に飲水できるようにし、冷たすぎずぬるすぎない水温に配慮する対応ができる。","level5":"水は体の大部分を占める最も重要な栄養と理解し、飲水量の減少を体調不良や暑さの兆候と判断する。随時水の清浄さ（汚れの有無）を調べて記録・管理し、設備の点検と水管理を自ら判断して上長に報告でき、新人に指導できる。","name_en":"Drinking water and equipment management (nipple inspection, checking water volume and quality)","kanten_en":"Checks that the nipple drinkers dispense properly and at what rate, and monitors water intake, water temperature, and water cleanliness.","level1_en":"Does not inspect the drinkers and leaves poor flow or blockages unaddressed. Fails to notice rooms where the water has stopped or is leaking, overlooking situations where pigs cannot drink and become weak or stop eating.","level2_en":"When told, checks the drinkers, but often misses room-by-room and point-by-point checks and flow-rate inspection, and does not think about water temperature or cleanliness. Waits for instructions before acting.","level3_en":"With guidance, activates each drinker to confirm that water comes out, and can identify visible faults such as blockages, leaks, and poor flow.","level4_en":"Without guidance, checks the flow rate of every drinker daily, and cleans or adjusts the height when the flow is poor. Ensures the pigs can drink enough, with attention to a water temperature that is neither too cold nor too warm.","level5_en":"Understands that water is the most essential nutrient, making up most of the body, and judges reduced water intake to be a sign of illness or heat stress. Regularly checks the cleanliness of the water and records and manages it, can independently judge equipment inspection and water management and report to the supervisor, and can instruct new staff.","name_vi":"Quản lý nước uống và thiết bị cấp nước (kiểm tra núm uống nước, xác nhận lượng nước và chất lượng nước)","kanten_vi":"Có kiểm tra núm uống nước ra bình thường không và lượng nước ra, xác nhận được lượng nước uống, nhiệt độ nước, độ sạch của nước không.","level1_vi":"Không kiểm tra núm uống nước, bỏ mặc tình trạng nước ra kém hoặc bị tắc. Không nhận ra phòng bị ngắt nước hoặc rò rỉ nước; bỏ sót tình trạng lợn không uống được nước dẫn đến suy yếu, không ăn.","level2_vi":"Nếu được nói thì kiểm tra núm uống nước, nhưng nhiều bỏ sót trong việc kiểm tra từng phòng, từng vị trí và lượng nước ra; không để ý đến nhiệt độ và độ sạch của nước. Chỉ kiểm tra sau khi chờ có chỉ dẫn.","level3_vi":"Nếu có chỉ dẫn thì bấm thử từng núm uống nước để kiểm tra nước ra, xác nhận được các trục trặc nhìn thấy như tắc, rò rỉ nước, nước ra kém.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra hàng ngày lượng nước ra của tất cả núm uống nước; nếu ra kém thì làm vệ sinh và điều chỉnh độ cao. Đảm bảo lợn uống đủ nước, chú ý được nhiệt độ nước không quá lạnh, không quá ấm.","level5_vi":"Hiểu rằng nước là chất dinh dưỡng quan trọng nhất, chiếm phần lớn cơ thể; phán đoán lượng nước uống giảm là dấu hiệu của thể trạng kém hoặc bị nóng. Thường xuyên kiểm tra độ sạch của nước (có bẩn không) để ghi chép và quản lý; tự phán đoán việc kiểm tra thiết bị và quản lý nước, báo cáo được cấp trên, và hướng dẫn cho người mới.","name_id":"Pengelolaan air minum dan alat minum (pemeriksaan nipple, jumlah dan kebersihan air)","kanten_id":"Apakah memeriksa alat minum (nipple air minum) keluar normal atau tidak dan berapa jumlah keluarnya, serta memeriksa jumlah air minum, suhu air, dan kebersihan airnya.","level1_id":"Tidak memeriksa alat minum, membiarkan keadaan air keluarnya buruk atau tersumbat. Tidak sadar ada ruangan yang aliran airnya berhenti atau kebocoran air, melewatkan keadaan babi tidak bisa minum sampai melemah dan berhenti makan.","level2_id":"Kalau disuruh, memeriksa alat minum, tetapi banyak yang terlewat dalam pemeriksaan tiap ruangan dan tiap titik serta jumlah keluarnya, dan tidak sampai memperhatikan suhu dan kebersihan air. Baru bergerak setelah menunggu perintah.","level3_id":"Jika diberi petunjuk, dapat menekan tiap alat minum untuk memastikan airnya keluar, dan memeriksa kerusakan yang terlihat: tersumbat, bocor, keluarnya seret.","level4_id":"Tanpa diberi petunjuk pun memeriksa setiap hari jumlah air yang keluar di semua alat minum; jika keluarnya buruk, membersihkan atau menyetel tingginya. Memastikan babi bisa minum cukup, dan memperhatikan suhu air supaya tidak terlalu dingin dan tidak terlalu hangat.","level5_id":"Paham bahwa air adalah gizi terpenting yang mengisi sebagian besar tubuh, dan menilai turunnya jumlah minum sebagai tanda kondisi badan buruk atau kepanasan. Memeriksa kebersihan air (ada tidaknya kotoran) secara berkala, mencatat dan mengelolanya, memutuskan sendiri pemeriksaan alat dan pengelolaan air lalu melapor ke atasan, dan dapat mengajari karyawan baru."},{"no":"肥-3","name":"増体・発育の観察（成長のばらつき、発育不良豚の選別と対応）","kanten":"同一部屋内の体格のばらつきを把握し、発育の悪い豚・やせた豚を選び出して原因を探れているか。","level1":"発育の悪い豚や体格のばらつきに気づかず放置する。やせた豚や明らかに発育の遅れた豚を見落とし、部屋全体の発育状況を把握できない。","level2":"言われればやせた豚を選び出せるが、部屋全体のばらつきの把握や、発育の悪い豚を別室（治療部屋）へ移すことに漏れが多く、対応の判断は他者任せ。","level3":"指示があれば部屋を観察し、発育のばらつきや、明らかに発育が悪い・やせている豚を確認できる。","level4":"指示がなくても日頃から体格を観察し、発育の遅れた豚を治療部屋へ選別する。原因（体調不良・飼料の取り合い・給餌スペースの不足・群内の優劣）を探り、群の組み替えや個別管理などの対応ができる。","level5":"計画的に育成する意味を理解し、体重を測定して部屋内の体格をそろえる。出荷時期や目標体重に照らして発育の遅れの原因を調べて改善し、選別の目安を記録して上長に報告し、新人に指導できる。","name_en":"Growth observation (variation in growth, sorting out and managing poor doers)","kanten_en":"Grasps the variation in body size within each room, and can pick out poorly growing and thin pigs and investigate the causes.","level1_en":"Does not notice poor doers or variation in body size, leaving them unaddressed. Overlooks thin pigs and pigs with clearly delayed growth, and cannot grasp the room's overall growth status.","level2_en":"When told, can pick out thin pigs, but often fails to grasp the room-wide variation or to move poor doers to a separate room (hospital pen), relying on others for the decision.","level3_en":"With guidance, observes the room and can identify variation in growth and pigs that are clearly growing poorly or are thin.","level4_en":"Without guidance, routinely observes body condition and sorts pigs with delayed growth into the hospital pen. Investigates causes (poor health, feed competition, insufficient feeder space, dominance within the group) and can respond with regrouping or individual management.","level5_en":"Understands the purpose of planned rearing and weighs pigs to even out body sizes within the room. Investigates and corrects the causes of delayed growth against shipping schedules and target weights, records the sorting criteria and reports to the supervisor, and can instruct new staff.","name_vi":"Quan sát tăng trọng và phát triển (độ chênh lệch tăng trưởng, chọn lọc và xử lý lợn chậm lớn)","kanten_vi":"Có nắm được độ chênh lệch thể trạng trong cùng một phòng, chọn ra được lợn phát triển kém và lợn gầy để tìm nguyên nhân không.","level1_vi":"Không nhận ra lợn phát triển kém và độ chênh lệch thể trạng, bỏ mặc. Bỏ sót lợn gầy và lợn chậm lớn rõ rệt, không nắm được tình hình phát triển của cả phòng.","level2_vi":"Nếu được nói thì chọn ra được lợn gầy, nhưng nhiều bỏ sót trong việc nắm độ chênh lệch của cả phòng và chuyển lợn phát triển kém sang phòng riêng (phòng điều trị); phán đoán cách đối ứng phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì quan sát phòng nuôi, xác nhận được độ chênh lệch phát triển và những con phát triển kém, gầy rõ rệt.","level4_vi":"Dù không có chỉ dẫn vẫn quan sát thể trạng thường ngày, chọn lọc lợn chậm lớn sang phòng điều trị. Tìm nguyên nhân (thể trạng kém, tranh giành thức ăn, thiếu chỗ ăn, thứ bậc mạnh yếu trong nhóm), làm được các đối ứng như tổ chức lại nhóm hoặc quản lý riêng từng con.","level5_vi":"Hiểu ý nghĩa của việc nuôi có kế hoạch, đo cân nặng để làm đồng đều thể trạng trong phòng. Đối chiếu với thời kỳ xuất chuồng và cân nặng mục tiêu để điều tra nguyên nhân chậm phát triển và cải thiện; ghi chép tiêu chí chọn lọc, báo cáo cấp trên, và hướng dẫn cho người mới.","name_id":"Pengamatan pertambahan berat dan pertumbuhan (keragaman pertumbuhan, pemilahan dan penanganan babi yang tumbuh buruk)","kanten_id":"Apakah memahami keragaman ukuran badan di dalam satu ruangan, memilih babi yang pertumbuhannya buruk atau kurus, dan mencari penyebabnya.","level1_id":"Tidak sadar akan babi yang tumbuh buruk atau keragaman ukuran badan dan membiarkannya. Melewatkan babi kurus atau babi yang jelas terlambat tumbuh, dan tidak bisa memahami keadaan pertumbuhan seluruh ruangan.","level2_id":"Kalau disuruh, dapat memilih babi yang kurus, tetapi banyak yang terlewat dalam memahami keragaman seluruh ruangan dan dalam memindahkan babi yang tumbuh buruk ke ruangan terpisah (ruang perawatan). Penilaian penanganan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat mengamati ruangan dan memeriksa keragaman pertumbuhan serta babi yang jelas tumbuh buruk atau kurus.","level4_id":"Tanpa diberi petunjuk pun mengamati ukuran badan sehari-hari, dan memilah babi yang terlambat tumbuh ke ruang perawatan. Mencari penyebabnya (kondisi badan, rebutan pakan, tempat makan kurang, urutan kuat-lemah dalam kelompok) dan dapat menangani dengan menyusun ulang kelompok atau merawat per ekor.","level5_id":"Paham arti membesarkan secara terencana, menimbang berat badan dan menyeragamkan ukuran badan dalam ruangan. Menyelidiki penyebab keterlambatan tumbuh berdasarkan waktu pengiriman dan berat target lalu memperbaikinya, mencatat patokan pemilahan, melapor ke atasan, dan dapat mengajari karyawan baru."},{"no":"肥-4","name":"健康観察・疾病対応（呼吸器・消化器症状、尾かじり等の早期発見と対応）","kanten":"せき・腹部を使った苦しそうな呼吸・下痢・元気のなさ・尾をかじる行動などを早めに発見し、隔離・手当て・報告といった初期対応を行えているか。","level1":"せき・下痢・尾かじりなどの兆候を見落として放置する。元気のない豚や衰弱した豚に気づかず、手遅れを招く危険な見落としがある。","level2":"言われれば不調の豚を見つけられるが、せきの頻度・下痢便の様子・体の傷など個体ごとの確認に漏れが多く、隔離・手当て・報告の判断は他者任せ。","level3":"指示があればせき・くしゃみ・腹部を使った苦しそうな呼吸・下痢・採食しない・元気がない・尾をかじられた傷など、目に見える兆候を確認できる。","level4":"指示がなくても毎日見回り、発熱が疑われれば体温を測って平熱より高くないか確かめる。安静時の呼吸が普段より速いことや腹部を使った呼吸を異常の兆候ととらえ、不調の豚を別室（治療部屋）へ移して個別管理する対応ができる。","level5":"兆候を正しく読み取り（せきの継続・血の混じった便など）、手当て・経過観察・隔離・上長への報告を自ら判断する。尾かじりは加害個体を特定して分け、環境要因（換気不足・過密・飼料不足）を是正する。観察結果を記録し、新人に指導できる。","name_en":"Health observation and disease response (early detection and response to respiratory and digestive signs, tail biting, etc.)","kanten_en":"Detects coughing, labored abdominal breathing, diarrhea, listlessness, tail-biting behavior, and other signs early, and can take initial actions such as isolation, treatment, and reporting.","level1_en":"Overlooks and neglects signs such as coughing, diarrhea, and tail biting. Fails to notice listless or weakened pigs, with dangerous oversights that let cases become hopeless.","level2_en":"When told, can find unwell pigs, but often misses individual checks such as cough frequency, the appearance of diarrheic feces, and body wounds, relying on others for decisions on isolation, treatment, and reporting.","level3_en":"With guidance, can identify visible signs: coughing, sneezing, labored abdominal breathing, diarrhea, not eating, listlessness, and tail-bite wounds.","level4_en":"Without guidance, makes daily rounds; when fever is suspected, takes the temperature to check whether it is above normal. Recognizes faster-than-usual resting respiration and abdominal breathing as signs of abnormality, and can move unwell pigs to a separate room (hospital pen) for individual management.","level5_en":"Correctly interprets the signs (persistent coughing, blood in the feces, etc.) and independently decides on treatment, follow-up observation, isolation, and reporting to the supervisor. For tail biting, identifies and separates the biting individual and corrects environmental factors (insufficient ventilation, overcrowding, feed shortage). Records observations and can instruct new staff.","name_vi":"Quan sát sức khỏe và ứng phó bệnh (phát hiện sớm và xử lý triệu chứng hô hấp, tiêu hóa, cắn đuôi, v.v.)","kanten_vi":"Có phát hiện sớm ho, thở khó nhọc bằng bụng, tiêu chảy, kém khỏe, hành vi cắn đuôi; thực hiện được các đối ứng ban đầu như cách ly, chăm sóc, báo cáo không.","level1_vi":"Bỏ sót và bỏ mặc các dấu hiệu như ho, tiêu chảy, cắn đuôi. Không nhận ra lợn kém khỏe hay lợn suy yếu; có những bỏ sót nguy hiểm dẫn đến quá muộn không cứu được.","level2_vi":"Nếu được nói thì tìm được lợn không khỏe, nhưng nhiều bỏ sót trong việc kiểm tra từng con như tần suất ho, tình trạng phân tiêu chảy, vết thương trên thân; phán đoán cách ly, chăm sóc, báo cáo phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì kiểm tra được các dấu hiệu nhìn thấy: ho, hắt hơi, thở khó nhọc bằng bụng, tiêu chảy, không ăn, kém khỏe, vết thương do bị cắn đuôi.","level4_vi":"Dù không có chỉ dẫn vẫn đi tuần tra hàng ngày; nghi sốt thì đo thân nhiệt để xác nhận có cao hơn bình thường không. Coi việc thở khi nghỉ nhanh hơn bình thường và thở bằng bụng là dấu hiệu bất thường; làm được đối ứng như chuyển lợn không khỏe sang phòng riêng (phòng điều trị) để quản lý riêng.","level5_vi":"Đọc đúng các dấu hiệu (ho kéo dài, phân lẫn máu, v.v.); tự phán đoán chăm sóc, theo dõi, cách ly, báo cáo cấp trên. Với việc cắn đuôi thì xác định con gây hại để tách ra, khắc phục yếu tố môi trường (thiếu thông gió, quá đông, thiếu thức ăn). Ghi chép kết quả quan sát, và hướng dẫn cho người mới.","name_id":"Pengamatan kesehatan dan penanganan penyakit (gejala pernapasan dan pencernaan, penemuan dini gigit ekor dan lainnya)","kanten_id":"Apakah dapat menemukan sejak dini batuk, napas berat yang memakai perut, diare, tidak bersemangat, perilaku menggigit ekor, dll., dan melakukan penanganan awal berupa isolasi, perawatan, dan pelaporan.","level1_id":"Melewatkan tanda seperti batuk, diare, dan gigit ekor lalu membiarkannya. Tidak sadar akan babi yang lesu atau melemah, ada kelalaian berbahaya yang bisa berujung terlambat ditolong.","level2_id":"Kalau disuruh, dapat menemukan babi yang tidak sehat, tetapi banyak yang terlewat dalam pemeriksaan per ekor: seringnya batuk, bentuk kotoran diare, luka di badan. Penilaian isolasi, perawatan, dan pelaporan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat memeriksa tanda yang terlihat: batuk, bersin, napas berat memakai perut, diare, tidak makan, tidak bersemangat, luka bekas digigit ekornya.","level4_id":"Tanpa diberi petunjuk pun berkeliling setiap hari; jika curiga demam, mengukur suhu tubuh dan memastikan tidak lebih tinggi dari normal. Menganggap napas saat istirahat yang lebih cepat dari biasanya atau napas memakai perut sebagai tanda kelainan, dan dapat memindahkan babi yang tidak sehat ke ruangan terpisah (ruang perawatan) untuk dirawat per ekor.","level5_id":"Membaca tanda dengan benar (batuk yang berlanjut, kotoran bercampur darah, dll.), lalu memutuskan sendiri perawatan, pemantauan, isolasi, dan laporan ke atasan. Untuk gigit ekor, menemukan babi pelakunya dan memisahkannya, serta memperbaiki faktor lingkungan (ventilasi kurang, terlalu padat, pakan kurang). Mencatat hasil pengamatan, dan dapat mengajari karyawan baru."},{"no":"肥-5","name":"出荷管理（出荷適期の判断、体重測定、選別・積込の段取り）","kanten":"出荷適期の見きわめ・体重測定、出荷前の絶食の段取りや、薬剤使用後に出荷を控える期間の確認、豚を落ち着いて選別・積み込む扱いができているか。","level1":"出荷の頃合いを見きわめられず、体重も測らずに規格に合わない豚を出荷する。乱暴に追い立てたり電気棒を多用したりして豚を傷つける危険な扱いがある。","level2":"言われれば選別や積み込みを手伝えるが、体重の確認・薬剤使用後に出荷を控える期間・出荷前の絶食の段取りに漏れが多く、頃合いや除外の判断は他者任せ。","level3":"指示があれば体重測定と外観の確認で出荷適期の豚を選び、けがや疾病のある豚を除外できる。","level4":"指示がなくても出荷前に所定の時間飼料を止め（水は自由に飲ませる）、薬剤使用後に出荷を控える期間を確認する。追い板で少しずつ静かに追い、電気棒を避け、ゆるやかな傾斜の通路で誘導する対応ができる。","level5":"肉質を落とさないことや、薬剤使用後の期間を確実に守る意味を理解して計画的に出荷する。耳標番号・投薬記録・体重を出荷リストで管理・記録し、季節への配慮（夏は早朝・散水、過密を避けた積み込み）まで判断して、上長に報告し新人に指導できる。","name_en":"Shipping management (judging market readiness, weighing, arranging sorting and loading)","kanten_en":"Judges the right time for shipping and weighs pigs, arranges pre-shipping fasting, checks the withdrawal period after drug use, and handles pigs calmly during sorting and loading.","level1_en":"Cannot judge when pigs are ready and ships pigs that do not meet the specification without weighing them. Handles pigs dangerously — driving them roughly or overusing the electric prod — and injures them.","level2_en":"When told, can help with sorting and loading, but often misses weight checks, the withdrawal period after drug use, and the pre-shipping fasting arrangements, relying on others to judge readiness and exclusions.","level3_en":"With guidance, selects pigs at market readiness by weighing and visual inspection, and can exclude injured or diseased pigs.","level4_en":"Without guidance, withholds feed for the set time before shipping (allowing free access to water) and checks the withdrawal period after drug use. Can drive pigs gently and gradually with a sorting board, avoid the electric prod, and guide them along gently sloped passages.","level5_en":"Understands the importance of preserving meat quality and of strictly observing the period after drug use, and ships according to plan. Manages and records ear tag numbers, medication records, and weights on the shipping list, judges seasonal considerations (early morning shipping and water sprinkling in summer, loading without overcrowding), reports to the supervisor, and can instruct new staff.","name_vi":"Quản lý xuất chuồng (phán đoán thời điểm xuất chuồng thích hợp, đo cân nặng, sắp xếp việc phân loại và chất lên xe)","kanten_vi":"Có xác định được thời điểm xuất chuồng thích hợp và đo cân nặng, sắp xếp việc nhịn ăn trước khi xuất chuồng, kiểm tra thời gian phải ngừng xuất chuồng sau khi dùng thuốc, phân loại và chất lợn lên xe một cách bình tĩnh không.","level1_vi":"Không xác định được thời điểm xuất chuồng, không cân mà xuất cả lợn không đạt quy cách. Có các thao tác nguy hiểm làm lợn bị thương như lùa thô bạo, lạm dụng gậy điện.","level2_vi":"Nếu được nói thì giúp được việc phân loại và chất lên xe, nhưng nhiều bỏ sót trong việc kiểm tra cân nặng, thời gian phải ngừng xuất chuồng sau khi dùng thuốc, sắp xếp nhịn ăn trước xuất chuồng; phán đoán thời điểm và loại trừ phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì chọn được lợn đến thời điểm xuất chuồng thích hợp bằng cách đo cân nặng và kiểm tra bên ngoài, loại trừ được lợn bị thương và bị bệnh.","level4_vi":"Dù không có chỉ dẫn vẫn ngừng cho ăn trong thời gian quy định trước khi xuất chuồng (nước cho uống tự do), kiểm tra thời gian phải ngừng xuất chuồng sau khi dùng thuốc. Dùng tấm chắn lùa từng chút một cách nhẹ nhàng, tránh dùng gậy điện, dẫn lợn qua lối đi có độ dốc thoải.","level5_vi":"Hiểu ý nghĩa của việc không làm giảm chất lượng thịt và việc tuân thủ chắc chắn thời gian sau khi dùng thuốc; xuất chuồng có kế hoạch. Quản lý và ghi chép số thẻ tai, ghi chép dùng thuốc, cân nặng bằng danh sách xuất chuồng; phán đoán đến cả lưu ý theo mùa (mùa hè xuất sáng sớm, phun nước, tránh chất lên xe quá đông), báo cáo cấp trên và hướng dẫn cho người mới.","name_id":"Pengelolaan pengiriman (menentukan waktu siap kirim, penimbangan berat badan, urutan pemilahan dan pemuatan)","kanten_id":"Apakah dapat menentukan waktu siap kirim dan menimbang berat badan, mengatur puasa sebelum pengiriman, memeriksa masa tunggu setelah pemakaian obat sebelum boleh dikirim, dan memperlakukan babi dengan tenang saat memilah dan memuat ke kendaraan.","level1_id":"Tidak bisa menentukan waktu siap kirim, dan mengirim babi yang tidak sesuai standar tanpa menimbang. Ada perlakuan berbahaya yang melukai babi, seperti menghalau dengan kasar atau sering memakai tongkat listrik.","level2_id":"Kalau disuruh, dapat membantu memilah dan memuat, tetapi banyak yang terlewat dalam pemeriksaan berat badan, masa tunggu setelah pemakaian obat sebelum boleh dikirim, dan pengaturan puasa sebelum pengiriman. Penilaian waktunya dan babi yang harus dikecualikan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat memilih babi yang siap kirim melalui penimbangan berat dan pemeriksaan penampilan, serta menyisihkan babi yang luka atau sakit.","level4_id":"Tanpa diberi petunjuk pun menghentikan pakan pada waktu yang ditentukan sebelum pengiriman (air tetap bebas diminum), dan memeriksa masa tunggu setelah pemakaian obat sebelum boleh dikirim. Dapat menghalau pelan-pelan sedikit demi sedikit dengan papan penggiring, menghindari tongkat listrik, dan menggiring lewat jalur dengan tanjakan yang landai.","level5_id":"Paham arti menjaga mutu daging dan pentingnya mematuhi dengan pasti masa tunggu setelah pemakaian obat, dan mengirim secara terencana. Mengelola dan mencatat nomor tanda telinga, catatan pemberian obat, dan berat badan di daftar pengiriman, mempertimbangkan sampai musim (musim panas: pagi-pagi, siram air, hindari muatan terlalu padat), melapor ke atasan, dan dapat mengajari karyawan baru."},{"no":"肥-6","name":"衛生管理・消毒（豚房清掃、オールイン・オールアウト、防疫意識）","kanten":"洗浄・消毒の手順を守れているか、豚を全頭出して洗浄・消毒し、空けてからまとめて入れ替えるやり方での空け期間、作業動線と病原を持ち込まない意識があるか。","level1":"部屋の清掃や消毒の手順を理解しておらず、ふん尿・飼料の食べ残しなどの汚れを残したまま消毒剤をまく。空け期間を守らずに豚を入れるなど、病原を持ち込まない意識がない。","level2":"言われれば清掃するが、つけ置き・高圧洗浄・乾燥の各工程や、消毒剤の希釈・接触時間を守ることに漏れが多く、汚れの取り残しがある。","level3":"指示があれば「ふんを取る→洗う→消毒する」の基本手順で部屋を清掃し、汚れの残りなど目に見える点を確認できる。","level4":"指示がなくても一連の手順（ふんを取る→粗洗い→つけ置き→高圧洗浄→乾燥→消毒→乾燥）を行い、消毒の前に汚れをしっかり落とす。豚を全頭出して洗浄・消毒し、空け期間を十分にとってまとめて入れ替えるやり方を守り、作業は清浄な所から汚れた所への一方通行で動く。","level5":"洗浄してから消毒し乾燥させる基本と、消毒剤の性質（汚れが残ると効かなくなる等）を理解し、対象の病原に応じて消毒剤を選ぶ。洗浄の仕上がりを確かめて効果を見極め、消毒の記録（日時・薬剤・希釈濃度・消毒箇所）を残して改善し、新人に指導できる。","name_en":"Hygiene and disinfection (pen cleaning, all-in/all-out, biosecurity awareness)","kanten_en":"Follows the washing and disinfection procedures; observes the downtime in the all-in/all-out method of removing all pigs, washing and disinfecting, and restocking together after a rest period; and maintains awareness of the work flow and of not introducing pathogens.","level1_en":"Does not understand the room cleaning and disinfection procedures, and sprays disinfectant over remaining manure, urine, and leftover feed. Shows no biosecurity awareness, such as putting pigs in without observing the downtime.","level2_en":"When told, cleans, but often fails to complete each step — soaking, high-pressure washing, drying — or to observe the disinfectant dilution and contact time, leaving dirt behind.","level3_en":"With guidance, cleans the room following the basic sequence 'remove manure → wash → disinfect,' and can check visible points such as remaining dirt.","level4_en":"Without guidance, performs the full sequence (remove manure → pre-rinse → soak → high-pressure wash → dry → disinfect → dry), removing dirt thoroughly before disinfecting. Follows the all-in/all-out method of removing all pigs, washing and disinfecting, allowing sufficient downtime, and restocking together, and works in one direction from clean to dirty areas.","level5_en":"Understands the wash-then-disinfect-then-dry principle and the properties of disinfectants (losing effectiveness where dirt remains, etc.), and selects the disinfectant for the target pathogen. Checks the quality of the washing to verify effectiveness, keeps disinfection records (date/time, product, dilution rate, locations disinfected) for improvement, and can instruct new staff.","name_vi":"Quản lý vệ sinh, khử trùng (dọn ô chuồng lợn, cùng vào - cùng ra, ý thức phòng dịch)","kanten_vi":"Có tuân thủ trình tự rửa và khử trùng, thời gian để trống chuồng theo cách đưa toàn bộ lợn ra để rửa - khử trùng rồi thay cả loạt, đường đi khi làm việc và ý thức không mang mầm bệnh vào không.","level1_vi":"Không hiểu trình tự dọn và khử trùng phòng, rắc thuốc khử trùng khi còn phân - nước tiểu - thức ăn thừa. Đưa lợn vào khi chưa đủ thời gian để trống chuồng — không có ý thức không mang mầm bệnh vào.","level2_vi":"Nếu được nói thì dọn dẹp, nhưng nhiều bỏ sót trong các công đoạn ngâm, rửa áp lực cao, làm khô, và trong việc tuân thủ độ pha loãng, thời gian tiếp xúc của thuốc khử trùng; còn sót vết bẩn chưa được làm sạch.","level3_vi":"Nếu có chỉ dẫn thì dọn phòng theo trình tự cơ bản \"dọn phân → rửa → khử trùng\", kiểm tra được các điểm nhìn thấy như vết bẩn còn sót.","level4_vi":"Dù không có chỉ dẫn vẫn làm được một loạt trình tự (dọn phân → rửa sơ → ngâm → rửa áp lực cao → làm khô → khử trùng → làm khô), làm sạch kỹ vết bẩn trước khi khử trùng. Tuân thủ cách đưa toàn bộ lợn ra để rửa - khử trùng, để trống chuồng đủ thời gian rồi thay cả loạt; khi làm việc đi một chiều từ chỗ sạch sang chỗ bẩn.","level5_vi":"Hiểu nguyên tắc cơ bản rửa xong mới khử trùng rồi làm khô, và tính chất của thuốc khử trùng (còn bẩn thì mất tác dụng, v.v.); chọn được thuốc khử trùng theo mầm bệnh cần diệt. Kiểm tra độ sạch sau khi rửa để đánh giá hiệu quả, lưu ghi chép khử trùng (ngày giờ, thuốc, nồng độ pha loãng, vị trí khử trùng) để cải thiện, và hướng dẫn cho người mới.","name_id":"Pengelolaan kebersihan dan disinfeksi (pembersihan petak kandang, all-in all-out, kesadaran biosekuriti)","kanten_id":"Apakah mematuhi urutan pencucian dan disinfeksi, masa kosong kandang pada cara mengeluarkan semua babi untuk dicuci dan didisinfeksi lalu memasukkan sekaligus (all-in all-out), alur kerja, dan kesadaran tidak membawa masuk kuman penyakit.","level1_id":"Tidak paham urutan pembersihan dan disinfeksi ruangan, menyemprot disinfektan dengan kotoran dan sisa pakan masih ada. Memasukkan babi tanpa mematuhi masa kosong kandang — tidak ada kesadaran mencegah masuknya kuman penyakit.","level2_id":"Kalau disuruh akan membersihkan, tetapi banyak yang terlewat dalam tiap tahap perendaman, cuci tekanan tinggi, dan pengeringan, serta dalam mematuhi pengenceran dan waktu kontak disinfektan; masih ada kotoran yang tertinggal.","level3_id":"Jika diberi petunjuk, dapat membersihkan ruangan dengan urutan dasar 'ambil kotoran → cuci → disinfeksi', dan memeriksa hal yang terlihat seperti kotoran yang masih tersisa.","level4_id":"Tanpa diberi petunjuk pun menjalankan seluruh rangkaian urutan (ambil kotoran → cuci kasar → rendam → cuci tekanan tinggi → keringkan → disinfeksi → keringkan), dan membersihkan kotoran dengan benar sebelum disinfeksi. Mematuhi cara mengeluarkan semua babi untuk dicuci-didisinfeksi, memberi masa kosong yang cukup lalu memasukkan sekaligus, dan bekerja satu arah dari tempat bersih ke tempat kotor.","level5_id":"Paham dasar mencuci dulu baru disinfeksi lalu keringkan, dan sifat disinfektan (tidak mempan jika kotoran tersisa, dll.), serta memilih disinfektan sesuai kuman sasaran. Memastikan hasil pencucian untuk menilai efeknya, menyimpan catatan disinfeksi (tanggal, obat, kepekatan pengenceran, tempat yang didisinfeksi) untuk perbaikan, dan dapat mengajari karyawan baru."},{"no":"肥-7","name":"環境管理（温度・湿度・換気・飼養密度の調整）","kanten":"定めた温度・湿り具合（湿度）を保つこと、換気量や空気の汚れ（鼻をつくにおい）、過密の度合い（飼養頭数）の調整を行えているか。","level1":"温度計や鼻をつくにおいに気を配らず、暑さ・寒さ・過密・換気の悪さを放置する。豚が固まって寄り集まったり、苦しそうに浅く速い呼吸をしていても気づかず対応できない。","level2":"言われれば温度計を確認するが、換気の調整・過密の度合い・空気の汚れの確認に漏れが多く、調整の判断は他者任せ。","level3":"指示があれば温度計を確認し、体が小さい時期は高め・出荷体重に近づくほど低めという目安で温度を保ち、過密や換気の悪さなど目に見える点を確認できる。","level4":"指示がなくても温度・湿り具合・換気を毎日調整し、安静時の呼吸が普段より速いことや鼻をつくにおいを感じ取って換気を強める。過密にならない頭数を守り、暑い時は散水・送風を合わせて行う対応ができる。","level5":"暑いと採食量が落ちて発育が鈍る等の意味や、蒸し暑さが増した時に対策を強める必要を理解して環境を細かく調整する。季節に合わせて換気の最小と最大を見据えて管理し、記録して改善し、上長に報告して新人に指導できる。","name_en":"Environmental management (adjusting temperature, humidity, ventilation, and stocking density)","kanten_en":"Maintains the set temperature and humidity, and adjusts the ventilation rate, air quality (pungent odors), and degree of crowding (number of pigs housed).","level1_en":"Pays no attention to the thermometer or pungent odors, leaving heat, cold, overcrowding, and poor ventilation unaddressed. Does not notice pigs huddling together or breathing shallowly and rapidly in distress, and cannot respond.","level2_en":"When told, checks the thermometer, but often misses the ventilation adjustment, the degree of crowding, and the air quality check, relying on others for adjustment decisions.","level3_en":"With guidance, checks the thermometer, maintains temperature by the guideline of higher while the pigs are small and lower as they approach market weight, and can check visible points such as overcrowding and poor ventilation.","level4_en":"Without guidance, adjusts temperature, humidity, and ventilation daily, and senses faster-than-usual resting respiration and pungent odors and increases ventilation. Keeps to stocking numbers that avoid overcrowding, and combines water sprinkling and fans in hot weather.","level5_en":"Understands the implications — heat reduces feed intake and slows growth — and the need to strengthen countermeasures as heat and humidity rise, and adjusts the environment precisely. Manages the minimum and maximum ventilation with the seasons in view, records and improves, reports to the supervisor, and can instruct new staff.","name_vi":"Quản lý môi trường (điều chỉnh nhiệt độ, độ ẩm, thông gió, mật độ nuôi)","kanten_vi":"Có giữ được nhiệt độ và độ ẩm đã định, điều chỉnh lượng thông gió, độ ô nhiễm không khí (mùi hắc xộc lên mũi), mức độ quá đông (số đầu con nuôi) không.","level1_vi":"Không để ý nhiệt kế và mùi hắc, bỏ mặc nóng, lạnh, quá đông, thông gió kém. Lợn chụm lại thành đống hay thở nhanh - nông khó nhọc cũng không nhận ra và không đối ứng được.","level2_vi":"Nếu được nói thì kiểm tra nhiệt kế, nhưng nhiều bỏ sót trong việc điều chỉnh thông gió, mức độ quá đông, kiểm tra độ ô nhiễm không khí; phán đoán điều chỉnh phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì kiểm tra nhiệt kế, giữ nhiệt độ theo mức chuẩn: cao hơn khi lợn còn nhỏ, thấp dần khi gần đạt cân nặng xuất chuồng; kiểm tra được các điểm nhìn thấy như quá đông, thông gió kém.","level4_vi":"Dù không có chỉ dẫn vẫn điều chỉnh nhiệt độ, độ ẩm, thông gió hàng ngày; cảm nhận việc thở khi nghỉ nhanh hơn bình thường và mùi hắc xộc lên mũi để tăng cường thông gió. Tuân thủ số đầu con để không quá đông; khi nóng thì kết hợp phun nước và quạt gió.","level5_vi":"Hiểu ý nghĩa như trời nóng làm giảm lượng ăn và chậm phát triển, và sự cần thiết phải tăng cường biện pháp khi độ oi bức tăng; điều chỉnh môi trường tỉ mỉ. Quản lý có tầm nhìn mức thông gió tối thiểu và tối đa theo mùa, ghi chép để cải thiện, báo cáo cấp trên và hướng dẫn cho người mới.","name_id":"Pengelolaan lingkungan (pengaturan suhu, kelembapan, ventilasi, kepadatan kandang)","kanten_id":"Apakah menjaga suhu dan kelembapan yang ditetapkan, mengatur jumlah ventilasi dan kotornya udara (bau yang menyengat hidung), dan mengatur tingkat kepadatan (jumlah babi yang dipelihara).","level1_id":"Tidak memperhatikan termometer atau bau menyengat, membiarkan panas, dingin, kepadatan, dan ventilasi yang buruk. Tidak sadar walau babi berkumpul menumpuk atau bernapas cepat dan dangkal dengan susah payah, dan tidak bisa menangani.","level2_id":"Kalau disuruh, memeriksa termometer, tetapi banyak yang terlewat dalam pengaturan ventilasi, tingkat kepadatan, dan pemeriksaan kotornya udara. Penilaian pengaturan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, memeriksa termometer dan menjaga suhu dengan patokan: saat badan masih kecil lebih hangat, makin mendekati berat pengiriman makin rendah, serta memeriksa hal yang terlihat seperti kepadatan dan ventilasi yang buruk.","level4_id":"Tanpa diberi petunjuk pun mengatur suhu, kelembapan, dan ventilasi setiap hari, merasakan napas istirahat yang lebih cepat dari biasa atau bau yang menyengat hidung, lalu memperkuat ventilasi. Mematuhi jumlah babi supaya tidak terlalu padat, dan saat panas dapat menggabungkan penyiraman air dan tiupan angin.","level5_id":"Paham artinya (saat panas jumlah makan turun dan pertumbuhan melambat, dll.) dan perlunya memperkuat penanganan saat udara makin gerah, lalu mengatur lingkungan secara halus. Mengelola ventilasi dengan memperhitungkan batas minimum dan maksimum sesuai musim, mencatat dan memperbaiki, melapor ke atasan, dan dapat mengajari karyawan baru."}]},{"key":"nursery","sheet":"子豚舎（離乳舎）","scale":"業務","items":[{"no":"子-1","name":"離乳豚の導入・馴致（移動時のストレス軽減、給餌・給水への誘導）","kanten":"移動直後の子豚をよく観察し、飼料と水の場所まで誘導し、体格をそろえた群分けができるか。","level1":"指示があっても子豚を乱暴に追い立て、飼料や水の場所を教えずに放置する。母豚からの分離・飼料の変化・移動・群の組み替えといった負担が重なることを理解しておらず、隅でうずくまる子豚や水を飲めていない子豚に気づかない。","level2":"指示があれば水飲み口に口を当てて飲み方を教えるが、抜けが多い。体格の異なる子豚を同じ群に混ぜてしまい、はじかれて弱る子豚が出ても気づかない。誘導が適切かどうかの判断は他者任せ。","level3":"指示があれば静かに追い込み、水飲み口と飼料箱の場所まで子豚を誘導し、体格の近い子豚同士で適切な規模の群を編成できる。どの子豚も無理なく採食できる飼料箱の幅を確保し、飼料や水に近づかない子豚を目視で確認できる。","level4":"指示がなくても、導入後しばらくは採食しない子豚を重点的に観察し、水でふやかした飼料や手からの給餌で立ち上げる。群を混ぜる際は夕方の暗い時間帯に行って争いを抑え、各水飲み口の出方・水量・高さまで自ら点検し、うずくまりや水分不足の兆候を探って早めに対処する。","level5":"離乳時の発育状態を目安に立ち上がりの良否を見分け、弱い子豚の別飼い・群の組み替え・記録まで自ら判断する。導入後に衰弱する子豚を減らす誘導法や群分けの工夫を提案し、追い込みや飼料・水への誘導のやり方を新人に指導できる。","name_en":"Introduction and acclimation of weaned pigs (reducing moving stress, guiding to feed and water)","kanten_en":"Observes newly moved piglets closely, guides them to the feed and water locations, and can form groups evened out by body size.","level1_en":"Even when instructed, drives piglets roughly and leaves them without showing where the feed and water are. Does not understand that the burdens of separation from the sow, feed change, moving, and regrouping pile up, and fails to notice piglets crouching in corners or unable to drink.","level2_en":"With guidance, teaches piglets to drink by putting their mouths to the nipple, but with many omissions. Mixes piglets of different sizes into the same group and does not notice when outcompeted piglets weaken. Relies on others to judge whether the guidance is adequate.","level3_en":"With guidance, drives piglets in calmly, guides them to the nipples and feed boxes, and can form appropriately sized groups of piglets of similar size. Secures enough feeder width for every piglet to eat without strain, and can visually identify piglets that do not approach the feed or water.","level4_en":"Without guidance, intensively observes piglets that are not eating in the period after entry, and starts them up with water-soaked feed or hand feeding. Mixes groups in the dark evening hours to reduce fighting, personally inspects the flow, volume, and height of every nipple, and looks for signs of crouching and dehydration to intervene early.","level5_en":"Judges the quality of the start-up against condition at weaning, and independently decides on separate rearing of weak piglets, regrouping, and record-keeping. Proposes guidance methods and grouping arrangements that reduce piglets weakening after entry, and can teach new staff how to drive piglets and guide them to feed and water.","name_vi":"Tiếp nhận và làm quen lợn cai sữa (giảm stress khi di chuyển, dẫn đến chỗ ăn và chỗ uống nước)","kanten_vi":"Có quan sát kỹ lợn con ngay sau khi di chuyển đến, dẫn đến chỗ thức ăn và nước, chia nhóm với thể trạng đồng đều không.","level1_vi":"Dù có chỉ dẫn vẫn lùa lợn con thô bạo, không chỉ chỗ thức ăn và nước mà bỏ mặc. Không hiểu rằng nhiều gánh nặng chồng lên nhau — tách khỏi mẹ, thay đổi thức ăn, di chuyển, xáo trộn nhóm; không nhận ra lợn con co ro ở góc hay lợn con không uống được nước.","level2_vi":"Nếu có chỉ dẫn thì đưa miệng lợn con vào núm uống nước để dạy cách uống, nhưng nhiều thiếu sót. Trộn lợn con khác thể trạng vào cùng một nhóm, có con bị chèn ép yếu đi cũng không nhận ra. Việc phán đoán cách dẫn dắt có phù hợp không phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì lùa lợn nhẹ nhàng, dẫn lợn con đến chỗ núm uống nước và máng ăn, lập được nhóm quy mô thích hợp gồm các lợn con thể trạng gần nhau. Đảm bảo chiều rộng máng ăn để con nào cũng ăn được thoải mái, kiểm tra được bằng mắt lợn con không lại gần thức ăn và nước.","level4_vi":"Dù không có chỉ dẫn vẫn quan sát trọng điểm những lợn con không ăn trong thời gian đầu sau khi chuyển đến, giúp lợn bắt đầu ăn bằng thức ăn ngâm nước cho mềm hoặc cho ăn bằng tay. Trộn nhóm vào lúc chiều tối trời tối để hạn chế đánh nhau; tự kiểm tra cả mức nước ra, lượng nước, độ cao của từng núm uống nước; tìm dấu hiệu co ro và thiếu nước để xử lý sớm.","level5_vi":"Dựa vào tình trạng phát triển lúc cai sữa để phân biệt sự khởi đầu tốt hay xấu; tự phán đoán việc nuôi riêng lợn con yếu, xáo trộn lại nhóm, ghi chép. Đề xuất cách dẫn dắt và cách chia nhóm để giảm lợn con suy yếu sau khi chuyển đến, hướng dẫn cho người mới cách lùa và cách dẫn đến thức ăn, nước.","name_id":"Penerimaan dan adaptasi babi sapih (mengurangi stres saat pindah, mengarahkan ke pakan dan air minum)","kanten_id":"Apakah dapat mengamati baik-baik anak babi yang baru saja dipindah, mengarahkannya sampai ke tempat pakan dan air, dan membagi kelompok dengan ukuran badan yang seragam.","level1_id":"Walau disuruh, menghalau anak babi dengan kasar dan membiarkannya tanpa menunjukkan tempat pakan dan air. Tidak paham bahwa beban menumpuk (pisah dari induk babi, perubahan pakan, perpindahan, penyusunan ulang kelompok), dan tidak sadar ada anak babi yang meringkuk di pojok atau yang tidak bisa minum air.","level2_id":"Jika diberi petunjuk, dapat menempelkan mulut anak babi ke tempat minum untuk mengajarinya minum, tetapi banyak yang terlewat. Mencampur anak babi yang beda ukuran badan dalam satu kelompok, dan tidak sadar ada anak yang tersisih dan melemah. Penilaian tepat tidaknya pengarahan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat menggiring dengan pelan, mengarahkan anak babi sampai ke tempat minum dan kotak pakan, dan menyusun kelompok berukuran pas dari anak babi yang badannya berdekatan. Menjamin lebar kotak pakan supaya semua anak babi bisa makan tanpa kesulitan, dan dapat memeriksa dengan mata anak babi yang tidak mendekati pakan atau air.","level4_id":"Tanpa diberi petunjuk pun, selama beberapa waktu setelah masuk, mengamati secara fokus anak babi yang tidak makan, dan membangkitkannya dengan pakan yang direndam air atau menyuapi dari tangan. Mencampur kelompok pada waktu sore yang gelap untuk menekan perkelahian, memeriksa sendiri keluarnya air, jumlah air, dan tinggi tiap tempat minum, dan mencari tanda meringkuk atau kekurangan cairan untuk ditangani lebih awal.","level5_id":"Dapat menilai baik-buruknya awal pemeliharaan dengan patokan kondisi pertumbuhan saat sapih, dan memutuskan sendiri pemeliharaan terpisah untuk anak yang lemah, penyusunan ulang kelompok, dan pencatatan. Mengusulkan cara pengarahan dan pembagian kelompok yang mengurangi anak babi yang melemah setelah masuk, dan dapat mengajari karyawan baru cara menggiring dan mengarahkan ke pakan dan air."},{"no":"子-2","name":"飼料・給餌管理（離乳食の切替、少量多回給与、食い込みの確認）","kanten":"離乳用の飼料を段階的に分け、少量を複数回に分けて給与し、豚房ごと・個体ごとの採食状況を確認できるか。","level1":"指示があっても飼料を一度に大量に与え、古い飼料の残りや傷み・カビに気づかない。離乳直後に急に次段階の飼料へ切り替えるなど順序を無視し、消化器の不調や下痢を生じさせる。","level2":"指示があれば少量ずつ与えるが回数や量が安定せず、初期の飼料から次の飼料へ急に切り替えて消化器の不調を生じさせる。個体ごと・豚房ごとの採食状況の差に気づけず、判断は他者任せ。","level3":"指示に従い、消化のよい離乳用飼料を少量ずつ複数回に分けて与え、数日かけて混ぜながら段階を進められる。飼料箱の食べ残しや飼料の汚れを確認し、採食状況の悪い豚房を目視で把握できる。","level4":"指示がなくても毎回の採食状況を観察し、採食しない子豚には手からの給餌や水でふやかすなどで対応する。発育に合わせて飼料の栄養を段階的に下げる切り替えを意識して時期を見極め、採食量が落ちれば飼料の鮮度・水の出・温度・体調まで原因を探る。","level5":"採食量が減った際、その原因が疾病か・暑熱や寒冷など環境か・飼料の質かを切り分け、給与量・回数・飼料の段階を自ら少しずつ調整する。離乳後の下痢を抑える給与法を提案し、少量多回給与のコツや段階の進め方を記録に基づき新人に指導できる。","name_en":"Feed and feeding management (weaner diet transitions, small frequent feedings, checking feed intake)","kanten_en":"Divides the weaner diets into stages, feeds small amounts split over multiple feedings, and can check the intake status by pen and by individual.","level1_en":"Even when instructed, feeds a large amount at once and does not notice old leftover feed or spoilage and mold. Ignores the sequence, such as switching abruptly to the next-stage feed right after weaning, causing digestive upsets and diarrhea.","level2_en":"With guidance, feeds small amounts, but the frequency and amount are inconsistent, and abrupt switches from the starter feed to the next feed cause digestive upsets. Cannot notice differences in intake between individuals and pens, and relies on others for judgment.","level3_en":"Following instructions, feeds digestible weaner diets in small amounts over multiple feedings, and can advance the stages by mixing over several days. Checks leftovers in the feed boxes and soiling of the feed, and can visually identify pens with poor intake.","level4_en":"Without guidance, observes the intake at every feeding and responds to non-eating piglets with hand feeding or soaking the feed in water. Deliberately times the transitions that step the feed's nutrition down as the piglets grow, and when intake drops, investigates the feed's freshness, the water flow, the temperature, and the piglets' health.","level5_en":"When intake falls, differentiates whether the cause is disease, the environment (heat or cold), or feed quality, and adjusts the amount, frequency, and feed stage bit by bit on their own. Proposes feeding methods that curb post-weaning diarrhea, and can teach new staff the techniques of small frequent feeding and stage progression based on records.","name_vi":"Quản lý thức ăn và cho ăn (chuyển đổi thức ăn cai sữa, cho ăn ít một - nhiều lần, kiểm tra mức độ ăn)","kanten_vi":"Có chia thức ăn cai sữa theo giai đoạn, cho ăn lượng nhỏ chia thành nhiều lần, kiểm tra được tình trạng ăn theo từng ô chuồng lợn, từng con không.","level1_vi":"Dù có chỉ dẫn vẫn đổ một lần lượng lớn thức ăn, không nhận ra thức ăn cũ còn sót, bị hỏng, bị mốc. Bỏ qua trình tự như đổi ngay sang thức ăn giai đoạn tiếp theo ngay sau cai sữa, gây rối loạn tiêu hóa và tiêu chảy.","level2_vi":"Nếu có chỉ dẫn thì cho ăn từng ít một, nhưng số lần và lượng không ổn định, chuyển đột ngột từ thức ăn giai đoạn đầu sang thức ăn tiếp theo gây rối loạn tiêu hóa. Không nhận ra sự khác biệt về tình trạng ăn giữa từng con, từng ô chuồng; phán đoán phó mặc cho người khác.","level3_vi":"Theo chỉ dẫn, cho ăn thức ăn cai sữa dễ tiêu với lượng nhỏ chia nhiều lần, tiến dần từng giai đoạn bằng cách trộn dần trong vài ngày. Kiểm tra thức ăn thừa trong máng và thức ăn bị bẩn, nắm được bằng mắt các ô chuồng ăn kém.","level4_vi":"Dù không có chỉ dẫn vẫn quan sát tình trạng ăn mỗi lần cho ăn, với lợn con không ăn thì đối ứng bằng cho ăn bằng tay hoặc ngâm nước cho mềm. Có ý thức về việc chuyển đổi giảm dần dinh dưỡng thức ăn theo sự phát triển và xác định thời điểm; nếu lượng ăn giảm thì tìm nguyên nhân đến cả độ tươi của thức ăn, nước chảy ra, nhiệt độ, thể trạng.","level5_vi":"Khi lượng ăn giảm, phân biệt được nguyên nhân là bệnh, môi trường như nóng - lạnh, hay chất lượng thức ăn; tự điều chỉnh dần từng ít lượng cho ăn, số lần, giai đoạn thức ăn. Đề xuất cách cho ăn để hạn chế tiêu chảy sau cai sữa, hướng dẫn cho người mới mẹo cho ăn ít một - nhiều lần và cách tiến giai đoạn dựa trên ghi chép.","name_id":"Pengelolaan pakan dan pemberian pakan (penggantian pakan sapih, pemberian sedikit-sedikit tapi sering, pemeriksaan lahapnya makan)","kanten_id":"Apakah dapat memberikan pakan khusus sapih secara bertahap, dalam jumlah sedikit yang dibagi beberapa kali, dan memeriksa keadaan makan per petak kandang dan per ekor.","level1_id":"Walau disuruh, memberi pakan sekaligus dalam jumlah besar, dan tidak sadar akan sisa pakan lama, pakan rusak, atau berjamur. Mengabaikan urutan, misalnya langsung mengganti ke pakan tahap berikutnya begitu selesai sapih, sehingga menimbulkan gangguan pencernaan dan diare.","level2_id":"Jika diberi petunjuk, memberi sedikit demi sedikit, tetapi jumlah dan frekuensinya tidak stabil, dan mengganti dari pakan awal ke pakan berikutnya secara mendadak sehingga menimbulkan gangguan pencernaan. Tidak sadar akan beda keadaan makan per ekor dan per petak kandang, penilaiannya bergantung pada orang lain.","level3_id":"Sesuai petunjuk, dapat memberikan pakan sapih yang mudah dicerna sedikit demi sedikit dalam beberapa kali, dan menaikkan tahap pakan sambil mencampurnya selama beberapa hari. Memeriksa sisa pakan di kotak pakan dan kotornya pakan, dan dapat mengetahui dengan mata petak kandang yang keadaan makannya buruk.","level4_id":"Tanpa diberi petunjuk pun mengamati keadaan makan setiap kali memberi, dan menangani anak babi yang tidak makan dengan menyuapi dari tangan atau merendam pakan dengan air. Menentukan waktu penggantian dengan sadar bahwa gizi pakan diturunkan bertahap sesuai pertumbuhan, dan jika jumlah makan turun, mencari penyebab sampai ke kesegaran pakan, keluarnya air, suhu, dan kondisi badan.","level5_id":"Saat jumlah makan berkurang, dapat memilah penyebabnya: penyakit, lingkungan (panas atau dingin), atau mutu pakan, lalu menyesuaikan sendiri sedikit demi sedikit jumlah, frekuensi, dan tahap pakan. Mengusulkan cara pemberian yang menekan diare setelah sapih, dan dapat mengajari karyawan baru, berdasarkan catatan, trik pemberian sedikit-sedikit tapi sering dan cara menaikkan tahap pakan."},{"no":"子-3","name":"飲水管理（給水器の高さ・水量、脱水の防止）","kanten":"水飲み口の高さ・水量・出方を点検し、子豚が飲水できているか・水分が足りているかを確認できるか。","level1":"指示があっても水飲み口から水が出ているか確かめず、詰まりや高さの不適合で飲めない状態を放置する。水分不足でうずくまる子豚に気づかない。","level2":"指示があれば水飲み口を触って確かめるが、高さの調整や水量の確認はせず、飲水できていない豚房や水分不足の兆候を見落としやすい。","level3":"指示があれば水飲み口の高さを子豚の肩の位置に合わせ、水の出方や詰まりを点検できる。眼の落ちくぼみ・皮膚をつまんでも戻りが遅いなど、水分不足の兆候を目視で確認できる。","level4":"指示がなくても毎日すべての水飲み口で水が出るか・スムーズに出るか・出が悪くないかを確かめ、下痢が出た際は水分と塩分の補給を意識する。飲水量の低下に気づけば水の温度・勢い・詰まりまで原因を探る。","level5":"下痢や暑熱で水分が不足する危険を見極め、塩分の追加や水飲み口の増設・高さの調整といった対応を自ら判断して行う。水の清浄さや出水量の点検を記録して改善につなげ、飲水管理の要点を新人に指導できる。","name_en":"Drinking water management (nipple height and flow, preventing dehydration)","kanten_en":"Inspects the nipples' height, flow volume, and function, and can confirm that the piglets are drinking and adequately hydrated.","level1_en":"Even when instructed, does not verify that water comes out of the nipples, leaving blockages or unsuitable heights that prevent drinking. Fails to notice piglets crouching from lack of water.","level2_en":"With guidance, touches the nipples to check them, but does not adjust the height or check the flow volume, and tends to miss pens where piglets are not drinking and the signs of dehydration.","level3_en":"With guidance, sets the nipple height to the piglets' shoulder level and inspects the flow and blockages. Can visually identify signs of dehydration such as sunken eyes and skin that is slow to spring back when pinched.","level4_en":"Without guidance, checks every nipple daily for whether water comes out, comes out smoothly, and is not weak, and when diarrhea occurs, attends to replacing water and salts. When water intake drops, investigates the water temperature, pressure, and blockages.","level5_en":"Assesses the risk of dehydration from diarrhea and heat, and independently decides on and carries out responses such as adding salts, installing additional nipples, and adjusting heights. Records the inspections of water cleanliness and flow volume for improvement, and can teach new staff the essentials of water management.","name_vi":"Quản lý nước uống (độ cao và lượng nước của núm uống nước, phòng mất nước)","kanten_vi":"Có kiểm tra độ cao, lượng nước, mức chảy ra của núm uống nước; xác nhận được lợn con có uống được nước không, có đủ nước không.","level1_vi":"Dù có chỉ dẫn vẫn không kiểm tra nước có ra từ núm uống nước không, bỏ mặc tình trạng lợn không uống được do tắc hoặc độ cao không phù hợp. Không nhận ra lợn con co ro vì thiếu nước.","level2_vi":"Nếu có chỉ dẫn thì sờ núm uống nước để kiểm tra, nhưng không điều chỉnh độ cao và không kiểm tra lượng nước; dễ bỏ sót ô chuồng không uống được nước và dấu hiệu thiếu nước.","level3_vi":"Nếu có chỉ dẫn thì chỉnh độ cao núm uống nước ngang vai lợn con, kiểm tra được mức chảy ra và tình trạng tắc. Kiểm tra được bằng mắt các dấu hiệu thiếu nước như mắt trũng, véo da mà da chậm trở lại.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra hàng ngày tất cả núm uống nước: có ra nước không, ra có trơn tru không, có ra kém không; khi có tiêu chảy thì ý thức việc bù nước và muối. Nếu nhận ra lượng nước uống giảm thì tìm nguyên nhân đến cả nhiệt độ nước, độ mạnh của dòng nước, tình trạng tắc.","level5_vi":"Nhận định được nguy cơ thiếu nước do tiêu chảy và nóng; tự phán đoán và thực hiện các đối ứng như bổ sung muối, lắp thêm núm uống nước, điều chỉnh độ cao. Ghi chép việc kiểm tra độ sạch của nước và lượng nước chảy ra để cải thiện, hướng dẫn cho người mới các điểm chính của quản lý nước uống.","name_id":"Pengelolaan air minum (tinggi dan jumlah air alat minum, pencegahan dehidrasi)","kanten_id":"Apakah dapat memeriksa tinggi, jumlah air, dan keluarnya air pada tempat minum, dan memastikan anak babi bisa minum serta cairan tubuhnya cukup.","level1_id":"Walau disuruh, tidak memeriksa apakah air keluar dari tempat minum, dan membiarkan keadaan anak babi tidak bisa minum karena tersumbat atau tingginya tidak pas. Tidak sadar ada anak babi yang meringkuk karena kekurangan cairan.","level2_id":"Jika diberi petunjuk, menyentuh tempat minum untuk memeriksanya, tetapi tidak menyetel tinggi dan tidak memeriksa jumlah air, sehingga mudah melewatkan petak kandang yang tidak bisa minum dan tanda kekurangan cairan.","level3_id":"Jika diberi petunjuk, dapat menyetel tinggi tempat minum sesuai posisi bahu anak babi, dan memeriksa keluarnya air dan sumbatan. Dapat memeriksa dengan mata tanda kekurangan cairan: mata cekung, kulit yang dicubit lambat kembali.","level4_id":"Tanpa diberi petunjuk pun memeriksa setiap hari semua tempat minum: apakah air keluar, apakah keluarnya lancar, apakah tidak seret. Saat muncul diare, sadar perlunya menambah cairan dan garam. Jika jumlah minum menurun, mencari penyebab sampai ke suhu air, kencangnya aliran, dan sumbatan.","level5_id":"Dapat menilai bahaya kekurangan cairan karena diare atau kepanasan, dan memutuskan serta melakukan sendiri penanganannya: menambah garam, menambah tempat minum, atau menyetel tinggi. Mencatat pemeriksaan kebersihan air dan jumlah keluarnya untuk perbaikan, dan dapat mengajari karyawan baru pokok-pokok pengelolaan air minum."},{"no":"子-4","name":"子豚の健康観察（下痢・呼吸器症状・削痩の早期発見）","kanten":"糞・呼吸・活力・体つきを観察し、下痢・咳や苦しそうな呼吸・やせを早期に発見し対処できるか。","level1":"指示があっても豚房を素通りし、下痢の糞や咳・腹を使った苦しそうな呼吸、やせた子豚を見落とす。気づいた異常も別飼いや連絡といった対処につなげられない。","level2":"指示があれば、明らかな下痢や活力の低下には気づくが、軽い咳・くしゃみや発育の遅れ・やせ始めなど初期の兆候は見落としやすく、対処の判断は他者任せ。","level3":"指示があれば毎日各豚房を観察し、水様の下痢・血の混じった下痢、咳・くしゃみ・鼻水、やせ・毛づやの悪さ・うずくまりなど目に見える状態を確認できる。離乳後しばらくは下痢が生じやすい時期だと理解している。","level4":"指示がなくても毎日すべての豚房を観察し、発熱が疑われれば体温を測定し平熱より高くないかで原因を探る。呼吸が速く荒くないか・糞の状態・飼料と水の摂取状況まで確認し、下痢の子豚は早めに別の豚房（手当て用）へ移す対処ができる。","level5":"観察した状態から疾病の見当をつけ（離乳後に下痢を起こす疾病や、咳・呼吸の疾病などを想定し）、治療・経過観察・別飼い・上長への報告まで自ら判断する。いつ・どのような状態が現れたかを記録して見直し、次の予防に役立て、観察の着眼点を新人に指導できる。","name_en":"Piglet health observation (early detection of diarrhea, respiratory signs, and wasting)","kanten_en":"Observes the feces, breathing, vitality, and body condition, and can detect and address diarrhea, coughing and labored breathing, and thinness early.","level1_en":"Even when instructed, walks past the pens and misses diarrheic feces, coughing and labored abdominal breathing, and thin piglets. Cannot connect noticed abnormalities to actions such as separate housing or communication.","level2_en":"With guidance, notices obvious diarrhea and reduced vitality, but tends to miss early signs such as mild coughing and sneezing, delayed growth, and the beginnings of thinness, relying on others for the response.","level3_en":"With guidance, observes each pen daily and can check visible conditions: watery or bloody diarrhea; coughing, sneezing, nasal discharge; thinness, poor coat, and crouching. Understands that the period shortly after weaning is prone to diarrhea.","level4_en":"Without guidance, observes all pens daily; if fever is suspected, measures the temperature and investigates the cause based on whether it is above normal. Also checks whether the breathing is fast and labored, the state of the feces, and the intake of feed and water, and can move piglets with diarrhea early to a separate (care) pen.","level5_en":"Forms a working idea of the disease from the observed condition (considering diseases that cause post-weaning diarrhea, and coughing and respiratory diseases), and independently decides on treatment, follow-up observation, separate rearing, and reporting to the supervisor. Records when and what condition appeared, reviews it for future prevention, and can teach new staff the key observation points.","name_vi":"Quan sát sức khỏe lợn con (phát hiện sớm tiêu chảy, triệu chứng hô hấp, gầy sút)","kanten_vi":"Có quan sát phân, hô hấp, sức sống, vóc dáng; phát hiện sớm và xử lý được tiêu chảy, ho và thở khó nhọc, gầy sút không.","level1_vi":"Dù có chỉ dẫn vẫn đi ngang qua ô chuồng, bỏ sót phân tiêu chảy, ho, thở khó nhọc bằng bụng, lợn con gầy. Bất thường đã nhận ra cũng không nối được đến việc xử lý như nuôi riêng hay liên lạc.","level2_vi":"Nếu có chỉ dẫn thì nhận ra được tiêu chảy rõ và sức sống giảm, nhưng dễ bỏ sót các dấu hiệu ban đầu như ho nhẹ, hắt hơi, chậm phát triển, bắt đầu gầy; phán đoán cách xử lý phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì quan sát từng ô chuồng hàng ngày, kiểm tra được các trạng thái nhìn thấy: tiêu chảy như nước, tiêu chảy lẫn máu, ho, hắt hơi, nước mũi, gầy, lông xơ xác, co ro. Hiểu rằng thời gian đầu sau cai sữa là thời kỳ dễ bị tiêu chảy.","level4_vi":"Dù không có chỉ dẫn vẫn quan sát tất cả các ô chuồng hàng ngày; nghi sốt thì đo thân nhiệt và tìm nguyên nhân theo việc có cao hơn bình thường không. Kiểm tra đến cả việc thở có nhanh và gấp không, tình trạng phân, mức ăn thức ăn và uống nước; xử lý được như chuyển sớm lợn con tiêu chảy sang ô chuồng riêng (dành cho chăm sóc).","level5_vi":"Từ trạng thái quan sát được, ước đoán bệnh (hình dung bệnh gây tiêu chảy sau cai sữa, bệnh về ho và hô hấp, v.v.); tự phán đoán điều trị, theo dõi, nuôi riêng, báo cáo cấp trên. Ghi chép khi nào xuất hiện trạng thái gì để xem lại và dùng cho việc phòng bệnh lần sau, hướng dẫn cho người mới các điểm cần quan sát.","name_id":"Pengamatan kesehatan anak babi (penemuan dini diare, gejala pernapasan, badan makin kurus)","kanten_id":"Apakah dapat mengamati kotoran, napas, semangat, dan bentuk badan, lalu menemukan dan menangani sejak dini diare, batuk atau napas yang berat, dan badan yang kurus.","level1_id":"Walau disuruh, lewat begitu saja di petak kandang, dan melewatkan kotoran diare, batuk, napas berat yang memakai perut, dan anak babi yang kurus. Kelainan yang disadari pun tidak disambungkan ke penanganan seperti pemeliharaan terpisah atau menghubungi seseorang.","level2_id":"Jika diberi petunjuk, sadar ak
