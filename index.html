<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HSS 評価システム</title>
<meta name="description" content="HSS認定制度の従業員実技評価（豚舎別評価・作業評価）。オフライン対応PWA">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f5c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSS評価">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hdr">
  <div class="brand">
    <span class="brand-mk" aria-hidden="true"><img src="icon-192.png" alt="" width="36" height="36"></span>
    <div>
      <h1 data-t="appTitle">HSS 評価システム</h1>
      <span class="brand-sub">HSS SKILL EVALUATION</span>
    </div>
  </div>
  <div class="lsw" role="group" aria-label="Language">
    <button class="on" onclick="setLang('ja')" aria-pressed="true" lang="ja">JP</button>
    <button onclick="setLang('en')" aria-pressed="false" lang="en">EN</button>
    <button onclick="setLang('vi')" aria-pressed="false" lang="vi">VI</button>
    <button onclick="setLang('id')" aria-pressed="false" lang="id">ID</button>
  </div>
</header>

<div class="modebar" role="group" aria-label="評価モード">
  <button id="modeBarn" class="on" onclick="setMode('barn')" data-t="modeBarn" aria-pressed="true">豚舎別評価</button>
  <button id="modeWork" onclick="setMode('work')" data-t="modeWork" aria-pressed="false">作業評価</button>
</div>

<div class="barnbar" id="barnbar">
  <svg class="bb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-2v9h-5v-6h-4v6H5v-9H3z"/></svg>
  <span class="barnbar-lbl" id="barnLbl" data-t="barnLbl">豚舎</span>
  <select id="barnSel" onchange="setBarn(this.value)" aria-labelledby="barnLbl"></select>
</div>

<div class="barnbar" id="workbar" style="display:none;flex-wrap:wrap;gap:8px">
  <svg class="bb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 1 6 0h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-1.4 12.6-2.1-2.1L7 15l3.6 3.6 6-6-1.5-1.5z"/></svg>
  <span class="barnbar-lbl" id="workLbl" data-t="workLbl">作業</span>
  <select id="workCatSel" onchange="setWorkCat(this.value)" style="flex:1 1 120px"></select>
  <select id="workSel" onchange="setWork(this.value)" style="flex:1 1 160px" aria-labelledby="workLbl"></select>
</div>

<div class="ebar" id="editBar">
  <span data-t="editingBanner">編集中</span>
  <button onclick="cancelEdit()" data-t="cancelEdit">取消</button>
</div>

<!-- 入力 -->
<div id="pgIn" class="pg on">
  <div class="prog"><div class="prog-b" id="progB" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="prog-f" id="progF"></div></div><span class="prog-t" id="progT"></span></div>
  <div class="cd meta">
    <label for="fDate" data-t="labelDate">評価日</label>
    <input type="date" id="fDate">
    <label for="fEv" data-t="labelEvaluator">評価者名</label>
    <input type="text" id="fEv" data-ph="phEv" placeholder="例：山田太郎">
    <label for="fEe" data-t="labelEvaluatee">被評価者名</label>
    <input type="text" id="fEe" data-ph="phEe" placeholder="例：佐藤花子">
  </div>
  <div id="cards"></div>
  <div class="cd oasec">
    <h3 id="fOvLbl" data-t="overall">全体所感</h3>
    <textarea id="fOv" class="oata" rows="4" data-ph="phOv" aria-labelledby="fOvLbl" placeholder="全体的な評価や今後の期待などを記入..."></textarea>
  </div>
  <div class="bg">
    <button class="b b1" id="btnSave" onclick="doSave()" data-t="btnSave">保存</button>
    <button class="b b2" onclick="doReset()" data-t="btnReset">リセット</button>
  </div>
</div>

<!-- 履歴 -->
<div id="pgHi" class="pg">
  <div class="hctrl">
    <select id="hFil" onchange="drawHist()"><option value="" data-t="filterAll">全員</option></select>
    <button class="b b3 b-slim" onclick="doCSV()" data-t="btnCSV">CSV出力</button>
  </div>
  <div id="hList" class="hlist"></div>
</div>

<!-- グラフ -->
<div id="pgCh" class="pg">
  <div class="chc">
    <label for="chSel" data-t="selEe">被評価者を選択</label>
    <select id="chSel" onchange="drawCharts()"><option value="" data-t="selPh">-- 選択してください --</option></select>
  </div>
  <div id="chArea">
    <div class="chb"><h3 data-t="chLine">平均点の推移</h3><canvas id="cvL"></canvas></div>
    <div class="chb"><h3 data-t="chRadar">項目別レーダーチャート（直近）</h3><canvas id="cvR"></canvas></div>
  </div>
  <div id="chNone" class="nd" style="display:none" data-t="selEe"></div>
</div>

<!-- 設定 -->
<div id="pgCfg" class="pg">
  <div id="cfgArea"></div>
  <div class="cfg-add">
    <button onclick="addSection()" data-t="addSec">＋ セクション追加</button>
  </div>
  <div class="mt24">
    <button class="b b1 b-full" onclick="saveCfg()" data-t="saveCfg">設定を保存</button>
  </div>
  <div class="mt12">
    <button class="b b2 b-full" onclick="resetCfg()" data-t="resetCfg">初期設定に戻す</button>
  </div>

  <div class="cfg-blk">
    <p data-t="expHint" class="cfg-hint">別のPCへ評価項目を渡すには「書き出し」でファイルを保存し、そのファイルを相手のPCの「読み込み」で取り込みます。</p>
    <button class="b b4 b-full" onclick="exportCfg()" data-t="expCfg">⬇ 項目を書き出し（ファイル保存）</button>
    <div class="mt12">
      <button class="b b3 b-full" onclick="document.getElementById('impFile').click()" data-t="impCfg">⬆ 項目を読み込み（ファイルから）</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="importCfg(this)">
  </div>

  <div class="cfg-blk">
    <p data-t="backupHint" class="cfg-hint">端末の故障や誤消去に備えて、全豚舎の評価データと項目を1ファイルに保存できます。復元では既存の記録は残り、新しい記録だけが追加されます。</p>
    <button class="b b4 b-full" onclick="exportAll()" data-t="expAll">⬇ 全データをバックアップ（評価＋項目）</button>
    <div class="mt12">
      <button class="b b3 b-full" onclick="document.getElementById('impAllFile').click()" data-t="impAll">⬆ バックアップから復元</button>
    </div>
    <input type="file" id="impAllFile" accept="application/json,.json" style="display:none" onchange="importAll(this)">
  </div>
</div>

<!-- モーダル -->
<div class="mo" id="modal" role="dialog" aria-modal="true" aria-labelledby="moTitle" onclick="if(event.target===this)closeMo()">
  <div class="mc" id="moBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- タブ -->
<nav class="tabs" aria-label="Main">
  <button class="on" data-pg="pgIn" onclick="swTab(this)">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 3.5L18.5 8H14V3.5zM6 20V4h6v6h6v10H6z"/><path d="M8 13h8v1.5H8zM8 16h5v1.5H8z"/></svg>
    <span data-t="tabIn">入力</span>
  </button>
  <button data-pg="pgHi" onclick="swTab(this)">
    <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    <span data-t="tabHi">履歴</span>
  </button>
  <button data-pg="pgCh" onclick="swTab(this)">
    <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
    <span data-t="tabCh">グラフ</span>
  </button>
  <button data-pg="pgCfg" onclick="swTab(this)">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    <span data-t="tabCfg">設定</span>
  </button>
</nav>

<script id="criteriaData" type="application/json">[{"key":"farrow","sheet":"分娩舎","scale":"業務","items":[{"no":"分-1","name":"母豚の健康観察（食欲・行動・乳房状態の確認、異常の有無）","kanten":"分娩舎の母豚を毎日見回り、飼料の食べ具合・起立の様子・乳房の張りや乳の出・尻まわりの汚れやにおい・飲水量を確認し、平常との違いに気づけるか。発熱が疑われるときは体温を測定できるか。","level1":"母豚の前を素通りし、飼料の食べ残しや、横臥したまま動かない母豚に気づかない。乳房の赤みや腫れ、尻まわりの異臭をともなう汚れを見ても異常と捉えず放置する。見回り自体も、指示がなければ行わない。","level2":"指示があれば、飼料の食べ残しや元気の有無はある程度確認できるが、乳房の張りや乳の出のかたより、飲水量の低下などを見落としがち。異常かどうかの判断は常に他者まかせで、自力では正常か異常かの線引きができない。","level3":"指示があればひと通り見回り、飼料の食べ残し・呼んでも起立しない元気のなさ・尻まわりの異臭をともなう汚れなど、目に見える異常に気づける。乳房をひと通り触れて張りを確認し、子豚がすべての乳首に吸いついているか（腹部がふくれているか）も確かめられる。","level4":"指示がなくても毎日欠かさず見回り、飼料の摂取が落ちたり元気がなかったりすれば、発熱を疑って体温を測定する。平常より高ければ分娩後の体調不良（乳房の腫れ・発熱・乳の出が悪い 等）を疑い、乳房のしこりや熱感、乳の出、飲水量まで確かめて原因を探り、給餌を控えて飲水を促すなど、初期の手当てをしたうえで報告できる。","level5":"観察結果を分娩後の体調不良の知識と結びつけて的確に捉え、上長への相談・経過観察・授乳の工夫・移動の判断・記録・報告まで自力で判断できる。体格・栄養状態（やせ・標準・過肥）を目安に、母豚ごとに給餌量を細かく加減し、体温・飲水・乳の出の平常の様子と着眼点を新人に指導できる。","name_en":"Sow health observation (checking appetite, behavior, udder condition, and any abnormalities)","kanten_en":"Can make daily rounds of sows in the farrowing house, checking feed intake, standing behavior, udder fullness and milk flow, dirt or odor around the rear, and water intake, and notice deviations from normal. Can measure body temperature when fever is suspected.","level1_en":"Walks past sows without observing; fails to notice leftover feed or a sow lying down and not moving. Sees udder redness or swelling, or foul-smelling dirt around the rear, but does not recognize them as abnormal and leaves them unaddressed. Does not even make rounds unless instructed.","level2_en":"With guidance, can check leftover feed and general liveliness to some extent, but tends to miss udder fullness, uneven milk flow, or reduced water intake. Always relies on others to judge whether something is abnormal and cannot distinguish normal from abnormal on their own.","level3_en":"With guidance, makes a full round and notices visible abnormalities such as leftover feed, listlessness (not standing when called), and foul-smelling dirt around the rear. Can palpate the udder to check fullness and confirm that piglets are suckling on all teats (bellies are rounded).","level4_en":"Without guidance, makes rounds every day without fail; if feed intake drops or a sow seems listless, suspects fever and measures body temperature. If it is higher than normal, suspects postpartum illness (udder swelling, fever, poor milk flow, etc.), checks udder lumps and heat, milk flow, and water intake to investigate the cause, and can give initial care such as reducing feed and encouraging water intake before reporting.","level5_en":"Accurately interprets observations by linking them to knowledge of postpartum disorders, and can independently decide on consulting the supervisor, follow-up observation, nursing adjustments, moving the sow, recording, and reporting. Fine-tunes feed amounts for each sow based on body condition (thin, standard, over-conditioned), and can teach new staff the normal patterns and key observation points for temperature, water intake, and milk flow.","name_vi":"Quan sát sức khỏe lợn nái (kiểm tra ăn uống, hành vi, tình trạng bầu vú, có bất thường hay không)","kanten_vi":"Hàng ngày đi tuần tra lợn nái ở chuồng đẻ, kiểm tra mức độ ăn thức ăn, cách đứng dậy, độ căng bầu vú và sữa chảy ra, vết bẩn và mùi ở vùng mông, lượng nước uống; có nhận ra sự khác thường so với bình thường không. Khi nghi bị sốt, có đo được thân nhiệt không.","level1_vi":"Đi ngang qua lợn nái mà không quan sát; không nhận ra thức ăn thừa hoặc lợn nái nằm im không cử động. Thấy bầu vú đỏ, sưng, vùng mông bẩn có mùi hôi cũng không cho là bất thường và bỏ mặc. Nếu không có chỉ dẫn thì không đi tuần tra.","level2_vi":"Nếu có chỉ dẫn thì kiểm tra được phần nào thức ăn thừa và mức độ khỏe mạnh, nhưng hay bỏ sót độ căng bầu vú, sữa ra không đều, lượng nước uống giảm. Việc phán đoán bất thường luôn phó mặc cho người khác; không tự phân biệt được bình thường hay bất thường.","level3_vi":"Nếu có chỉ dẫn thì đi tuần tra đầy đủ, nhận ra được các bất thường nhìn thấy được như thức ăn thừa, lợn không đứng dậy khi gọi, vùng mông bẩn có mùi hôi. Có thể sờ toàn bộ bầu vú để kiểm tra độ căng, và kiểm tra được lợn con có bú đủ tất cả các vú không (bụng có căng tròn không).","level4_vi":"Dù không có chỉ dẫn vẫn đi tuần tra hàng ngày không bỏ sót; nếu lợn ăn ít hoặc kém khỏe thì nghi sốt và đo thân nhiệt. Nếu cao hơn bình thường thì nghi bệnh sau khi đẻ (vú sưng, sốt, sữa ra kém, v.v.), kiểm tra thêm cục cứng và nóng ở vú, sữa chảy ra, lượng nước uống để tìm nguyên nhân; có thể xử lý ban đầu như giảm cho ăn, khuyến khích uống nước, rồi báo cáo.","level5_vi":"Kết hợp kết quả quan sát với kiến thức về bệnh sau khi đẻ để đánh giá chính xác; tự phán đoán được từ việc trao đổi với cấp trên, theo dõi, điều chỉnh cách cho bú, quyết định di chuyển, ghi chép đến báo cáo. Dựa vào thể trạng (gầy - trung bình - quá béo) để điều chỉnh tỉ mỉ lượng thức ăn cho từng lợn nái, và có thể hướng dẫn cho người mới về trạng thái bình thường và điểm cần chú ý của thân nhiệt, nước uống, sữa.","name_id":"Pengamatan kesehatan induk babi (nafsu makan, perilaku, kondisi ambing, ada tidaknya kelainan)","kanten_id":"Apakah dapat berkeliling memeriksa induk babi di kandang beranak setiap hari, memeriksa cara makan pakan, cara berdiri, bengkak ambing dan keluarnya susu, kotoran dan bau di sekitar pantat, serta jumlah air minum, dan menyadari perbedaan dari kondisi normal. Apakah dapat mengukur suhu tubuh saat dicurigai demam.","level1_id":"Lewat begitu saja di depan induk babi, tidak sadar ada sisa pakan atau induk babi yang terus berbaring tidak bergerak. Melihat ambing memerah atau bengkak, atau kotoran berbau di sekitar pantat, tetapi tidak menganggapnya kelainan dan membiarkannya. Tidak berkeliling memeriksa kalau tidak disuruh.","level2_id":"Jika diberi petunjuk, dapat sedikit memeriksa sisa pakan dan semangat babi, tetapi sering melewatkan bengkak ambing, susu yang keluar tidak merata, atau air minum yang berkurang. Menilai normal atau tidak selalu bergantung pada orang lain, tidak dapat memutuskan sendiri.","level3_id":"Jika diberi petunjuk, dapat berkeliling memeriksa secara lengkap dan menyadari kelainan yang terlihat, seperti sisa pakan, babi yang tidak berdiri saat dipanggil (tidak bersemangat), atau kotoran berbau di sekitar pantat. Dapat meraba semua ambing untuk memeriksa bengkaknya, dan memastikan anak babi menyusu di semua puting (perutnya membesar/kenyang).","level4_id":"Tanpa diberi petunjuk pun berkeliling memeriksa setiap hari tanpa lupa. Jika makan berkurang atau babi tidak bersemangat, curiga demam dan mengukur suhu tubuh. Jika lebih tinggi dari normal, curiga gangguan kesehatan setelah melahirkan (ambing bengkak, demam, susu tidak lancar, dll.), memeriksa benjolan dan rasa panas pada ambing, keluarnya susu, dan air minum untuk mencari penyebab, lalu melakukan penanganan awal seperti mengurangi pakan dan mendorong minum, kemudian melapor.","level5_id":"Dapat menghubungkan hasil pengamatan dengan pengetahuan tentang gangguan kesehatan setelah melahirkan, dan memutuskan sendiri konsultasi ke atasan, pemantauan, pengaturan menyusui, pemindahan, pencatatan, dan pelaporan. Dapat mengatur halus jumlah pakan tiap induk babi berdasarkan kondisi tubuh dan gizi (kurus, normal, terlalu gemuk), dan dapat mengajari karyawan baru kondisi normal serta titik pengamatan suhu tubuh, air minum, dan keluarnya susu."},{"no":"分-2","name":"分娩介助の対応（介助タイミング、難産時の処置、分娩記録の正確性）","kanten":"分娩の進行間隔に注意を払いながら見守り、難産の見分け・産道の確認や子豚の引き出し・定められた分娩処置や薬剤の使用・記録を、清潔かつ正確に行えるか。","level1":"分娩の進み具合を見ておらず、子豚が産道で引っかかっても気づかない。手指を消毒せず、潤滑剤も使わずに産道へ手を入れる、無理に引っ張るなど、危険で雑な扱いをする。出生数や死産数の記録も行わない。","level2":"指示があれば分娩を見守れるが、分娩間隔を正確に計れず、難産の見分けが遅れがち。介助の要否は他者まかせで、定められた分娩薬の使い方も自力では判断できず、記録も抜け漏れが多い。","level3":"指示があれば分娩間隔を計りながら見守り、口や鼻のぬめりを取る・乾いたタオルで拭く・へその緒を適切な長さで切って消毒する、という一連の流れを行える。生存出生数・死産数・腹中で育たず固まって生まれた子豚の数を正しく記録し、分娩間隔が空くなど難産が疑われれば報告できる。","level4":"指示がなくても分娩を計りながら見守り、分娩間隔が平常より空きすぎれば難産を疑う。まず母豚を起立させて向きを変えるよう促し、改善しなければ清潔な長手袋をして潤滑剤を用い、産道を確かめ、母豚のいきみに合わせて慎重に引き出す。産道に子豚がいなければ定められた分娩薬を用いて経過を見て、それでも生まれなければ上長へ連絡する。胎盤が排出されたか、分娩後の体温も確かめる。","level5":"子豚が大きすぎる・体位が悪い・いきむ力が弱いなど、難産の原因を見分けて手当てを選べる。産道の入り口が十分に開く前に分娩薬を用いると母豚の損傷や死産を招くと理解し、開き具合の確認と用量を必ず守る。分娩記録（出生数・死産数・所要時間・介助の内容）を成績の見直しや次回の分娩管理に役立てつつ、介助の見極めと手技を新人に指導できる。","name_en":"Farrowing assistance (timing of intervention, handling dystocia, accuracy of farrowing records)","kanten_en":"Can monitor farrowing while paying attention to birth intervals, recognize dystocia, examine the birth canal and extract piglets, and carry out prescribed farrowing procedures, drug use, and record-keeping cleanly and accurately.","level1_en":"Does not watch the progress of farrowing and fails to notice a piglet stuck in the birth canal. Handles sows dangerously and carelessly, such as inserting a hand into the birth canal without disinfecting hands or using lubricant, or pulling forcibly. Does not record the number born or stillborn.","level2_en":"With guidance, can watch over farrowing, but cannot accurately time birth intervals and is slow to recognize dystocia. Relies on others to decide whether assistance is needed, cannot judge the prescribed use of farrowing drugs on their own, and records have many gaps.","level3_en":"With guidance, monitors farrowing while timing birth intervals and can perform the standard sequence: clearing mucus from the mouth and nose, wiping with a dry towel, and cutting the umbilical cord to the proper length and disinfecting it. Correctly records the numbers of liveborn, stillborn, and mummified piglets, and can report when dystocia is suspected due to prolonged birth intervals.","level4_en":"Without guidance, monitors farrowing while timing intervals and suspects dystocia if intervals are longer than normal. First encourages the sow to stand up and change position; if there is no improvement, puts on a clean long glove, applies lubricant, examines the birth canal, and carefully extracts the piglet in time with the sow's straining. If no piglet is in the birth canal, administers the prescribed farrowing drug and observes; if the piglet is still not born, contacts the supervisor. Also checks that the placenta has been expelled and takes the sow's postpartum temperature.","level5_en":"Can distinguish the causes of dystocia — an oversized piglet, malpresentation, weak straining — and choose the appropriate intervention. Understands that using farrowing drugs before the birth canal is sufficiently dilated can injure the sow or cause stillbirths, and always verifies dilation and observes the dosage. Uses farrowing records (numbers born and stillborn, duration, assistance given) to review performance and plan the next farrowing management, and can teach new staff how to judge when to assist and how to perform the technique.","name_vi":"Hỗ trợ đỡ đẻ (thời điểm hỗ trợ, xử lý khi đẻ khó, ghi chép chính xác về ca đẻ)","kanten_vi":"Có theo dõi ca đẻ với sự chú ý đến khoảng cách giữa các lần đẻ, phân biệt đẻ khó, kiểm tra đường sinh và kéo lợn con ra, thực hiện xử lý đẻ và dùng thuốc theo quy định, ghi chép — một cách sạch sẽ và chính xác không.","level1_vi":"Không theo dõi tiến trình đẻ, lợn con bị kẹt trong đường sinh cũng không nhận ra. Không khử trùng tay, không dùng chất bôi trơn mà đưa tay vào đường sinh, kéo mạnh — thao tác nguy hiểm và cẩu thả. Cũng không ghi chép số con đẻ ra và số con chết lưu.","level2_vi":"Nếu có chỉ dẫn thì theo dõi được ca đẻ, nhưng không đo chính xác khoảng cách giữa các lần đẻ, hay chậm nhận ra đẻ khó. Việc có cần hỗ trợ hay không phó mặc cho người khác, không tự phán đoán được cách dùng thuốc hỗ trợ đẻ theo quy định, ghi chép cũng nhiều thiếu sót.","level3_vi":"Nếu có chỉ dẫn thì theo dõi và đo khoảng cách giữa các lần đẻ, làm được một loạt thao tác: lau nhớt ở miệng và mũi, lau khô bằng khăn, cắt dây rốn đúng độ dài và khử trùng. Ghi chép đúng số con sinh ra còn sống, số con chết lưu, số thai gỗ; báo cáo được khi nghi đẻ khó do khoảng cách đẻ kéo dài.","level4_vi":"Dù không có chỉ dẫn vẫn theo dõi và đo thời gian ca đẻ; nếu khoảng cách giữa các lần đẻ dài hơn bình thường thì nghi đẻ khó. Trước tiên cho lợn nái đứng dậy và đổi tư thế; nếu không cải thiện thì đeo găng tay dài sạch, dùng chất bôi trơn, kiểm tra đường sinh, kéo lợn con ra cẩn thận theo nhịp rặn của lợn nái. Nếu không có lợn con trong đường sinh thì dùng thuốc hỗ trợ đẻ theo quy định và theo dõi; nếu vẫn không đẻ thì liên lạc cấp trên. Kiểm tra cả nhau thai đã ra chưa và thân nhiệt sau đẻ.","level5_vi":"Phân biệt được nguyên nhân đẻ khó (lợn con quá to, tư thế thai xấu, lực rặn yếu) và chọn cách xử lý. Hiểu rằng dùng thuốc hỗ trợ đẻ khi cửa đường sinh chưa mở đủ sẽ gây tổn thương lợn nái và thai chết lưu, nên luôn kiểm tra độ mở và tuân thủ liều lượng. Dùng ghi chép ca đẻ (số con đẻ ra, số chết lưu, thời gian, nội dung hỗ trợ) để xem lại thành tích và quản lý lần đẻ sau, và có thể hướng dẫn cho người mới cách phán đoán và kỹ thuật hỗ trợ.","name_id":"Penanganan bantuan melahirkan (waktu membantu, penanganan saat melahirkan sulit, ketepatan catatan kelahiran)","kanten_id":"Apakah dapat mengawasi jalannya kelahiran dengan memperhatikan jarak waktu antar kelahiran, mengenali melahirkan sulit, memeriksa jalan lahir dan menarik keluar anak babi, melakukan penanganan kelahiran dan pemakaian obat yang sudah ditentukan, serta mencatat, dengan bersih dan tepat.","level1_id":"Tidak mengawasi jalannya kelahiran, tidak sadar anak babi tersangkut di jalan lahir. Memasukkan tangan ke jalan lahir tanpa disinfeksi tangan dan tanpa pelumas, menarik dengan paksa, dan perlakuan lain yang kasar dan berbahaya. Tidak mencatat jumlah lahir dan jumlah lahir mati.","level2_id":"Jika diberi petunjuk, dapat mengawasi kelahiran, tetapi tidak dapat menghitung jarak waktu antar kelahiran dengan tepat, sehingga sering terlambat mengenali melahirkan sulit. Perlu tidaknya bantuan bergantung pada orang lain, tidak dapat menentukan sendiri cara pakai obat kelahiran yang ditentukan, dan catatannya banyak yang bolong.","level3_id":"Jika diberi petunjuk, dapat mengawasi sambil menghitung jarak waktu antar kelahiran, dan melakukan satu rangkaian kerja: membersihkan lendir di mulut dan hidung, mengelap dengan handuk kering, memotong tali pusar dengan panjang yang tepat dan mendisinfeksinya. Dapat mencatat dengan benar jumlah lahir hidup, jumlah lahir mati, dan jumlah fetus mumifikasi, serta melapor jika jarak antar kelahiran terlalu lama (dicurigai melahirkan sulit).","level4_id":"Tanpa diberi petunjuk pun mengawasi sambil menghitung jarak kelahiran. Jika jaraknya terlalu lama dari biasanya, curiga melahirkan sulit. Pertama mendorong induk babi berdiri dan mengubah posisinya. Jika tidak membaik, memakai sarung tangan panjang yang bersih dan pelumas, memeriksa jalan lahir, dan menarik anak babi pelan-pelan mengikuti dorongan (ejan) induk. Jika tidak ada anak babi di jalan lahir, memakai obat kelahiran yang ditentukan dan mengamati; jika tetap tidak lahir, menghubungi atasan. Juga memeriksa apakah ari-ari (plasenta) sudah keluar dan suhu tubuh setelah melahirkan.","level5_id":"Dapat membedakan penyebab melahirkan sulit (anak babi terlalu besar, posisi janin buruk, dorongan induk lemah) dan memilih penanganannya. Paham bahwa memakai obat kelahiran sebelum mulut jalan lahir cukup terbuka dapat melukai induk dan menyebabkan lahir mati, sehingga selalu memeriksa bukaan dan mematuhi dosis. Memanfaatkan catatan kelahiran (jumlah lahir, jumlah lahir mati, lama waktu, isi bantuan) untuk meninjau hasil dan pengelolaan kelahiran berikutnya, dan dapat mengajari karyawan baru cara menilai perlunya bantuan dan tekniknya."},{"no":"分-3","name":"子豚のケア（初乳給与、去勢・歯切り・断尾・体重測定などの処置）","kanten":"生まれたばかりの子豚に初乳を与えて保温し、鉄分の補給・歯切り・尾の処置・去勢などを、適切な時期に清潔かつ正確に行えるか。","level1":"初乳を飲めていない弱い子豚への対応や、保温場所の用意をおろそかにする。鉄分の補給や歯切りを指示されても行えず、あるいは不潔で雑な手技により出血や事故を生じさせる。","level2":"指示があれば処置の一部は行えるが、初乳の摂取確認のもれや、鉄分の注入部位・量、去勢時期の誤りが多い。処置の可否や順序は他者まかせ。","level3":"指示があれば、出生後できるだけ早く初乳の摂取を介助し、適切な時期に鉄分の注射を後肢に行い、とがった歯の歯切り・必要に応じた尾の処置・時期を見た去勢をひと通り行える。へその緒を消毒し、保温場所を確かめられる。","level4":"指示がなくても、各子豚が初乳を十分に飲めているかを腹部のふくらみで確かめ、飲めない小さい子豚には分けて与える。初乳が不十分だと離乳前の死亡が大きく増えると理解し、処置の際は器具の消毒・出血の抑制を徹底し、去勢には痛みをやわらげる処置を併せるなど、適切な初期対応ができる。","level5":"各処置の意味（病気から守る力を得る・乳首の損傷を防ぐ・闘争による傷を防ぐ）を、子豚は出生後まもなく母乳の重要な成分を取り込む力を失うといった知識で理解し、子豚の状態を見て処置の順序や実施の可否を判断・微調整できる。体重の測定値や処置の記録を残して小さい子豚の育成方針を定め、清潔で安全な手技を新人に指導できる。","name_en":"Piglet care (colostrum intake, castration, teeth clipping, tail docking, weighing, and other procedures)","kanten_en":"Can ensure newborn piglets receive colostrum and are kept warm, and perform iron supplementation, teeth clipping, tail docking, and castration at the appropriate time, cleanly and accurately.","level1_en":"Neglects weak piglets that are not getting colostrum and fails to prepare a warm creep area. Cannot perform iron supplementation or teeth clipping even when instructed, or causes bleeding and injuries through unhygienic, careless technique.","level2_en":"With guidance, can perform some procedures, but often fails to confirm colostrum intake and makes frequent mistakes in the iron injection site and dose or the timing of castration. Relies on others to decide whether and in what order procedures should be done.","level3_en":"With guidance, helps piglets take colostrum as soon as possible after birth, gives iron injections into the hind leg at the appropriate time, and can perform the full set of procedures: clipping sharp teeth, tail docking as needed, and castration at the right age. Can disinfect the umbilical cord and check the warming area.","level4_en":"Without guidance, checks that each piglet has drunk enough colostrum by the fullness of its belly, and split-suckles small piglets that cannot drink enough. Understands that insufficient colostrum greatly increases pre-weaning mortality; during procedures, thoroughly disinfects instruments and controls bleeding, and gives appropriate initial care such as combining castration with pain relief.","level5_en":"Understands the purpose of each procedure (gaining protection against disease, preventing teat injuries, preventing fight wounds) backed by knowledge such as the fact that piglets lose the ability to absorb the key components of colostrum shortly after birth, and can judge and fine-tune the order and appropriateness of procedures based on each piglet's condition. Keeps weighing and treatment records to set rearing plans for small piglets, and can teach new staff clean, safe technique.","name_vi":"Chăm sóc lợn con (cho bú sữa non, thiến, cắt răng, cắt đuôi, đo cân nặng, v.v.)","kanten_vi":"Có cho lợn con mới sinh bú sữa non và giữ ấm, thực hiện bổ sung sắt, cắt răng, xử lý đuôi, thiến — đúng thời điểm, sạch sẽ và chính xác không.","level1_vi":"Bỏ bê việc xử lý lợn con yếu chưa bú được sữa non và việc chuẩn bị chỗ giữ ấm. Được chỉ dẫn bổ sung sắt hay cắt răng cũng không làm được, hoặc thao tác bẩn và cẩu thả gây chảy máu, tai nạn.","level2_vi":"Nếu có chỉ dẫn thì làm được một phần công việc, nhưng hay bỏ sót kiểm tra bú sữa non, sai vị trí và lượng tiêm sắt, sai thời điểm thiến. Việc có làm hay không và thứ tự làm phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì hỗ trợ lợn con bú sữa non càng sớm càng tốt sau khi sinh, tiêm sắt vào chân sau đúng thời điểm, cắt răng nhọn, xử lý đuôi khi cần, thiến đúng thời điểm — làm được một loạt. Khử trùng dây rốn, kiểm tra được chỗ giữ ấm.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra từng lợn con có bú đủ sữa non không qua độ căng của bụng; lợn con nhỏ không bú được thì cho bú riêng. Hiểu rằng thiếu sữa non làm số lợn con chết trước cai sữa tăng mạnh; khi xử lý luôn khử trùng dụng cụ, hạn chế chảy máu, khi thiến kết hợp biện pháp giảm đau — làm được đối ứng ban đầu phù hợp.","level5_vi":"Hiểu ý nghĩa của từng công việc (giúp có sức đề kháng bệnh, tránh tổn thương vú mẹ, tránh vết thương do cắn nhau) bằng kiến thức như lợn con mất khả năng hấp thu thành phần quan trọng của sữa mẹ không lâu sau khi sinh; nhìn trạng thái lợn con để phán đoán và điều chỉnh thứ tự, việc có làm hay không. Ghi lại số đo cân nặng và nội dung xử lý để định hướng nuôi lợn con nhỏ, và hướng dẫn cho người mới thao tác sạch sẽ, an toàn.","name_id":"Perawatan anak babi (pemberian kolostrum, kastrasi, memotong gigi, memotong ekor, penimbangan berat badan, dll.)","kanten_id":"Apakah dapat memberi kolostrum (susu pertama) dan menghangatkan anak babi yang baru lahir, serta melakukan pemberian zat besi, memotong gigi, penanganan ekor, dan kastrasi pada waktu yang tepat, dengan bersih dan tepat.","level1_id":"Mengabaikan anak babi lemah yang belum minum kolostrum dan tidak menyiapkan tempat penghangat. Tidak dapat memberi zat besi atau memotong gigi walau disuruh, atau menimbulkan pendarahan dan kecelakaan karena cara kerja yang kotor dan kasar.","level2_id":"Jika diberi petunjuk, dapat melakukan sebagian penanganan, tetapi sering lupa memastikan anak babi sudah minum kolostrum, dan sering salah tempat suntik dan jumlah zat besi atau waktu kastrasi. Boleh tidaknya dan urutan penanganan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat membantu anak babi minum kolostrum sesegera mungkin setelah lahir, menyuntikkan zat besi di kaki belakang pada waktu yang tepat, memotong gigi yang tajam, menangani ekor jika perlu, dan melakukan kastrasi pada waktunya, secara lengkap. Dapat mendisinfeksi tali pusar dan memastikan tempat penghangat.","level4_id":"Tanpa diberi petunjuk pun memastikan tiap anak babi cukup minum kolostrum dengan melihat kembung perutnya, dan memberi minum terpisah untuk anak babi kecil yang tidak bisa minum. Paham bahwa kolostrum yang kurang membuat kematian sebelum sapih naik banyak. Saat penanganan, selalu mendisinfeksi alat dan menekan pendarahan, serta menambahkan penanganan pengurang rasa sakit saat kastrasi. Dapat melakukan penanganan awal yang tepat.","level5_id":"Paham arti tiap penanganan (mendapat daya tahan terhadap penyakit, mencegah luka puting induk, mencegah luka karena berkelahi) dengan pengetahuan bahwa anak babi tidak lama setelah lahir kehilangan kemampuan menyerap zat penting dari susu induk. Dapat menilai dan menyesuaikan urutan serta boleh tidaknya penanganan sesuai kondisi anak babi. Menyimpan catatan berat badan dan penanganan untuk menentukan cara membesarkan anak babi kecil, dan dapat mengajari karyawan baru teknik yang bersih dan aman."},{"no":"分-4","name":"哺乳・離乳管理（人工哺乳、里子調整、離乳作業の段取り）","kanten":"出生頭数と、利用できる乳首の数・体重の釣り合いを見て、ほかの母豚への預け（里子）・人工乳による育成を調整し、離乳作業を正しい段取りで進められるか。","level1":"乳首にあぶれた子豚を放置し、里子に出す・人工乳で育てる必要に気づかない。人工乳の温度や量も適当で、離乳作業も指示がなければ動けない。","level2":"指示があれば里子付けや人工乳の手伝いはできるが、実施時期や対象の選び方を誤りやすく見落としが多い。離乳の時期や体重の目安を理解しておらず、段取りは他者まかせ。","level3":"指示があれば、利用できる乳首の数を超えてあまった子豚をほかの母豚に預け、人工乳を適温に温めて適切な間隔・量で与えられる。離乳に適した時期と体重を目安に作業をひと通り進められる。","level4":"指示がなくても子豚の体重を見て、各母豚につく子豚の体重がそろうよう振り分け、里子は初乳を与えたあとできるだけ早く、分娩時期の近い母豚につける段取りを自ら組む。移す子豚に預け先のにおいをつける、乳の飲みや体重の増え方を見て定着するまで確かめるなど、先回りした対応ができる。","level5":"里子・人工乳・離乳の各判断を、乳の出のピークを過ぎると子豚に乳が不足することや、子豚の入れ替えが過多だと病気を広げやすいことといった知識で裏づけ、調整を最小限に抑えて最適化できる。離乳は母豚を移して子豚は慣れた場所に残すなどでストレスを抑える工夫をし、離乳後の下痢の予防まで見越して記録・改善し、段取りを新人に指導できる。","name_en":"Nursing and weaning management (artificial rearing, cross-fostering, weaning procedures)","kanten_en":"Can balance the number of piglets born against the number of functional teats and piglet weights, arrange cross-fostering to other sows and rearing on milk replacer, and carry out weaning work in the correct sequence.","level1_en":"Leaves piglets that cannot get a teat unattended and does not recognize the need for cross-fostering or milk-replacer rearing. Milk replacer temperature and amounts are haphazard, and does not act on weaning tasks without instructions.","level2_en":"With guidance, can help with cross-fostering and milk replacer feeding, but often mistakes the timing or which piglets to select, with many oversights. Does not understand the target weaning age and weight, and relies on others for the sequence of work.","level3_en":"With guidance, can foster surplus piglets exceeding the number of functional teats onto other sows, and feed milk replacer warmed to the right temperature at appropriate intervals and amounts. Can carry out the weaning work based on the standard weaning age and weight.","level4_en":"Without guidance, checks piglet weights and allocates them so that the piglets on each sow are even in weight; arranges fostering as soon as possible after colostrum intake, onto sows that farrowed around the same time. Takes proactive steps such as rubbing the receiving litter's scent onto transferred piglets and monitoring milk intake and weight gain until they settle in.","level5_en":"Grounds each fostering, artificial rearing, and weaning decision in knowledge — for example, that milk becomes insufficient for piglets after peak lactation, and that excessive piglet movement spreads disease — and optimizes while keeping interventions to a minimum. Reduces weaning stress by, for example, moving the sow while leaving piglets in the familiar pen, anticipates post-weaning diarrhea through records and improvements, and can teach the workflow to new staff.","name_vi":"Quản lý bú sữa và cai sữa (cho bú nhân tạo, điều chỉnh ghép bầy, sắp xếp công việc cai sữa)","kanten_vi":"Có nhìn sự cân đối giữa số con đẻ ra với số vú dùng được và cân nặng, điều chỉnh việc ghép bầy (cho nái khác nuôi) và nuôi bằng sữa nhân tạo, tiến hành công việc cai sữa đúng trình tự không.","level1_vi":"Bỏ mặc lợn con không tranh được vú, không nhận ra sự cần thiết phải ghép bầy hoặc nuôi bằng sữa nhân tạo. Nhiệt độ và lượng sữa nhân tạo cũng tùy tiện; công việc cai sữa nếu không có chỉ dẫn thì không làm.","level2_vi":"Nếu có chỉ dẫn thì giúp được việc ghép bầy và cho uống sữa nhân tạo, nhưng dễ sai thời điểm thực hiện và chọn sai đối tượng, nhiều bỏ sót. Không hiểu thời điểm và cân nặng chuẩn để cai sữa; sắp xếp công việc phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì đưa lợn con thừa so với số vú dùng được sang lợn nái khác nuôi, hâm sữa nhân tạo đến nhiệt độ thích hợp và cho uống đúng khoảng cách, đúng lượng. Tiến hành được một loạt công việc theo thời điểm và cân nặng thích hợp để cai sữa.","level4_vi":"Dù không có chỉ dẫn vẫn nhìn cân nặng lợn con để chia sao cho cân nặng các con theo mỗi nái đồng đều; tự sắp xếp việc ghép bầy càng sớm càng tốt sau khi cho bú sữa non, ghép vào nái có thời gian đẻ gần nhau. Làm được các đối ứng đón đầu như bôi mùi của bầy nhận lên lợn con chuyển sang, theo dõi việc bú và mức tăng cân cho đến khi lợn con quen bầy.","level5_vi":"Củng cố các phán đoán về ghép bầy, sữa nhân tạo, cai sữa bằng kiến thức như: qua đỉnh tiết sữa thì lợn con sẽ thiếu sữa, hay xáo trộn lợn con quá nhiều dễ làm lây lan bệnh — tối ưu hóa với sự điều chỉnh ít nhất. Khi cai sữa có cách giảm stress như chuyển lợn nái đi và để lợn con ở lại chỗ quen; nhìn trước cả việc phòng tiêu chảy sau cai sữa để ghi chép, cải thiện, và hướng dẫn cách sắp xếp công việc cho người mới.","name_id":"Pengelolaan menyusui dan sapih (pemberian susu buatan, pengaturan titip anak ke induk lain, urutan kerja sapih)","kanten_id":"Apakah dapat melihat keseimbangan antara jumlah anak lahir, jumlah puting yang bisa dipakai, dan berat badan, mengatur titip anak ke induk lain dan pembesaran dengan susu buatan, serta menjalankan pekerjaan sapih dengan urutan yang benar.","level1_id":"Membiarkan anak babi yang tidak kebagian puting, tidak sadar perlunya titip anak ke induk lain atau membesarkan dengan susu buatan. Suhu dan jumlah susu buatan asal-asalan, dan tidak bergerak untuk pekerjaan sapih kalau tidak disuruh.","level2_id":"Jika diberi petunjuk, dapat membantu titip anak dan memberi susu buatan, tetapi sering salah waktu pelaksanaan dan pemilihan anak, banyak yang terlewat. Tidak paham waktu dan patokan berat badan untuk sapih, urutan kerja bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat menitipkan anak babi yang melebihi jumlah puting yang bisa dipakai ke induk lain, menghangatkan susu buatan sampai suhu yang pas dan memberikannya dengan jarak waktu dan jumlah yang tepat. Dapat menjalankan pekerjaan sapih secara lengkap dengan patokan waktu dan berat badan yang cocok untuk sapih.","level4_id":"Tanpa diberi petunjuk pun melihat berat anak babi dan membaginya supaya berat anak pada tiap induk seimbang. Menyusun sendiri urutannya: titip anak dilakukan sesegera mungkin setelah anak minum kolostrum, ke induk yang waktu melahirkannya berdekatan. Dapat bertindak lebih dulu, seperti memberi bau induk penerima pada anak yang dipindah, dan memantau minum susu serta pertambahan berat sampai anak menetap.","level5_id":"Dapat mendasari tiap keputusan titip anak, susu buatan, dan sapih dengan pengetahuan bahwa setelah puncak produksi susu anak babi akan kekurangan susu, dan bahwa terlalu banyak memindah anak mudah menyebarkan penyakit, sehingga pengaturan ditekan seminimal mungkin. Mengurangi stres saat sapih, misalnya dengan memindahkan induk dan membiarkan anak tetap di tempat yang sudah biasa. Melihat sampai pencegahan diare setelah sapih, mencatat dan memperbaiki, dan dapat mengajari karyawan baru urutan kerjanya."},{"no":"分-5","name":"衛生管理・消毒（豚房清掃、器具消毒、防疫意識）","kanten":"分娩用の囲いや器具を正しい手順で洗浄・消毒し、人や物の動線と、病気を持ち込まない意識をもって清潔を保てるか。","level1":"糞や汚れが残ったまま消毒液をまく、希釈や作用時間を守らないなど、効果のない雑な手順をとる。器具を使い回し、汚れた場所からきれいな場所へ逆行するなど、防疫の意識がない。","level2":"指示があれば清掃・消毒はある程度できるが、洗浄が不十分・乾燥の手順を省く・消毒液の希釈を誤ることが多い。何をどの順で消毒するかは他者まかせ。","level3":"指示があれば「糞を取る→粗洗い→つけ置き→高圧洗浄→乾燥→消毒→乾燥」の手順で囲いを洗浄・消毒し、分娩用器具を消毒液で消毒できる。作業着・長靴の着用、手指の消毒など、基本の清潔な動作ができる。","level4":"指示がなくても、汚れが残ると消毒が効かないと理解し、高圧で隅々まで洗い、十分に乾燥させてから消毒する。母豚を入れる前に空ける期間をとり、きれいな場所（分娩舎）から汚れた場所への一方通行を自ら守って、汚れの往来を防ぐ。","level5":"消毒液の特性（汚れがあると効かない・効きにくい病原がある 等）と、対象の病原・温度・作用時間をふまえて、薬剤と希釈を選べる。豚を全頭出して洗浄・消毒し、まとめて入れ替える方式を計画的に運用し、消毒記録（日時・薬剤・濃度）を残して効果を検証し、防疫の手順を新人に指導できる。","name_en":"Hygiene and disinfection (pen cleaning, instrument disinfection, biosecurity awareness)","kanten_en":"Can wash and disinfect farrowing pens and instruments in the correct sequence, and maintain cleanliness with awareness of the flow of people and materials and of not bringing in disease.","level1_en":"Sprays disinfectant over remaining manure and dirt, and ignores dilution rates and contact times — ineffective, careless procedures. Reuses instruments and moves backward from dirty areas to clean areas, showing no biosecurity awareness.","level2_en":"With guidance, can clean and disinfect to some extent, but often washes insufficiently, skips the drying step, or misdilutes disinfectant. Relies on others to decide what to disinfect and in what order.","level3_en":"With guidance, washes and disinfects pens following the sequence 'remove manure → pre-rinse → soak → high-pressure wash → dry → disinfect → dry,' and disinfects farrowing instruments in disinfectant solution. Performs basic hygiene practices such as wearing work clothes and boots and disinfecting hands.","level4_en":"Without guidance, understands that disinfection does not work where dirt remains; washes every corner at high pressure and dries thoroughly before disinfecting. Allows a downtime period before introducing sows, and follows one-way movement from clean areas (farrowing house) to dirty areas on their own to prevent cross-contamination.","level5_en":"Can select disinfectants and dilutions based on their properties (inactivated by organic matter, pathogens that are harder to kill, etc.) and on the target pathogen, temperature, and contact time. Systematically operates the all-in/all-out method of removing all pigs, washing and disinfecting, and restocking together; keeps disinfection records (date/time, product, concentration) to verify effectiveness; and can teach biosecurity procedures to new staff.","name_vi":"Quản lý vệ sinh, khử trùng (dọn ô chuồng lợn, khử trùng dụng cụ, ý thức phòng dịch)","kanten_vi":"Có rửa và khử trùng ô đẻ và dụng cụ theo đúng trình tự, giữ sạch sẽ với ý thức về đường đi của người và đồ vật, không mang mầm bệnh vào không.","level1_vi":"Rắc thuốc khử trùng khi phân và vết bẩn còn sót, không tuân thủ độ pha loãng và thời gian tác dụng — làm theo cách cẩu thả không hiệu quả. Dùng chung dụng cụ, đi ngược từ chỗ bẩn sang chỗ sạch — không có ý thức phòng dịch.","level2_vi":"Nếu có chỉ dẫn thì dọn dẹp và khử trùng được phần nào, nhưng hay rửa chưa sạch, bỏ qua bước làm khô, pha loãng thuốc khử trùng sai. Việc khử trùng cái gì theo thứ tự nào phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì rửa và khử trùng ô chuồng theo trình tự \"dọn phân → rửa sơ → ngâm → rửa áp lực cao → làm khô → khử trùng → làm khô\", khử trùng dụng cụ đỡ đẻ bằng dung dịch khử trùng. Làm được các động tác sạch sẽ cơ bản như mặc quần áo lao động, đi ủng cao su, sát khuẩn tay.","level4_vi":"Dù không có chỉ dẫn vẫn hiểu rằng còn bẩn thì khử trùng không hiệu quả; rửa kỹ mọi ngóc ngách bằng áp lực cao, làm khô đầy đủ rồi mới khử trùng. Để trống chuồng một thời gian trước khi đưa lợn nái vào, tự tuân thủ đường đi một chiều từ chỗ sạch (chuồng đẻ) sang chỗ bẩn, ngăn vết bẩn qua lại.","level5_vi":"Hiểu đặc tính của thuốc khử trùng (còn bẩn thì mất tác dụng, có mầm bệnh khó diệt, v.v.) và chọn được thuốc, độ pha loãng theo mầm bệnh, nhiệt độ, thời gian tác dụng. Vận hành có kế hoạch phương thức đưa toàn bộ lợn ra để rửa - khử trùng rồi thay cả loạt; lưu ghi chép khử trùng (ngày giờ, thuốc, nồng độ) để kiểm chứng hiệu quả và hướng dẫn quy trình phòng dịch cho người mới.","name_id":"Pengelolaan kebersihan dan disinfeksi (pembersihan petak kandang, disinfeksi alat, kesadaran biosekuriti)","kanten_id":"Apakah dapat mencuci dan mendisinfeksi petak kandang beranak dan alat dengan urutan yang benar, serta menjaga kebersihan dengan kesadaran akan alur gerak orang dan barang, dan kesadaran tidak membawa masuk penyakit.","level1_id":"Menyemprot cairan disinfektan dengan kotoran masih menempel, tidak mematuhi pengenceran dan waktu kontak — cara kerja asal yang tidak ada efeknya. Memakai alat bergantian tanpa dicuci, bergerak balik dari tempat kotor ke tempat bersih — tidak punya kesadaran biosekuriti.","level2_id":"Jika diberi petunjuk, dapat membersihkan dan mendisinfeksi seadanya, tetapi sering mencuci kurang bersih, melewati langkah pengeringan, atau salah pengenceran disinfektan. Apa yang didisinfeksi dan urutannya bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat mencuci dan mendisinfeksi petak kandang dengan urutan: ambil kotoran → cuci kasar → rendam → cuci tekanan tinggi → keringkan → disinfeksi → keringkan, dan mendisinfeksi alat kelahiran dengan cairan disinfektan. Dapat melakukan tindakan bersih dasar: memakai baju kerja dan sepatu bot karet, serta disinfeksi tangan.","level4_id":"Tanpa diberi petunjuk pun paham bahwa disinfeksi tidak berhasil jika kotoran masih tersisa, mencuci sampai sudut-sudut dengan tekanan tinggi, dan mendisinfeksi setelah benar-benar kering. Memberi masa kosong sebelum induk babi dimasukkan, dan mematuhi sendiri arus satu arah dari tempat bersih (kandang beranak) ke tempat kotor, mencegah kotoran bolak-balik.","level5_id":"Dapat memilih obat dan pengenceran berdasarkan sifat disinfektan (tidak mempan jika ada kotoran, ada kuman yang sulit dibasmi, dll.), kuman sasaran, suhu, dan waktu kontak. Menjalankan secara terencana cara mengeluarkan semua babi untuk mencuci-mendisinfeksi lalu memasukkan sekaligus. Menyimpan catatan disinfeksi (tanggal, obat, kepekatan) untuk menguji hasilnya, dan dapat mengajari karyawan baru urutan biosekuriti."},{"no":"分-6","name":"環境管理（温度・湿度・換気・保温灯の調整）","kanten":"母豚と子豚で適温が異なることをふまえ、保温灯・換気・冷却の工夫を、季節と子豚の発育に合わせて調整できるか。","level1":"保温灯をつけ忘れる、母豚向けと子豚向けの適温の違いを理解せず放置する。すきま風・換気の不良・刺激臭のガスに気づかず、子豚の寒さや母豚の暑さを見落とす。","level2":"指示があれば保温灯のオンオフや温度の確認はできるが、設定の目安があいまいで見落としが多い。換気量や湿度の調整、暑熱・寒冷への対応の判断は他者まかせ。","level3":"指示があれば、母豚のいる場所と子豚の保温場所のそれぞれの適温を目安に保温灯やヒーターを調整し、温度計を確かめられる。強い臭気やすきま風など、目視・体感できる異常に気づける。","level4":"指示がなくても、子豚の保温灯やマットを発育につれて段階的に弱め、天候に合わせて温度を調整する。子豚の集まり方（寒いと密集、暑いと分散）や呼吸の様子から寒暑を読み取り、暑い時は母豚に水を垂らして冷やす、寒い時は風を防いで温めるなど、適切な初期対応ができる。換気は臭気がこもらないよう配慮する。","level5":"子豚は冷えやすく、授乳中の母豚は体が熱くなりやすいという相反する要求を両立させる重要性を理解し、保温・換気・冷却のバランスを微調整できる。暑熱の程度や母豚の呼吸（速く浅い呼吸は暑熱に注意）を目安に対策を強め、設定や記録を残して改善し、適切な温度管理の考え方を新人に指導できる。","name_en":"Environmental management (temperature, humidity, ventilation, heat lamp adjustment)","kanten_en":"Understanding that sows and piglets require different temperatures, can adjust heat lamps, ventilation, and cooling measures according to the season and piglet growth.","level1_en":"Forgets to turn on heat lamps and leaves things unattended without understanding the different temperature needs of sows and piglets. Fails to notice drafts, poor ventilation, or pungent gases, and overlooks cold piglets and overheated sows.","level2_en":"With guidance, can switch heat lamps on and off and check the temperature, but the target settings are vague and much is overlooked. Relies on others for adjusting ventilation and humidity and for responding to heat and cold.","level3_en":"With guidance, adjusts heat lamps and heaters based on the target temperatures for the sow area and the piglet creep area, and checks the thermometer. Notices abnormalities that can be seen or felt, such as strong odors and drafts.","level4_en":"Without guidance, gradually reduces the piglets' heat lamps and mats as they grow and adjusts temperature to the weather. Reads heat and cold from how piglets gather (huddling when cold, spreading out when hot) and from their breathing, and gives appropriate first responses such as dripping water on sows when hot and blocking drafts and warming when cold. Manages ventilation so odors do not build up.","level5_en":"Understands the importance of reconciling the opposing needs of chilling-prone piglets and heat-prone lactating sows, and can fine-tune the balance of warming, ventilation, and cooling. Strengthens countermeasures based on the severity of heat and the sow's respiration (rapid shallow breathing warns of heat stress), keeps settings and records for improvement, and can teach new staff the principles of proper temperature management.","name_vi":"Quản lý môi trường (điều chỉnh nhiệt độ, độ ẩm, thông gió, đèn sưởi ấm)","kanten_vi":"Có hiểu rằng nhiệt độ thích hợp của lợn nái và lợn con khác nhau, và điều chỉnh đèn sưởi ấm, thông gió, cách làm mát theo mùa và sự phát triển của lợn con không.","level1_vi":"Quên bật đèn sưởi ấm, không hiểu sự khác nhau giữa nhiệt độ thích hợp cho lợn nái và cho lợn con mà bỏ mặc. Không nhận ra gió lùa, thông gió kém, khí có mùi hắc; bỏ sót lợn con bị lạnh và lợn nái bị nóng.","level2_vi":"Nếu có chỉ dẫn thì bật tắt được đèn sưởi ấm và kiểm tra nhiệt độ, nhưng mức cài đặt còn mơ hồ và nhiều bỏ sót. Việc điều chỉnh lượng thông gió, độ ẩm và phán đoán ứng phó nóng - lạnh phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì điều chỉnh đèn sưởi ấm và máy sưởi theo nhiệt độ thích hợp cho chỗ lợn nái và chỗ giữ ấm lợn con, kiểm tra được nhiệt kế. Nhận ra được các bất thường nhìn thấy và cảm nhận được như mùi hôi nồng, gió lùa.","level4_vi":"Dù không có chỉ dẫn vẫn giảm dần đèn sưởi ấm và thảm sưởi của lợn con theo sự phát triển, điều chỉnh nhiệt độ theo thời tiết. Đọc được nóng - lạnh từ cách lợn con tụ tập (lạnh thì chụm lại, nóng thì tản ra) và cách thở; làm được đối ứng ban đầu phù hợp như khi nóng thì nhỏ nước làm mát lợn nái, khi lạnh thì chắn gió giữ ấm. Chú ý thông gió để mùi hôi không tích tụ.","level5_vi":"Hiểu tầm quan trọng của việc dung hòa hai yêu cầu trái ngược — lợn con dễ bị lạnh, lợn nái đang cho con bú dễ bị nóng — và tinh chỉnh được cân bằng giữ ấm, thông gió, làm mát. Dựa vào mức độ nóng và cách thở của lợn nái (thở nhanh và nông là dấu hiệu cần chú ý nóng) để tăng cường biện pháp, lưu lại cài đặt và ghi chép để cải thiện, hướng dẫn cho người mới cách suy nghĩ về quản lý nhiệt độ.","name_id":"Pengelolaan lingkungan (pengaturan suhu, kelembapan, ventilasi, lampu pemanas)","kanten_id":"Apakah dapat, dengan memahami bahwa suhu nyaman induk babi dan anak babi berbeda, mengatur lampu pemanas, ventilasi, dan pendinginan sesuai musim dan pertumbuhan anak babi.","level1_id":"Lupa menyalakan lampu pemanas, tidak paham beda suhu nyaman untuk induk dan anak babi lalu membiarkannya. Tidak sadar ada angin dari celah, ventilasi buruk, atau gas berbau menyengat, dan melewatkan anak babi kedinginan atau induk kepanasan.","level2_id":"Jika diberi petunjuk, dapat menyalakan-mematikan lampu pemanas dan memeriksa suhu, tetapi patokan pengaturannya samar dan banyak yang terlewat. Pengaturan jumlah ventilasi dan kelembapan serta penanganan panas dan dingin bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat mengatur lampu pemanas dan pemanas dengan patokan suhu nyaman masing-masing untuk tempat induk dan tempat penghangat anak babi, serta memeriksa termometer. Dapat menyadari kelainan yang bisa dilihat dan dirasakan, seperti bau menyengat dan angin dari celah.","level4_id":"Tanpa diberi petunjuk pun melemahkan lampu pemanas dan alas hangat anak babi secara bertahap sesuai pertumbuhan, dan mengatur suhu sesuai cuaca. Membaca dingin-panas dari cara anak babi berkumpul (dingin = menumpuk rapat, panas = menyebar) dan cara bernapasnya, lalu melakukan penanganan awal yang tepat: meneteskan air ke badan induk saat panas, menahan angin dan menghangatkan saat dingin. Menjaga ventilasi supaya bau tidak mengendap.","level5_id":"Paham pentingnya menyeimbangkan dua kebutuhan yang bertolak belakang — anak babi mudah kedinginan dan induk yang menyusui badannya mudah panas — dan dapat menyetel halus keseimbangan penghangatan, ventilasi, dan pendinginan. Memperkuat penanganan dengan patokan tingkat panas dan napas induk (napas cepat dan dangkal = waspada kepanasan), menyimpan pengaturan dan catatan untuk perbaikan, dan dapat mengajari karyawan baru cara berpikir pengaturan suhu yang tepat."},{"no":"分-7","name":"異常の早期発見と報告（疾病・事故・死亡の早期察知と報連相）","kanten":"母豚・子豚の疾病・負傷・死亡を早期に発見し、緊急度を見極めて、的確に報告・連絡・相談できるか。","level1":"高熱・耳や皮膚の紫色化・急死・圧死・新生子豚の下痢などの異常を見ても気づかない、または気づいても報告せず放置する。後に判明して対応が大きく遅れる。","level2":"指示があれば異常に気づけるが、見落としや報告の遅れが多い。緊急か経過観察かの判断ができず、誰に何を伝えるかも他者まかせで、報告・連絡・相談が不十分。","level3":"指示があれば、明らかな異常（飼料を食べない、高熱、水様の下痢、胎盤の残留、死亡・圧死）を見つけ、上長へ報告できる。目に見える事実を確かめ、伝えるべき内容をひと通り報告できる。","level4":"指示がなくても日頃から見回って早期に異常へ気づき、発熱を疑えば体温を測定し、平常より高ければ分娩後の体調不良を疑うなど、緊急度を見極める。耳や皮膚の紫色化・急死、新生子豚の下痢が同じ腹や隣の囲いに広がるなどの重い兆候は、直ちに上長へ連絡し、隔離・初期対応を併せて行う。","level5":"様子から疾病の可能性を知識で見立て、隔離・手当ての相談・経過観察を自ら判断して動ける。発生事項（日時・症状・頭数・経過）を正しく記録して再発防止・改善につなげ、誰に・何を・どの程度の緊急度で報告すべきかの基準を新人に指導できる。","name_en":"Early detection and reporting of abnormalities (early recognition of disease, accidents, and deaths, and reporting/communication)","kanten_en":"Can detect disease, injury, and death in sows and piglets early, assess the urgency, and report, contact, and consult accurately.","level1_en":"Fails to notice abnormalities such as high fever, purple discoloration of the ears or skin, sudden death, crushing deaths, or diarrhea in newborn piglets — or notices but does not report them, leaving them unaddressed. The problem comes to light later and the response is greatly delayed.","level2_en":"With guidance, can notice abnormalities, but overlooks many and is often slow to report. Cannot judge between urgent and watch-and-wait cases, relies on others for whom to tell and what to say, and reporting and communication are inadequate.","level3_en":"With guidance, can find obvious abnormalities (not eating, high fever, watery diarrhea, retained placenta, deaths and crushing) and report them to the supervisor. Verifies the visible facts and can report the essential information.","level4_en":"Without guidance, makes routine rounds and notices abnormalities early; if fever is suspected, measures the temperature, and if it is above normal, suspects postpartum illness — assessing urgency. For serious signs such as purple ears or skin, sudden death, or newborn diarrhea spreading within the litter or to adjacent pens, contacts the supervisor immediately while also isolating and giving initial care.","level5_en":"Uses knowledge to form a working assessment of possible disease from the animal's appearance, and can independently decide on isolation, consulting about treatment, and follow-up observation. Correctly records events (date/time, symptoms, number affected, course) to drive prevention and improvement, and can teach new staff the criteria for whom to report to, what to report, and with what urgency.","name_vi":"Phát hiện sớm bất thường và báo cáo (phát hiện sớm bệnh, tai nạn, chết; báo cáo - liên lạc - trao đổi)","kanten_vi":"Có phát hiện sớm bệnh, thương tích, chết của lợn nái và lợn con, đánh giá mức độ khẩn cấp, và báo cáo - liên lạc - trao đổi một cách chính xác không.","level1_vi":"Thấy các bất thường như sốt cao, tai và da tím tái, chết đột ngột, bị mẹ đè chết, tiêu chảy ở lợn con sơ sinh cũng không nhận ra, hoặc nhận ra mà không báo cáo, bỏ mặc. Đến khi bị phát hiện sau thì việc đối ứng đã chậm trễ nghiêm trọng.","level2_vi":"Nếu có chỉ dẫn thì nhận ra được bất thường nhưng nhiều bỏ sót và báo cáo chậm. Không phán đoán được là khẩn cấp hay chỉ cần theo dõi, truyền đạt gì cho ai cũng phó mặc cho người khác; báo cáo - liên lạc - trao đổi chưa đầy đủ.","level3_vi":"Nếu có chỉ dẫn thì phát hiện được các bất thường rõ ràng (không ăn thức ăn, sốt cao, tiêu chảy như nước, sót nhau thai, chết, bị đè chết) và báo cáo cấp trên. Kiểm tra sự việc nhìn thấy được và báo cáo được một loạt nội dung cần truyền đạt.","level4_vi":"Dù không có chỉ dẫn vẫn tuần tra thường ngày để nhận ra bất thường sớm; nghi sốt thì đo thân nhiệt, nếu cao hơn bình thường thì nghi bệnh sau khi đẻ — đánh giá được mức độ khẩn cấp. Với dấu hiệu nặng như tai và da tím tái, chết đột ngột, tiêu chảy lợn con sơ sinh lan trong cùng bầy hoặc ô chuồng bên cạnh thì liên lạc cấp trên ngay lập tức, đồng thời thực hiện cách ly và xử lý ban đầu.","level5_vi":"Dùng kiến thức để nhận định khả năng bệnh từ biểu hiện; tự phán đoán và hành động về cách ly, trao đổi cách chăm sóc, theo dõi. Ghi chép đúng sự việc phát sinh (ngày giờ, triệu chứng, số đầu con, diễn biến) để phòng tái phát và cải thiện, hướng dẫn cho người mới tiêu chí báo cáo cho ai, nội dung gì, với mức khẩn cấp nào.","name_id":"Penemuan dini kelainan dan pelaporan (deteksi dini penyakit, kecelakaan, kematian, serta lapor-hubung-konsultasi)","kanten_id":"Apakah dapat menemukan penyakit, luka, dan kematian pada induk atau anak babi sejak dini, menilai tingkat kedaruratannya, dan melapor, menghubungi, serta berkonsultasi dengan tepat.","level1_id":"Melihat kelainan seperti demam tinggi, telinga atau kulit membiru keunguan, mati mendadak, mati tertindih, atau diare anak babi baru lahir, tetapi tidak sadar, atau sadar tetapi tidak melapor dan membiarkannya. Baru ketahuan belakangan sehingga penanganan sangat terlambat.","level2_id":"Jika diberi petunjuk, dapat menyadari kelainan, tetapi banyak yang terlewat dan laporan sering terlambat. Tidak dapat menilai darurat atau cukup dipantau, dan kepada siapa serta apa yang disampaikan bergantung pada orang lain; lapor-hubung-konsultasi belum cukup.","level3_id":"Jika diberi petunjuk, dapat menemukan kelainan yang jelas (tidak makan, demam tinggi, diare cair, ari-ari tertinggal, kematian atau mati tertindih) dan melapor ke atasan. Dapat memastikan fakta yang terlihat dan melaporkan hal-hal yang perlu disampaikan secara lengkap.","level4_id":"Tanpa diberi petunjuk pun berkeliling setiap hari dan menyadari kelainan sejak dini. Jika curiga demam, mengukur suhu tubuh; jika lebih tinggi dari normal, curiga gangguan kesehatan setelah melahirkan — dapat menilai tingkat kedaruratan. Untuk tanda berat seperti telinga atau kulit membiru keunguan, mati mendadak, atau diare anak babi baru lahir yang menyebar ke satu kelahiran atau petak sebelah, langsung menghubungi atasan sambil melakukan isolasi dan penanganan awal.","level5_id":"Dapat memperkirakan kemungkinan penyakit dari gejalanya dengan pengetahuan, dan memutuskan sendiri isolasi, konsultasi penanganan, dan pemantauan. Mencatat kejadian dengan benar (tanggal, gejala, jumlah ekor, perjalanan penyakit) untuk pencegahan terulang dan perbaikan, dan dapat mengajari karyawan baru patokan kepada siapa, apa, dan seberapa darurat harus melapor."}]},{"key":"stall","sheet":"ストール舎","scale":"業務","items":[{"no":"ス-1","name":"発情発見・種付けのタイミング（発情観察、人工授精・交配の的確さとタイミング）","kanten":"母豚の陰部の腫れ・赤み・粘液、他の豚に乗りかかる動き、背中を押すと静止する発情の兆候、雄豚を用いた確認、離乳からの経過日数の記録をふまえ、種付けの適期を見極めて実施できるか。","level1":"母豚の陰部が腫れて赤くなったり粘液が出ても、発情と気づけない。背中を押して静止するか確かめる手順もあいまいで、兆候を見落とす。種付けの時期が判断できず、実施の可否は毎回指示や補助を要する。","level2":"指示があれば陰部の変化や、母豚が他の豚に乗りかかる動きには気づくが、雄豚を近づけて背中を押し、静止するかを確かめる確認が不十分で、一部しか把握できない。種付けの時期の判断は他者任せで、適期を外すことが多い。","level3":"指示があれば朝夕など決まった時間に発情を見回り、陰部の腫れ・粘液や、背中を押すと静止する兆候を確かめられる。指示されたタイミングで一通りの種付け作業ができる。","level4":"指示がなくても、発情の見込み日を周期や離乳からの経過日数で予測し重点的に観察する。静止する兆候を確かめてから適切な間隔をおいて種付けする。初産の母豚と経産の母豚とで適期に差があることをふまえ、雄豚を前に置いて背中を押し、落ち着かせて実施するなど丁寧に行える。","level5":"排卵が発情開始からしばらく経って起こり、経産の母豚では遅くなる体の仕組みを正しく理解する。発情の強さや持続の長さ（初産か経産かで異なる）を見て、種付けの回数や間隔を細かく調整できる。確実な受胎を目標に成績をふまえ自らの手順を見直し、発情の再発する割合や夏場に発情が弱まることも考慮して記録・判断し、同僚や新人に指導できる。","name_en":"Estrus detection and breeding timing (heat observation, accuracy and timing of AI and mating)","kanten_en":"Can identify and act on the optimal breeding time, based on vulvar swelling, redness, and mucus; mounting behavior on other pigs; the standing reflex when back pressure is applied; boar exposure checks; and records of days since weaning.","level1_en":"Does not recognize estrus even when the sow's vulva is swollen and red or discharging mucus. The back-pressure standing test procedure is vague and signs are missed. Cannot judge breeding timing and requires instructions or assistance every time.","level2_en":"With guidance, notices vulvar changes and mounting behavior, but the check of bringing a boar close and applying back pressure to confirm standing is insufficient, so only part of the picture is captured. Relies on others for breeding timing and often misses the optimal window.","level3_en":"With guidance, makes estrus-check rounds at set times such as morning and evening, confirming vulvar swelling and mucus and the standing reflex under back pressure. Can carry out the full breeding procedure at the instructed timing.","level4_en":"Without guidance, predicts expected estrus dates from the cycle and days since weaning and observes those sows intensively. Confirms the standing reflex, then breeds at appropriate intervals. Understands that the optimal timing differs between first-parity (gilt) and multiparous sows, and works carefully — for example, placing a boar in front and applying back pressure to settle the sow before insemination.","level5_en":"Correctly understands the physiology that ovulation occurs some time after the onset of estrus and is later in multiparous sows. Can finely adjust the number and interval of services based on the strength and duration of estrus (which differ between gilts and multiparous sows). Aims for reliable conception, reviews their own procedures against results, factors return-to-estrus rates and weaker summer estrus into records and decisions, and can instruct colleagues and new staff.","name_vi":"Phát hiện động dục và thời điểm phối giống (quan sát động dục, độ chính xác và thời điểm của thụ tinh nhân tạo / giao phối)","kanten_vi":"Có dựa vào âm hộ sưng - đỏ - dịch nhầy của lợn nái, hành động cưỡi lên con khác, dấu hiệu động dục đứng yên khi ấn lưng, việc kiểm tra bằng lợn đực, ghi chép số ngày từ khi cai sữa — để xác định và thực hiện đúng thời điểm phối giống không.","level1_vi":"Âm hộ lợn nái sưng đỏ, ra dịch nhầy cũng không nhận ra là động dục. Trình tự ấn lưng để kiểm tra có đứng yên không cũng mơ hồ, bỏ sót dấu hiệu. Không phán đoán được thời điểm phối giống, mỗi lần thực hiện đều cần chỉ dẫn và trợ giúp.","level2_vi":"Nếu có chỉ dẫn thì nhận ra thay đổi ở âm hộ và hành động lợn nái cưỡi lên con khác, nhưng việc đưa lợn đực đến gần và ấn lưng để kiểm tra có đứng yên không thì chưa đầy đủ, chỉ nắm được một phần. Phán đoán thời điểm phối giống phó mặc cho người khác, thường lỡ thời điểm thích hợp.","level3_vi":"Nếu có chỉ dẫn thì đi kiểm tra động dục vào giờ cố định như sáng và chiều, kiểm tra được âm hộ sưng, dịch nhầy, dấu hiệu đứng yên khi ấn lưng. Làm được một loạt công việc phối giống vào thời điểm được chỉ định.","level4_vi":"Dù không có chỉ dẫn vẫn dự đoán ngày có thể động dục bằng chu kỳ và số ngày từ khi cai sữa để quan sát trọng điểm. Kiểm tra dấu hiệu đứng yên rồi phối giống với khoảng cách thích hợp. Hiểu rằng thời điểm thích hợp khác nhau giữa nái đẻ lứa đầu và nái đã đẻ; làm được cẩn thận như đặt lợn đực phía trước, ấn lưng, để lợn nái bình tĩnh rồi thực hiện.","level5_vi":"Hiểu đúng cơ chế cơ thể: rụng trứng xảy ra một thời gian sau khi bắt đầu động dục và muộn hơn ở nái đã đẻ. Nhìn độ mạnh và độ dài của động dục (khác nhau giữa lứa đầu và nái đã đẻ) để điều chỉnh tỉ mỉ số lần và khoảng cách phối giống. Với mục tiêu thụ thai chắc chắn, tự xem lại quy trình của mình dựa trên thành tích; cân nhắc cả tỷ lệ động dục trở lại và việc động dục yếu đi vào mùa hè để ghi chép, phán đoán, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Penemuan birahi dan waktu perkawinan (pengamatan birahi, ketepatan dan waktu inseminasi buatan/perkawinan)","kanten_id":"Apakah dapat menentukan dan melaksanakan waktu perkawinan yang tepat, berdasarkan bengkak, kemerahan, dan lendir pada kemaluan induk babi, gerakan menaiki babi lain, tanda birahi berupa diam saat punggung ditekan, pemeriksaan dengan babi jantan, dan catatan jumlah hari sejak sapih.","level1_id":"Tidak sadar birahi walau kemaluan induk bengkak, memerah, atau keluar lendir. Cara memeriksa dengan menekan punggung (apakah babi diam) juga samar, sehingga tanda birahi terlewat. Tidak bisa menentukan waktu perkawinan, dan pelaksanaannya selalu butuh perintah dan bantuan.","level2_id":"Jika diberi petunjuk, sadar perubahan kemaluan dan gerakan induk menaiki babi lain, tetapi pemeriksaan dengan mendekatkan babi jantan dan menekan punggung untuk melihat refleks diam belum cukup, hanya sebagian yang terdeteksi. Waktu perkawinan bergantung pada orang lain dan sering meleset dari waktu yang tepat.","level3_id":"Jika diberi petunjuk, dapat memeriksa birahi pada jam tetap seperti pagi dan sore, memastikan bengkak dan lendir kemaluan serta tanda diam saat punggung ditekan. Dapat melakukan satu rangkaian pekerjaan perkawinan pada waktu yang diperintahkan.","level4_id":"Tanpa diberi petunjuk pun memperkirakan hari birahi dari siklus dan jumlah hari sejak sapih, lalu mengamatinya lebih fokus. Memastikan refleks diam, lalu mengawinkan dengan jarak waktu yang tepat. Paham bahwa waktu terbaik berbeda antara induk beranak pertama dan induk yang sudah pernah beranak, dan dapat bekerja dengan hati-hati, misalnya menaruh babi jantan di depan sambil menekan punggung supaya induk tenang.","level5_id":"Paham dengan benar mekanisme tubuh: ovulasi terjadi beberapa waktu setelah birahi mulai, dan pada induk yang sudah pernah beranak terjadinya lebih lambat. Dapat menyetel halus jumlah dan jarak perkawinan dengan melihat kuatnya dan lamanya birahi (berbeda antara beranak pertama dan sudah pernah beranak). Dengan target kebuntingan yang pasti, meninjau ulang caranya sendiri berdasarkan hasil, memperhitungkan angka birahi kembali dan birahi yang melemah di musim panas dalam pencatatan dan penilaian, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-2","name":"妊娠鑑定・再発チェック（不受胎・流産の早期発見、再種付けの管理）","kanten":"種付けから一定期間後の発情の再発の有無の観察、超音波による胎子の袋や心拍の確認、不受胎の母豚や流産の早期発見、再種付けの段取りができるか。","level1":"発情の再発の確認を怠り、不受胎の母豚を妊娠と取り違える。超音波の当て方もあいまいで胎子の袋を確認できず、不受胎や流産を見逃すため毎回補助を要する。","level2":"指示があれば発情の再発予定日に観察するが見落としが多く、受胎の有無の判断や再種付けの段取りは他者任せ。流産の早期発見ができないことがある。","level3":"指示に従い、種付けから一定期間後に発情の再発の有無を確かめ、超音波を母豚の右下腹部に当てて胎子の袋や心拍を確認できる。不受胎や流産の目立つ兆候には気づける。","level4":"指示がなくても発情周期に合わせて再発の見込み日を予測し重点的に観察し、種付け後の適期に超音波で複数回確認する。発情の再発する母豚が多ければ精液の質・種付けの時期・自らの手順を疑い、不受胎の母豚を速やかに再種付けへ回せる。","level5":"種付けからの経過が短すぎると、受胎していても不受胎と判定される場合があるため、日をおいて再確認するなど、確実に判別できる時期を理解している。真の妊娠とまぎらわしい状態（子宮に膿がたまる不調など）を見分け、不受胎・流産の生じやすさの傾向をふまえ原因への対処・記録を検討し、同僚や新人に指導できる。","name_en":"Pregnancy diagnosis and return-to-estrus checks (early detection of open sows and abortions, rebreeding management)","kanten_en":"Can observe for returns to estrus at the set interval after breeding, confirm gestational sacs and heartbeats by ultrasound, detect open (non-pregnant) sows and abortions early, and arrange rebreeding.","level1_en":"Neglects return-to-estrus checks and mistakes open sows for pregnant ones. Ultrasound placement is vague, gestational sacs cannot be confirmed, and open sows and abortions are missed, so assistance is required every time.","level2_en":"With guidance, observes on the expected return dates but misses many cases; relies on others to judge conception and arrange rebreeding. Sometimes fails to detect abortions early.","level3_en":"Following instructions, checks for returns to estrus at the set interval after breeding, and can confirm gestational sacs and heartbeats by placing the ultrasound probe on the sow's lower right abdomen. Notices obvious signs of open sows and abortions.","level4_en":"Without guidance, predicts expected return dates from the estrus cycle and observes intensively, and performs ultrasound checks several times at the appropriate stages after breeding. If many sows return to estrus, questions the semen quality, breeding timing, and their own technique, and promptly moves open sows to rebreeding.","level5_en":"Understands the reliable diagnostic window — for example, that checking too soon after breeding can misjudge a pregnant sow as open, so a re-check after an interval is needed. Can distinguish conditions that mimic true pregnancy (such as pus accumulating in the uterus), considers patterns in the occurrence of open sows and abortions to address causes and keep records, and can instruct colleagues and new staff.","name_vi":"Chẩn đoán mang thai và kiểm tra động dục trở lại (phát hiện sớm không thụ thai, sảy thai; quản lý phối giống lại)","kanten_vi":"Có quan sát việc động dục trở lại hay không sau khi phối giống một thời gian nhất định, kiểm tra túi thai và tim thai bằng siêu âm, phát hiện sớm lợn nái không thụ thai và sảy thai, sắp xếp việc phối giống lại được không.","level1_vi":"Bỏ qua việc kiểm tra động dục trở lại, nhầm lợn nái không thụ thai là đang mang thai. Cách đặt đầu dò siêu âm cũng mơ hồ, không xác nhận được túi thai; bỏ sót không thụ thai và sảy thai nên mỗi lần đều cần trợ giúp.","level2_vi":"Nếu có chỉ dẫn thì quan sát vào ngày dự kiến động dục trở lại nhưng nhiều bỏ sót; việc phán đoán có thụ thai hay không và sắp xếp phối giống lại phó mặc cho người khác. Có khi không phát hiện sớm được sảy thai.","level3_vi":"Theo chỉ dẫn, kiểm tra có động dục trở lại hay không sau khi phối giống một thời gian nhất định, đặt máy siêu âm vào vùng bụng dưới bên phải của lợn nái để xác nhận được túi thai và tim thai. Nhận ra được các dấu hiệu rõ của không thụ thai và sảy thai.","level4_vi":"Dù không có chỉ dẫn vẫn dự đoán ngày có thể động dục trở lại theo chu kỳ động dục để quan sát trọng điểm, siêu âm nhiều lần vào thời điểm thích hợp sau phối giống. Nếu nhiều nái động dục trở lại thì nghi chất lượng tinh dịch, thời điểm phối giống, thao tác của chính mình; nhanh chóng đưa nái không thụ thai vào phối giống lại.","level5_vi":"Hiểu thời điểm có thể phân biệt chắc chắn: nếu thời gian sau phối giống quá ngắn, dù đã thụ thai vẫn có thể bị phán đoán nhầm là không thụ thai, nên cần kiểm tra lại sau vài ngày. Phân biệt được trạng thái dễ nhầm với mang thai thật (như tình trạng tử cung tích mủ), cân nhắc xu hướng dễ xảy ra không thụ thai và sảy thai để xử lý nguyên nhân, ghi chép, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Diagnosa kebuntingan dan pemeriksaan birahi kembali (penemuan dini tidak bunting dan keguguran, pengelolaan kawin ulang)","kanten_id":"Apakah dapat mengamati ada tidaknya birahi kembali beberapa waktu setelah perkawinan, memeriksa kantong janin dan detak jantung dengan USG, menemukan sejak dini induk yang tidak bunting atau keguguran, dan mengatur kawin ulang.","level1_id":"Lalai memeriksa birahi kembali, salah mengira induk yang tidak bunting sebagai bunting. Cara menempelkan alat USG juga samar sehingga tidak bisa memastikan kantong janin, melewatkan tidak bunting dan keguguran, dan selalu butuh bantuan.","level2_id":"Jika diberi petunjuk, mengamati pada hari perkiraan birahi kembali, tetapi banyak yang terlewat. Penentuan bunting atau tidak dan pengaturan kawin ulang bergantung pada orang lain. Kadang tidak bisa menemukan keguguran sejak dini.","level3_id":"Sesuai petunjuk, dapat memeriksa ada tidaknya birahi kembali beberapa waktu setelah perkawinan, dan menempelkan USG di perut kanan bawah induk untuk memeriksa kantong janin dan detak jantung. Dapat menyadari tanda mencolok dari tidak bunting atau keguguran.","level4_id":"Tanpa diberi petunjuk pun memperkirakan hari birahi kembali sesuai siklus birahi dan mengamatinya fokus, serta memeriksa dengan USG beberapa kali pada waktu yang pas setelah perkawinan. Jika induk yang birahi kembali banyak, mencurigai kualitas semen, waktu perkawinan, atau caranya sendiri, dan dapat segera mengalihkan induk yang tidak bunting ke kawin ulang.","level5_id":"Paham waktu yang bisa dipastikan: jika terlalu cepat setelah perkawinan, induk yang sebenarnya bunting bisa saja dinilai tidak bunting, sehingga perlu diperiksa ulang setelah beberapa hari. Dapat membedakan keadaan yang mirip kebuntingan sejati (misalnya gangguan berupa nanah menumpuk di rahim), mempertimbangkan penanganan penyebab dan pencatatan berdasarkan kecenderungan mudah terjadinya tidak bunting atau keguguran, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-3","name":"母豚の体況管理（体格・栄養状態の見分け、給餌量の調整、やせすぎ・過肥の防止）","kanten":"母豚の体格・栄養状態（やせ・標準・過肥）を腰や背・肋骨に触れて見分け、妊娠の時期に応じて飼料の量を加減し、やせすぎ・過肥を防げるか。","level1":"やせすぎ・過肥を見ても判断できず、体格を見る部位も分からない。飼料の量を加減できず、栄養状態を放置する。","level2":"指示があれば極端なやせや過肥には気づくが、体格を段階で見分けるのがあいまいで、飼料を増減する判断は他者任せ。個体に応じた加減に漏れが多い。","level3":"指示があれば体格を段階で見分け、腰や背・肋骨に触れて脂肪のつき方を確かめられる。やせすぎや過肥を見つけられる。","level4":"指示がなくても妊娠初期と分娩前に体格を確認し、適正な状態を保つよう一頭ごとに飼料の量を加減する。妊娠の初期・中期・後期で飼料量を増減し、やせすぎ・過肥を防ぐ。","level5":"背の脂肪の厚みを定められた部位で測定して客観的に見分け、過肥は分娩を重くして食欲を落とし、やせすぎは産子数を減らし泌乳を悪くすることを理解する。泌乳期にやせさせすぎると次の分娩成績に影響することを見越して先回りで細かく加減し、記録して改善し、同僚や新人に指導できる。","name_en":"Sow body condition management (assessing condition and nutrition, adjusting feed amounts, preventing thinness and over-conditioning)","kanten_en":"Can assess the sow's body condition (thin, standard, over-conditioned) by touching the loin, back, and ribs, adjust feed amounts according to the stage of gestation, and prevent excessive thinness and over-conditioning.","level1_en":"Cannot judge thinness or over-conditioning even when seeing it, and does not know which body parts to check. Cannot adjust feed amounts and leaves poor condition unaddressed.","level2_en":"With guidance, notices extreme thinness or fatness, but scoring condition by grade is vague and the decision to increase or decrease feed is left to others. Individual adjustments are often missed.","level3_en":"With guidance, can score body condition by grade and check fat cover by touching the loin, back, and ribs. Can identify overly thin and over-conditioned sows.","level4_en":"Without guidance, checks body condition in early gestation and before farrowing, and adjusts feed amounts sow by sow to maintain proper condition. Varies feed amounts across early, mid, and late gestation to prevent thinness and over-conditioning.","level5_en":"Measures backfat thickness at the designated site for an objective assessment, and understands that over-conditioning makes farrowing difficult and reduces appetite, while thinness reduces litter size and impairs milk production. Anticipating that excessive weight loss during lactation affects the next farrowing's performance, fine-tunes feed proactively, records and improves, and can instruct colleagues and new staff.","name_vi":"Quản lý thể trạng lợn nái (phân biệt thể trạng và tình trạng dinh dưỡng, điều chỉnh lượng cho ăn, phòng quá gầy và quá béo)","kanten_vi":"Có sờ hông, lưng, xương sườn để phân biệt thể trạng và tình trạng dinh dưỡng của lợn nái (gầy - trung bình - quá béo), tăng giảm lượng thức ăn theo giai đoạn mang thai, phòng được quá gầy và quá béo không.","level1_vi":"Thấy quá gầy hay quá béo cũng không phán đoán được, không biết cả vị trí cần xem để đánh giá thể trạng. Không tăng giảm được lượng thức ăn, bỏ mặc tình trạng dinh dưỡng.","level2_vi":"Nếu có chỉ dẫn thì nhận ra được gầy hay béo cực đoan, nhưng việc phân biệt thể trạng theo mức độ còn mơ hồ, phán đoán tăng giảm thức ăn phó mặc cho người khác. Nhiều bỏ sót trong việc điều chỉnh theo từng con.","level3_vi":"Nếu có chỉ dẫn thì phân biệt được thể trạng theo mức độ, sờ hông, lưng, xương sườn để kiểm tra lớp mỡ. Phát hiện được quá gầy và quá béo.","level4_vi":"Dù không có chỉ dẫn vẫn kiểm tra thể trạng vào đầu kỳ mang thai và trước khi đẻ, điều chỉnh lượng thức ăn cho từng con để giữ trạng thái thích hợp. Tăng giảm lượng thức ăn theo đầu kỳ - giữa kỳ - cuối kỳ mang thai, phòng quá gầy và quá béo.","level5_vi":"Đo độ dày mỡ lưng tại vị trí quy định để phân biệt một cách khách quan; hiểu rằng quá béo làm đẻ khó và giảm sự thèm ăn, còn quá gầy làm giảm số con đẻ ra và tiết sữa kém. Nhìn trước rằng để nái gầy quá trong kỳ cho bú sẽ ảnh hưởng thành tích lứa đẻ sau nên điều chỉnh đón đầu tỉ mỉ, ghi chép để cải thiện, và hướng dẫn cho đồng nghiệp và người mới.","name_id":"Pengelolaan kondisi tubuh induk babi (menilai postur dan gizi, mengatur jumlah pakan, mencegah terlalu kurus dan terlalu gemuk)","kanten_id":"Apakah dapat menilai kondisi tubuh dan gizi induk babi (kurus, normal, terlalu gemuk) dengan meraba pinggang, punggung, dan tulang rusuk, menambah-mengurangi jumlah pakan sesuai tahap kebuntingan, dan mencegah terlalu kurus atau terlalu gemuk.","level1_id":"Melihat babi terlalu kurus atau terlalu gemuk tetapi tidak bisa menilai, dan tidak tahu bagian tubuh mana yang dilihat. Tidak bisa menambah-mengurangi jumlah pakan dan membiarkan kondisi gizi.","level2_id":"Jika diberi petunjuk, sadar akan kurus atau gemuk yang ekstrem, tetapi samar dalam menilai kondisi tubuh secara bertahap, dan keputusan menambah-mengurangi pakan bergantung pada orang lain. Banyak yang terlewat dalam penyesuaian per ekor.","level3_id":"Jika diberi petunjuk, dapat menilai kondisi tubuh secara bertahap dan meraba pinggang, punggung, dan tulang rusuk untuk memeriksa lapisan lemaknya. Dapat menemukan babi yang terlalu kurus atau terlalu gemuk.","level4_id":"Tanpa diberi petunjuk pun memeriksa kondisi tubuh pada awal kebuntingan dan sebelum melahirkan, dan menambah-mengurangi jumlah pakan per ekor supaya kondisi tetap baik. Menambah-mengurangi jumlah pakan pada awal, tengah, dan akhir kebuntingan, mencegah terlalu kurus dan terlalu gemuk.","level5_id":"Dapat menilai secara objektif dengan mengukur ketebalan lemak punggung di bagian yang ditentukan, dan paham bahwa terlalu gemuk membuat kelahiran berat dan nafsu makan turun, sedangkan terlalu kurus mengurangi jumlah anak per kelahiran dan memperburuk produksi susu. Melihat ke depan bahwa membiarkan induk terlalu kurus saat menyusui akan mempengaruhi hasil kelahiran berikutnya, mengatur halus lebih awal, mencatat dan memperbaiki, dan dapat mengajari rekan dan karyawan baru."},{"no":"ス-4","name":"給餌・給水管理（飼料の種類・量の管理、給水器の点検）","kanten":"妊娠の時期に応じた飼料の種類・量、食べ残しの確認、給水器の水の出と量の点検、飲み水を十分に確保できるか。","level1":"飼料の種類や量を取り違え、給水器の水の出が悪くても気づかず放置する。食べ残しや水切れに気づけず、飼料の量を加減できない。","level2":"指示があれば定められた量を給与できるが、妊娠の時期ごとの使い分けや給水器の点検に漏れが多く、過不足の判断は他者任せ。","level3":"指示があれば妊娠の時期に応じて飼料の量を変えて給与し（初期・中期・後期で量を変える）、給水器から水が出ているかを確かめられる。","level4":"指示がなくても飼料の食べ具合（食べ残しの有無）を毎日確かめ、給水器の水の出を点検する。妊娠中の母豚に水切れを生じさせず、泌乳中の母豚には多く要する飲み水を十分に用意し、暑い時期は涼しい朝夕に給与時間をずらすなどの工夫ができる。","level5":"飼料の栄養の内容や、暑い時期は冷たい水が食欲の維持に役立つことを理解し、食べ具合・体格・産子数をふまえ飼料の量を細かく加減する。食べ残しや飲水量を記録し、給与方法の改善を提案し、同僚や新人に指導できる。","name_en":"Feeding and water management (managing feed type and amount, drinker inspection)","kanten_en":"Can manage the feed type and amount according to the stage of gestation, check leftovers, inspect drinker flow and volume, and ensure sufficient drinking water.","level1_en":"Mixes up feed types and amounts, and does not notice poor drinker flow, leaving it unaddressed. Fails to notice leftovers or water outages and cannot adjust feed amounts.","level2_en":"With guidance, can feed the prescribed amounts, but often misses the stage-specific use of feeds and drinker checks, relying on others to judge excess or shortage.","level3_en":"With guidance, feeds amounts adjusted to the stage of gestation (varying the amount across early, mid, and late gestation) and can confirm that water is flowing from the drinkers.","level4_en":"Without guidance, checks feed consumption (presence of leftovers) daily and inspects drinker flow. Prevents water outages for pregnant sows, ensures the larger volume of drinking water that lactating sows need, and can adapt, for example by shifting feeding times to the cooler morning and evening in hot weather.","level5_en":"Understands the nutritional content of feeds and that cool water helps maintain appetite in hot weather; fine-tunes feed amounts based on intake, body condition, and litter size. Records leftovers and water intake, proposes improvements to feeding methods, and can instruct colleagues and new staff.","name_vi":"Quản lý cho ăn và nước uống (quản lý loại và lượng thức ăn, kiểm tra vòi uống nước)","kanten_vi":"Có quản lý loại và lượng thức ăn theo giai đoạn mang thai, kiểm tra thức ăn thừa, kiểm tra nước chảy ra và lượng nước của vòi uống, đảm bảo đủ nước uống không.","level1_vi":"Nhầm loại và lượng thức ăn, vòi uống nước ra kém cũng không nhận ra và bỏ mặc. Không nhận ra thức ăn thừa và tình trạng hết nước, không điều chỉnh được lượng thức ăn.","level2_vi":"Nếu có chỉ dẫn thì cho ăn được lượng quy định, nhưng nhiều bỏ sót trong việc dùng thức ăn khác nhau theo giai đoạn mang thai và kiểm tra vòi uống nước; phán đoán thừa - thi
