an diare yang jelas dan semangat yang menurun, tetapi mudah melewatkan tanda awal seperti batuk ringan, bersin, keterlambatan tumbuh, atau mulai kurus. Penilaian penanganan bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, mengamati tiap petak kandang setiap hari, dan dapat memeriksa keadaan yang terlihat: diare cair atau diare bercampur darah, batuk, bersin, ingus, kurus, bulu kusam, meringkuk. Paham bahwa beberapa waktu setelah sapih adalah masa yang mudah muncul diare.","level4_id":"Tanpa diberi petunjuk pun mengamati semua petak kandang setiap hari; jika curiga demam, mengukur suhu tubuh dan mencari penyebab berdasarkan lebih tinggi tidaknya dari suhu normal. Memeriksa sampai apakah napas cepat dan kasar, keadaan kotoran, dan asupan pakan-air, dan dapat menangani dengan segera memindahkan anak babi yang diare ke petak kandang lain (untuk perawatan).","level5_id":"Dapat memperkirakan penyakit dari keadaan yang diamati (membayangkan penyakit yang menyebabkan diare setelah sapih atau penyakit batuk dan pernapasan), dan memutuskan sendiri sampai pengobatan, pemantauan, pemeliharaan terpisah, dan laporan ke atasan. Mencatat kapan dan keadaan apa yang muncul untuk ditinjau ulang, memanfaatkannya untuk pencegahan berikutnya, dan dapat mengajari karyawan baru titik-titik pengamatan."},{"no":"子-5","name":"発育不良豚のケア（はじかれ豚の管理、群分け・別飼いの対応）","kanten":"群に入れず採食できない子豚や発育の悪い子豚を見分け、適切な時期に群分け・別飼いを行い個別に世話できるか。","level1":"指示があっても発育の悪い子豚やはじかれた子豚を群に放置し、採食できず衰弱していくのを見過ごす。","level2":"指示があれば弱い子豚を別の豚房へ移すが、抜き出すのが遅く、やせが進んでから手を打つ。群分けの目安があいまいで、判断は他者任せ。","level3":"指示があれば体格の近い子豚同士で群をそろえ、はじかれて採食できない子豚や、やせ・毛づやの悪い発育不良の子豚を見分け、別飼い用の手当て豚房へ移して個別に世話できる。","level4":"指示がなくても日々、はじかれた子豚を早めに抜き出し、消化のよい飼料・手からの給餌・十分な保温など立て直しの世話を行う。回復の度合いを体格や採食状況で確かめ、原因（疾病・歯・群内の力関係）まで探る。","level5":"発育不良の原因を疾病・飼料・環境から切り分け、別飼い・投薬・経過観察・淘汰の判断を自ら行う。はじかれる子豚が出ないよう群編成や給与法で減らす工夫を提案し、立て直しの世話を新人に指導できる。","name_en":"Care of poor doers (managing outcompeted piglets, grouping and separate rearing)","kanten_en":"Can distinguish piglets that cannot join the group to eat and poorly growing piglets, carry out grouping and separate rearing at the appropriate time, and care for them individually.","level1_en":"Even when instructed, leaves poor doers and outcompeted piglets in the group, overlooking them as they fail to eat and gradually weaken.","level2_en":"With guidance, moves weak piglets to another pen, but pulls them out late, acting only after the wasting has progressed. The grouping criteria are vague and the judgment is left to others.","level3_en":"With guidance, evens groups out with piglets of similar size, distinguishes outcompeted piglets that cannot eat and poor doers with thinness and poor coat, and can move them to a care pen for separate rearing and individual attention.","level4_en":"Without guidance, pulls out outcompeted piglets early each day and provides recovery care: digestible feed, hand feeding, ample warmth. Verifies the degree of recovery by body condition and intake, and investigates the causes (disease, teeth, power relations within the group).","level5_en":"Differentiates the causes of poor growth among disease, feed, and environment, and makes the decisions on separate rearing, medication, follow-up observation, and culling on their own. Proposes group composition and feeding practices that reduce the number of outcompeted piglets, and can teach recovery care to new staff.","name_vi":"Chăm sóc lợn con chậm lớn (quản lý lợn con bị chèn ép, đối ứng chia nhóm và nuôi riêng)","kanten_vi":"Có phân biệt được lợn con không vào được nhóm nên không ăn được và lợn con phát triển kém, thực hiện chia nhóm và nuôi riêng đúng thời điểm, chăm sóc riêng từng con không.","level1_vi":"Dù có chỉ dẫn vẫn để mặc lợn con phát triển kém hoặc bị chèn ép trong nhóm, nhìn qua việc chúng không ăn được và suy yếu dần.","level2_vi":"Nếu có chỉ dẫn thì chuyển lợn con yếu sang ô chuồng khác, nhưng tách ra chậm, để gầy đi rồi mới xử lý. Tiêu chuẩn chia nhóm mơ hồ, phán đoán phó mặc cho người khác.","level3_vi":"Nếu có chỉ dẫn thì gom nhóm các lợn con thể trạng gần nhau, phân biệt được lợn con bị chèn ép không ăn được và lợn con phát triển kém với biểu hiện gầy, lông xơ xác; chuyển sang ô chuồng chăm sóc để nuôi riêng và chăm sóc từng con.","level4_vi":"Dù không có chỉ dẫn vẫn hàng ngày tách sớm lợn con bị chèn ép, chăm sóc phục hồi bằng thức ăn dễ tiêu, cho ăn bằng tay, giữ ấm đầy đủ. Kiểm tra mức độ phục hồi qua thể trạng và tình trạng ăn, tìm cả nguyên nhân (bệnh, răng, quan hệ mạnh yếu trong nhóm).","level5_vi":"Phân tách được nguyên nhân chậm lớn từ bệnh, thức ăn, môi trường; tự phán đoán nuôi riêng, dùng thuốc, theo dõi, loại thải. Đề xuất cách giảm lợn con bị chèn ép bằng việc tổ chức nhóm và cách cho ăn, hướng dẫn cho người mới cách chăm sóc phục hồi.","name_id":"Perawatan anak babi yang tumbuh buruk (pengelolaan babi tersisih, pembagian kelompok dan pemeliharaan terpisah)","kanten_id":"Apakah dapat mengenali anak babi yang tersisih dari kelompok sehingga tidak bisa makan atau anak babi yang tumbuh buruk, membagi kelompok dan memelihara terpisah pada waktu yang tepat, dan merawatnya satu per satu.","level1_id":"Walau disuruh, membiarkan anak babi yang tumbuh buruk atau tersisih tetap di dalam kelompok, dan membiarkan mereka tidak bisa makan sampai makin melemah.","level2_id":"Jika diberi petunjuk, memindahkan anak babi yang lemah ke petak kandang lain, tetapi mengambilnya terlambat, baru bertindak setelah makin kurus. Patokan pembagian kelompok samar, penilaiannya bergantung pada orang lain.","level3_id":"Jika diberi petunjuk, dapat menyeragamkan kelompok dengan anak babi yang ukuran badannya berdekatan, mengenali anak babi yang tersisih dan tidak bisa makan atau yang kurus dan bulunya kusam (tumbuh buruk), lalu memindahkannya ke petak kandang perawatan untuk dirawat satu per satu.","level4_id":"Tanpa diberi petunjuk pun setiap hari mengambil lebih awal anak babi yang tersisih, dan melakukan perawatan pemulihan: pakan yang mudah dicerna, menyuapi dari tangan, penghangatan yang cukup. Memastikan tingkat pemulihan dari ukuran badan dan keadaan makan, dan mencari sampai ke penyebabnya (penyakit, gigi, hubungan kuat-lemah dalam kelompok).","level5_id":"Dapat memilah penyebab pertumbuhan buruk dari sisi penyakit, pakan, atau lingkungan, dan memutuskan sendiri pemeliharaan terpisah, pemberian obat, pemantauan, atau afkir. Mengusulkan cara penyusunan kelompok dan cara pemberian pakan yang mengurangi anak babi tersisih, dan dapat mengajari karyawan baru cara perawatan pemulihan."},{"no":"子-6","name":"環境管理（保温、温度ムラ・すきま風の防止、換気）","kanten":"舎内の温度・床の温度・すきま風・換気（鼻をつくにおいがこもっていないか）を点検し、子豚の様子から適温を保てるか。","level1":"指示があっても温度計を確認せず、寒さで折り重なってうずくまる、あるいは暑さでばらばらに伏せる子豚の様子を放置する。すきま風や換気の不良に気づかない。","level2":"指示があれば保温電球や換気を調整するが、適温の根拠があいまいで、温度ムラ・すきま風・鼻をつくにおいを見落としやすい。","level3":"指示があれば離乳直後の適温を目安に温度計を確認し、保温電球や床暖房で加温し、すきま風を防げる。子豚の伏せ方（折り重なる＝寒い、手足を伸ばして散らばる＝暑い）から体感温度を読める。","level4":"指示がなくても発育に合わせて段階的に設定温度を下げ、床を気温より暖かく保つ。鼻をつくにおいがこもらないよう換気とすきま風対策を両立させ、温度ムラの原因（すきま・送風機・敷きわら）を探って対処する。","level5":"発育の週齢に応じた適温の推移や、最低限必要な換気の意味を理解し、保温・換気・飼養密度を季節に合わせて段階的に調整する。子豚の様子から環境を読み取って改善・記録し、温度ムラやすきま風の対策を新人に指導できる。","name_en":"Environmental management (warmth, preventing uneven temperatures and drafts, ventilation)","kanten_en":"Inspects the room temperature, floor temperature, drafts, and ventilation (whether pungent odors are trapped), and can maintain the right temperature by reading the piglets' behavior.","level1_en":"Even when instructed, does not check the thermometer and ignores piglets piling up and crouching from cold, or lying scattered apart from heat. Fails to notice drafts and poor ventilation.","level2_en":"With guidance, adjusts the heat lamps and ventilation, but the basis for the right temperature is vague, and uneven temperatures, drafts, and pungent odors tend to be missed.","level3_en":"With guidance, checks the thermometer against the target temperature for right after weaning, warms with heat lamps and floor heating, and can block drafts. Can read the effective temperature from how the piglets lie (piling up = cold; stretched out and scattered = hot).","level4_en":"Without guidance, lowers the set temperature in stages as the piglets grow and keeps the floor warmer than the air. Balances ventilation against draft prevention so that pungent odors do not accumulate, and investigates and addresses the causes of uneven temperatures (gaps, fans, bedding).","level5_en":"Understands the progression of target temperatures by week of age and the purpose of minimum ventilation, and adjusts warming, ventilation, and stocking density in stages by season. Reads the environment from the piglets' behavior, improves and records, and can teach new staff the countermeasures for uneven temperatures and drafts.","name_vi":"Quản lý môi trường (giữ ấm, phòng chênh lệch nhiệt độ và gió lùa, thông gió)","kanten_vi":"Có kiểm tra nhiệt độ trong chuồng, nhiệt độ sàn, gió lùa, thông gió (mùi hắc có tích tụ không), và giữ được nhiệt độ thích hợp dựa vào biểu hiện của lợn con không.","level1_vi":"Dù có chỉ dẫn vẫn không xem nhiệt kế, bỏ mặc lợn con nằm chồng lên nhau co ro vì lạnh hoặc nằm tản ra vì nóng. Không nhận ra gió lùa và thông gió kém.","level2_vi":"Nếu có chỉ dẫn thì điều chỉnh đèn sưởi ấm và thông gió, nhưng căn cứ về nhiệt độ thích hợp còn mơ hồ; dễ bỏ sót chênh lệch nhiệt độ, gió lùa, mùi hắc.","level3_vi":"Nếu có chỉ dẫn thì kiểm tra nhiệt kế theo nhiệt độ thích hợp ngay sau cai sữa, sưởi ấm bằng đèn sưởi ấm và sàn sưởi, chắn được gió lùa. Đọc được nhiệt độ mà lợn cảm nhận từ cách nằm của lợn con (nằm chồng lên nhau = lạnh, duỗi chân tay nằm tản ra = nóng).","level4_vi":"Dù không có chỉ dẫn vẫn hạ dần nhiệt độ cài đặt theo sự phát triển, giữ sàn ấm hơn nhiệt độ không khí. Dung hòa việc thông gió để mùi hắc không tích tụ với việc chống gió lùa; tìm và xử lý nguyên nhân chênh lệch nhiệt độ (khe hở, quạt gió, chất lót chuồng).","level5_vi":"Hiểu diễn biến nhiệt độ thích hợp theo tuổi theo tuần và ý nghĩa của mức thông gió tối thiểu cần thiết; điều chỉnh từng bước việc giữ ấm, thông gió, mật độ nuôi theo mùa. Đọc môi trường từ biểu hiện của lợn con để cải thiện và ghi chép; hướng dẫn cho người mới biện pháp chống chênh lệch nhiệt độ và gió lùa.","name_id":"Pengelolaan lingkungan (penghangatan, pencegahan suhu tidak merata dan angin dari celah, ventilasi)","kanten_id":"Apakah dapat memeriksa suhu ruangan, suhu lantai, angin dari celah, dan ventilasi (apakah bau menyengat mengendap), dan menjaga suhu nyaman dengan melihat keadaan anak babi.","level1_id":"Walau disuruh, tidak memeriksa termometer, dan membiarkan anak babi yang bertumpuk meringkuk karena dingin atau berbaring terpisah-pisah karena panas. Tidak sadar akan angin dari celah dan ventilasi yang buruk.","level2_id":"Jika diberi petunjuk, menyetel lampu penghangat dan ventilasi, tetapi dasar suhu nyamannya samar, sehingga mudah melewatkan suhu yang tidak merata, angin dari celah, dan bau menyengat.","level3_id":"Jika diberi petunjuk, memeriksa termometer dengan patokan suhu nyaman sesaat setelah sapih, menghangatkan dengan lampu penghangat atau pemanas lantai, dan dapat menahan angin dari celah. Dapat membaca suhu yang dirasakan anak babi dari cara berbaringnya (bertumpuk = kedinginan, kaki terentang dan menyebar = kepanasan).","level4_id":"Tanpa diberi petunjuk pun menurunkan suhu setelan secara bertahap sesuai pertumbuhan, dan menjaga lantai lebih hangat dari suhu udara. Menyeimbangkan ventilasi (supaya bau menyengat tidak mengendap) dengan pencegahan angin dari celah, dan mencari serta menangani penyebab suhu tidak merata (celah, kipas, alas kandang).","level5_id":"Paham perubahan suhu nyaman sesuai umur dalam minggu dan arti ventilasi minimum yang diperlukan, dan mengatur bertahap penghangatan, ventilasi, dan kepadatan kandang sesuai musim. Membaca lingkungan dari keadaan anak babi lalu memperbaiki dan mencatat, dan dapat mengajari karyawan baru penanganan suhu tidak merata dan angin dari celah."},{"no":"子-7","name":"衛生管理・消毒（豚房清掃、オールイン・オールアウト、防疫意識）","kanten":"糞の除去→洗浄→乾燥→消毒の順序と、豚をまとめて入れ替えて洗浄・消毒する方式、作業者の動線・病原を持ち込まない意識を守れるか。","level1":"指示があっても糞を残したまま消毒液を散布する、空舎期間を取らずに次の群を入れるなど順序を無視し、糞や汚れが残ると消毒が効かないことを理解していない。","level2":"指示があれば洗浄・消毒はするが、乾燥・つけ置きの手順を省き、消毒液の希釈や空舎期間を守れないことが多い。作業者の動線や手指消毒への意識が薄い。","level3":"指示があれば、糞の除去→洗浄→乾燥→消毒の順で豚房を清掃し、豚をまとめて入れ替える方式で群を一斉に入れ替えられる。消毒液の希釈を守り、長靴や手指の消毒もできる。","level4":"指示がなくても、糞や汚れを十分に除去し、空舎期間を十分にとって洗浄・消毒・乾燥まで終わらせる。清浄な子豚舎から汚染区域への一方通行を守り、消毒液を対象に応じて選び、効くまでの時間を確保する。","level5":"「洗浄→消毒→乾燥」の重要性や、消毒液には汚れがあると効かないもの・効きにくい対象があることを理解し、薬剤や濃度を選べる。豚をまとめて入れ替える方式で疾病の持ち越しを断ち、消毒の記録や効果の確認で改善し、病原を持ち込まない手順を新人に指導できる。","name_en":"Hygiene and disinfection (pen cleaning, all-in/all-out, biosecurity awareness)","kanten_en":"Can follow the sequence 'manure removal → washing → drying → disinfection,' the all-in/all-out method of washing and disinfecting while turning groups over together, and the worker traffic flow and awareness of not introducing pathogens.","level1_en":"Even when instructed, ignores the sequence — spraying disinfectant over remaining manure, putting the next group in without a downtime period — and does not understand that disinfection fails where manure and dirt remain.","level2_en":"With guidance, washes and disinfects, but skips the drying and soaking steps and often fails to observe the disinfectant dilution and the downtime period. Awareness of worker traffic flow and hand disinfection is weak.","level3_en":"With guidance, cleans the pens in the order 'manure removal → washing → drying → disinfection,' and can turn groups over all at once using the batch-replacement method. Observes the disinfectant dilution and can disinfect boots and hands.","level4_en":"Without guidance, removes manure and dirt thoroughly, allows sufficient downtime, and completes washing, disinfection, and drying. Follows one-way movement from the clean nursery to contaminated areas, selects disinfectants according to the target, and allows enough time for them to take effect.","level5_en":"Understands the importance of 'wash → disinfect → dry' and that some disinfectants fail where there is dirt or against certain targets, and can select the product and concentration. Breaks the carryover of disease with the all-in/all-out batch turnover method, improves through disinfection records and effectiveness checks, and can teach new staff the procedures for keeping pathogens out.","name_vi":"Quản lý vệ sinh, khử trùng (dọn ô chuồng lợn, cùng vào - cùng ra, ý thức phòng dịch)","kanten_vi":"Có tuân thủ trình tự dọn phân → rửa → làm khô → khử trùng, phương thức thay cả loạt lợn rồi rửa - khử trùng, đường đi của người làm việc và ý thức không mang mầm bệnh vào không.","level1_vi":"Dù có chỉ dẫn vẫn phun thuốc khử trùng khi còn sót phân, đưa nhóm mới vào khi chưa có thời gian để trống chuồng — bỏ qua trình tự; không hiểu rằng còn phân và vết bẩn thì khử trùng không có hiệu quả.","level2_vi":"Nếu có chỉ dẫn thì rửa và khử trùng, nhưng bỏ qua các bước làm khô, ngâm; hay không tuân thủ độ pha loãng thuốc khử trùng và thời gian để trống chuồng. Ý thức về đường đi của người làm việc và sát khuẩn tay còn kém.","level3_vi":"Nếu có chỉ dẫn thì dọn ô chuồng theo trình tự dọn phân → rửa → làm khô → khử trùng, thay được cả nhóm cùng một lúc theo phương thức thay cả loạt lợn. Tuân thủ độ pha loãng thuốc khử trùng, khử trùng được cả ủng cao su và tay.","level4_vi":"Dù không có chỉ dẫn vẫn loại bỏ đầy đủ phân và vết bẩn, để trống chuồng đủ thời gian và hoàn tất rửa - khử trùng - làm khô. Tuân thủ đường đi một chiều từ chuồng lợn con sạch sang khu vực bẩn, chọn thuốc khử trùng theo đối tượng, đảm bảo thời gian để thuốc có tác dụng.","level5_vi":"Hiểu tầm quan trọng của \"rửa → khử trùng → làm khô\" và việc thuốc khử trùng có loại mất tác dụng khi còn bẩn, có đối tượng khó diệt; chọn được thuốc và nồng độ. Cắt đứt việc mang bệnh sang lứa sau bằng phương thức thay cả loạt lợn, cải thiện bằng ghi chép khử trùng và việc kiểm tra hiệu quả, hướng dẫn cho người mới quy trình không mang mầm bệnh vào.","name_id":"Pengelolaan kebersihan dan disinfeksi (pembersihan petak kandang, all-in all-out, kesadaran biosekuriti)","kanten_id":"Apakah dapat mematuhi urutan buang kotoran → cuci → keringkan → disinfeksi, cara mengganti babi sekaligus lalu mencuci dan mendisinfeksi (all-in all-out), alur gerak pekerja, dan kesadaran tidak membawa masuk kuman penyakit.","level1_id":"Walau disuruh, menyemprot cairan disinfektan dengan kotoran masih tersisa, dan memasukkan kelompok berikutnya tanpa masa kosong kandang — mengabaikan urutan dan tidak paham bahwa disinfeksi tidak mempan jika kotoran masih ada.","level2_id":"Jika diberi petunjuk, mencuci dan mendisinfeksi, tetapi sering melewati langkah pengeringan dan perendaman, serta tidak mematuhi pengenceran disinfektan dan masa kosong kandang. Kesadaran akan alur gerak pekerja dan disinfeksi tangan masih tipis.","level3_id":"Jika diberi petunjuk, dapat membersihkan petak kandang dengan urutan buang kotoran → cuci → keringkan → disinfeksi, dan mengganti kelompok serentak dengan cara memasukkan-mengeluarkan babi sekaligus. Mematuhi pengenceran cairan disinfektan, dan dapat mendisinfeksi sepatu bot karet dan tangan.","level4_id":"Tanpa diberi petunjuk pun membuang kotoran dengan bersih, memberi masa kosong kandang yang cukup, dan menyelesaikan sampai cuci, disinfeksi, dan pengeringan. Mematuhi arus satu arah dari kandang anak babi yang bersih ke daerah yang kotor, memilih cairan disinfektan sesuai sasarannya, dan memberi waktu yang cukup sampai obat bekerja.","level5_id":"Paham pentingnya 'cuci → disinfeksi → keringkan' dan bahwa ada disinfektan yang tidak mempan jika ada kotoran atau ada sasaran yang sulit dibasmi, dan dapat memilih obat dan kepekatannya. Memutus terbawanya penyakit dengan cara mengganti babi sekaligus, memperbaiki melalui catatan disinfeksi dan pemeriksaan hasilnya, dan dapat mengajari karyawan baru urutan yang tidak membawa masuk kuman penyakit."}]},{"key":"attitude","sheet":"仕事への姿勢（全舎共通）","scale":"姿勢","items":[{"no":"仕-1","name":"時間厳守・出勤態度（始業前準備、遅刻欠勤、身だしなみ）","kanten":"始業時刻より前に出勤して準備を整えているか。長靴の消毒・専用作業着への着替え・手指の消毒など、病原の持ち込みを防ぐための手順を実行しているか。遅刻・欠勤の際に事前連絡をするか。爪・髪・服装が清潔か。あわせて、指示を待たず自ら動けているか、周囲へ声をかけているかを見る。","level1":"始業時刻に遅れることが多く、連絡のない遅刻・欠勤がある。長靴の消毒や専用作業着への着替えを怠り、その都度指示されなければ、病原の持ち込みを防ぐ手順や身だしなみを整えられない。","level2":"ぎりぎりの出勤や連絡漏れが時折あるが、注意されれば始業より早めに出勤し、作業着への着替え・長靴の消毒・手指の消毒を行う。身だしなみの乱れも、指摘されれば直す。","level3":"指示どおり始業時刻より前に出勤し、長靴の消毒・専用作業着への着替え・手指の消毒という手順を一通り実行できる。遅刻・欠勤の際は、始業前に自ら連絡できる。","level4":"指示がなくても始業より余裕をもって早めに出勤し、その日の段取りや道具・記録用紙を整える。長靴の消毒や着替えを毎回欠かさないなど、病原の持ち込みを防ごうとする意識が言動に表れている。体調不良の際も早めに連絡し、代替の対応を申し出る。","level5":"自ら進んで早めの準備や消毒（消毒液の汚れ・濁りを確認して入れ替える等）を行い、遅れがちな同僚や新人へ、出勤時刻・身だしなみ・消毒手順を具体的に助言する。職場全体の出勤規律と衛生意識を高めている。","name_en":"Punctuality and work attitude (pre-shift preparation, lateness and absence, personal grooming)","kanten_en":"Arrives before the start time and gets prepared. Carries out the procedures to prevent bringing in pathogens: boot disinfection, changing into dedicated work clothes, and hand disinfection. Gives advance notice of lateness or absence. Keeps nails, hair, and clothing clean. Also assessed: whether they act without waiting for instructions and reach out to those around them.","level1_en":"Is often late for the start time, with unnotified lateness and absences. Neglects boot disinfection and changing into dedicated work clothes, and cannot keep up the biosecurity procedures or grooming unless instructed each time.","level2_en":"Occasionally cuts arrival close or forgets to give notice, but when reminded, arrives ahead of the start time and carries out changing into work clothes, boot disinfection, and hand disinfection. Corrects grooming lapses when they are pointed out.","level3_en":"As instructed, arrives before the start time and can carry out the full routine of boot disinfection, changing into dedicated work clothes, and hand disinfection. Gives notice of lateness or absence on their own initiative before the start time.","level4_en":"Without guidance, arrives with time to spare and prepares the day's schedule, tools, and record sheets. The intent to keep pathogens out shows in their behavior, such as never skipping boot disinfection or changing clothes. When unwell, contacts early and offers arrangements for coverage.","level5_en":"Proactively prepares early and maintains disinfection (for example, checking the disinfectant for dirt and cloudiness and replacing it), and gives concrete advice to colleagues and new staff who tend to be late about arrival times, grooming, and disinfection procedures. Raises the attendance discipline and hygiene awareness of the whole workplace.","name_vi":"Đúng giờ và thái độ đi làm (chuẩn bị trước giờ làm, đi muộn - nghỉ làm, trang phục gọn gàng)","kanten_vi":"Có đến trước giờ bắt đầu làm việc và chuẩn bị sẵn sàng không. Có thực hiện các bước ngăn mang mầm bệnh vào — khử trùng ủng cao su, thay quần áo lao động chuyên dụng, sát khuẩn tay — không. Khi đi muộn, nghỉ làm có liên lạc trước không. Móng tay, tóc, trang phục có sạch sẽ không. Đồng thời xem có tự hành động không chờ chỉ dẫn, có chủ động lên tiếng với những người xung quanh không.","level1_vi":"Thường đến muộn so với giờ bắt đầu, có khi đi muộn - nghỉ làm mà không liên lạc. Lơ là việc khử trùng ủng cao su và thay quần áo lao động chuyên dụng; nếu không được chỉ dẫn từng lần thì không thực hiện được các bước ngăn mầm bệnh và không chỉnh trang phục.","level2_vi":"Thỉnh thoảng đến sát giờ hoặc quên liên lạc, nhưng nếu được nhắc nhở thì đến sớm hơn giờ bắt đầu, thay quần áo lao động, khử trùng ủng cao su, sát khuẩn tay. Trang phục lộn xộn cũng sửa lại nếu được chỉ ra.","level3_vi":"Theo chỉ dẫn, đến trước giờ bắt đầu làm việc, thực hiện được một loạt các bước: khử trùng ủng cao su, thay quần áo lao động chuyên dụng, sát khuẩn tay. Khi đi muộn, nghỉ làm thì tự liên lạc trước giờ bắt đầu.","level4_vi":"Dù không có chỉ dẫn vẫn đến sớm với thời gian dư dả, chuẩn bị sắp xếp công việc trong ngày, dụng cụ, giấy ghi chép. Ý thức muốn ngăn mang mầm bệnh vào thể hiện qua lời nói và việc làm, như không bao giờ bỏ qua việc khử trùng ủng cao su và thay đồ. Khi không khỏe cũng liên lạc sớm và đề xuất phương án thay thế.","level5_vi":"Tự giác chuẩn bị sớm và khử trùng (kiểm tra độ bẩn - độ đục của dung dịch khử trùng để thay mới, v.v.), khuyên bảo cụ thể đồng nghiệp và người mới hay chậm trễ về giờ đến, trang phục, quy trình khử trùng. Nâng cao kỷ luật đi làm và ý thức vệ sinh của cả nơi làm việc.","name_id":"Ketepatan waktu dan sikap kerja (persiapan sebelum mulai kerja, terlambat dan absen, kerapian diri)","kanten_id":"Apakah datang sebelum jam mulai kerja dan menyiapkan diri. Apakah menjalankan langkah untuk mencegah masuknya kuman penyakit: disinfeksi sepatu bot karet, ganti ke baju kerja khusus, dan disinfeksi tangan. Apakah memberi tahu lebih dulu saat akan terlambat atau absen. Apakah kuku, rambut, dan pakaian bersih. Juga dilihat: apakah bergerak sendiri tanpa menunggu perintah, dan apakah menyapa serta berkomunikasi dengan orang sekitar.","level1_id":"Sering terlambat dari jam mulai kerja, dan ada terlambat atau absen tanpa kabar. Lalai mendisinfeksi sepatu bot dan mengganti ke baju kerja khusus; kalau tidak disuruh setiap kali, tidak bisa menjalankan langkah pencegahan masuknya kuman dan tidak merapikan diri.","level2_id":"Kadang datang mepet atau lupa memberi kabar, tetapi kalau ditegur, datang lebih awal dari jam mulai dan melakukan ganti baju kerja, disinfeksi sepatu bot, dan disinfeksi tangan. Kerapian diri yang kurang juga diperbaiki kalau ditunjukkan.","level3_id":"Sesuai petunjuk, datang sebelum jam mulai kerja dan dapat menjalankan lengkap urutan disinfeksi sepatu bot, ganti ke baju kerja khusus, dan disinfeksi tangan. Saat terlambat atau absen, dapat menghubungi sendiri sebelum jam mulai.","level4_id":"Tanpa diberi petunjuk pun datang lebih awal dengan waktu yang lega, dan menyiapkan urutan kerja hari itu, alat, dan lembar catatan. Tidak pernah melewatkan disinfeksi sepatu bot dan ganti baju — kesadaran untuk mencegah masuknya kuman terlihat dari kata dan tindakannya. Saat badan tidak sehat pun cepat memberi kabar dan menawarkan penanganan pengganti.","level5_id":"Atas kemauan sendiri melakukan persiapan lebih awal dan menjaga disinfeksi (memeriksa kotor dan keruhnya cairan disinfektan lalu menggantinya, dll.), dan memberi saran konkret kepada rekan atau karyawan baru yang sering terlambat tentang jam datang, kerapian diri, dan urutan disinfeksi. Meningkatkan disiplin kehadiran dan kesadaran kebersihan seluruh tempat kerja."},{"no":"仕-2","name":"報連相とチームワーク（情報共有、協力姿勢、引き継ぎの正確さ）","kanten":"体調の異常（発熱の様子・飼料を食べない・死亡・分娩の兆候・豚の脱柵 など）を、いかに早くもれなく上長や仲間へ伝え、相談しているか。引き継ぎノートや日報に、頭数・豚房・状態・実施した処置を正しく記録できているか。手が空いた際に手伝う姿勢があるか。指示を待たず動けるか、周囲へ働きかけているかを見る。","level1":"発熱の様子・飼料を食べない・死亡といった異常を見ても伝えず、自分で抱え込み、引き継ぎの漏れが多い。その都度確認して指示しなければ、情報を共有しない。","level2":"報告漏れや引き継ぎの抜けが時折あるが、指示されれば日報や引き継ぎノートに、頭数・豚房の番号・状態・実施した処置を記録して共有できる。","level3":"指示された事項（処置した豚の頭数・使用した薬剤の名称と残量・残っている作業・注意して観察すべき豚）について一通り報告・連絡・相談ができ、引き継ぎノートに記録して次の担当者へ引き渡せる。","level4":"指示がなくても気づいた異常をその場で伝えて相談し、引き継ぎの内容（投薬中の豚房・薬を止めてから出荷までの待機期間・注意して観察する豚 など）を、相手に伝わる形で正しく残そうとする姿勢が言動に表れている。手が空けば、忙しい同僚を自ら手伝う。","level5":"引き継ぎの書き方や報告の優先順位（緊急か通常か）を仲間とそろえるよう働きかけ、新人へ、伝えるべき異常の見分け方や記録の書き方を指導する。職場の情報共有とチーム連携の質を底上げしている。","name_en":"Reporting/communication and teamwork (information sharing, cooperative attitude, accuracy of handovers)","kanten_en":"How quickly and completely they convey and consult on health abnormalities (signs of fever, not eating, deaths, signs of farrowing, escaped pigs, etc.) to the supervisor and colleagues. Whether they can correctly record head counts, pens, conditions, and treatments given in the handover notes and daily report. Whether they are willing to help when their hands are free. Also assessed: acting without waiting for instructions and engaging with those around them.","level1_en":"Sees abnormalities such as signs of fever, not eating, or deaths but does not convey them, keeps things to themselves, and leaves many gaps in handovers. Does not share information unless checked and instructed each time.","level2_en":"Occasionally misses reports and handover items, but when instructed, can record and share the head counts, pen numbers, conditions, and treatments given in the daily report or handover notes.","level3_en":"Can carry out reporting and communication on the instructed items (number of pigs treated, names and remaining amounts of drugs used, remaining tasks, pigs needing close observation), and hand over to the next person by recording them in the handover notes.","level4_en":"Without guidance, conveys and consults on noticed abnormalities on the spot, and their behavior shows an effort to record the handover content accurately in a form the recipient can understand (pens under medication, the withdrawal period from stopping a drug to shipping, pigs to watch closely, etc.). When free, helps busy colleagues on their own initiative.","level5_en":"Works to align the handover format and reporting priorities (urgent versus routine) with teammates, and teaches new staff how to recognize abnormalities that must be conveyed and how to write the records. Raises the quality of information sharing and team coordination across the workplace.","name_vi":"Báo cáo - liên lạc - trao đổi và làm việc nhóm (chia sẻ thông tin, tinh thần hợp tác, bàn giao chính xác)","kanten_vi":"Có truyền đạt và trao đổi nhanh, không bỏ sót các bất thường về sức khỏe của lợn (dấu hiệu sốt, không ăn thức ăn, chết, dấu hiệu sắp đẻ, lợn sổng chuồng, v.v.) cho cấp trên và đồng nghiệp không. Có ghi đúng số đầu con, ô chuồng, trạng thái, xử lý đã làm vào sổ bàn giao và nhật ký công việc không. Khi rảnh tay có tinh thần giúp đỡ không. Xem có tự hành động không chờ chỉ dẫn, có chủ động tác động đến những người xung quanh không.","level1_vi":"Thấy bất thường như dấu hiệu sốt, không ăn thức ăn, chết cũng không truyền đạt mà tự ôm giữ; bàn giao nhiều thiếu sót. Nếu không được hỏi và chỉ dẫn từng lần thì không chia sẻ thông tin.","level2_vi":"Thỉnh thoảng có sót báo cáo và thiếu bàn giao, nhưng nếu được chỉ dẫn thì ghi và chia sẻ được số đầu con, số ô chuồng, trạng thái, xử lý đã làm vào nhật ký công việc và sổ bàn giao.","level3_vi":"Báo cáo - liên lạc - trao đổi được một loạt các mục được chỉ dẫn (số con lợn đã xử lý, tên và lượng còn lại của thuốc đã dùng, công việc còn dở, lợn cần chú ý quan sát), ghi vào sổ bàn giao và bàn giao được cho người phụ trách tiếp theo.","level4_vi":"Dù không có chỉ dẫn vẫn truyền đạt và trao đổi ngay tại chỗ khi nhận ra bất thường; thái độ cố gắng ghi lại đúng và dễ hiểu cho người nhận các nội dung bàn giao (ô chuồng đang dùng thuốc, thời gian chờ từ khi ngừng thuốc đến khi xuất chuồng, lợn cần chú ý quan sát, v.v.) thể hiện qua lời nói và việc làm. Khi rảnh tay thì tự giúp đồng nghiệp đang bận.","level5_vi":"Chủ động tác động để thống nhất với đồng nghiệp cách viết bàn giao và thứ tự ưu tiên báo cáo (khẩn cấp hay thông thường), hướng dẫn cho người mới cách phân biệt bất thường cần truyền đạt và cách ghi chép. Nâng cao chất lượng chia sẻ thông tin và phối hợp nhóm của cả nơi làm việc.","name_id":"Lapor-hubung-konsultasi dan kerja sama tim (berbagi informasi, sikap saling membantu, ketepatan serah terima)","kanten_id":"Apakah menyampaikan kelainan pada babi (tanda demam, tidak makan pakan, kematian, tanda akan melahirkan, babi lepas dari kandang, dll.) kepada atasan dan rekan dengan cepat dan tanpa terlewat, serta berkonsultasi. Apakah dapat mencatat dengan benar di buku serah terima dan laporan harian: jumlah ekor, petak kandang, keadaannya, dan penanganan yang sudah dilakukan. Apakah punya sikap membantu saat pekerjaannya kosong. Juga dilihat: apakah bergerak tanpa menunggu perintah, dan apakah aktif mengajak orang sekitar.","level1_id":"Melihat kelainan seperti tanda demam, tidak makan pakan, atau kematian, tetapi tidak menyampaikannya, memendamnya sendiri, dan banyak bolong dalam serah terima. Kalau tidak ditanya dan diperintah setiap kali, tidak berbagi informasi.","level2_id":"Kadang ada laporan yang bolong dan serah terima yang terlewat, tetapi kalau disuruh, dapat mencatat dan membagikan di laporan harian atau buku serah terima: jumlah ekor, nomor petak kandang, keadaannya, dan penanganan yang dilakukan.","level3_id":"Dapat melapor, menghubungi, dan berkonsultasi secara lengkap tentang hal-hal yang diperintahkan (jumlah babi yang ditangani, nama dan sisa obat yang dipakai, pekerjaan yang masih tersisa, babi yang perlu diawasi), dan mencatatnya di buku serah terima lalu menyerahkannya ke petugas berikutnya.","level4_id":"Tanpa diberi petunjuk pun menyampaikan kelainan di tempat begitu menyadarinya dan berkonsultasi. Terlihat dari kata dan tindakannya sikap berusaha meninggalkan isi serah terima dengan benar dan dalam bentuk yang mudah dipahami penerimanya (petak kandang yang sedang diberi obat, masa tunggu dari berhenti obat sampai pengiriman, babi yang perlu diawasi, dll.). Jika pekerjaannya kosong, membantu sendiri rekan yang sibuk.","level5_id":"Mengajak rekan-rekan menyamakan cara menulis serah terima dan urutan prioritas laporan (darurat atau biasa), dan mengajari karyawan baru cara mengenali kelainan yang harus disampaikan dan cara menulis catatan. Menaikkan mutu berbagi informasi dan kerja sama tim di tempat kerja."},{"no":"仕-3","name":"改善意識・学習姿勢（提案、振り返り、新しい知識の習得意欲）","kanten":"その日の作業を振り返って改善を提案するか。疑問点を確認するか。新しい知識（飼養管理・疾病・薬剤・衛生）を学ぼうとするか。指示を待たず動けるか、提案が具体的で観察できる事実にもとづくか、周囲へ広げているかを見る。","level1":"指示された作業をこなすだけで振り返りも疑問もなく、失敗しても原因を考えない。その都度促されなければ学ぼうとしない。","level2":"改善の気づきが時折あるが自らは動かず、指示されれば手順を見直したり、分からない用語（分娩後の体調不良・離乳に適した時期・薬を止めてから出荷までの待機期間 など）を確認したりする。","level3":"指示された範囲でその日の作業を振り返って疑問を質問し、教わった手順や目安（分娩室の適切な室温・薬剤の希釈方法 など）を覚えて次に活かそうとする。","level4":"指示がなくても作業の無駄や危険な箇所（人や豚の動線・転倒のしやすさ・薬剤の取り違え など）に気づいて改善案を出し、研修資料やマニュアルを自ら読み込むなど、学ぼうとする姿勢が言動から分かる。","level5":"試した改善を、観察できる結果（事故の発生しやすさ・離乳できた頭数・発育の状態・作業にかかった時間 など）で振り返ってチームに提案・共有し、新しい知識ややり方を勉強会などで同僚へ広め、職場の作業手順の見直しにつなげている。","name_en":"Improvement mindset and learning attitude (proposals, reflection, motivation to acquire new knowledge)","kanten_en":"Whether they look back on the day's work and propose improvements, confirm points of doubt, and try to learn new knowledge (husbandry, disease, drugs, hygiene). Also assessed: acting without waiting for instructions, whether proposals are concrete and grounded in observable facts, and whether they spread learning to others.","level1_en":"Merely completes the assigned tasks with no reflection or questions, and does not consider the cause when something fails. Does not try to learn unless prompted each time.","level2_en":"Occasionally notices possible improvements but does not act on their own; when instructed, reviews procedures and confirms terms they do not understand (postpartum disorders, the appropriate weaning age, the withdrawal period from stopping a drug to shipping, etc.).","level3_en":"Within the instructed scope, looks back on the day's work and asks questions about doubts, and tries to remember and apply the procedures and reference values taught (the proper farrowing room temperature, how to dilute disinfectants, etc.).","level4_en":"Without guidance, notices waste and hazards in the work (the flow of people and pigs, slip risks, drug mix-ups, etc.) and puts forward improvement ideas; their drive to learn shows in their behavior, such as reading training materials and manuals on their own.","level5_en":"Reviews the improvements they have tried against observable results (accident rates, number of piglets weaned, growth status, time taken, etc.), proposes and shares them with the team, spreads new knowledge and methods to colleagues through study sessions and the like, and drives revisions of the workplace's work procedures.","name_vi":"Ý thức cải thiện và thái độ học hỏi (đề xuất, nhìn lại công việc, ý muốn học kiến thức mới)","kanten_vi":"Có nhìn lại công việc trong ngày và đề xuất cải thiện không. Có xác nhận điều còn thắc mắc không. Có muốn học kiến thức mới (quản lý chăn nuôi, bệnh, thuốc, vệ sinh) không. Xem có tự hành động không chờ chỉ dẫn, đề xuất có cụ thể và dựa trên sự việc quan sát được không, có lan tỏa ra những người xung quanh không.","level1_vi":"Chỉ làm xong việc được chỉ dẫn, không nhìn lại cũng không thắc mắc; thất bại cũng không suy nghĩ nguyên nhân. Nếu không được thúc giục từng lần thì không chịu học.","level2_vi":"Thỉnh thoảng có nhận ra điểm cần cải thiện nhưng không tự hành động; nếu được chỉ dẫn thì xem lại trình tự làm việc, xác nhận các từ ngữ chưa hiểu (bệnh sau khi đẻ, thời điểm thích hợp để cai sữa, thời gian chờ từ khi ngừng thuốc đến khi xuất chuồng, v.v.).","level3_vi":"Trong phạm vi được chỉ dẫn, nhìn lại công việc trong ngày và hỏi điều thắc mắc, nhớ các trình tự và mức chuẩn đã được dạy (nhiệt độ thích hợp của phòng đẻ, cách pha loãng thuốc, v.v.) để vận dụng cho lần sau.","level4_vi":"Dù không có chỉ dẫn vẫn nhận ra sự lãng phí và chỗ nguy hiểm trong công việc (đường đi của người và lợn, chỗ dễ trượt ngã, nhầm lẫn thuốc, v.v.) và đưa ra phương án cải thiện; thái độ ham học như tự đọc kỹ tài liệu đào tạo và sổ tay hướng dẫn thể hiện qua lời nói và việc làm.","level5_vi":"Nhìn lại các cải thiện đã thử bằng kết quả quan sát được (mức độ xảy ra tai nạn, số con cai sữa được, tình trạng phát triển, thời gian làm việc, v.v.) để đề xuất và chia sẻ với nhóm; lan tỏa kiến thức và cách làm mới cho đồng nghiệp qua các buổi học, kết nối đến việc xem lại quy trình làm việc của nơi làm việc.","name_id":"Kesadaran perbaikan dan sikap belajar (usulan, peninjauan ulang, semangat mempelajari pengetahuan baru)","kanten_id":"Apakah meninjau ulang pekerjaan hari itu dan mengusulkan perbaikan. Apakah menanyakan hal yang belum jelas. Apakah berusaha mempelajari pengetahuan baru (pemeliharaan ternak, penyakit, obat, kebersihan). Juga dilihat: apakah bergerak tanpa menunggu perintah, apakah usulannya konkret dan berdasarkan fakta yang bisa diamati, dan apakah menyebarkannya ke orang sekitar.","level1_id":"Hanya mengerjakan pekerjaan yang diperintahkan, tanpa peninjauan ulang dan tanpa pertanyaan; gagal pun tidak memikirkan penyebabnya. Tidak mau belajar kalau tidak didorong setiap kali.","level2_id":"Kadang ada kesadaran akan perbaikan tetapi tidak bergerak sendiri; kalau disuruh, meninjau ulang urutan kerja atau menanyakan istilah yang belum dipahami (gangguan kesehatan setelah melahirkan, waktu yang cocok untuk sapih, masa tunggu dari berhenti obat sampai pengiriman, dll.).","level3_id":"Dalam lingkup yang diperintahkan, meninjau ulang pekerjaan hari itu dan menanyakan keraguannya, serta berusaha mengingat urutan kerja dan patokan yang diajarkan (suhu ruangan yang tepat untuk ruang beranak, cara pengenceran obat, dll.) untuk dipakai pada kesempatan berikutnya.","level4_id":"Tanpa diberi petunjuk pun menyadari pemborosan kerja dan titik yang berbahaya (alur gerak orang dan babi, tempat yang mudah terpeleset, tertukarnya obat, dll.) lalu mengeluarkan usulan perbaikan. Sikap mau belajar terlihat dari kata dan tindakannya, seperti membaca sendiri bahan pelatihan dan manual.","level5_id":"Meninjau ulang perbaikan yang sudah dicoba dengan hasil yang bisa diamati (mudah tidaknya terjadi kecelakaan, jumlah anak yang berhasil disapih, keadaan pertumbuhan, waktu yang dibutuhkan untuk bekerja, dll.), mengusulkan dan membagikannya ke tim, menyebarkan pengetahuan dan cara baru kepada rekan lewat forum belajar, dan menghubungkannya ke peninjauan ulang urutan kerja tempat kerja."}]}]</script>
<script id="workCriteriaData" type="application/json">{"levelLabels":["要指導","要改善","標準","上回る","模範的"],"commonAspects":[{"id":"care","name":"丁寧さ・確実さ","kanten":"{work}を手順どおり丁寧に、やり残しや不備なく確実に行えるか。仕上がりを自分で確かめられるか。","levels":["{work}を雑に済ませ、やり残しや不備があっても気づかず放置する。指示されなければ正しく行えない。","指示があれば{work}をひと通り行えるが、手順の抜けや仕上がりのムラが多く、確実にできたかの確認は他者まかせ。","指示があれば{work}を手順どおり丁寧に行い、やり残しや不備に自分で気づける。","指示がなくても{work}を確実に行い、仕上がりを自分で確かめて、不備があればその場で直す。","{work}の要点とミスの起きやすい箇所を理解し、常に安定した品質で行い、丁寧で確実なやり方を新人に指導できる。"],"name_en":"Care and Reliability","kanten_en":"Can they perform {work} carefully by the procedure, completely and without defects, and check the finished result themselves?","levels_en":["Does {work} sloppily and leaves omissions and defects unnoticed. Cannot do it correctly unless instructed.","With guidance can get through {work}, but with many procedural gaps and uneven results, leaving the quality check to others.","With guidance can perform {work} carefully by the procedure and notice omissions and defects on their own.","Independently performs {work} reliably, checks the result themselves, and fixes any defect on the spot.","Understands the key points of {work} and where mistakes tend to occur, performs it at consistently stable quality, and can teach new staff careful and reliable methods."],"name_vi":"Cẩn thận, chắc chắn","kanten_vi":"Có làm {work} đúng trình tự, cẩn thận, chắc chắn không bỏ sót, không sai sót không. Có tự kiểm tra kết quả hoàn thành không.","levels_vi":["Làm {work} cẩu thả, có chỗ bỏ sót, sai sót cũng không nhận ra mà bỏ mặc. Không được chỉ thị thì không làm đúng được.","Nếu được chỉ thị thì làm được {work} một cách cơ bản, nhưng hay bỏ sót bước, chất lượng không đều, việc kiểm tra đã làm chắc chưa thì phó mặc người khác.","Nếu được chỉ thị thì làm {work} đúng trình tự, cẩn thận, tự nhận ra được chỗ bỏ sót, sai sót.","Dù không có chỉ thị vẫn làm {work} chắc chắn, tự kiểm tra kết quả, có sai sót thì sửa ngay tại chỗ.","Hiểu các điểm chính của {work} và chỗ dễ xảy ra lỗi, luôn làm với chất lượng ổn định, và có thể hướng dẫn người mới cách làm cẩn thận, chắc chắn."],"name_id":"Ketelitian dan kepastian","kanten_id":"Apakah dapat melakukan {work} sesuai urutan dengan teliti dan pasti, tanpa yang terlewat atau cacat? Apakah dapat memeriksa sendiri hasil kerjanya?","levels_id":["Melakukan {work} asal-asalan, dan tidak sadar serta membiarkan walaupun ada yang terlewat atau cacat. Tidak bisa melakukan dengan benar jika tidak diperintah.","Jika diperintah dapat melakukan {work} secara garis besar, tetapi banyak urutan yang terlewat dan hasilnya tidak rata, dan pemeriksaan hasil diserahkan ke orang lain.","Jika diperintah, dapat melakukan {work} sesuai urutan dengan teliti, dan menyadari sendiri yang terlewat atau cacat.","Tanpa diperintah pun, melakukan {work} dengan pasti, memeriksa sendiri hasilnya, dan langsung memperbaiki jika ada cacat.","Memahami pokok {work} dan titik yang mudah salah, selalu bekerja dengan mutu stabil, dan dapat mengajarkan cara kerja yang teliti dan pasti kepada karyawan baru."]},{"id":"time","name":"時間内の遂行","kanten":"{work}を決められた時間の目安内に、段取りよく終えられるか。","levels":["{work}に時間がかかりすぎ、時間内に終わらない。段取りを考えず、遅れても気にしない。","指示があれば取りかかるが、段取りが悪く時間内に終わらないことが多い。","指示された時間の目安を守って{work}を進められる。","指示がなくても優先順位と段取りを考え、{work}を余裕をもって時間内に終える。","{work}全体の段取りを組んで無駄を省き、時間内に終える工夫を新人に教えられる。"],"name_en":"Completion Within Time","kanten_en":"Can they finish {work} within the expected time frame with good planning?","levels_en":["Takes too long on {work} and cannot finish in time. Does not plan the sequence and does not mind being late.","With guidance can get started, but plans poorly and often fails to finish in time.","Can proceed with {work} within the instructed time frame.","Independently sets priorities and sequencing and finishes {work} within time with margin to spare.","Plans the whole flow of {work} to eliminate waste, and can teach new staff how to finish within time."],"name_vi":"Hoàn thành trong thời gian","kanten_vi":"Có hoàn thành {work} trong thời gian định mức, với trình tự công việc hợp lý không.","levels_vi":["Làm {work} mất quá nhiều thời gian, không xong trong thời gian. Không nghĩ đến trình tự, chậm cũng không quan tâm.","Nếu được chỉ thị thì bắt tay vào làm, nhưng sắp xếp kém, thường không xong trong thời gian.","Giữ được thời gian định mức được chỉ thị và tiến hành {work}.","Dù không có chỉ thị vẫn cân nhắc thứ tự ưu tiên và trình tự, hoàn thành {work} trong thời gian một cách dư dả.","Sắp xếp được trình tự của toàn bộ {work}, loại bỏ lãng phí, và có thể dạy người mới cách hoàn thành trong thời gian."],"name_id":"Menyelesaikan dalam waktu","kanten_id":"Apakah dapat menyelesaikan {work} dalam patokan waktu yang ditentukan dengan urutan kerja yang baik?","levels_id":["{work} memakan waktu terlalu lama dan tidak selesai dalam waktu. Tidak memikirkan urutan kerja, dan tidak peduli walaupun terlambat.","Mulai bekerja jika diperintah, tetapi urutan kerjanya buruk sehingga sering tidak selesai dalam waktu.","Dapat mengerjakan {work} dengan menepati patokan waktu yang diperintahkan.","Tanpa diperintah pun, memikirkan prioritas dan urutan kerja, dan menyelesaikan {work} dalam waktu dengan longgar.","Dapat menyusun urutan seluruh {work}, membuang yang sia-sia, dan mengajarkan cara menyelesaikan dalam waktu kepada karyawan baru."]},{"id":"tools","name":"器具・設備の扱い","kanten":"{work}で使う器具・設備を正しく清潔に扱い、使用後の洗浄・消毒・点検・片づけができるか。","levels":["{work}で使う器具・設備を乱暴に扱い、汚れや破損・消毒忘れがあっても気にしない。","指示があれば器具を使えるが、消毒や後片づけ・点検に抜けが多い。","指示があれば器具・設備を正しく使い、使用後の洗浄・消毒・片づけができる。","指示がなくても器具を清潔・適切に扱い、不具合や消耗に気づけば手入れ・報告する。","器具・設備の扱いと管理の要点を理解し、正しい扱い方を新人に指導できる。"],"name_en":"Handling Equipment and Facilities","kanten_en":"Can they handle the equipment and facilities used in {work} correctly and hygienically, and wash, disinfect, inspect, and put them away after use?","levels_en":["Handles the equipment and facilities used in {work} roughly, and does not care about dirt, damage, or missed disinfection.","With guidance can use the equipment, but often misses disinfection, cleanup, or inspection.","With guidance can use equipment and facilities correctly and wash, disinfect, and put them away after use.","Independently handles equipment hygienically and properly, and maintains or reports any defect or wear they notice.","Understands the key points of equipment handling and care, and can teach new staff the correct handling."],"name_vi":"Sử dụng dụng cụ, thiết bị","kanten_vi":"Có sử dụng đúng và sạch sẽ dụng cụ, thiết bị dùng trong {work}, sau khi dùng có rửa, khử trùng, kiểm tra, cất dọn không.","levels_vi":["Sử dụng thô bạo dụng cụ, thiết bị dùng trong {work}, bẩn, hỏng hay quên khử trùng cũng không quan tâm.","Nếu được chỉ thị thì dùng được dụng cụ, nhưng hay bỏ sót khử trùng, dọn dẹp, kiểm tra.","Nếu được chỉ thị thì dùng đúng dụng cụ, thiết bị, sau khi dùng rửa, khử trùng, cất dọn được.","Dù không có chỉ thị vẫn dùng dụng cụ sạch sẽ, phù hợp, nhận ra hỏng hóc, hao mòn thì bảo dưỡng, báo cáo.","Hiểu các điểm chính về sử dụng và quản lý dụng cụ, thiết bị, và có thể hướng dẫn người mới cách dùng đúng."],"name_id":"Penanganan alat dan peralatan","kanten_id":"Apakah dapat memakai alat dan peralatan untuk {work} dengan benar dan bersih, serta mencuci, mendisinfeksi, memeriksa, dan merapikannya setelah dipakai?","levels_id":["Memperlakukan alat dan peralatan untuk {work} dengan kasar, dan tidak peduli walaupun ada kotoran, kerusakan, atau lupa disinfeksi.","Dapat memakai alat jika diperintah, tetapi banyak yang terlewat dalam disinfeksi, merapikan, dan pemeriksaan.","Jika diperintah, dapat memakai alat dan peralatan dengan benar, serta mencuci, mendisinfeksi, dan merapikannya setelah dipakai.","Tanpa diperintah pun, memperlakukan alat dengan bersih dan tepat, dan jika menyadari kerusakan atau keausan segera merawat atau melapor.","Memahami pokok penanganan dan pengelolaan alat dan peralatan, dan dapat mengajarkan cara penanganan yang benar kepada karyawan baru."]},{"id":"report","name":"報告・記録","kanten":"{work}の結果・数値・気づいた異常を、上長へ報告し、記録に残せるか。","levels":["{work}の結果や気づいた異常を報告せず、記録も残さない。","指示されれば報告・記録するが、内容が不十分で抜け漏れが多い。","指示された事項について{work}の結果・数値・異常を報告し、記録に残せる。","指示がなくても{work}で気づいた異常や引き継ぎ事項を、相手に伝わる形で報告・記録する。","報告・記録の要点や優先順位を判断し、伝えるべき異常の見分け方と記録の書き方を新人に指導できる。"],"name_en":"Reporting and Recording","kanten_en":"Can they report the results, figures, and any abnormalities noticed in {work} to supervisors and keep records?","levels_en":["Does not report results or abnormalities noticed in {work} and keeps no records.","With guidance can report and record, but the content is insufficient with many omissions.","Can report and record the results, figures, and abnormalities of {work} for the instructed items.","Independently reports and records abnormalities and handover items noticed in {work} in a form that gets through to the recipient.","Judges the key points and priorities of reporting and recording, and can teach new staff how to spot reportable abnormalities and write records."],"name_vi":"Báo cáo, ghi chép","kanten_vi":"Có báo cáo cho cấp trên và ghi lại kết quả, số liệu, bất thường nhận thấy trong {work} không.","levels_vi":["Không báo cáo kết quả hay bất thường nhận thấy trong {work}, cũng không ghi chép lại.","Nếu được chỉ thị thì báo cáo, ghi chép, nhưng nội dung chưa đủ, hay thiếu sót.","Báo cáo và ghi lại được kết quả, số liệu, bất thường của {work} theo các mục được chỉ thị.","Dù không có chỉ thị vẫn báo cáo, ghi chép bất thường và việc cần bàn giao nhận thấy trong {work} theo cách người khác hiểu được.","Phán đoán được điểm chính và thứ tự ưu tiên của báo cáo, ghi chép, và có thể hướng dẫn người mới cách nhận biết bất thường cần truyền đạt và cách viết ghi chép."],"name_id":"Laporan dan pencatatan","kanten_id":"Apakah dapat melaporkan hasil, angka, dan kelainan yang disadari dari {work} kepada atasan, dan menyimpannya dalam catatan?","levels_id":["Tidak melaporkan hasil {work} dan kelainan yang disadari, dan tidak menyimpan catatan.","Melaporkan dan mencatat jika diperintah, tetapi isinya kurang dan banyak yang terlewat.","Dapat melaporkan hasil, angka, dan kelainan {work} sesuai hal yang diperintahkan, dan menyimpannya dalam catatan.","Tanpa diperintah pun, melaporkan dan mencatat kelainan serta hal serah terima yang disadari dari {work} dalam bentuk yang dimengerti penerimanya.","Dapat menilai pokok dan prioritas laporan dan catatan, dan mengajarkan cara membedakan kelainan yang harus disampaikan dan cara menulis catatan kepada karyawan baru."]},{"id":"observe","name":"作業外の観察（豚の異常察知）","kanten":"{work}をしながらも豚全体へ目を配り、発熱・食欲・行動の変化などの異常を早期に察知できるか。","levels":["{work}に気を取られ、豚の様子や周囲の異常に気づかない。","指示されれば豚を見るが、{work}中の異常（発熱・食欲・行動の変化など）を見落としがち。","{work}をしながら豚の目に見える異常に気づき、確かめられる。","{work}中も自然に豚全体へ目を配り、異常の兆候を早期に察知して初期対応・報告できる。","{work}と並行した観察の着眼点を理解し、異常の早期発見のコツを新人に指導できる。"],"name_en":"Observation Beyond the Task (Spotting Pig Abnormalities)","kanten_en":"Can they keep an eye on all the pigs while doing {work} and detect abnormalities such as fever and changes in appetite or behavior early?","levels_en":["Absorbed in {work}, fails to notice the pigs' condition or abnormalities around them.","With guidance watches the pigs, but tends to miss abnormalities during {work} (fever, changes in appetite or behavior, etc.).","Notices visible pig abnormalities while doing {work} and can verify them.","Naturally keeps an eye on all the pigs during {work}, detects early signs of abnormality, and takes initial action and reports.","Understands the observation points to combine with {work}, and can teach new staff the knack of early abnormality detection."],"name_vi":"Quan sát ngoài công việc (nhận biết bất thường của lợn)","kanten_vi":"Vừa làm {work} vừa để mắt đến toàn bộ đàn lợn, có phát hiện sớm bất thường như sốt, thay đổi ăn uống, hành vi không.","levels_vi":["Mải làm {work}, không nhận ra tình trạng lợn hay bất thường xung quanh.","Nếu được chỉ thị thì nhìn lợn, nhưng hay bỏ sót bất thường trong lúc làm {work} (sốt, thay đổi ăn uống, hành vi v.v.).","Vừa làm {work} vừa nhận ra và kiểm tra được bất thường nhìn thấy của lợn.","Trong lúc làm {work} vẫn tự nhiên để mắt đến toàn đàn, phát hiện sớm dấu hiệu bất thường, xử lý ban đầu và báo cáo được.","Hiểu các điểm cần nhìn khi quan sát song song với {work}, và có thể hướng dẫn người mới mẹo phát hiện sớm bất thường."],"name_id":"Pengamatan di luar pekerjaan (menyadari kelainan babi)","kanten_id":"Apakah sambil melakukan {work} tetap memperhatikan seluruh babi, dan dapat menyadari sejak dini kelainan seperti demam, nafsu makan, dan perubahan tingkah laku?","levels_id":["Terlalu sibuk dengan {work}, dan tidak menyadari keadaan babi dan kelainan di sekitarnya.","Melihat babi jika diperintah, tetapi cenderung melewatkan kelainan saat {work} (demam, nafsu makan, perubahan tingkah laku, dan lainnya).","Sambil melakukan {work}, dapat menyadari dan memastikan kelainan babi yang terlihat mata.","Selama {work} pun secara alami memperhatikan seluruh babi, menyadari tanda kelainan sejak dini, dan dapat menangani awal serta melapor.","Memahami titik pengamatan yang dilakukan bersamaan dengan {work}, dan dapat mengajarkan cara menemukan kelainan sejak dini kepada karyawan baru."]}],"categories":[{"id":"feeding","name":"飼養管理","name_en":"Feeding Management","name_vi":"Quản lý chăn nuôi","name_id":"Manajemen pemeliharaan"},{"id":"hygiene","name":"衛生管理","name_en":"Hygiene Management","name_vi":"Quản lý vệ sinh","name_id":"Manajemen kebersihan"},{"id":"breeding","name":"繁殖管理","name_en":"Breeding Management","name_vi":"Quản lý sinh sản","name_id":"Manajemen reproduksi"},{"id":"farrowing","name":"分娩管理","name_en":"Farrowing Management","name_vi":"Quản lý sinh đẻ","name_id":"Manajemen kelahiran"},{"id":"facility","name":"施設管理","name_en":"Facility Management","name_vi":"Quản lý chuồng trại, thiết bị","name_id":"Manajemen fasilitas"},{"id":"record","name":"記録管理","name_en":"Record Management","name_vi":"Quản lý ghi chép","name_id":"Manajemen pencatatan"},{"id":"shipping","name":"出荷管理","name_en":"Shipping Management","name_vi":"Quản lý xuất chuồng","name_id":"Manajemen pengiriman"}],"works":[{"id":"feeding-daily","category":"feeding","no":"No.11","name":"給餌","purposeShort":"成長・繁殖を安定させ、全頭がムラなく食べ、ムダな飼料を出さない","aspects":[{"id":"amount","name":"給与量の管理と個体・季節調整","kanten":"決められた給与量を守りつつ、豚の状態や季節に応じて過不足なく調整できるか。","levels":["決められた量を守らず目分量で与え、豚の状態や季節の違いを考えずに一律に給餌する。","指示があれば決められた量を与えられるが、季節や個体差に応じた調整は他者まかせで、過不足が出やすい。","指示があれば決められた量を守り、暑い時期や豚の状態に応じてある程度の増減ができる。","指示がなくても食い込みや季節を見て量を細かく加減し、食下量の低下があれば原因を探って対応する。","給与量が成長・繁殖に与える影響を理解し、体況・季節・ステージに合わせて最適化し、調整の考え方を新人に指導できる。"],"name_en":"Feed amount control with individual and seasonal adjustment","kanten_en":"Can they follow the prescribed feed amounts while adjusting appropriately for pig condition and season, without excess or shortage?","levels_en":["Ignores the prescribed amounts and feeds by eye, giving the same amount to all pigs regardless of condition or season.","With guidance, can give the prescribed amount, but leaves seasonal and individual adjustments to others, often causing excess or shortage.","With guidance, follows the prescribed amounts and can make some increases or decreases according to hot weather or pig condition.","Independently fine-tunes amounts based on feed intake and season, and investigates the cause when feed intake drops.","Understands how feed amounts affect growth and reproduction, optimizes them by body condition, season, and stage, and can teach new staff the principles of adjustment."],"name_vi":"Quản lý lượng thức ăn và điều chỉnh theo từng con, theo mùa","kanten_vi":"Có giữ đúng lượng thức ăn quy định, đồng thời điều chỉnh vừa đủ theo tình trạng lợn và theo mùa không.","levels_vi":["Không giữ lượng quy định, cho ăn theo ước lượng bằng mắt, cho ăn giống nhau mà không nghĩ đến tình trạng lợn hay mùa.","Nếu có chỉ dẫn thì cho ăn đúng lượng quy định, nhưng việc điều chỉnh theo mùa hay từng con thì phó mặc cho người khác, dễ bị thừa hoặc thiếu.","Nếu có chỉ dẫn thì giữ đúng lượng quy định, và có thể tăng giảm phần nào theo mùa nóng hoặc tình trạng lợn.","Không cần chỉ dẫn cũng nhìn mức ăn và mùa để điều chỉnh lượng một cách tỉ mỉ; nếu lợn ăn ít đi thì tìm nguyên nhân và xử lý.","Hiểu lượng thức ăn ảnh hưởng đến tăng trưởng và sinh sản, tối ưu theo thể trạng, mùa và giai đoạn, và có thể hướng dẫn người mới cách điều chỉnh."],"name_id":"Pengelolaan jumlah pakan dan penyesuaian per individu dan musim","kanten_id":"Apakah bisa mengikuti jumlah pakan yang ditentukan, dan menyesuaikannya dengan tepat sesuai kondisi babi dan musim.","levels_id":["Tidak mengikuti jumlah yang ditentukan, memberi pakan dengan kira-kira saja, dan memberi jumlah yang sama tanpa melihat kondisi babi atau musim.","Jika ada instruksi bisa memberi jumlah yang ditentukan, tetapi penyesuaian menurut musim atau perbedaan individu diserahkan ke orang lain, sehingga sering kelebihan atau kekurangan.","Jika ada instruksi, bisa mengikuti jumlah yang ditentukan dan bisa menambah atau mengurangi sedikit sesuai musim panas atau kondisi babi.","Tanpa instruksi pun, bisa mengatur jumlah pakan dengan teliti sambil melihat nafsu makan dan musim, dan jika konsumsi pakan turun, mencari penyebabnya lalu menanganinya.","Memahami pengaruh jumlah pakan terhadap pertumbuhan dan reproduksi, mengoptimalkannya sesuai kondisi tubuh, musim, dan tahap produksi, serta bisa mengajari karyawan baru cara berpikir penyesuaiannya."]},{"id":"residue-water","name":"残餌と給水の確認","kanten":"残餌の有無・変質と、給水器の流量を毎回確認し、飲水不足や飼料ロスを防げるか。","levels":["残餌や給水器の不具合を確認せず、飼料ロスや飲水不足を放置する。高温期の変質・カビにも気づかない。","指示があれば残餌を片づけるが、給水器の流量確認や槽内飼料の傷みの点検に漏れが多い。","指示があれば残餌を確認して片づけ、給水器から水が出ているかを確かめられる。","指示がなくても毎回残餌の量と傷みを確かめ、給水器の流量を点検し、飲水不足による食い込み低下を防ぐ。","残餌量・飲水量を給餌量の見直しに結びつけ、高温期の変質対策まで判断し、確認の要点を新人に指導できる。"],"name_en":"Checking leftover feed and water supply","kanten_en":"Can they check for leftover feed, spoilage, and drinker flow rate at every feeding to prevent water shortage and feed loss?","levels_en":["Does not check leftover feed or drinker problems, leaving feed loss and water shortage unaddressed; fails to notice spoilage or mold in hot weather.","With guidance, clears leftover feed, but often misses checking drinker flow rates and spoiled feed in the trough.","With guidance, checks and clears leftover feed and can confirm that water comes out of the drinkers.","Independently checks the amount and condition of leftover feed at every feeding, inspects drinker flow rates, and prevents reduced feed intake caused by water shortage.","Links leftover feed and water intake to feed amount reviews, makes decisions on spoilage countermeasures in hot weather, and can teach new staff the key checkpoints."],"name_vi":"Kiểm tra thức ăn thừa và nước uống","kanten_vi":"Mỗi lần có kiểm tra thức ăn thừa, thức ăn bị hỏng và lưu lượng núm uống nước, để tránh lợn thiếu nước và lãng phí thức ăn không.","levels_vi":["Không kiểm tra thức ăn thừa hay núm uống nước hỏng, bỏ mặc lãng phí thức ăn và thiếu nước. Mùa nóng thức ăn hỏng, mốc cũng không nhận ra.","Nếu có chỉ dẫn thì dọn thức ăn thừa, nhưng hay bỏ sót việc kiểm tra lưu lượng nước và thức ăn hỏng trong máng.","Nếu có chỉ dẫn thì kiểm tra và dọn thức ăn thừa, xác nhận được nước có chảy ra từ núm uống không.","Không cần chỉ dẫn cũng kiểm tra lượng và độ hỏng của thức ăn thừa mỗi lần, kiểm tra lưu lượng núm uống, phòng lợn ăn ít do thiếu nước.","Biết dùng lượng thức ăn thừa và lượng nước uống để xem lại lượng cho ăn, biết cách chống thức ăn hỏng mùa nóng, và có thể hướng dẫn người mới các điểm cần kiểm tra."],"name_id":"Pemeriksaan sisa pakan dan air minum","kanten_id":"Apakah setiap kali memeriksa ada tidaknya sisa pakan dan kerusakannya serta aliran air di nipple, sehingga bisa mencegah kekurangan air minum dan pemborosan pakan.","levels_id":["Tidak memeriksa sisa pakan atau kerusakan nipple air minum, membiarkan pakan terbuang dan babi kekurangan air. Tidak sadar pakan rusak atau berjamur di musim panas.","Jika ada instruksi bisa membereskan sisa pakan, tetapi sering lupa memeriksa aliran air nipple dan kerusakan pakan di dalam tempat pakan.","Jika ada instruksi, bisa memeriksa dan membereskan sisa pakan, serta memastikan air keluar dari nipple air minum.","Tanpa instruksi pun, setiap kali memeriksa jumlah dan kerusakan sisa pakan, memeriksa aliran air nipple, dan mencegah turunnya nafsu makan karena kekurangan air minum.","Menghubungkan jumlah sisa pakan dan konsumsi air dengan peninjauan jumlah pakan, bisa memutuskan langkah pencegahan pakan rusak di musim panas, dan bisa mengajari karyawan baru poin-poin pemeriksaannya."]}],"gyomu":"11","name_en":"Feeding","purposeShort_en":"Stabilize growth and reproduction, ensure all pigs eat evenly, and avoid feed waste","name_vi":"Cho ăn","purposeShort_vi":"Giúp lợn lớn và sinh sản ổn định, cả đàn ăn đều nhau, không lãng phí thức ăn","name_id":"Pemberian pakan","purposeShort_id":"Menstabilkan pertumbuhan dan reproduksi, semua babi makan merata, tidak ada pakan terbuang"},{"id":"feed-adjust","category":"feeding","no":"No.02","name":"エサ調整","purposeShort":"BCS・生理ステージに応じて栄養過不足を防ぎ、繁殖成績を高める","aspects":[{"id":"stage-timing","name":"ステージ・時期に合わせた調整","kanten":"妊娠・泌乳などの生理ステージと正しい時期を見て、適切な段階で給与を変えられるか。","levels":["ステージや時期を考えず、いつも同じ与え方をする。切り替えの時期を外しても気にしない。","指示があれば切り替えられるが、ステージ移行の時期が遅れがちで、判断は他者まかせ。","指示があれば生理ステージに応じた時期にエサ量を切り替えられる。","指示がなくてもステージの移行を見越して適切な時期に調整し、増量中は餌残しに注意する。","不適切な時期の調整が逆効果になることを理解し、ステージごとに最適な時期と量を判断し、新人に指導できる。"],"name_en":"Adjustment by stage and timing","kanten_en":"Can they observe physiological stages such as gestation and lactation and change feeding at the appropriate step and correct timing?","levels_en":["Feeds the same way at all times without considering stage or timing, and does not care about missing the switch-over timing.","With guidance, can switch feed, but stage transitions tend to be late and judgment is left to others.","With guidance, can switch feed amounts at the timing appropriate to the physiological stage.","Independently anticipates stage transitions, adjusts at the appropriate timing, and watches for feed refusals during increases.","Understands that adjustment at the wrong timing can backfire, judges the optimal timing and amount for each stage, and can teach new staff."],"name_vi":"Điều chỉnh theo giai đoạn và thời điểm","kanten_vi":"Có nhìn giai đoạn sinh lý như mang thai, nuôi con và đúng thời điểm, để thay đổi lượng cho ăn ở bước phù hợp không.","levels_vi":["Không nghĩ đến giai đoạn hay thời điểm, lúc nào cũng cho ăn giống nhau. Lỡ thời điểm chuyển đổi cũng không quan tâm.","Nếu có chỉ dẫn thì chuyển đổi được, nhưng hay bị trễ thời điểm chuyển giai đoạn, việc phán đoán phó mặc cho người khác.","Nếu có chỉ dẫn thì chuyển đổi lượng thức ăn đúng thời điểm theo giai đoạn sinh lý.","Không cần chỉ dẫn cũng nhìn trước việc chuyển giai đoạn để điều chỉnh đúng lúc, khi tăng lượng thì chú ý thức ăn bị bỏ thừa.","Hiểu rằng điều chỉnh sai thời điểm sẽ phản tác dụng, biết phán đoán thời điểm và lượng tốt nhất cho từng giai đoạn, và có thể hướng dẫn người mới."],"name_id":"Penyesuaian sesuai tahap dan waktu","kanten_id":"Apakah bisa mengubah pemberian pakan pada tahap yang tepat, dengan melihat tahap fisiologis seperti bunting dan menyusui serta waktu yang benar.","levels_id":["Selalu memberi pakan dengan cara yang sama tanpa memikirkan tahap atau waktu. Tidak peduli walau melewatkan waktu penggantian pakan.","Jika ada instruksi bisa mengganti pakan, tetapi waktu perpindahan tahap sering terlambat dan keputusan diserahkan ke orang lain.","Jika ada instruksi, bisa mengganti jumlah pakan pada waktu yang sesuai dengan tahap fisiologis.","Tanpa instruksi pun, bisa mengantisipasi perpindahan tahap dan menyesuaikan pada waktu yang tepat, serta memperhatikan sisa pakan saat jumlah pakan sedang dinaikkan.","Memahami bahwa penyesuaian pada waktu yang salah bisa berakibat sebaliknya, bisa menentukan waktu dan jumlah terbaik untuk tiap tahap, dan bisa mengajari karyawan baru."]},{"id":"individual","name":"個体差・体重に応じた加減","kanten":"体重やBCSを見て一頭ごとに給与を加減し、日齢だけで一律に判断しないか。","levels":["個体差を見ずに全頭一律に与え、痩せ・過肥があっても気づかない。","指示があれば極端な個体には対応するが、体重を確かめず日齢だけで切り替えることが多い。","指示があれば体重やBCSを確かめ、痩せ・過肥の個体を見分けられる。","指示がなくても一頭ごとに体重・BCSを見て給与量を加減し、痩せすぎ・太りすぎを防ぐ。","体重・BCS・産次を総合して細かく最適化し、個体に応じた加減の目安を新人に指導できる。"],"name_en":"Adjustment by individual variation and body weight","kanten_en":"Do they adjust feeding for each pig based on body weight and BCS, rather than judging uniformly by age in days alone?","levels_en":["Feeds all pigs uniformly without looking at individual differences, and fails to notice thin or over-conditioned animals.","With guidance, handles extreme individuals, but often switches feed based on age in days alone without checking body weight.","With guidance, checks body weight and BCS and can identify thin and over-conditioned individuals.","Independently adjusts feed amounts for each pig based on body weight and BCS, preventing animals from becoming too thin or too fat.","Fine-tunes feeding by integrating body weight, BCS, and parity, and can teach new staff the guidelines for individual adjustment."],"name_vi":"Tăng giảm theo từng con và theo cân nặng","kanten_vi":"Có nhìn cân nặng và BCS để tăng giảm lượng cho từng con, không phán đoán đồng loạt chỉ theo tuổi ngày không.","levels_vi":["Không nhìn sự khác nhau giữa các con, cho ăn đồng loạt như nhau, có con gầy hay quá béo cũng không nhận ra.","Nếu có chỉ dẫn thì xử lý được những con quá gầy hoặc quá béo rõ rệt, nhưng thường không kiểm tra cân nặng mà chỉ chuyển đổi theo tuổi ngày.","Nếu có chỉ dẫn thì kiểm tra cân nặng và BCS, phân biệt được con gầy và con quá béo.","Không cần chỉ dẫn cũng nhìn cân nặng và BCS của từng con để tăng giảm lượng thức ăn, phòng lợn quá gầy hoặc quá béo.","Tổng hợp cân nặng, BCS và lứa đẻ để tối ưu tỉ mỉ, và có thể hướng dẫn người mới tiêu chuẩn tăng giảm theo từng con."],"name_id":"Penyesuaian menurut perbedaan individu dan berat badan","kanten_id":"Apakah menambah atau mengurangi pakan per ekor dengan melihat berat badan dan BCS, tanpa memutuskan seragam hanya berdasarkan umur (hari).","levels_id":["Memberi pakan seragam ke semua babi tanpa melihat perbedaan individu, dan tidak sadar walau ada babi yang kurus atau terlalu gemuk.","Jika ada instruksi bisa menangani individu yang ekstrem, tetapi sering mengganti pakan hanya berdasarkan umur (hari) tanpa memeriksa berat badan.","Jika ada instruksi, bisa memeriksa berat badan dan BCS, serta membedakan babi yang kurus dan yang terlalu gemuk.","Tanpa instruksi pun, bisa menambah atau mengurangi jumlah pakan per ekor dengan melihat berat badan dan BCS, sehingga mencegah babi terlalu kurus atau terlalu gemuk.","Bisa mengoptimalkan pakan secara rinci dengan mempertimbangkan berat badan, BCS, dan paritas, serta bisa mengajari karyawan baru patokan penyesuaian per individu."]}],"gyomu":"02","name_en":"Feed adjustment","purposeShort_en":"Prevent nutritional excess or deficiency according to BCS and physiological stage, and improve reproductive performance","name_vi":"Điều chỉnh lượng thức ăn","purposeShort_vi":"Tránh thừa hoặc thiếu dinh dưỡng theo BCS (điểm thể trạng) và giai đoạn sinh lý, nâng cao thành tích sinh sản","name_id":"Penyesuaian Jumlah Pakan","purposeShort_id":"Mencegah kelebihan atau kekurangan gizi sesuai BCS dan tahap fisiologis, meningkatkan hasil reproduksi"},{"id":"feed-adjust-detail","category":"feeding","no":"No.38","name":"エサ調整（詳細）","purposeShort":"体重・BCS・産次を見て調整し、痩せ・過肥を防ぎ農場目標に合わせる","aspects":[{"id":"gradual","name":"段階的な増減","kanten":"エサ量を急に変えず少しずつ増減し、急な変化による食欲低下を防げるか。","levels":["エサ量を一気に増減し、食欲低下を招いても気にしない。","指示があれば増減するが、変化幅が大きく食欲を落とすことがある。","指示があればエサ量を少しずつ増減できる。","指示がなくても食い込みを見ながら段階的に増減し、急な変化を避ける。","急な増減が消化器や食欲に与える影響を理解し、段階的な調整幅を判断して新人に指導できる。"],"name_en":"Gradual increases and decreases","kanten_en":"Can they change feed amounts gradually rather than abruptly, preventing appetite loss caused by sudden changes?","levels_en":["Increases or decreases feed all at once and does not care even when this causes appetite loss.","With guidance, adjusts feed, but the changes are too large and sometimes reduce appetite.","With guidance, can increase or decrease feed amounts little by little.","Independently adjusts feed in gradual steps while watching feed intake, avoiding sudden changes.","Understands how sudden changes affect the digestive system and appetite, judges appropriate step sizes for adjustment, and can teach new staff."],"name_vi":"Tăng giảm từng bước","kanten_vi":"Có tăng giảm lượng thức ăn từng chút một, không thay đổi đột ngột, để tránh lợn chán ăn do thay đổi nhanh không.","levels_vi":["Tăng giảm lượng thức ăn một lúc quá nhiều, làm lợn chán ăn cũng không quan tâm.","Nếu có chỉ dẫn thì tăng giảm được, nhưng mức thay đổi lớn, có khi làm lợn chán ăn.","Nếu có chỉ dẫn thì có thể tăng giảm lượng thức ăn từng chút một.","Không cần chỉ dẫn cũng vừa nhìn mức ăn vừa tăng giảm từng bước, tránh thay đổi đột ngột.","Hiểu việc tăng giảm đột ngột ảnh hưởng đến tiêu hóa và sự thèm ăn, biết phán đoán mức điều chỉnh từng bước và có thể hướng dẫn người mới."],"name_id":"Penambahan dan pengurangan bertahap","kanten_id":"Apakah bisa menambah atau mengurangi jumlah pakan sedikit demi sedikit, tidak mengubahnya mendadak, sehingga mencegah turunnya nafsu makan karena perubahan tiba-tiba.","levels_id":["Menambah atau mengurangi jumlah pakan sekaligus, dan tidak peduli walau menyebabkan nafsu makan turun.","Jika ada instruksi bisa menambah atau mengurangi, tetapi perubahannya terlalu besar sehingga kadang menurunkan nafsu makan.","Jika ada instruksi, bisa menambah atau mengurangi jumlah pakan sedikit demi sedikit.","Tanpa instruksi pun, menambah atau mengurangi secara bertahap sambil melihat nafsu makan, dan menghindari perubahan mendadak.","Memahami pengaruh perubahan mendadak terhadap pencernaan dan nafsu makan, bisa menentukan besarnya penyesuaian bertahap, dan bisa mengajari karyawan baru."]},{"id":"parity-season","name":"産次・季節への配慮","kanten":"産次の違いや夏季の食い込み低下を考え、量だけでなく回数や時間帯でも対応できるか。","levels":["産次の違いや季節を無視して与え、夏季の食い込み低下を量の増加だけで対応し残餌を増やす。","指示があれば産次や季節をある程度考えるが、多産系母豚の泌乳量増大への対応に漏れが多い。","指示があれば産次や季節を考えて量を調整できる。","指示がなくても産次差・多産系の泌乳量を考え、夏季は給与時間や回数を工夫して食下量を確保する。","産次・泌乳量・季節を総合して給与設計を最適化し、残餌を抑える工夫を新人に指導できる。"],"name_en":"Consideration of parity and season","kanten_en":"Can they account for parity differences and reduced summer feed intake, responding not only with amount but also with feeding frequency and timing?","levels_en":["Ignores parity differences and season, responds to reduced summer intake only by increasing amounts, and increases leftover feed.","With guidance, gives some consideration to parity and season, but often fails to address the increased milk production of hyperprolific sows.","With guidance, can adjust amounts with parity and season in mind.","Independently considers parity differences and the milk output of hyperprolific sows, and secures feed intake in summer by adjusting feeding times and frequency.","Optimizes the feeding plan by integrating parity, milk production, and season, and can teach new staff techniques for minimizing leftover feed."],"name_vi":"Chú ý đến lứa đẻ và mùa","kanten_vi":"Có nghĩ đến sự khác nhau theo lứa đẻ và việc lợn ăn ít vào mùa hè, xử lý không chỉ bằng lượng mà cả số bữa và giờ cho ăn không.","levels_vi":["Bỏ qua lứa đẻ và mùa, mùa hè lợn ăn ít thì chỉ tăng lượng, làm tăng thức ăn thừa.","Nếu có chỉ dẫn thì có nghĩ phần nào đến lứa đẻ và mùa, nhưng hay bỏ sót việc xử lý khi lợn nái nhiều con tiết sữa nhiều hơn.","Nếu có chỉ dẫn thì điều chỉnh được lượng theo lứa đẻ và mùa.","Không cần chỉ dẫn cũng nghĩ đến sự khác nhau theo lứa đẻ và lượng sữa của nái nhiều con; mùa hè thì thay đổi giờ và số bữa cho ăn để lợn ăn đủ.","Tổng hợp lứa đẻ, lượng sữa và mùa để tối ưu cách cho ăn, và có thể hướng dẫn người mới cách giảm thức ăn thừa."],"name_id":"Perhatian pada paritas dan musim","kanten_id":"Apakah mempertimbangkan perbedaan paritas dan turunnya nafsu makan di musim panas, dan bisa menanganinya bukan hanya dengan jumlah tetapi juga dengan frekuensi dan jam pemberian.","levels_id":["Memberi pakan tanpa peduli perbedaan paritas atau musim, dan mengatasi turunnya nafsu makan di musim panas hanya dengan menambah jumlah sehingga sisa pakan bertambah.","Jika ada instruksi bisa sedikit mempertimbangkan paritas dan musim, tetapi sering lalai menangani produksi susu yang besar pada induk babi tipe prolifik (banyak anak).","Jika ada instruksi, bisa menyesuaikan jumlah pakan dengan mempertimbangkan paritas dan musim.","Tanpa instruksi pun, mempertimbangkan perbedaan paritas dan produksi susu induk tipe prolifik, dan di musim panas mengatur jam serta frekuensi pemberian agar konsumsi pakan terjaga.","Bisa mengoptimalkan rancangan pemberian pakan dengan mempertimbangkan paritas, produksi susu, dan musim secara menyeluruh, serta bisa mengajari karyawan baru cara menekan sisa pakan."]}],"gyomu":"38","name_en":"Feed adjustment (advanced)","purposeShort_en":"Adjust based on body weight, BCS, and parity to prevent thinness and over-conditioning, in line with farm targets","name_vi":"Điều chỉnh thức ăn (chi tiết)","purposeShort_vi":"Nhìn cân nặng, BCS và lứa đẻ để điều chỉnh, tránh lợn gầy hoặc quá béo, đạt mục tiêu của trại","name_id":"Penyesuaian pakan (rinci)","purposeShort_id":"Menyesuaikan dengan melihat berat badan, BCS, dan paritas, mencegah babi kurus atau terlalu gemuk, sesuai target peternakan"},{"id":"feed-recovery","category":"feeding","no":"No.16","name":"エサ回収","purposeShort":"病気・腐敗リスクを減らし飼料コストを削減し、給餌量見直しに役立てる","aspects":[{"id":"spoilage","name":"変質餌の見分けと短時間回収","kanten":"カビ・腐敗した残餌を再利用せず、回収・保管を短時間で行い変質を防げるか。","levels":["カビや腐敗した残餌を再利用し、回収後も常温で長時間放置して変質させる。","指示があれば回収するが、変質の見分けが甘く、放置時間が長くなりがち。","指示があればカビ・腐敗した残餌を見分けて分け、短時間で回収できる。","指示がなくても変質を見分けて再利用せず、回収・保管を短時間で済ませる。","変質が病気・腐敗リスクにつながることを理解し、回収の手順を最適化して新人に指導できる。"],"name_en":"Identifying spoiled feed and quick recovery","kanten_en":"Can they avoid reusing moldy or rotten leftover feed and complete recovery and storage quickly to prevent spoilage?","levels_en":["Reuses moldy or rotten leftover feed and leaves recovered feed at room temperature for long periods, letting it spoil.","With guidance, recovers feed, but is poor at identifying spoilage and tends to leave feed standing too long.","With guidance, can identify and separate moldy or rotten leftover feed and recover it quickly.","Independently identifies spoiled feed, avoids reusing it, and completes recovery and storage in a short time.","Understands that spoilage leads to disease and decay risk, optimizes the recovery procedure, and can teach new staff."],"name_vi":"Phân biệt thức ăn hỏng và thu gom nhanh","kanten_vi":"Có tránh dùng lại thức ăn thừa bị mốc, thối, và thu gom, cất giữ trong thời gian ngắn để tránh hỏng thêm không.","levels_vi":["Dùng lại thức ăn thừa bị mốc hoặc thối; sau khi thu gom lại để lâu ở nhiệt độ thường làm hỏng thêm.","Nếu có chỉ dẫn thì thu gom, nhưng phân biệt thức ăn hỏng còn kém, hay để lâu.","Nếu có chỉ dẫn thì phân biệt và tách được thức ăn thừa bị mốc, thối, thu gom trong thời gian ngắn.","Không cần chỉ dẫn cũng phân biệt thức ăn hỏng và không dùng lại, thu gom và cất giữ nhanh gọn.","Hiểu thức ăn hỏng dẫn đến nguy cơ bệnh và thối rữa, biết tối ưu quy trình thu gom và có thể hướng dẫn người mới."],"name_id":"Mengenali pakan rusak dan pengumpulan cepat","kanten_id":"Apakah tidak memakai ulang sisa pakan yang berjamur atau busuk, dan bisa mengumpulkan serta menyimpannya dalam waktu singkat agar tidak rusak.","levels_id":["Memakai ulang sisa pakan yang berjamur atau busuk, dan setelah dikumpulkan dibiarkan lama di suhu ruang sampai rusak.","Jika ada instruksi bisa mengumpulkan, tetapi kurang teliti mengenali pakan rusak dan cenderung membiarkannya terlalu lama.","Jika ada instruksi, bisa mengenali dan memisahkan sisa pakan yang berjamur atau busuk, serta mengumpulkannya dalam waktu singkat.","Tanpa instruksi pun, mengenali pakan rusak dan tidak memakainya ulang, serta menyelesaikan pengumpulan dan penyimpanan dalam waktu singkat.","Memahami bahwa pakan rusak berhubungan dengan risiko penyakit dan pembusukan, bisa mengoptimalkan urutan pengumpulan, dan bisa mengajari karyawan baru."]},{"id":"dedicated-tools","name":"専用容器・器具の管理","kanten":"回収用の容器・器具を専用にして洗い、他用途転用や豚房間共用による交差汚染を防げるか。","levels":["他用途のバケツを転用し、器具を豚房間で使い回して交差汚染・病原伝播を招く。","指示があれば専用容器を使うが、洗浄や豚房ごとの使い分けに漏れがある。","指示があれば回収用の専用容器・器具を使い、使用後に洗える。","指示がなくても専用容器を清潔に保ち、豚房間の共用を避けて交差汚染を防ぐ。","交差汚染・病原伝播の仕組みを理解し、容器・器具の管理ルールを新人に指導できる。"],"name_en":"Management of dedicated containers and tools","kanten_en":"Can they keep recovery containers and tools dedicated and washed, preventing cross-contamination from repurposing or sharing between pens?","levels_en":["Repurposes buckets from other uses and shares tools between pens, causing cross-contamination and pathogen spread.","With guidance, uses dedicated containers, but is inconsistent about washing and keeping tools separate per pen.","With guidance, uses dedicated recovery containers and tools and can wash them after use.","Independently keeps dedicated containers clean and avoids sharing between pens, preventing cross-contamination.","Understands the mechanisms of cross-contamination and pathogen spread, and can teach new staff the rules for managing containers and tools."],"name_vi":"Quản lý thùng và dụng cụ chuyên dùng","kanten_vi":"Có dùng thùng và dụng cụ chuyên cho việc thu gom, rửa sạch sau khi dùng, tránh lây nhiễm chéo do dùng chung giữa các ô chuồng hoặc dùng sang việc khác không.","levels_vi":["Lấy xô của việc khác sang dùng, dùng chung dụng cụ giữa các ô chuồng lợn, gây lây nhiễm chéo và lan truyền mầm bệnh.","Nếu có chỉ dẫn thì dùng thùng chuyên dùng, nhưng có bỏ sót việc rửa và việc dùng riêng theo từng ô chuồng.","Nếu có chỉ dẫn thì dùng thùng và dụng cụ chuyên cho thu gom, rửa được sau khi dùng.","Không cần chỉ dẫn cũng giữ thùng chuyên dùng sạch sẽ, tránh dùng chung giữa các ô chuồng để phòng lây nhiễm chéo.","Hiểu cơ chế lây nhiễm chéo và lan truyền mầm bệnh, và có thể hướng dẫn người mới quy tắc quản lý thùng, dụng cụ."],"name_id":"Pengelolaan wadah dan alat khusus","kanten_id":"Apakah memakai wadah dan alat khusus untuk pengumpulan lalu mencucinya, sehingga mencegah kontaminasi silang karena dipakai untuk keperluan lain atau dipakai bergantian antar petak kandang.","levels_id":["Memakai ember bekas keperluan lain, dan memakai alat bergantian antar petak kandang sehingga menyebabkan kontaminasi silang dan penyebaran bibit penyakit.","Jika ada instruksi bisa memakai wadah khusus, tetapi sering lalai mencuci atau memisahkan pemakaian per petak kandang.","Jika ada instruksi, bisa memakai wadah dan alat khusus untuk pengumpulan, serta mencucinya setelah dipakai.","Tanpa instruksi pun, menjaga wadah khusus tetap bersih dan menghindari pemakaian bergantian antar petak kandang sehingga mencegah kontaminasi silang.","Memahami mekanisme kontaminasi silang dan penyebaran bibit penyakit, dan bisa mengajari karyawan baru aturan pengelolaan wadah dan alat."]}],"gyomu":"16","name_en":"Feed recovery","purposeShort_en":"Reduce disease and spoilage risk, cut feed costs, and inform feed amount reviews","name_vi":"Thu gom thức ăn thừa","purposeShort_vi":"Giảm nguy cơ bệnh và thức ăn thối hỏng, giảm chi phí thức ăn, giúp xem lại lượng cho ăn","name_id":"Mengumpulkan sisa pakan","purposeShort_id":"Mengurangi risiko penyakit dan pembusukan, menekan biaya pakan, dan membantu peninjauan jumlah pakan"},{"id":"nursing-feed","category":"feeding","no":"No.43","name":"えつけ（哺乳期給餌）","purposeShort":"泌乳量を確保し、子豚の離乳頭数・体重を高め、母豚の削痩を防ぐ","aspects":[{"id":"gradual-lactation","name":"分娩後の段階的増給と暑熱対応","kanten":"分娩後は少量から段階的に増やし、暑熱時は回数を増やして食下量を確保できるか。","levels":["分娩後にいきなり多く与える、または暑熱時に回数を増やさず食下量を落とす。","指示があれば段階的に増やすが、暑熱時の回数調整や水の確保に漏れがある。","指示があれば分娩後は少量から段階的に増やし、水が飲める状態を保てる。","指示がなくても食い込みを見て段階的に増やし、暑熱時は回数を増やして食下量を確保する。","泌乳量と母豚の削痩・次回繁殖の関係を理解し、給餌設計を最適化して新人に指導できる。"],"name_en":"Gradual increase after farrowing and heat stress response","kanten_en":"Can they increase feed gradually from small amounts after farrowing, and increase feeding frequency in hot weather to maintain feed intake?","levels_en":["Gives large amounts right after farrowing, or fails to increase feeding frequency in hot weather, reducing feed intake.","With guidance, increases feed gradually, but is inconsistent about adjusting frequency in hot weather and securing water.","With guidance, increases feed gradually from small amounts after farrowing and keeps water available.","Independently increases feed step by step while watching intake, and raises feeding frequency in hot weather to maintain feed intake.","Understands the relationship between milk production, sow body condition loss, and the next breeding cycle, optimizes the feeding plan, and can teach new staff."],"name_vi":"Tăng dần thức ăn sau đẻ và ứng phó nắng nóng","kanten_vi":"Sau khi đẻ có cho ăn từ ít rồi tăng dần từng bước, khi nắng nóng có tăng số bữa để lợn ăn đủ không.","levels_vi":["Sau khi đẻ cho ăn nhiều ngay một lúc, hoặc khi nắng nóng không tăng số bữa làm lợn ăn ít đi.","Nếu có chỉ dẫn thì tăng dần được, nhưng có bỏ sót việc điều chỉnh số bữa khi nắng nóng và việc bảo đảm nước uống.","Nếu có chỉ dẫn thì sau khi đẻ cho ăn từ ít rồi tăng dần, giữ được trạng thái lợn luôn uống được nước.","Không cần chỉ dẫn cũng nhìn mức ăn để tăng dần từng bước, khi nắng nóng thì tăng số bữa để lợn ăn đủ.","Hiểu quan hệ giữa lượng sữa với việc nái gầy sút và lứa sinh sản tiếp theo, biết tối ưu cách cho ăn và có thể hướng dẫn người mới."],"name_id":"Penambahan bertahap setelah melahirkan dan penanganan cuaca panas","kanten_id":"Apakah setelah melahirkan menambah pakan bertahap mulai dari sedikit, dan saat cuaca panas menambah frekuensi pemberian agar konsumsi pakan terjaga.","levels_id":["Langsung memberi banyak pakan setelah melahirkan, atau saat cuaca panas tidak menambah frekuensi sehingga konsumsi pakan turun.","Jika ada instruksi bisa menambah bertahap, tetapi sering lalai mengatur frekuensi saat cuaca panas dan memastikan a
