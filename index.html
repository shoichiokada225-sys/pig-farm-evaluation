ir minum.","Jika ada instruksi, bisa menambah pakan bertahap mulai dari sedikit setelah melahirkan, dan menjaga agar induk selalu bisa minum air.","Tanpa instruksi pun, menambah pakan bertahap sambil melihat nafsu makan, dan saat cuaca panas menambah frekuensi pemberian agar konsumsi pakan terjaga.","Memahami hubungan produksi susu dengan menurunnya kondisi tubuh induk dan reproduksi berikutnya, bisa mengoptimalkan rancangan pemberian pakan, dan bisa mengajari karyawan baru."]},{"id":"colostrum-balance","name":"産子数と乳頭数のバランス管理","kanten":"産子数と乳頭数の差を確認し、初乳未摂取子豚や泌乳不全乳頭を見落とさず対応できるか。","levels":["産子数と乳頭数の差を確認せず、初乳を飲めない子豚や泌乳不全の乳頭を放置する。","指示があれば確認するが、分割授乳や弱い子豚の固定に漏れが多い。","指示があれば産子数と乳頭数の差を確かめ、初乳を飲めていない子豚に気づける。","指示がなくても分割授乳を行い、泌乳不全乳頭や発育格差に気づいて弱い子豚を手当てする。","初乳・泌乳と発育格差の関係を理解し、里子や分割授乳の判断を最適化して新人に指導できる。"],"name_en":"Balancing litter size and functional teats","kanten_en":"Can they check the gap between litter size and teat count, and respond without overlooking piglets that missed colostrum or non-functional teats?","levels_en":["Does not check the gap between litter size and teat count, leaving piglets without colostrum and non-lactating teats unattended.","With guidance, checks, but often fails to carry out split suckling or place weak piglets on teats.","With guidance, checks the gap between litter size and teat count and can notice piglets that are not getting colostrum.","Independently performs split suckling, notices non-functional teats and growth disparities, and cares for weak piglets.","Understands the relationship between colostrum, lactation, and growth disparity, optimizes decisions on cross-fostering and split suckling, and can teach new staff."],"name_vi":"Quản lý cân bằng số con đẻ ra và số vú","kanten_vi":"Có kiểm tra chênh lệch giữa số con đẻ ra và số vú, không bỏ sót lợn con chưa bú sữa đầu và vú không tiết sữa, và xử lý được không.","levels_vi":["Không kiểm tra chênh lệch giữa số con đẻ ra và số vú, bỏ mặc lợn con không bú được sữa đầu và vú không tiết sữa.","Nếu có chỉ dẫn thì kiểm tra, nhưng hay bỏ sót việc cho bú theo nhóm chia lượt và việc giữ chỗ bú cho con yếu.","Nếu có chỉ dẫn thì kiểm tra chênh lệch giữa số con đẻ ra và số vú, nhận ra được lợn con chưa bú được sữa đầu.","Không cần chỉ dẫn cũng cho bú theo nhóm chia lượt, nhận ra vú không tiết sữa và sự chênh lệch phát triển, chăm sóc con yếu.","Hiểu quan hệ giữa sữa đầu, tiết sữa và chênh lệch phát triển, biết tối ưu việc ghép bầy và cho bú chia lượt, và có thể hướng dẫn người mới."],"name_id":"Pengelolaan keseimbangan jumlah anak dan jumlah puting","kanten_id":"Apakah memeriksa selisih jumlah anak yang lahir dengan jumlah puting, dan tidak melewatkan anak babi yang belum minum kolostrum atau puting yang tidak mengeluarkan susu.","levels_id":["Tidak memeriksa selisih jumlah anak dan jumlah puting, membiarkan anak babi yang tidak bisa minum kolostrum atau puting yang tidak mengeluarkan susu.","Jika ada instruksi bisa memeriksa, tetapi sering lalai melakukan menyusui bergantian (split suckling) atau memegangi anak yang lemah ke puting.","Jika ada instruksi, bisa memeriksa selisih jumlah anak dan jumlah puting, serta menyadari anak babi yang belum minum kolostrum.","Tanpa instruksi pun, melakukan menyusui bergantian, menyadari puting yang tidak mengeluarkan susu dan perbedaan pertumbuhan, serta menolong anak babi yang lemah.","Memahami hubungan kolostrum dan produksi susu dengan perbedaan pertumbuhan, bisa mengoptimalkan keputusan titip anak ke induk lain dan menyusui bergantian, dan bisa mengajari karyawan baru."]}],"gyomu":"43","name_en":"Lactation feeding","purposeShort_en":"Secure milk production, increase the number and weight of weaned piglets, and prevent sow body condition loss","name_vi":"Tập cho ăn (cho ăn thời kỳ nuôi con bú sữa)","purposeShort_vi":"Bảo đảm lượng sữa, tăng số con và cân nặng lúc cai sữa, tránh lợn nái bị gầy sút","name_id":"Melatih makan (pemberian pakan masa menyusui)","purposeShort_id":"Menjaga produksi susu, meningkatkan jumlah dan berat anak babi saat sapih, dan mencegah induk babi menjadi kurus"},{"id":"grow-handover","category":"feeding","no":"No.27","name":"育成受け","purposeShort":"育成管理への引き継ぎを確実に行う","aspects":[{"id":"info-handover","name":"個体情報の引き継ぎ","kanten":"個体情報を漏れなく伝え、受入れ先が管理を継続できる形で引き継げるか。","levels":["個体情報を伝えず、引き継ぎ漏れがあっても気にしない。","指示されれば伝えるが、内容が不十分で伝達漏れが多い。","指示された個体情報をひと通り伝えて引き継げる。","指示がなくても必要な個体情報を整理し、受入れ先に伝わる形で引き継ぐ。","引き継ぎで漏れやすい情報を把握し、確実な引き継ぎの方法を新人に指導できる。"],"name_en":"Handover of individual animal information","kanten_en":"Can they pass on individual animal information without omissions, in a form that lets the receiving side continue management?","levels_en":["Does not pass on individual animal information and does not care about handover omissions.","Passes information when instructed, but the content is insufficient with many omissions.","With guidance, can pass on the specified individual animal information and complete the handover.","Independently organizes the necessary individual information and hands it over in a form the receiving side can use.","Knows which information is easily missed in handovers and can teach new staff reliable handover methods."],"name_vi":"Bàn giao thông tin từng con","kanten_vi":"Có truyền đạt đầy đủ thông tin từng con, bàn giao theo cách để bên nhận tiếp tục quản lý được không.","levels_vi":["Không truyền đạt thông tin từng con, có sót khi bàn giao cũng không quan tâm.","Nếu được chỉ dẫn thì truyền đạt, nhưng nội dung chưa đủ, hay bị sót thông tin.","Truyền đạt và bàn giao được các thông tin từng con theo chỉ dẫn.","Không cần chỉ dẫn cũng sắp xếp thông tin cần thiết của từng con, bàn giao theo cách bên nhận hiểu được.","Nắm được những thông tin dễ bị sót khi bàn giao, và có thể hướng dẫn người mới cách bàn giao chắc chắn."],"name_id":"Serah terima informasi individu","kanten_id":"Apakah bisa menyampaikan informasi individu tanpa ada yang terlewat, dalam bentuk yang memungkinkan pihak penerima melanjutkan pengelolaan.","levels_id":["Tidak menyampaikan informasi individu, dan tidak peduli walau ada yang terlewat dalam serah terima.","Jika disuruh bisa menyampaikan, tetapi isinya kurang lengkap dan banyak informasi yang tidak tersampaikan.","Bisa menyampaikan dan menyerahterimakan informasi individu yang diinstruksikan secara garis besar.","Tanpa instruksi pun, merapikan informasi individu yang diperlukan dan menyerahterimakannya dalam bentuk yang mudah dipahami pihak penerima.","Mengetahui informasi yang mudah terlewat dalam serah terima, dan bisa mengajari karyawan baru cara serah terima yang pasti."]},{"id":"receiving-env","name":"受入れ環境の事前確認と初期観察","kanten":"受入れ先の水・エサ・温度・群密度を事前に整え、受入後数日の採食・飲水を確認できるか。","levels":["洗浄・消毒や空舎期間を省き、前ロットのままの温度・換気で受け入れ、群密度過多も見落とす。","指示があれば環境を確認するが、受入後の採食・飲水の確認に漏れが多い。","指示があれば受入れ先の水・エサ・温度を事前に確かめられる。","指示がなくても洗浄・消毒・空舎期間をとり、群密度と受入後3日間の採食・飲水を確認する。","病原体持ち越しや群密度過多のリスクを理解し、受入れ環境づくりを最適化して新人に指導できる。"],"name_en":"Pre-checking the receiving environment and initial observation","kanten_en":"Can they prepare water, feed, temperature, and group density at the receiving site in advance, and check eating and drinking for the first days after arrival?","levels_en":["Skips washing, disinfection, and downtime, receives pigs with the previous lot's temperature and ventilation settings, and overlooks overcrowding.","With guidance, checks the environment, but often fails to confirm eating and drinking after arrival.","With guidance, can check water, feed, and temperature at the receiving site in advance.","Independently carries out washing, disinfection, and downtime, and checks group density plus eating and drinking for the first 3 days after arrival.","Understands the risks of pathogen carryover and overcrowding, optimizes preparation of the receiving environment, and can teach new staff."],"name_vi":"Kiểm tra trước môi trường nhận lợn và quan sát ban đầu","kanten_vi":"Có chuẩn bị trước nước, thức ăn, nhiệt độ, mật độ đàn ở nơi nhận lợn, và kiểm tra việc ăn, uống trong vài ngày sau khi nhận không.","levels_vi":["Bỏ qua việc rửa, khử trùng và thời gian để trống chuồng, nhận lợn với nhiệt độ, thông gió còn nguyên như lứa trước, mật độ đàn quá đông cũng bỏ sót.","Nếu có chỉ dẫn thì kiểm tra môi trường, nhưng hay bỏ sót việc kiểm tra ăn, uống sau khi nhận lợn.","Nếu có chỉ dẫn thì kiểm tra trước được nước, thức ăn, nhiệt độ ở nơi nhận lợn.","Không cần chỉ dẫn cũng thực hiện rửa, khử trùng, để trống chuồng, kiểm tra mật độ đàn và việc ăn, uống trong 3 ngày sau khi nhận.","Hiểu nguy cơ mầm bệnh còn sót lại và mật độ đàn quá đông, biết tối ưu việc chuẩn bị môi trường nhận lợn và có thể hướng dẫn người mới."],"name_id":"Pemeriksaan awal lingkungan penerima dan pengamatan awal","kanten_id":"Apakah menyiapkan air, pakan, suhu, dan kepadatan kelompok di tempat penerima sebelumnya, dan memeriksa makan serta minum selama beberapa hari setelah diterima.","levels_id":["Melewatkan pencucian, disinfeksi, dan masa kosong kandang, menerima babi dengan suhu dan ventilasi bekas kelompok sebelumnya, dan tidak sadar kepadatan kelompok berlebih.","Jika ada instruksi bisa memeriksa lingkungan, tetapi sering lalai memeriksa makan dan minum setelah babi diterima.","Jika ada instruksi, bisa memeriksa air, pakan, dan suhu di tempat penerima sebelum babi datang.","Tanpa instruksi pun, melakukan pencucian, disinfeksi, dan masa kosong kandang, serta memeriksa kepadatan kelompok dan makan-minum selama 3 hari setelah diterima.","Memahami risiko bibit penyakit yang terbawa dan kepadatan kelompok berlebih, bisa mengoptimalkan penyiapan lingkungan penerima, dan bisa mengajari karyawan baru."]}],"gyomu":"27","name_en":"Grower intake","purposeShort_en":"Ensure a reliable handover to grower management","name_vi":"Nhận lợn cai sữa vào chuồng cai sữa (bàn giao nuôi dưỡng)","purposeShort_vi":"Bàn giao chắc chắn sang khâu quản lý lợn choai","name_id":"Penerimaan babi sapih ke kandang sapih (serah terima pemeliharaan)","purposeShort_id":"Memastikan serah terima ke pengelolaan pembesaran berjalan dengan pasti"},{"id":"castration","category":"feeding","no":"No.34","name":"去勢","purposeShort":"雄臭のない豚肉を生産し、ケンカ・乗駕を減らし、群管理を安全にする","aspects":[{"id":"age-method","name":"日齢・方法の遵守と短時間実施","kanten":"決められた日齢・方法で、子豚に無理をさせず短時間で去勢できるか。","levels":["日齢や方法を守らず、生後7日を過ぎてから雑に行い、子豚に長く無理をさせる。","指示があれば実施できるが、日齢の判断や手早さに欠け、ストレスをかけがち。","指示があれば決められた日齢・方法でひと通り去勢できる。","指示がなくても適期を見て短時間で行い、子豚への負担を抑える。","日齢超過がストレス・出血を増やすことを理解し、適期と手技を新人に指導できる。"],"name_en":"Following age and method with quick execution","kanten_en":"Can they castrate at the prescribed age in days and by the prescribed method, quickly and without straining the piglets?","levels_en":["Ignores age and method, performs the procedure roughly after 7 days of age, and puts prolonged strain on the piglets.","With guidance, can perform the procedure, but lacks judgment on age and speed, tending to stress the piglets.","With guidance, can castrate adequately at the prescribed age and by the prescribed method.","Independently judges the right timing, works quickly, and keeps the burden on piglets low.","Understands that exceeding the proper age increases stress and bleeding, and can teach new staff the right timing and technique."],"name_vi":"Giữ đúng tuổi ngày, cách làm và thực hiện nhanh gọn","kanten_vi":"Có thiến đúng tuổi ngày và cách làm quy định, thao tác nhanh, không làm lợn con quá sức không.","levels_vi":["Không giữ tuổi ngày và cách làm, làm ẩu sau khi lợn quá 7 ngày tuổi, bắt lợn con chịu đựng lâu.","Nếu có chỉ dẫn thì làm được, nhưng phán đoán tuổi ngày và độ nhanh tay còn kém, dễ gây stress cho lợn.","Nếu có chỉ dẫn thì thiến được các bước cơ bản theo đúng tuổi ngày và cách làm quy định.","Không cần chỉ dẫn cũng nhìn đúng thời kỳ thích hợp, làm nhanh gọn, giảm gánh nặng cho lợn con.","Hiểu việc quá tuổi ngày làm tăng stress và chảy máu, và có thể hướng dẫn người mới thời kỳ thích hợp và kỹ thuật thao tác."],"name_id":"Mematuhi umur dan metode serta pelaksanaan cepat","kanten_id":"Apakah bisa melakukan kastrasi dengan umur (hari) dan metode yang ditentukan, dalam waktu singkat tanpa memaksa anak babi.","levels_id":["Tidak mematuhi umur atau metode, melakukannya dengan kasar setelah lewat umur 7 hari, dan membuat anak babi tersiksa lama.","Jika ada instruksi bisa melaksanakan, tetapi kurang bisa menilai umur dan kurang cekatan sehingga cenderung membuat stres.","Jika ada instruksi, bisa melakukan kastrasi secara garis besar dengan umur dan metode yang ditentukan.","Tanpa instruksi pun, melakukannya pada waktu yang tepat dalam waktu singkat, dan menekan beban pada anak babi.","Memahami bahwa melewati umur yang tepat menambah stres dan pendarahan, dan bisa mengajari karyawan baru waktu yang tepat dan teknik pelaksanaannya."]},{"id":"asepsis-aftercare","name":"清潔な器具と術後の確認","kanten":"器具を1頭ごとに消毒し、術後の切り口の処置と出血・腫れ・元気の確認ができるか。","levels":["器具を1頭ごとに消毒せず使い回し、術後の切り口処置や観察を怠り腹膜炎・感染を招く。","指示があれば消毒するが、術後の消毒薬塗布や観察に漏れが多い。","指示があれば清潔な器具を使い、術後の出血・腫れ・元気をひと通り確認できる。","指示がなくても1頭ごとに器具を消毒し、切り口を処置して術後の観察頻度を増やす。","感染・合併症の仕組みを理解し、無菌操作と術後管理を新人に指導できる。"],"name_en":"Clean instruments and post-operative checks","kanten_en":"Can they disinfect instruments for each animal, treat the incision, and check for bleeding, swelling, and vitality after the procedure?","levels_en":["Reuses instruments without disinfecting between animals and neglects incision care and observation, causing peritonitis and infection.","With guidance, disinfects, but often fails to apply antiseptic to the incision or observe afterward.","With guidance, uses clean instruments and can adequately check bleeding, swelling, and vitality after the procedure.","Independently disinfects instruments between each animal, treats the incision, and increases the frequency of post-operative observation.","Understands the mechanisms of infection and complications, and can teach new staff aseptic technique and post-operative management."],"name_vi":"Dụng cụ sạch và kiểm tra sau thiến","kanten_vi":"Có khử trùng dụng cụ theo từng con, xử lý vết cắt sau thiến và kiểm tra chảy máu, sưng, độ khỏe không.","levels_vi":["Không khử trùng dụng cụ theo từng con mà dùng đi dùng lại, bỏ qua xử lý vết cắt và quan sát sau thiến, gây viêm phúc mạc và nhiễm trùng.","Nếu có chỉ dẫn thì khử trùng, nhưng hay bỏ sót việc bôi thuốc sát trùng và quan sát sau thiến.","Nếu có chỉ dẫn thì dùng dụng cụ sạch, kiểm tra được cơ bản chảy máu, sưng và độ khỏe sau thiến.","Không cần chỉ dẫn cũng khử trùng dụng cụ theo từng con, xử lý vết cắt và tăng số lần quan sát sau thiến.","Hiểu cơ chế nhiễm trùng và biến chứng, và có thể hướng dẫn người mới thao tác vô trùng và quản lý sau thiến."],"name_id":"Alat yang bersih dan pemeriksaan pascaoperasi","kanten_id":"Apakah mendisinfeksi alat setiap satu ekor, merawat luka sayatan setelah operasi, dan memeriksa pendarahan, bengkak, serta keaktifan anak babi.","levels_id":["Memakai alat bergantian tanpa disinfeksi per ekor, lalai merawat luka dan mengamati setelah operasi sehingga menyebabkan peritonitis (radang selaput perut) dan infeksi.","Jika ada instruksi bisa mendisinfeksi, tetapi sering lalai mengoleskan obat disinfektan pada luka dan mengamati setelah operasi.","Jika ada instruksi, bisa memakai alat yang bersih dan memeriksa pendarahan, bengkak, serta keaktifan secara garis besar setelah operasi.","Tanpa instruksi pun, mendisinfeksi alat setiap satu ekor, merawat luka sayatan, dan menambah frekuensi pengamatan setelah operasi.","Memahami mekanisme infeksi dan komplikasi, dan bisa mengajari karyawan baru cara kerja bersih (aseptik) dan pengelolaan pascaoperasi."]}],"gyomu":"34","name_en":"Castration","purposeShort_en":"Produce pork free of boar taint, reduce fighting and mounting, and make group management safer","name_vi":"Thiến lợn con","purposeShort_vi":"Sản xuất thịt lợn không có mùi hôi đực, giảm đánh nhau và nhảy lên nhau, quản lý đàn an toàn hơn","name_id":"Kastrasi anak babi","purposeShort_id":"Menghasilkan daging babi tanpa bau pejantan, mengurangi perkelahian dan menunggangi, membuat pengelolaan kelompok lebih aman"},{"id":"additive","category":"feeding","no":"No.18","name":"添加剤準備","purposeShort":"添加剤の効果をムラなく出し、豚の健康・成績を安定させる","aspects":[{"id":"dosage-mix","name":"正確な計量と混合","kanten":"ラベルの対象・添加量を守り、正確に計量してムラなく混合できるか。","levels":["計量器を確かめず目分量で入れ、混合手順を省いてムラを出す。","指示があれば計量するが、計量器の校正やプレミックス手順に漏れがある。","指示があればラベルの添加量に従って計量し、ひと通り混合できる。","指示がなくても計量器を確かめて正確に計り、プレミックスでムラなく混合する。","計量誤差・混合ムラが成績に与える影響を理解し、正確な準備手順を新人に指導できる。"],"name_en":"Accurate measurement and mixing","kanten_en":"Can they follow the label's target animals and inclusion rate, measure accurately, and mix evenly?","levels_en":["Adds by eye without checking the scale and skips mixing steps, causing uneven distribution.","With guidance, measures, but is inconsistent about scale calibration and premix procedures.","With guidance, measures according to the label's inclusion rate and can mix adequately.","Independently verifies the scale, measures accurately, and mixes evenly using a premix.","Understands how measurement errors and uneven mixing affect performance, and can teach new staff accurate preparation procedures."],"name_vi":"Cân đo chính xác và trộn đều","kanten_vi":"Có giữ đúng đối tượng và lượng bổ sung ghi trên nhãn, cân đo chính xác và trộn đều không.","levels_vi":["Không kiểm tra dụng cụ cân, đổ theo ước lượng bằng mắt, bỏ bước trộn làm trộn không đều.","Nếu có chỉ dẫn thì cân đo, nhưng có bỏ sót việc hiệu chỉnh dụng cụ cân và bước trộn trước (premix).","Nếu có chỉ dẫn thì cân đo theo lượng bổ sung trên nhãn, trộn được các bước cơ bản.","Không cần chỉ dẫn cũng kiểm tra dụng cụ cân, cân chính xác, trộn trước (premix) để trộn đều không bị chỗ đậm chỗ nhạt.","Hiểu sai số cân đo và trộn không đều ảnh hưởng đến thành tích, và có thể hướng dẫn người mới quy trình chuẩn bị chính xác."],"name_id":"Penakaran akurat dan pencampuran","kanten_id":"Apakah mematuhi sasaran dan dosis pada label, menakar dengan akurat, dan mencampur secara merata.","levels_id":["Memasukkan dengan kira-kira tanpa memeriksa alat takar, dan melewatkan langkah pencampuran sehingga tidak merata.","Jika ada instruksi bisa menakar, tetapi sering lalai mengecek kalibrasi alat takar dan langkah premix (campuran awal).","Jika ada instruksi, bisa menakar sesuai dosis pada label dan mencampur secara garis besar.","Tanpa instruksi pun, memeriksa alat takar dan menakar dengan akurat, serta mencampur merata dengan cara premix.","Memahami pengaruh kesalahan takaran dan campuran tidak merata terhadap performa, dan bisa mengajari karyawan baru urutan persiapan yang akurat."]},{"id":"antibacterial","name":"抗菌性添加物の重複・休薬管理","kanten":"抗菌性添加物の重なりに注意し、給与期間の終了・休薬を記録で管理できるか。","levels":["抗菌性添加物の重なりや給与期間の終了を確認せず、残留リスクを招く。","指示があれば注意するが、複数添加剤の残存や期間管理に漏れが多い。","指示があれば抗菌性添加物の重なりに注意し、休薬のあるものを記録できる。","指示がなくても給与期間の終了を管理し、容器内残存による混在を避ける。","残留リスクと休薬の意味を理解し、抗菌性添加物の管理ルールを新人に指導できる。"],"name_en":"Managing overlap and withdrawal of antibacterial additives","kanten_en":"Can they watch for overlapping antibacterial additives and manage the end of feeding periods and withdrawal through records?","levels_en":["Does not check for overlapping antibacterial additives or the end of feeding periods, creating residue risk.","With guidance, pays attention, but often misses residues of multiple additives and period management.","With guidance, watches for overlapping antibacterial additives and can record those with withdrawal periods.","Independently manages the end of feeding periods and prevents mixing caused by leftovers remaining in containers.","Understands residue risk and the meaning of withdrawal periods, and can teach new staff the rules for managing antibacterial additives."],"name_vi":"Quản lý trùng lặp và ngừng thuốc của chất bổ sung kháng khuẩn","kanten_vi":"Có chú ý sự trùng lặp của các chất bổ sung kháng khuẩn, quản lý bằng ghi chép việc kết thúc thời gian cho ăn và thời gian ngừng thuốc không.","levels_vi":["Không kiểm tra sự trùng lặp của chất bổ sung kháng khuẩn và việc kết thúc thời gian cho ăn, gây nguy cơ tồn dư thuốc.","Nếu có chỉ dẫn thì chú ý, nhưng hay bỏ sót việc quản lý chất còn sót lại khi dùng nhiều loại và quản lý thời gian.","Nếu có chỉ dẫn thì chú ý sự trùng lặp của chất bổ sung kháng khuẩn, ghi chép được những loại có thời gian ngừng thuốc.","Không cần chỉ dẫn cũng quản lý việc kết thúc thời gian cho ăn, tránh lẫn lộn do chất còn sót lại trong thùng chứa.","Hiểu nguy cơ tồn dư và ý nghĩa của việc ngừng thuốc, và có thể hướng dẫn người mới quy tắc quản lý chất bổ sung kháng khuẩn."],"name_id":"Pengelolaan tumpang tindih imbuhan antibakteri dan masa henti obat","kanten_id":"Apakah memperhatikan tumpang tindih imbuhan antibakteri, dan mengelola akhir masa pemberian serta masa henti obat dengan catatan.","levels_id":["Tidak memeriksa tumpang tindih imbuhan antibakteri atau akhir masa pemberian, sehingga menimbulkan risiko residu obat.","Jika ada instruksi bisa berhati-hati, tetapi sering lalai soal sisa beberapa imbuhan dan pengelolaan masa pemberian.","Jika ada instruksi, bisa memperhatikan tumpang tindih imbuhan antibakteri dan mencatat yang punya masa henti obat.","Tanpa instruksi pun, mengelola akhir masa pemberian dan menghindari tercampurnya sisa imbuhan di dalam wadah.","Memahami risiko residu dan arti masa henti obat, dan bisa mengajari karyawan baru aturan pengelolaan imbuhan antibakteri."]}],"gyomu":"18","name_en":"Additive preparation","purposeShort_en":"Deliver the effects of additives evenly and stabilize pig health and performance","name_vi":"Chuẩn bị chất bổ sung (trộn vào thức ăn)","purposeShort_vi":"Giúp chất bổ sung phát huy hiệu quả đều, giữ sức khỏe và thành tích của lợn ổn định","name_id":"Persiapan imbuhan pakan (dicampur ke pakan)","purposeShort_id":"Mengeluarkan efek imbuhan pakan secara merata, menstabilkan kesehatan dan performa babi"},{"id":"dung-removal","category":"hygiene","no":"No.12","name":"除フン","purposeShort":"病気・有害ガスを減らし豚の健康を守り、糞から異常を早期発見する","aspects":[{"id":"order","name":"除糞→洗浄→消毒の順序","kanten":"先に糞を取り除いてから洗浄・消毒する順序を守り、汚れの上から消毒しないか。","levels":["汚れが残ったまま消毒し、順序を守らず効果を半減させても気にしない。","指示があれば糞を取るが、洗浄・消毒の順序や仕上がりの確認に漏れが多い。","指示があれば先に糞を取り、その後に洗浄・消毒する順序をひと通り守れる。","指示がなくても順序を守り、汚れが残ると消毒が効かないことを踏まえて確実に除糞する。","汚れと消毒効果の関係を理解し、決められた頻度・タイミングと順序を新人に指導できる。"],"name_en":"Order of manure removal, washing, then disinfection","kanten_en":"Do they follow the order of removing manure first, then washing and disinfecting, and avoid disinfecting over dirt?","levels_en":["Disinfects over remaining dirt, ignoring the correct order and not caring that this halves the effect.","With guidance, removes manure, but often skips steps in the washing and disinfection order and fails to check the result.","With guidance, can adequately follow the order of removing manure first, then washing and disinfecting.","Independently follows the order and removes manure thoroughly, knowing that disinfection does not work over remaining dirt.","Understands the relationship between dirt and disinfection efficacy, and can teach new staff the prescribed frequency, timing, and order."],"name_vi":"Thứ tự dọn phân → rửa → khử trùng","kanten_vi":"Có giữ thứ tự lấy phân đi trước rồi mới rửa và khử trùng, không khử trùng đè lên chỗ bẩn không.","levels_vi":["Khử trùng khi chỗ bẩn còn nguyên, không giữ thứ tự làm hiệu quả giảm một nửa cũng không quan tâm.","Nếu có chỉ dẫn thì lấy phân, nhưng hay bỏ sót thứ tự rửa, khử trùng và việc kiểm tra kết quả.","Nếu có chỉ dẫn thì giữ được cơ bản thứ tự lấy phân trước, sau đó rửa và khử trùng.","Không cần chỉ dẫn cũng giữ thứ tự, dọn phân kỹ vì biết rằng còn bẩn thì khử trùng không có tác dụng.","Hiểu quan hệ giữa chỗ bẩn và hiệu quả khử trùng, và có thể hướng dẫn người mới tần suất, thời điểm quy định và thứ tự làm."],"name_id":"Urutan bersihkan kotoran → cuci → disinfeksi","kanten_id":"Apakah mematuhi urutan membersihkan kotoran dulu baru mencuci dan mendisinfeksi, dan tidak mendisinfeksi di atas kotoran.","levels_id":["Mendisinfeksi dengan kotoran masih menempel, tidak peduli walau urutan dilanggar dan efeknya berkurang setengah.","Jika ada instruksi bisa membersihkan kotoran, tetapi sering lalai soal urutan cuci-disinfeksi dan memeriksa hasil akhirnya.","Jika ada instruksi, bisa mematuhi urutan secara garis besar: bersihkan kotoran dulu, lalu cuci dan disinfeksi.","Tanpa instruksi pun, mematuhi urutan dan membersihkan kotoran dengan pasti, karena tahu disinfeksi tidak bekerja jika kotoran masih tersisa.","Memahami hubungan kotoran dengan efek disinfeksi, dan bisa mengajari karyawan baru frekuensi, waktu, dan urutan yang ditentukan."]},{"id":"underfloor","name":"床下・ピット・残渣の確認","kanten":"床下やピットまで定期的に確認し、スクレーパー動作後の残渣を目視で確かめられるか。","levels":["床下・ピットを確認せず、スクレーパー後の残渣も見ずに次工程へ進む。","指示があれば見えるところは確認するが、床下・ピットの点検に漏れが多い。","指示があれば床下やピットをひと通り確認できる。","指示がなくても床下・ピットを定期的に確認し、スクレーパー後の残渣を目視で確かめる。","残渣滞留のリスクを理解し、見落としやすい箇所の点検を新人に指導できる。"],"name_en":"Checking underfloor areas, pits, and residue","kanten_en":"Can they regularly check underfloor areas and pits, and visually confirm residue after the scraper has run?","levels_en":["Does not check underfloor areas or pits, and moves to the next task without looking at residue after the scraper.","With guidance, checks visible areas, but often misses underfloor and pit inspections.","With guidance, can adequately check underfloor areas and pits.","Independently checks underfloor areas and pits regularly and visually confirms residue after the scraper.","Understands the risks of residue accumulation and can teach new staff how to inspect easily overlooked spots."],"name_vi":"Kiểm tra dưới sàn, hố chứa phân và phân sót lại","kanten_vi":"Có kiểm tra định kỳ cả dưới sàn và hố chứa phân, nhìn tận mắt phân còn sót sau khi máy cào phân chạy không.","levels_vi":["Không kiểm tra dưới sàn và hố chứa phân, cũng không nhìn phân sót sau khi máy cào phân chạy mà chuyển sang việc tiếp theo.","Nếu có chỉ dẫn thì kiểm tra chỗ nhìn thấy được, nhưng hay bỏ sót việc kiểm tra dưới sàn và hố chứa phân.","Nếu có chỉ dẫn thì kiểm tra được cơ bản dưới sàn và hố chứa phân.","Không cần chỉ dẫn cũng kiểm tra định kỳ dưới sàn và hố chứa phân, nhìn tận mắt phân còn sót sau khi máy cào phân chạy.","Hiểu nguy cơ khi phân ứ đọng, và có thể hướng dẫn người mới cách kiểm tra những chỗ dễ bỏ sót."],"name_id":"Pemeriksaan bawah lantai, pit, dan sisa kotoran","kanten_id":"Apakah memeriksa sampai bawah lantai dan pit secara berkala, dan memeriksa dengan mata sisa kotoran setelah alat pengeruk kotoran bekerja.","levels_id":["Tidak memeriksa bawah lantai dan pit, dan lanjut ke pekerjaan berikutnya tanpa melihat sisa kotoran setelah alat pengeruk bekerja.","Jika ada instruksi bisa memeriksa bagian yang terlihat, tetapi sering lalai memeriksa bawah lantai dan pit.","Jika ada instruksi, bisa memeriksa bawah lantai dan pit secara garis besar.","Tanpa instruksi pun, memeriksa bawah lantai dan pit secara berkala, dan memeriksa dengan mata sisa kotoran setelah alat pengeruk bekerja.","Memahami risiko kotoran yang menumpuk, dan bisa mengajari karyawan baru pemeriksaan tempat-tempat yang mudah terlewat."]}],"gyomu":"12","name_en":"Manure removal","purposeShort_en":"Reduce disease and harmful gases to protect pig health, and detect abnormalities early from the manure","name_vi":"Dọn phân","purposeShort_vi":"Giảm bệnh và khí độc hại, bảo vệ sức khỏe lợn, phát hiện sớm bất thường qua phân","name_id":"Membersihkan kotoran","purposeShort_id":"Mengurangi penyakit dan gas berbahaya untuk menjaga kesehatan babi, dan menemukan kelainan lebih awal dari kotoran"},{"id":"five-s","category":"hygiene","no":"No.31","name":"5S清掃","purposeShort":"衛生レベルを底上げし、作業をやりやすくし、設備トラブルを早く見つける","aspects":[{"id":"fixed-place","name":"定位置管理の徹底","kanten":"物の置き場所を決めて守り、使った物を元の場所に戻せるか。","levels":["置き場所を決めず、使った物を元に戻さないまま放置する。","指示があれば片づけるが、元の場所に戻さないことが多い。","指示があれば決められた置き場所に物を戻せる。","指示がなくても定位置を守り、乱れがあれば自分で整える。","定位置管理がミス削減につながることを理解し、置き場所のルールづくりを新人に指導できる。"],"name_en":"Thorough fixed-location management","kanten_en":"Can they set and observe fixed storage locations, returning items to their place after use?","levels_en":["Does not set storage locations and leaves used items lying around without returning them.","With guidance, tidies up, but often fails to return items to their original place.","With guidance, can return items to their designated locations.","Independently keeps to the fixed locations and straightens things up on their own when they are out of order.","Understands that fixed-location management reduces mistakes, and can teach new staff how to establish storage rules."],"name_vi":"Giữ nghiêm việc để đồ đúng vị trí quy định","kanten_vi":"Có quy định chỗ để đồ và giữ đúng, dùng xong trả đồ về chỗ cũ không.","levels_vi":["Không quy định chỗ để đồ, dùng xong không trả về chỗ cũ mà bỏ mặc.","Nếu có chỉ dẫn thì dọn dẹp, nhưng thường không trả đồ về chỗ cũ.","Nếu có chỉ dẫn thì trả được đồ về chỗ để quy định.","Không cần chỉ dẫn cũng giữ đúng vị trí quy định, nếu có xáo trộn thì tự mình sắp xếp lại.","Hiểu việc quản lý vị trí cố định giúp giảm sai sót, và có thể hướng dẫn người mới cách đặt quy tắc chỗ để đồ."],"name_id":"Menjalankan pengaturan tempat tetap","kanten_id":"Apakah menentukan dan mematuhi tempat menyimpan barang, dan mengembalikan barang yang dipakai ke tempat semula.","levels_id":["Tidak menentukan tempat penyimpanan, dan membiarkan barang yang dipakai tanpa dikembalikan ke tempatnya.","Jika ada instruksi bisa membereskan, tetapi sering tidak mengembalikan barang ke tempat semula.","Jika ada instruksi, bisa mengembalikan barang ke tempat penyimpanan yang ditentukan.","Tanpa instruksi pun, mematuhi tempat tetap, dan jika ada yang berantakan merapikannya sendiri.","Memahami bahwa pengaturan tempat tetap mengurangi kesalahan, dan bisa mengajari karyawan baru cara membuat aturan tempat penyimpanan."]},{"id":"standard-abnormal","name":"きれいさの基準共有と異常発見","kanten":"「基準のきれいさ」を共有し、清掃を形式で終わらせず設備の異常発見につなげられるか。","levels":["基準があいまいで人により差が出て、チェックリストを形式的に埋めるだけで異常に気づかない。","指示があれば清掃するが、基準の共有や異常発見への意識が薄い。","指示があれば汚れやすい所を重点的に掃除し、決めた基準に沿ってひと通り清掃できる。","指示がなくても基準のきれいさを意識し、清掃しながら設備トラブルの兆候に気づく。","5Sを異常の早期発見に結びつけ、基準の共有と継続の仕組みを新人に指導できる。"],"name_en":"Sharing cleanliness standards and finding abnormalities","kanten_en":"Can they share a common cleanliness standard and use cleaning to detect equipment abnormalities rather than treating it as a formality?","levels_en":["Standards are vague and vary by person; fills in checklists as a formality and misses abnormalities.","With guidance, cleans, but has little awareness of shared standards or abnormality detection.","With guidance, focuses on spots that get dirty easily and can clean adequately according to the agreed standard.","Independently keeps the cleanliness standard in mind and notices early signs of equipment trouble while cleaning.","Connects 5S to early detection of abnormalities, and can teach new staff how to share standards and keep the practice going."],"name_vi":"Chia sẻ tiêu chuẩn sạch sẽ và phát hiện bất thường","kanten_vi":"Có chia sẻ \"tiêu chuẩn sạch sẽ\" chung, không làm vệ sinh cho có hình thức mà gắn với việc phát hiện bất thường của thiết bị không.","levels_vi":["Tiêu chuẩn mơ hồ nên mỗi người làm một kiểu, chỉ điền bảng kiểm cho có hình thức mà không nhận ra bất thường.","Nếu có chỉ dẫn thì làm vệ sinh, nhưng ý thức về chia sẻ tiêu chuẩn và phát hiện bất thường còn yếu.","Nếu có chỉ dẫn thì lau dọn kỹ những chỗ dễ bẩn, làm vệ sinh được cơ bản theo tiêu chuẩn đã định.","Không cần chỉ dẫn cũng ý thức về tiêu chuẩn sạch sẽ, vừa làm vệ sinh vừa nhận ra dấu hiệu sự cố của thiết bị.","Gắn 5S với việc phát hiện sớm bất thường, và có thể hướng dẫn người mới cách chia sẻ tiêu chuẩn và duy trì lâu dài."],"name_id":"Berbagi standar kebersihan dan menemukan kelainan","kanten_id":"Apakah berbagi \"standar kebersihan\" bersama, dan tidak menjadikan bersih-bersih sekadar formalitas tetapi menghubungkannya dengan penemuan kelainan peralatan.","levels_id":["Standarnya tidak jelas sehingga hasil tiap orang berbeda, hanya mengisi daftar periksa sebagai formalitas dan tidak menyadari kelainan.","Jika ada instruksi bisa bersih-bersih, tetapi kesadaran akan berbagi standar dan menemukan kelainan masih lemah.","Jika ada instruksi, bisa membersihkan terutama tempat yang mudah kotor, dan bersih-bersih secara garis besar sesuai standar yang ditetapkan.","Tanpa instruksi pun, sadar akan standar kebersihan, dan sambil bersih-bersih menyadari tanda-tanda masalah peralatan.","Bisa menghubungkan 5S dengan penemuan kelainan lebih awal, dan bisa mengajari karyawan baru cara berbagi standar dan menjaga kelangsungannya."]}],"gyomu":"31","name_en":"5S cleaning","purposeShort_en":"Raise the overall hygiene level, make work easier, and detect equipment trouble early","name_vi":"Vệ sinh 5S (Sàng lọc - Sắp xếp - Sạch sẽ - Săn sóc - Sẵn sàng)","purposeShort_vi":"Nâng cao mức vệ sinh, làm việc dễ hơn, phát hiện sớm sự cố thiết bị","name_id":"Kebersihan 5S (Ringkas - Rapi - Resik - Rawat - Rajin)","purposeShort_id":"Menaikkan tingkat kebersihan, membuat pekerjaan lebih mudah, dan menemukan masalah peralatan lebih cepat"},{"id":"treatment","category":"hygiene","no":"No.04","name":"治療","purposeShort":"体調の悪い豚を早く回復させ、悪化と感染拡大を防ぐ","aspects":[{"id":"withdrawal","name":"休薬期間の確認と治療豚の識別","kanten":"使用薬剤の休薬期間を確認し、治療豚を確実に識別して出荷から除外できるか。","levels":["休薬期間を確認せず、治療豚の識別もあいまいで、休薬中の豚を誤って出荷する危険がある。","指示があれば休薬を確認するが、治療豚の識別や記録に漏れが多い。","指示があれば休薬期間を確認し、治療豚を識別してひと通り管理できる。","指示がなくても休薬期間を必ず確認し、治療豚を明確に識別して出荷から除外する。","残留違反の重大さを理解し、休薬管理と個体識別の仕組みを新人に指導できる。"],"name_en":"Checking withdrawal periods and identifying treated pigs","kanten_en":"Can they check the withdrawal period of each drug used, reliably identify treated pigs, and exclude them from shipment?","levels_en":["Does not check withdrawal periods; identification of treated pigs is vague, risking mistaken shipment of pigs still in withdrawal.","With guidance, checks withdrawal periods, but often fails to identify or record treated pigs.","With guidance, checks withdrawal periods and can adequately identify and manage treated pigs.","Independently always checks withdrawal periods, clearly identifies treated pigs, and excludes them from shipment.","Understands the seriousness of residue violations, and can teach new staff systems for withdrawal management and individual identification."],"name_vi":"Kiểm tra thời gian ngừng thuốc và nhận biết lợn đang điều trị","kanten_vi":"Có kiểm tra thời gian ngừng thuốc của thuốc đang dùng, đánh dấu rõ lợn đang điều trị và loại khỏi danh sách xuất chuồng không.","levels_vi":["Không kiểm tra thời gian ngừng thuốc, đánh dấu lợn đang điều trị cũng mơ hồ, có nguy cơ xuất chuồng nhầm lợn đang trong thời gian ngừng thuốc.","Nếu có chỉ dẫn thì kiểm tra việc ngừng thuốc, nhưng hay bỏ sót việc đánh dấu và ghi chép lợn đang điều trị.","Nếu có chỉ dẫn thì kiểm tra thời gian ngừng thuốc, đánh dấu lợn đang điều trị và quản lý được cơ bản.","Không cần chỉ dẫn cũng luôn kiểm tra thời gian ngừng thuốc, đánh dấu rõ lợn đang điều trị và loại khỏi việc xuất chuồng.","Hiểu mức độ nghiêm trọng của vi phạm tồn dư thuốc, và có thể hướng dẫn người mới cách quản lý ngừng thuốc và nhận dạng từng con."],"name_id":"Pemeriksaan masa henti obat dan penandaan babi yang diobati","kanten_id":"Apakah memeriksa masa henti obat dari obat yang dipakai, menandai babi yang diobati dengan pasti, dan mengeluarkannya dari pengiriman.","levels_id":["Tidak memeriksa masa henti obat, penandaan babi yang diobati juga tidak jelas, sehingga ada bahaya mengirim babi yang masih dalam masa henti obat.","Jika ada instruksi bisa memeriksa masa henti obat, tetapi sering lalai menandai dan mencatat babi yang diobati.","Jika ada instruksi, bisa memeriksa masa henti obat, menandai babi yang diobati, dan mengelolanya secara garis besar.","Tanpa instruksi pun, selalu memeriksa masa henti obat, menandai babi yang diobati dengan jelas, dan mengeluarkannya dari pengiriman.","Memahami seriusnya pelanggaran residu obat, dan bisa mengajari karyawan baru sistem pengelolaan masa henti obat dan identifikasi individu."]},{"id":"protocol","name":"指示・用法の遵守と針の本数管理","kanten":"決められたやり方・指示を守り、注射針の本数を管理して紛失・混入を防げるか。","levels":["自己判断でやり方を変え、注射針の本数管理もせず紛失・混入の危険を放置する。","指示があれば従うが、用法の徹底や針の本数確認に漏れがある。","指示があれば決められたやり方・指示に従い、針の本数をひと通り確認できる。","指示がなくても用法を守り、注射針の本数管理を徹底して紛失・混入を防ぐ。","経験則での抗生剤選択のリスクや針混入の危険を理解し、正しい治療手順を新人に指導できる。"],"name_en":"Following instructions and dosage, and needle count management","kanten_en":"Can they follow prescribed methods and instructions, and manage the number of needles to prevent loss and contamination?","levels_en":["Changes methods on their own judgment and does not manage needle counts, leaving the risk of loss and contamination unaddressed.","With guidance, complies, but is inconsistent about following dosage instructions and checking needle counts.","With guidance, follows the prescribed methods and instructions and can adequately check needle counts.","Independently follows the dosage instructions and rigorously manages needle counts to prevent loss and contamination.","Understands the risks of choosing antibiotics by rule of thumb and of needle contamination, and can teach new staff correct treatment procedures."],"name_vi":"Tuân thủ chỉ dẫn, cách dùng thuốc và quản lý số kim tiêm","kanten_vi":"Có giữ đúng cách làm và chỉ dẫn quy định, quản lý số lượng kim tiêm để tránh mất kim và kim lẫn vào thịt không.","levels_vi":["Tự ý thay đổi cách làm, không quản lý số kim tiêm, bỏ mặc nguy cơ mất kim và kim lẫn vào thịt.","Nếu có chỉ dẫn thì làm theo, nhưng có bỏ sót việc giữ đúng cách dùng thuốc và kiểm số kim.","Nếu có chỉ dẫn thì làm theo đúng cách và chỉ dẫn quy định, kiểm được cơ bản số kim tiêm.","Không cần chỉ dẫn cũng giữ đúng cách dùng thuốc, quản lý chặt số kim tiêm để tránh mất và lẫn kim.","Hiểu nguy cơ khi tự chọn kháng sinh theo kinh nghiệm và nguy cơ kim lẫn vào thịt, và có thể hướng dẫn người mới quy trình điều trị đúng."],"name_id":"Mematuhi instruksi dan aturan pakai serta pengelolaan jumlah jarum","kanten_id":"Apakah mematuhi cara dan instruksi yang ditentukan, dan mengelola jumlah jarum suntik untuk mencegah hilang atau masuk ke tubuh babi.","levels_id":["Mengubah cara sesuka hati, tidak mengelola jumlah jarum suntik, dan membiarkan bahaya jarum hilang atau masuk ke tubuh babi.","Jika ada instruksi bisa mengikuti, tetapi sering lalai mematuhi aturan pakai dan memeriksa jumlah jarum.","Jika ada instruksi, bisa mengikuti cara dan instruksi yang ditentukan, serta memeriksa jumlah jarum secara garis besar.","Tanpa instruksi pun, mematuhi aturan pakai dan mengelola jumlah jarum suntik dengan ketat untuk mencegah hilang atau masuk ke tubuh babi.","Memahami risiko memilih antibiotik hanya berdasar pengalaman dan bahaya jarum masuk ke tubuh babi, dan bisa mengajari karyawan baru urutan pengobatan yang benar."]},{"id":"identify-track","name":"個体識別と投薬経過の記録","kanten":"治療豚を明確に識別し、薬剤名・投与量・開始日など投薬経過を追える形で記録できるか。","levels":["治療豚の識別が不明瞭で、投薬経過を記録せず後から追えない。","指示されれば記録するが、薬剤名・投与量・開始日の記入漏れが多い。","指示があれば治療豚を識別し、投薬内容をひと通り記録できる。","指示がなくても投薬経過を漏れなく記録し、識別と記録を結びつけて管理する。","投薬経過の記録が休薬管理・治療評価に不可欠と理解し、記録の書き方を新人に指導できる。"],"name_en":"Individual identification and medication records","kanten_en":"Can they clearly identify treated pigs and record the medication course — drug name, dose, start date — in a traceable form?","levels_en":["Identification of treated pigs is unclear, and the medication course is not recorded and cannot be traced later.","Records when instructed, but often omits drug name, dose, and start date.","With guidance, identifies treated pigs and can adequately record the medication details.","Independently records the medication course completely and manages it by linking identification with records.","Understands that medication records are essential for withdrawal management and treatment evaluation, and can teach new staff how to keep them."],"name_vi":"Nhận dạng từng con và ghi chép quá trình dùng thuốc","kanten_vi":"Có đánh dấu rõ lợn đang điều trị, ghi chép tên thuốc, liều lượng, ngày bắt đầu... theo cách theo dõi lại được quá trình dùng thuốc không.","levels_vi":["Đánh dấu lợn đang điều trị không rõ ràng, không ghi chép quá trình dùng thuốc nên sau này không theo dõi lại được.","Nếu được chỉ dẫn thì ghi chép, nhưng hay bỏ sót tên thuốc, liều lượng, ngày bắt đầu.","Nếu có chỉ dẫn thì đánh dấu lợn đang điều trị, ghi chép được cơ bản nội dung dùng thuốc.","Không cần chỉ dẫn cũng ghi chép đầy đủ quá trình dùng thuốc, quản lý bằng cách gắn kết việc đánh dấu với ghi chép.","Hiểu ghi chép quá trình dùng thuốc là không thể thiếu cho quản lý ngừng thuốc và đánh giá điều trị, và có thể hướng dẫn người mới cách ghi chép."],"name_id":"Identifikasi individu dan pencatatan perjalanan pengobatan","kanten_id":"Apakah menandai babi yang diobati dengan jelas, dan mencatat perjalanan pengobatan seperti nama obat, dosis, dan tanggal mulai dalam bentuk yang bisa ditelusuri.","levels_id":["Penandaan babi yang diobati tidak jelas, tidak mencatat perjalanan pengobatan sehingga tidak bisa ditelusuri kemudian.","Jika disuruh bisa mencatat, tetapi sering lupa mengisi nama obat, dosis, dan tanggal mulai.","Jika ada instruksi, bisa menandai babi yang diobati dan mencatat isi pengobatan secara garis besar.","Tanpa instruksi pun, mencatat perjalanan pengobatan tanpa ada yang terlewat, dan mengelolanya dengan menghubungkan penandaan dan catatan.","Memahami bahwa catatan perjalanan pengobatan sangat penting untuk pengelolaan masa henti obat dan evaluasi pengobatan, dan bisa mengajari karyawan baru cara menulis catatan."]}],"gyomu":"04","name_en":"Treatment","purposeShort_en":"Help sick pigs recover quickly and prevent deterioration and spread of infection","name_vi":"Điều trị","purposeShort_vi":"Giúp lợn ốm hồi phục nhanh, ngăn bệnh nặng thêm và lây lan","name_id":"Pengobatan","purposeShort_id":"Memulihkan babi yang sakit dengan cepat, mencegah kondisi memburuk dan penyebaran infeksi"},{"id":"sow-vaccine","category":"hygiene","no":"No.06","name":"母豚ワクチン","purposeShort":"母豚と子豚を守る免疫をつけ、農場の免疫レベルをそろえる","aspects":[{"id":"schedule","name":"日齢・スケジュールの遵守","kanten":"決められた日齢・スケジュールで確実に接種し、打ち漏れを作らないか。","levels":["スケジュールを守らず、体調不良の母豚にそのまま接種して免疫を不十分にする。","指示があれば接種するが、対象や時期の確認に漏れがある。","指示があれば決められた日齢・スケジュールでひと通り接種できる。","指示がなくても対象と体調を確認して接種し、打ち漏れを防ぐ。","接種時期と免疫の関係を理解し、スケジュール管理と体調確認を新人に指導できる。"],"name_en":"Following age and vaccination schedule","kanten_en":"Can they vaccinate reliably at the prescribed age and schedule without missing any animals?","levels_en":["Ignores the schedule and vaccinates unwell sows as-is, resulting in insufficient immunity.","With guidance, vaccinates, but is inconsistent about confirming target animals and timing.","With guidance, can adequately vaccinate at the prescribed age and schedule.","Independently confirms the target animals and their condition before vaccinating, preventing missed injections.","Understands the relationship between vaccination timing and immunity, and can teach new staff schedule management and condition checks."],"name_vi":"Giữ đúng tuổi ngày và lịch tiêm","kanten_vi":"Có tiêm chắc chắn theo đúng tuổi ngày và lịch quy định, không để sót con chưa tiêm không.","levels_vi":["Không giữ lịch tiêm, tiêm luôn cho lợn nái đang ốm làm miễn dịch không đủ.","Nếu có chỉ dẫn thì tiêm, nhưng có bỏ sót việc kiểm tra đối tượng và thời điểm.","Nếu có chỉ dẫn thì tiêm được cơ bản theo đúng tuổi ngày và lịch quy định.","Không cần chỉ dẫn cũng kiểm tra đối tượng và tình trạng sức khỏe rồi tiêm, phòng sót con chưa tiêm.","Hiểu quan hệ giữa thời điểm tiêm và miễn dịch, và có thể hướng dẫn người mới cách quản lý lịch và kiểm tra sức khỏe."],"name_id":"Mematuhi umur dan jadwal","kanten_id":"Apakah menyuntik vaksin dengan pasti sesuai umur dan jadwal yang ditentukan, tanpa ada yang terlewat.","levels_id":["Tidak mematuhi jadwal, dan menyuntik induk babi yang sedang tidak sehat begitu saja sehingga kekebalan tidak cukup.","Jika ada instruksi bisa menyuntik, tetapi sering lalai memeriksa sasaran dan waktunya.","Jika ada instruksi, bisa menyuntik secara garis besar sesuai umur dan jadwal yang ditentukan.","Tanpa instruksi pun, memeriksa sasaran dan kondisi kesehatan sebelum menyuntik, dan mencegah ada yang terlewat.","Memahami hubungan waktu penyuntikan dengan kekebalan, dan bisa mengajari karyawan baru pengelolaan jadwal dan pemeriksaan kondisi kesehatan."]},{"id":"vaccine-handling","name":"ワクチンの取り扱いと針交換","kanten":"生ワクチンは溶解後すぐ使い切り、不活化は当日中に使い、針を頭ごとに交換できるか。","levels":["溶解後の保管時間を超過し、注射針を使い回して感染リスクを高める。","指示があれば取り扱うが、使い切りの時間管理や針交換に漏れがある。","指示があれば生ワクチンを溶解後すぐ使い、針をひと通り交換できる。","指示がなくても溶解後の時間を守って使い切り、針を頭ごとに交換する。","ワクチンの失活や針使い回しのリスクを理解し、正しい取り扱いを新人に指導できる。"],"name_en":"Vaccine handling and needle changes","kanten_en":"Can they use live vaccines immediately after reconstitution, use inactivated vaccines within the day, and change needles for each animal?","levels_en":["Exceeds the storage time after reconstitution and reuses needles, raising infection risk.","With guidance, handles vaccines, but is inconsistent about use-by time management and needle changes.","With guidance, uses live vaccines promptly after reconstitution and can adequately change needles.","Independently observes the time limit after reconstitution, uses vaccines up, and changes the needle for each animal.","Understands the risks of vaccine inactivation and needle reuse, and can teach new staff correct handling."],"name_vi":"Cách xử lý vắc-xin và thay kim tiêm","kanten_vi":"Vắc-xin sống có dùng hết ngay sau khi pha, vắc-xin bất hoạt dùng trong ngày, và thay kim theo từng con không.","levels_vi":["Để quá thời gian bảo quản sau khi pha, dùng lại kim tiêm làm tăng nguy cơ lây nhiễm.","Nếu có chỉ dẫn thì xử lý được, nhưng có bỏ sót việc quản lý thời gian dùng hết và thay kim.","Nếu có chỉ dẫn thì dùng vắc-xin sống ngay sau khi pha, thay kim được cơ bản.","Không cần chỉ dẫn cũng giữ đúng thời gian sau khi pha và dùng hết, thay kim theo từng con.","Hiểu nguy cơ vắc-xin mất hiệu lực và dùng lại kim, và có thể hướng dẫn người mới cách xử lý đúng."],"name_id":"Penanganan vaksin dan penggantian jarum","kanten_id":"Apakah vaksin hidup dihabiskan segera setelah dilarutkan, vaksin inaktif dipakai pada hari yang sama, dan jarum diganti setiap ekor.","levels_id":["Melewati batas waktu penyimpanan setelah vaksin dilarutkan, dan memakai jarum suntik bergantian sehingga menaikkan risiko infeksi.","Jika ada instruksi bisa menangani, tetapi sering lalai mengelola batas waktu pemakaian dan mengganti jarum.","Jika ada instruksi, bisa memakai vaksin hidup segera setelah dilarutkan dan mengganti jarum secara garis besar.","Tanpa instruksi pun, mematuhi batas waktu setelah pelarutan dan menghabiskannya, serta mengganti jarum setiap ekor.","Memahami risiko vaksin kehilangan daya dan pemakaian jarum bergantian, dan bisa mengajari karyawan baru penanganan yang benar."]}],"gyomu":"06","name_en":"Sow vaccination","purposeShort_en":"Build immunity that protects sows and piglets, and even out the farm's immunity level","name_vi":"Tiêm vắc-xin cho lợn nái","purposeShort_vi":"Tạo miễn dịch bảo vệ lợn nái và lợn con, làm đồng đều mức miễn dịch của trại","name_id":"Vaksinasi induk babi","purposeShort_id":"Membangun kekebalan yang melindungi induk babi dan anak babi, dan menyeragamkan tingkat kekebalan peternakan"},{"id":"csf-vaccine","category":"hygiene","no":"No.41","name":"CSF（豚熱）子ワクチン接種","purposeShort":"子豚の免疫を立ち上げ、豚熱の発生・死亡と経済被害を防ぐ","aspects":[{"id":"maternal-antibody","name":"移行抗体を考えた接種日齢","kanten":"移行抗体を考慮し、決められた日齢で接種して免疫獲得の失敗を防げるか。","levels":["移行抗体を考えず、抗体の高い時期に接種して免疫獲得を失敗させる。","指示があれば決められた日齢で接種するが、農場の抗体レベルへの意識が薄い。","指示があれば決められた日齢でひと通り接種できる。","指示がなくても移行抗体を考えた日齢で接種し、確実な免疫獲得を意識する。","移行抗体と免疫獲得の関係を理解し、農場の抗体レベルに応じた接種時期を新人に指導できる。"],"name_en":"Vaccination age accounting for maternal antibodies","kanten_en":"Can they take maternal antibodies into account and vaccinate at the prescribed age to prevent immunization failure?","levels_en":["Ignores maternal antibodies and vaccinates while antibody levels are high, causing immunization failure.","With guidance, vaccinates at the prescribed age, but has little awareness of the farm's antibody levels.","With guidance, can adequately vaccinate at the prescribed age.","Independently vaccinates at an age that accounts for maternal antibodies, keeping reliable immunization in mind.","Understands the relationship between maternal antibodies and immunization, and can teach new staff vaccination timing suited to the farm's antibody levels."],"name_vi":"Tuổi ngày tiêm có tính đến kháng thể mẹ truyền","kanten_vi":"Có tính đến kháng thể mẹ truyền, tiêm đúng tuổi ngày quy định để tránh thất bại trong việc tạo miễn dịch không.","levels_vi":["Không nghĩ đến kháng thể mẹ truyền, tiêm vào thời kỳ kháng thể còn cao làm việc tạo miễn dịch thất bại.","Nếu có chỉ dẫn thì tiêm đúng tuổi ngày quy định, nhưng ý thức về mức kháng thể của trại còn yếu.","Nếu có chỉ dẫn thì tiêm được cơ bản theo đúng tuổi ngày quy định.","Không cần chỉ dẫn cũng tiêm ở tuổi ngày có tính đến kháng thể mẹ truyền, ý thức việc tạo miễn dịch chắc chắn.","Hiểu quan hệ giữa kháng thể mẹ truyền và việc tạo miễn dịch, và có thể hướng dẫn người mới thời điểm tiêm theo mức kháng thể của trại."],"name_id":"Umur penyuntikan yang mempertimbangkan antibodi dari induk","kanten_id":"Apakah mempertimbangkan antibodi dari induk (antibodi maternal) dan menyuntik pada umur yang ditentukan, sehingga mencegah gagalnya pembentukan kekebalan.","levels_id":["Tidak memikirkan antibodi dari induk, menyuntik saat antibodi masih tinggi sehingga pembentukan kekebalan gagal.","Jika ada instruksi bisa menyuntik pada umur yang ditentukan, tetapi kesadaran terhadap tingkat antibodi peternakan masih lemah.","Jika ada instruksi, bisa menyuntik secara garis besar pada umur yang ditentukan.","Tanpa instruksi pun, menyuntik pada umur yang mempertimbangkan antibodi dari induk, dan sadar akan pembentukan kekebalan yang pasti.","Memahami hubungan antibodi dari induk dengan pembentukan kekebalan, dan bisa mengajari karyawan baru waktu penyuntikan sesuai tingkat antibodi peternakan."]},{"id":"no-miss","name":"全頭接種と記録","kanten":"全頭に確実に接種し、打ち漏れを作らず接種記録を残せるか。","levels":["打ち漏れを確認せず、接種記録も残さないため漏れが把握できない。","指示があれば接種するが、全頭確認や記録に漏れが多い。","指示があれば全頭にひと通り接種し、記録できる。","指示がなくても打ち漏れがないか確かめ、接種記録を確実に残す。","打ち漏れが防疫上の穴になることを理解し、全頭接種と記録の徹底を新人に指導できる。"],"name_en":"Whole-herd vaccination and records","kanten_en":"Can they reliably vaccinate every animal, leave no missed injections, and keep vaccination records?","levels_en":["Does not check for missed injections and keeps no vaccination records, so omissions cannot be tracked.","With guidance, vaccinates, but often fails at whole-herd confirmation and record-keeping.","With guidance, can adequately vaccinate all animals and keep records.","Independently verifies there are no missed injections and reliably keeps vaccination records.","Understands that missed injections become holes in biosecurity, and can teach new staff thorough whole-herd vaccination and record-keeping."],"name_vi":"Tiêm đủ cả đàn và ghi chép","kanten_vi":"Có tiêm chắc chắn cho tất cả các con, không để sót và để lại ghi chép tiêm phòng không.","levels_vi":["Không kiểm tra con bị sót tiêm, cũng không để lại ghi chép nên không nắm được sót con nào.","Nếu có chỉ dẫn thì tiêm, nhưng hay bỏ sót việc kiểm tra cả đàn và ghi chép.","Nếu có chỉ dẫn thì tiêm được cơ bản cho cả đàn và ghi chép được.","Không cần chỉ dẫn cũng kiểm tra xem có con nào bị sót tiêm không, để lại ghi chép tiêm phòng chắc chắn.","Hiểu con sót tiêm là lỗ hổng trong phòng dịch, và có thể hướng dẫn người mới việc tiêm đủ cả đàn và ghi chép nghiêm túc."],"name_id":"Penyuntikan semua ekor dan pencatatan","kanten_id":"Apakah menyuntik semua ekor dengan pasti, tidak ada yang terlewat, dan meninggalkan catatan penyuntikan.","levels_id":["Tidak memeriksa ada tidaknya yang terlewat, tidak meninggalkan catatan penyuntikan sehingga yang terlewat tidak bisa diketahui.","Jika ada instruksi bisa menyuntik, tetapi sering lalai memeriksa semua ekor dan mencatat.","Jika ada instruksi, bisa menyuntik semua ekor secara garis besar dan mencatatnya.","Tanpa instruksi pun, memastikan tidak ada yang terlewat dan meninggalkan catatan penyuntikan dengan pasti.","Memahami bahwa penyuntikan yang terlewat menjadi lubang biosekuriti, dan bisa mengajari karyawan baru pentingnya penyuntikan semua ekor dan pencatatan."]}],"gyomu":"41","name_en":"CSF (classical swine fever) piglet vaccination","purposeShort_en":"Establish piglet immunity and prevent CSF outbreaks, deaths, and economic damage","name_vi":"Tiêm vắc-xin CSF (dịch tả lợn cổ điển) cho lợn con","purposeShort_vi":"Tạo miễn dịch cho lợn con, phòng bệnh dịch tả lợn phát sinh, chết và thiệt hại kinh tế","name_id":"Vaksinasi CSF (demam babi klasik) untuk anak babi","purposeShort_id":"Membangun kekebalan anak babi, mencegah kejadian dan kematian demam babi klasik serta kerugian ekonomi"},{"id":"vaccine-assist","category":"hygiene","no":"No.45","name":"子ワクチン補助","purposeShort":"接種漏れ・誤接種を防ぎ、安全に正しい部位・量で接種できる環境を作る","aspects":[{"id":"role-restraint","name":"役割分担・声かけと保定","kanten":"役割分担と声かけを明確にし、豚を落ち着かせて無理のない保定ができるか。","levels":["役割分担や声かけをせず、豚を無理に保定して暴れさせる。","指示があれば補助するが、声かけや保定が不十分で接種を難しくする。","指示があれば役割分担に従い、ひと通り保定を補助できる。","指示がなくても声かけで連携し、豚を落ち着かせて安全に保定する。","安全な接種環境づくりの要点を理解し、役割分担と保定のコツを新人に指導できる。"],"name_en":"Role assignment, communication, and restraint","kanten_en":"Can they clarify roles and verbal cues, calm the pigs, and restrain them without force?","levels_en":["Works without role assignment or verbal cues, restrains pigs forcibly, and makes them struggle.","With guidance, assists, but poor communication and restraint make the injections difficult.","With guidance, follows the role assignment and can adequately assist with restraint.","Independently coordinates with verbal cues, calms the pigs, and restrains them safely.","Understands the essentials of creating a safe injection environment, and can teach new staff role assignment and restraint techniques."],"name_vi":"Phân công, gọi báo nhau và giữ lợn","kanten_vi":"Có phân công và gọi báo nhau rõ ràng, làm lợn bình tĩnh và giữ lợn không quá sức không.","levels_vi":["Không phân công và không gọi báo nhau, giữ lợn quá mạnh làm lợn giãy giụa.","Nếu có chỉ dẫn thì hỗ trợ, nhưng gọi báo và giữ lợn chưa tốt, làm việc tiêm khó hơn.","Nếu có chỉ dẫn thì làm theo phân công, hỗ trợ giữ lợn được cơ bản.","Không cần chỉ dẫn cũng phối hợp bằng cách gọi báo nhau, làm lợn bình tĩnh và giữ lợn an toàn.","Hiểu các điểm chính để tạo môi trường tiêm an toàn, và có thể hướng dẫn người mới cách phân công và mẹo giữ lợn."],"name_id":"Pembagian peran, saling memberi aba-aba, dan memegangi babi","kanten_id":"Apakah pembagian peran dan aba-aba jelas, dan bisa memegangi babi tanpa paksaan dengan menenangkannya.","levels_id":["Tidak membagi peran atau memberi aba-aba, dan memegangi babi dengan paksa sehingga babi berontak.","Jika ada instruksi bisa membantu, tetapi aba-aba dan cara memegangi kurang baik sehingga menyulitkan penyuntikan.","Jika ada instruksi, bisa mengikuti pembagian peran dan membantu memegangi babi secara garis besar.","Tanpa instruksi pun, bekerja sama dengan aba-aba, menenangkan babi, dan memeganginya dengan aman.","Memahami poin-poin menciptakan lingkungan penyuntikan yang aman, dan bisa mengajari karyawan baru pembagian peran dan trik memegangi babi."]},{"id":"site-needle","name":"接種部位・針・残留の確認","kanten":"正しい部位・量・針で確実に筋注し、接種後の針折れ・針残留を確認してマーキングできるか。","levels":["浅く筋注できていない、成豚用量を子豚に投与する、針残留を確認しないなど危険な補助をする。","指示があれば補助するが、針の選択や残留確認、マーキングに漏れがある。","指示があれば正しい部位・量で接種を補助し、接種後にマーキングできる。","指示がなくても針の選択と体重・日齢を確認し、針折れ・残留を確かめてマーキングする。","針残留や誤用量の危険を理解し、確実な接種と確認の手順を新人に指導できる。"],"name_en":"Checking injection site, needles, and retained needles","kanten_en":"Can they inject intramuscularly at the correct site, dose, and needle, then check for broken or retained needles and mark the animal?","levels_en":["Assists dangerously — injections too shallow to be intramuscular, adult doses given to piglets, retained needles not checked.","With guidance, assists, but is inconsistent about needle selection, retained-needle checks, and marking.","With guidance, assists with injection at the correct site and dose and can mark animals after injection.","Independently checks needle selection against body weight and age, verifies no broken or retained needles, and marks the animals.","Understands the dangers of retained needles and wrong doses, and can teach new staff reliable injection and verification procedures."],"name_vi":"Kiểm tra vị trí tiêm, kim tiêm và kim sót lại","kanten_vi":"Có tiêm bắp chắc chắn đúng vị trí, đúng liều, đúng kim, kiểm tra kim gãy, kim sót lại sau tiêm và đánh dấu không.","levels_vi":["Hỗ trợ nguy hiểm như tiêm nông không vào bắp, tiêm liều của lợn lớn cho lợn con, không kiểm tra kim sót lại.","Nếu có chỉ dẫn thì hỗ trợ, nhưng có bỏ sót việc chọn kim, kiểm tra kim sót lại và đánh dấu.","Nếu có chỉ dẫn thì hỗ trợ tiêm đúng vị trí, đúng liều, đánh dấu được sau khi tiêm.","Không cần chỉ dẫn cũng kiểm tra việc chọn kim, cân nặng, tuổi ngày, kiểm tra kim gãy, kim sót lại rồi đánh dấu.","Hiểu nguy hiểm của kim sót lại và sai liều, và có thể hướng dẫn người mới quy trình tiêm và kiểm tra chắc chắn."],"name_id":"Pemeriksaan lokasi suntik, jarum, dan jarum tertinggal","kanten_id":"Apakah bisa menyuntik ke otot dengan pasti pada lokasi, dosis, dan jarum yang benar, lalu memeriksa jarum patah atau tertinggal setelah penyuntikan dan memberi tanda (marking).","levels_id":["Membantu dengan cara berbahaya, misalnya suntikan terlalu dangkal sehingga tidak masuk otot, memberi dosis babi dewasa ke anak babi, atau tidak memeriksa jarum tertinggal.","Jika ada instruksi bisa membantu, tetapi sering lalai memilih jarum, memeriksa jarum tertinggal, dan memberi tanda.","Jika ada instruksi, bisa membantu penyuntikan dengan lokasi dan dosis yang benar, serta memberi tanda setelah penyuntikan.","Tanpa instruksi pun, memeriksa pilihan jarum serta berat badan dan umur, memastikan tidak ada jarum patah atau tertinggal, lalu memberi tanda.","Memahami bahaya jarum tertinggal dan dosis yang salah, dan bisa mengajari karyawan baru urutan penyuntikan dan pemeriksaan yang pasti."]}],"gyomu":"45","name_en":"Piglet vaccination assistance","purposeShort_en":"Prevent missed and incorrect injections, creating a safe environment for injecting the right site and dose","name_vi":"Hỗ trợ tiêm vắc-xin cho lợn con","purposeShort_vi":"Phòng sót tiêm và tiêm nhầm, tạo môi trường tiêm an toàn, đúng vị trí và đúng liều","name_id":"Membantu vaksinasi anak babi","purposeShort_id":"Mencegah vaksin terlewat atau salah suntik, dan menciptakan lingkungan penyuntikan yang aman dengan lokasi dan dosis yang benar"},{"id":"washing","category":"hygiene","no":"No.40","name":"洗浄（離乳後）","purposeShort":"汚れと病原体を物理的に落とし、消毒が効く状態を作り舎内をリセットする","aspects":[{"id":"wash-order","name":"除糞→洗浄→乾燥→消毒の順序","kanten":"決められた順序を守り、有機物を残したまま消毒しないか、洗浄後に十分乾燥できるか。","levels":["有機物が残った状態で消毒薬を散布し、乾燥不十分のまま次ロットを入れる。","指示があれば洗浄するが、順序や乾燥の徹底に漏れが多い。","指示があれば除糞→洗浄→乾燥→消毒の順序をひと通り守れる。","指示がなくても順序を守り、有機物を落としてから消毒し、十分に乾燥させる。","有機物残存が消毒を無効化することを理解し、洗浄・乾燥の徹底を新人に指導できる。"],"name_en":"Order of manure removal, washing, drying, then disinfection","kanten_en":"Do they follow the prescribed order, avoid disinfecting over organic matter, and dry thoroughly after washing?","levels_en":["Sprays disinfectant over remaining organic matter and brings in the next lot without sufficient drying.","With guidance, washes, but often skips steps in the order and fails to dry thoroughly.","With guidance, can adequately follow the order of manure removal, washing, drying, then disinfection.","Independently follows the order, removes organic matter before disinfecting, and dries thoroughly.","Understands that remaining organic matter neutralizes disinfection, and can teach new staff thorough washing and drying."],"name_vi":"Thứ tự dọn phân → rửa → làm khô → khử trùng","kanten_vi":"Có giữ đúng thứ tự quy định, không khử trùng khi chất hữu cơ còn sót, và làm khô đủ sau khi rửa không.","levels_vi":["Phun thuốc khử trùng khi chất hữu cơ còn sót, đưa lứa lợn mới vào khi chuồng chưa khô đủ.","Nếu có chỉ dẫn thì rửa, nhưng hay bỏ sót thứ tự và việc làm khô kỹ.","Nếu có chỉ dẫn thì giữ được cơ bản thứ tự dọn phân → rửa → làm khô → khử trùng.","Không cần chỉ dẫn cũng giữ đúng thứ tự, loại bỏ chất hữu cơ trước rồi mới khử trùng, làm khô đầy đủ.","Hiểu chất hữu cơ còn sót làm khử trùng mất tác dụng, và có thể hướng dẫn người mới việc rửa và làm khô kỹ."],"name_id":"Urutan bersihkan kotoran → cuci → keringkan → disinfeksi","kanten_id":"Apakah mematuhi urutan yang ditentukan, tidak mendisinfeksi selagi bahan organik masih tersisa, dan bisa mengeringkan dengan cukup setelah mencuci.","levels_id":["Menyemprotkan disinfektan dalam keadaan bahan organik masih tersisa, dan memasukkan kelompok berikutnya selagi belum kering.","Jika ada instruksi bisa mencuci, tetapi sering lalai mematuhi urutan dan pengeringan menyeluruh.","Jika ada instruksi, bisa mematuhi urutan secara garis besar: bersihkan kotoran → cuci → keringkan → disinfeksi.","Tanpa instruksi pun, mematuhi urutan, menghilangkan bahan organik dulu baru mendisinfeksi, dan mengeringkan dengan cukup.","Memahami bahwa bahan organik yang tersisa membuat disinfeksi tidak berguna, dan bisa mengajari karyawan baru pentingnya pencucian dan pengeringan menyeluruh."]},{"id":"hidden-spots","name":"隅・溝・裏側の重点洗浄","kanten":"隅・溝・エサ箱・スノコ裏など汚れが溜まりやすい見えにくい場所を重点的に洗えるか。","levels":["見えやすい所だけ洗い、隅・溝・スノコ裏などの汚れを残す。","指示があれば洗うが、見えにくい場所の洗浄に漏れが多い。","指示があれば汚れが溜まりやすい場所をひと通り洗える。","指示がなくても隅・溝・スノコ裏まで重点的に洗い、汚れを残さない。","見えにくい場所の病原残存リスクを理解し、重点洗浄の着眼点を新人に指導できる。"],"name_en":"Focused washing of corners, grooves, and undersides","kanten_en":"Can they focus on hard-to-see spots where dirt accumulates — corners, grooves, feed boxes, and the undersides of slats?","levels_en":["Washes only visible areas, leaving dirt in corners, grooves, and under the slats.","With guidance, washes, but often misses hard-to-see spots.","With guidance, can adequately wash the spots where dirt accumulates.","Independently focuses on corners, grooves, and slat undersides, leaving no dirt behind.","Understands the risk of pathogens surviving in hard-to-see spots, and can teach new staff where to focus the washing."],"name_vi":"Rửa kỹ góc, rãnh và mặt sau","kanten_vi":"Có rửa kỹ những chỗ khó nhìn thấy, dễ đọng bẩn như góc, rãnh, máng ăn, mặt sau sàn khe không.","levels_vi":["Chỉ rửa chỗ dễ nhìn thấy, để sót bẩn ở góc, rãnh, mặt sau sàn khe.","Nếu có chỉ dẫn thì rửa, nhưng hay bỏ sót việc rửa những chỗ khó nhìn thấy.","Nếu có chỉ dẫn thì rửa được cơ bản những chỗ dễ đọng bẩn.","Không cần chỉ dẫn cũng rửa kỹ đến tận góc, rãnh, mặt sau sàn khe, không để sót bẩn.","Hiểu nguy cơ mầm bệnh còn sót ở những chỗ khó nhìn thấy, và có thể hướng dẫn người mới các điểm cần chú ý khi rửa kỹ."],"name_id":"Pencucian intensif sudut, parit, dan bagian belakang","kanten_id":"Apakah bisa mencuci secara intensif tempat-tempat tersembunyi yang mudah menumpuk kotoran seperti sudut, parit, kotak pakan, dan bagian bawah lantai slat.","levels_id":["Hanya mencuci bagian yang mudah terlihat, meninggalkan kotoran di sudut, parit, dan bawah lantai slat.","Jika ada instruksi bisa mencuci, tetapi sering lalai mencuci tempat yang sulit terlihat.","Jika ada instruksi, bisa mencuci secara garis besar tempat-tempat yang mudah menumpuk kotoran.","Tanpa instruksi pun, mencuci intensif sampai sudut, parit, dan bawah lantai slat tanpa meninggalkan kotoran.","Memahami risiko bibit penyakit yang tersisa di tempat yang sulit terlihat, dan bisa mengajari karyawan baru titik fokus pencucian intensif."]}],"gyomu":"40","name_en":"Washing (post-weaning)","purposeShort_en":"Physically remove dirt and pathogens, create conditions where disinfection works, and reset the barn","name_vi":"Rửa chuồng (sau cai sữa)","purposeShort_vi":"Loại bỏ chất bẩn và mầm bệnh bằng cách rửa, tạo trạng thái để khử trùng có tác dụng, làm mới lại chuồng","name_id":"Mencuci kandang (setelah sapih)","purposeShort_id":"Menghilangkan kotoran dan bibit penyakit secara fisik, membuat kondisi agar disinfeksi bekerja, dan mereset bagian dalam kandang"},{"id":"disinfect","category":"hygiene","no":"No.15","name":"消毒","purposeShort":"病原体を入れない・広げない・持ち出さず、農場の防疫レベルを保つ","aspects":[{"id":"concentration","name":"濃度・量・接触時間の遵守","kanten":"決められた濃度・量・接触時間を守り、目分量の希釈をしないか。","levels":["希釈濃度を目分量で調整し、接触時間も守らず規定を外す。","指示があれば希釈するが、濃度や接触時間の管理に漏れが多い。","指示があれば決められた濃度・量・接触時間をひと通り守れる。","指示がなくても正確に希釈し、接触時間を確保してから乾燥させる。","薬剤ごとの特性と濃度・接触時間の意味を理解し、正しい消毒を新人に指導できる。"],"name_en":"Following concentration, volume, and contact time","kanten_en":"Do they follow the prescribed concentration, volume, and contact time, without diluting by eye?","levels_en":["Adjusts dilution by eye and ignores contact times, deviating from the standards.","With guidance, dilutes, but often fails to manage concentration and contact time.","With guidance, can adequately follow the prescribed concentration, volume, and contact time.","Independently dilutes accurately and secures the contact time before allowing surfaces to dry.","Understands each chemical's characteristics and the meaning of concentration and contact time, and can teach new staff correct disinfection."],"name_vi":"Giữ đúng nồng độ, lượng và thời gian tiếp xúc","kanten_vi":"Có giữ đúng nồng độ, lượng và thời gian tiếp xúc quy định, không pha loãng theo ước lượng bằng mắt không.","levels_vi":["Pha loãng theo ước lượng bằng mắt, không giữ thời gian tiếp xúc, làm sai quy định.","Nếu có chỉ dẫn thì pha loãng, nhưng hay bỏ sót việc quản lý nồng độ và thời gian tiếp xúc.","Nếu có chỉ dẫn thì giữ được cơ bản nồng độ, lượng và thời gian tiếp xúc quy định.","Không cần chỉ dẫn cũng pha loãng chính xác, bảo đảm thời gian tiếp xúc rồi mới làm khô.","Hiểu đặc tính từng loại thuốc và ý nghĩa của nồng độ, thời gian tiếp xúc, và có thể hướng dẫn người mới cách khử trùng đúng."],"name_id":"Mematuhi konsentrasi, jumlah, dan waktu kontak","kanten_id":"Apakah mematuhi konsentrasi, jumlah, dan waktu kontak yang ditentukan, dan tidak mengencerkan dengan kira-kira.","levels_id":["Mengatur konsentrasi pengenceran dengan kira-kira, tidak mematuhi waktu kontak, dan keluar dari ketentuan.","Jika ada instruksi bisa mengencerkan, tetapi sering lalai mengelola konsentrasi dan waktu kontak.","Jika ada instruksi, bisa mematuhi secara garis besar konsentrasi, jumlah, dan waktu kontak yang ditentukan.","Tanpa instruksi pun, mengencerkan dengan akurat, memastikan waktu kontak tercapai, lalu membiarkannya kering.","Memahami sifat tiap bahan disinfektan serta arti konsentrasi dan waktu kontak, dan bisa mengajari karyawan baru cara disinfeksi yang benar."]},{"id":"clean-first-ppe","name":"汚れ除去の徹底と防護具着用","kanten":"汚れを先に落としてから消毒し、防護マスク・ゴーグルを着けて曝露を防げるか。","levels":["有機物が残った面に散布して消毒剤を不活化させ、防護具も着けず薬剤に曝露する。","指示があれば汚れを落とすが、防護具の着用や汚れ除去の徹底に漏れがある。","指示があれば汚れを落としてから消毒し、防護具をひと通り着用できる。","指示がなくても汚れを確実に落としてから消毒し、防護具を着けて安全に作業する。","有機物による不活化と薬剤曝露の危険を理解し、汚れ除去と防護の徹底を新人に指導できる。"],"name_en":"Thorough dirt removal first and wearing protective gear","kanten_en":"Can they remove dirt before disinfecting, and wear a protective mask and goggles to prevent chemical exposure?","levels_en":["Sprays onto surfaces with organic matter, inactivating the disinfectant, and works without protective gear, exposing themselves to chemicals.","With guidance, removes dirt, but is inconsistent about wearing protective gear and removing dirt thoroughly.","With guidance, removes dirt before disinfecting and can adequately wear protective gear.","Independently removes dirt thoroughly before disinfecting and works safely in protective gear.","Understands inactivation by organic matter and the dangers of chemical exposure, and can teach new staff thorough dirt removal and protection."],"name_vi":"Loại bỏ bẩn kỹ trước và đeo đồ bảo hộ","kanten_vi":"Có loại bỏ chất bẩn trước rồi mới khử trùng, đeo khẩu trang và kính bảo hộ để tránh phơi nhiễm thuốc không.","levels_vi":["Phun lên bề mặt còn chất hữu cơ làm thuốc khử trùng mất tác dụng, không đeo đồ bảo hộ nên bị phơi nhiễm thuốc.","Nếu có chỉ dẫn thì loại bỏ bẩn, nhưng có bỏ sót việc đeo đồ bảo hộ và việc làm sạch kỹ.","Nếu có chỉ dẫn thì loại bỏ bẩn trước rồi mới khử trùng, đeo được cơ bản đồ bảo hộ.","Không cần chỉ dẫn cũng loại bỏ bẩn chắc chắn trước khi khử trùng, đeo đồ bảo hộ và làm việc an toàn.","Hiểu chất hữu cơ làm thuốc mất tác dụng và nguy hiểm khi phơi nhiễm thuốc, và có thể hướng dẫn người mới việc làm sạch và bảo hộ kỹ."],"name_id":"Menghilangkan kotoran dengan tuntas dan memakai alat pelindung","kanten_id":"Apakah menghilangkan kotoran dulu baru mendisinfeksi, dan memakai masker pelindung serta kacamata pelindung agar tidak terpapar bahan kimia.","levels_id":["Menyemprot ke permukaan yang masih ada bahan organik sehingga disinfektan tidak bekerja, dan terpapar bahan kimia karena tidak memakai alat pelindung.","Jika ada instruksi bisa menghilangkan kotoran, tetapi sering lalai memakai alat pelindung dan menghilangkan kotoran dengan tuntas.","Jika ada instruksi, bisa menghilangkan kotoran dulu baru mendisinfeksi, dan memakai alat pelindung secara garis besar.","Tanpa instruksi pun, menghilangkan kotoran dengan pasti sebelum mendisinfeksi, dan bekerja dengan aman memakai alat pelindung.","Memahami disinfektan yang tidak bekerja karena bahan organik dan bahaya paparan bahan kimia, dan bisa mengajari karyawan baru pentingnya menghilangkan kotoran dan perlindungan diri."]}],"gyomu":"15","name_en":"Disinfection","purposeShort_en":"Keep pathogens out, contained, and off the farm, maintaining the farm's biosecurity level","name_vi":"Khử trùng","purposeShort_vi":"Không cho mầm bệnh vào, không làm lan rộng, không mang ra ngoài, giữ mức phòng dịch của trại","name_id":"Disinfeksi","purposeShort_id":"Tidak memasukkan, tidak menyebarkan, dan tidak membawa keluar bibit penyakit, menjaga tingkat biosekuriti peternakan"},{"id":"lime","category":"hygiene","no":"No.44","name":"石灰散布","purposeShort":"農場出入口に防疫バリアを作り、病原体の侵入・拡散を抑える","aspects":[{"id":"moisture","name":"含水と散布量の管理","kanten":"地面が白く見える量を目安に、乾燥粉末のままでなく消毒効果の出る状態で散布できるか。","levels":["乾燥粉末のまま散布し、量の目安も守らず消毒効果を出せない。","指示があれば散布するが、含水や量の管理に漏れがある。","指示があれば地面が白く見える量を目安にひと通り散布できる。","指示がなくても消毒効果の出る含水状態にし、劣化を見て定期的に補充する。","石灰の消毒が効く条件（含水率）を理解し、散布量と補充の管理を新人に指導できる。"],"name_en":"Managing moisture content and application amount","kanten_en":"Can they spread lime in a state where it disinfects — not as dry powder — using visible whitening of the ground as a guide for the amount?","levels_en":["Spreads dry powder as-is and ignores the amount guideline, achieving no disinfectant effect.","With guidance, spreads lime, but is inconsistent about managing moisture and amount.","With guidance, can adequately spread lime using visible whitening of the ground as the amount guide.","Independently keeps the lime at a moisture level where it disinfects, and replenishes it regularly as it degrades.","Understands the conditions (moisture content) under which lime disinfects, and can teach new staff how to manage application amounts and replenishment."],"name_vi":"Quản lý độ ẩm và lượng rắc","kanten_vi":"Có rắc với lượng đủ để mặt đất nhìn thấy trắng, ở trạng thái có độ ẩm để phát huy tác dụng khử trùng, không để nguyên dạng bột khô không.","levels_vi":["Rắc nguyên dạng bột khô, cũng không giữ lượng chuẩn nên không có tác dụng khử trùng.","Nếu có chỉ dẫn thì rắc, nhưng có bỏ sót việc quản lý độ ẩm và lượng rắc.","Nếu có chỉ dẫn thì rắc được cơ bản với lượng đủ để mặt đất nhìn thấy trắng.","Không cần chỉ dẫn cũng giữ trạng thái độ ẩm để có tác dụng khử trùng, nhìn độ xuống cấp để bổ sung định kỳ.","Hiểu điều kiện để vôi khử trùng có tác dụng (tỷ lệ độ ẩm), và có thể hướng dẫn người mới cách quản lý lượng rắc và bổ sung."],"name_id":"Pengelolaan kelembapan dan jumlah taburan","kanten_id":"Apakah bisa menabur dengan patokan tanah terlihat putih, dalam keadaan yang memberi efek disinfeksi, bukan berupa bubuk kering begitu saja.","levels_id":["Menabur dalam keadaan bubuk kering, tidak mematuhi patokan jumlah, sehingga efek disinfeksi tidak keluar.","Jika ada instruksi bisa menabur, tetapi sering lalai mengelola kelembapan dan jumlah.","Jika ada instruksi, bisa menabur secara garis besar dengan patokan tanah terlihat putih.","Tanpa instruksi pun, membuat keadaan lembap yang memberi efek disinfeksi, dan menambah taburan secara berkala dengan melihat penurunan mutunya.","Memahami syarat kapur bisa mendisinfeksi (kadar air), dan bisa mengajari karyawan baru pengelolaan jumlah taburan dan penambahannya."]},{"id":"wind-safety","name":"風向き確認と防護","kanten":"風向きを確認して粉末飛散を防ぎ、人・豚にかからないよう防護具を着けて散布できるか。","levels":["風向きを確認せず粉末を飛散させ、防護具も着けず呼吸器障害や周辺苦情を招く。","指示があれば注意するが、風向き確認や防護具着用に漏れがある。","指示があれば人・豚に直接かからないようひと通り注意して散布できる。","指示がなくても風向きを確認して飛散を防ぎ、防護具を着けて安全に散布する。","飛散による健康被害・苦情のリスクを理解し、安全な散布方法を新人に指導できる。"],"name_en":"Checking wind direction and protection","kanten_en":"Can they check the wind direction to prevent powder drift, and wear protective gear so the lime does not land on people or pigs?","levels_en":["Scatters powder without checking wind direction and works without protective gear, causing respiratory harm and neighborhood complaints.","With guidance, takes care, but is inconsistent about checking wind direction and wearing protective gear.","With guidance, can spread lime with adequate care to keep it off people and pigs.","Independently checks wind direction to prevent drift and spreads lime safely in protective gear.","Understands the health and complaint risks of powder drift, and can teach new staff safe spreading methods."],"name_vi":"Kiểm tra hướng gió và bảo hộ","kanten_vi":"Có kiểm tra hướng gió để tránh bột bay tán, đeo đồ bảo hộ và rắc sao cho không dính vào người và lợn không.","levels_vi":["Không kiểm tra hướng gió làm bột bay tán, không đeo đồ bảo hộ, gây hại đường hô hấp và khiếu nại từ xung quanh.","Nếu có chỉ dẫn thì chú ý, nhưng có bỏ sót việc kiểm tra hướng gió và đeo đồ bảo hộ.","Nếu có chỉ dẫn thì rắc được với sự chú ý cơ bản để không dính trực tiếp vào người và lợn.","Không cần chỉ dẫn cũng kiểm tra hướng gió để tránh bay tán, đeo đồ bảo hộ và rắc an toàn.","Hiểu nguy cơ hại sức khỏe và khiếu nại do bột bay tán, và có thể hướng dẫn người mới cách rắc an toàn."],"name_id":"Pemeriksaan arah angin dan perlindungan diri","kanten_id":"Apakah memeriksa arah angin untuk mencegah bubuk beterbangan, dan bisa menabur dengan memakai alat pelindung agar tidak mengenai orang dan babi.","levels_id":["Menabur tanpa memeriksa arah angin sehingga bubuk beterbangan, tidak memakai alat pelindung sehingga menyebabkan gangguan pernapasan dan keluhan warga sekitar.","Jika ada instruksi bisa berhati-hati, tetapi sering lalai memeriksa arah angin dan memakai alat pelindung.","Jika ada instruksi, bisa menabur dengan cukup hati-hati agar tidak langsung mengenai orang dan babi.","Tanpa instruksi pun, memeriksa arah angin untuk mencegah bubuk beterbangan, dan menabur dengan aman memakai alat pelindung.","Memahami risiko gangguan kesehatan dan keluhan akibat bubuk beterbangan, dan bisa mengajari karyawan baru cara menabur yang aman."]}],"gyomu":"44","name_en":"Lime spreading","purposeShort_en":"Create a biosecurity barrier at farm entrances and suppress pathogen entry and spread","name_vi":"Rắc vôi bột (khử trùng bằng vôi)","purposeShort_vi":"Tạo hàng rào phòng dịch ở lối ra vào trại, ngăn mầm bệnh xâm nhập và lan rộng","name_id":"Menaburkan kapur (disinfeksi dengan kapur)","purposeShort_id":"Membuat penghalang biosekuriti di pintu masuk-keluar peternakan, menekan masuk dan menyebarnya bibit penyakit"},{"id":"carcass","category":"hygiene","no":"No.37","name":"死獣回収","purposeShort":"病原体の拡散と悪臭・害獣被害を防ぎ、法令を守る","aspects":[{"id":"prompt-storage","name":"速やかな回収と専用保管","kanten":"死亡確認後すぐに回収し、豚房内に放置せず専用の保管場所へ入れられるか。","levels":["死体を豚房内に放置し、他の豚が接触して感染源になっても気にしない。","指示があれば回収するが、回収の遅れや保管場所の管理に漏れがある。","指示があれば死亡確認後にひと通り回収し、専用保管場所へ入れられる。","指示がなくても速やかに回収して専用場所へ入れ、感染源化を防ぐ。","死体放置の感染リスクを理解し、速やかな回収・保管の手順を新人に指導できる。"],"name_en":"Prompt collection and dedicated storage","kanten_en":"Can they collect carcasses immediately after confirming death, without leaving them in the pen, and place them in dedicated storage?","levels_en":["Leaves carcasses in the pen and does not care that other pigs touch them and they become an infection source.","With guidance, collects carcasses, but collection is delayed and storage management is inconsistent.","With guidance, can adequately collect carcasses after confirming death and place them in dedicated storage.","Independently collects carcasses promptly and moves them to the dedicated area, preventing them from becoming an infection source.","Understands the infection risk of leaving carcasses, and can teach new staff the procedures for prompt collection and storage."],"name_vi":"Thu gom nhanh và cất giữ ở nơi chuyên dùng","kanten_vi":"Sau khi xác nhận lợn chết có thu gom ngay, không để trong ô chuồng mà đưa vào nơi cất giữ chuyên dùng không.","levels_vi":["Để xác lợn trong ô chuồng, lợn khác chạm vào thành nguồn lây nhiễm cũng không quan tâm.","Nếu có chỉ dẫn thì thu gom, nhưng có chậm trễ và bỏ sót việc quản lý nơi cất giữ.","Nếu có chỉ dẫn thì thu gom được cơ bản sau khi xác nhận lợn chết, đưa vào nơi cất giữ chuyên dùng.","Không cần chỉ dẫn cũng thu gom nhanh và đưa vào nơi chuyên dùng, ngăn xác trở thành nguồn lây nhiễm.","Hiểu nguy cơ lây nhiễm khi để xác lợn, và có thể hướng dẫn người mới quy trình thu gom, cất giữ nhanh chóng."],"name_id":"Pengumpulan segera dan penyimpanan khusus","kanten_id":"Apakah segera mengumpulkan setelah kematian dipastikan, tidak membiarkannya di dalam petak kandang, dan memasukkannya ke tempat penyimpanan khusus.","levels_id":["Membiarkan bangkai di dalam petak kandang, dan tidak peduli walau babi lain menyentuhnya dan menjadi sumber infeksi.","Jika ada instruksi bisa mengumpulkan, tetapi sering terlambat mengumpulkan dan lalai mengelola tempat penyimpanan.","Jika ada instruksi, bisa mengumpulkan secara garis besar setelah kematian dipastikan, dan memasukkannya ke tempat penyimpanan khusus.","Tanpa instruksi pun, segera mengumpulkan dan memasukkannya ke tempat khusus, sehingga mencegahnya menjadi sumber infeksi.","Memahami risiko infeksi dari bangkai yang dibiarkan, dan bisa mengajari karyawan baru urutan pengumpulan dan penyimpanan yang cepat."]},{"id":"law-record","name":"法令遵守と死亡記録","kanten":"堆肥混入などの違法処理を避け、感染症疑いは自己判断せず、死亡状況を記録できるか。","levels":["死亡子豚を堆肥に混入するなど違法な処理をし、記録も残さない。","指示されれば記録するが、法令の理解が浅く記録に漏れが多い。","指示があれば専用処理へ回し、死亡状況をひと通り記録できる。","指示がなくても法令に沿って処理し、感染症疑いは自己判断せず、死亡日・頭数・原因を記録する。","化製場法・廃棄物処理法の要点を理解し、正しい処理と記録を新人に指導できる。"],"name_en":"Legal compliance and mortality records","kanten_en":"Can they avoid illegal disposal such as mixing into compost, not self-judge suspected infectious diseases, and record the circumstances of death?","levels_en":["Disposes of carcasses illegally, such as mixing dead piglets into compost, and keeps no records.","Records when instructed, but has a shallow understanding of the law and many recording omissions.","With guidance, sends carcasses to dedicated disposal and can adequately record the circumstances of death.","Independently disposes of carcasses in accordance with the law, never self-judges suspected infectious diseases, and records the date, number, and cause of death.","Understands the key points of the rendering plant and waste disposal laws, and can teach new staff correct disposal and record-keeping."],"name_vi":"Tuân thủ pháp luật và ghi chép lợn chết","kanten_vi":"Có tránh xử lý trái pháp luật như trộn vào phân ủ, không tự phán đoán khi nghi bệnh truyền nhiễm, và ghi chép được tình trạng chết không.","levels_vi":["Xử lý trái pháp luật như trộn lợn con chết vào phân ủ, cũng không để lại ghi chép.","Nếu được chỉ dẫn thì ghi chép, nhưng hiểu biết pháp luật còn nông, hay bỏ sót ghi chép.","Nếu có chỉ dẫn thì chuyển sang xử lý chuyên dùng, ghi chép được cơ bản tình trạng chết.","Không cần chỉ dẫn cũng xử lý theo pháp luật, nghi bệnh truyền nhiễm thì không tự phán đoán, ghi chép ngày chết, số con, nguyê
